<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C9A227" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="g2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C9A227" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <radialGradient id="vignette" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0a0c14" stop-opacity="0"/>
      <stop offset="100%" stop-color="#020203" stop-opacity="0.85"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1200" fill="#020203"/>
  <!-- holographic double helix field -->
  <g fill="none" stroke-linecap="round" filter="url(#soft)">
    <path d="M280 40 C420 160, 420 320, 280 440 C140 560, 140 720, 280 840 C420 960, 420 1100, 280 1180" stroke="url(#g1)" stroke-width="6" opacity="0.9"/>
    <path d="M520 40 C380 160, 380 320, 520 440 C660 560, 660 720, 520 840 C380 960, 380 1100, 520 1180" stroke="url(#g2)" stroke-width="6" opacity="0.85"/>
    <!-- rungs -->
    <g stroke="#7dd3fc" stroke-width="2" opacity="0.35">
      <line x1="320" y1="120" x2="480" y2="160"/>
      <line x1="300" y1="220" x2="500" y2="250"/>
      <line x1="290" y1="320" x2="510" y2="340"/>
      <line x1="300" y1="420" x2="500" y2="440"/>
      <line x1="310" y1="520" x2="490" y2="550"/>
      <line x1="300" y1="620" x2="500" y2="650"/>
      <line x1="290" y1="720" x2="510" y2="740"/>
      <line x1="300" y1="820" x2="500" y2="850"/>
      <line x1="310" y1="920" x2="490" y2="950"/>
      <line x1="300" y1="1020" x2="500" y2="1050"/>
    </g>
  </g>
  <!-- residual nodes -->
  <circle cx="310" cy="200" r="7" fill="#EF4444" opacity="0.9"/>
  <circle cx="490" cy="280" r="7" fill="#3B82F6" opacity="0.9"/>
  <circle cx="330" cy="480" r="7" fill="#22C55E" opacity="0.9"/>
  <circle cx="470" cy="620" r="7" fill="#EAB308" opacity="0.9"/>
  <circle cx="360" cy="880" r="7" fill="#94a3b8" opacity="0.85"/>
  <rect width="800" height="1200" fill="url(#vignette)"/>
</svg>
