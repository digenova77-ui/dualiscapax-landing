<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DualisCapax liquid orb">
  <defs>
    <radialGradient id="goo" cx="35%" cy="30%">
      <stop offset="0" stop-color="#e8fff8"/>
      <stop offset=".4" stop-color="#14b8a6"/>
      <stop offset=".75" stop-color="#0ea5a0"/>
      <stop offset="1" stop-color="#070b12"/>
