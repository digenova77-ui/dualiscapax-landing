<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Engineering depth — locked — DualisCapax</title>
<meta name="theme-color" content="#050505"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet"/>
<style>
body{font-family:Inter,system-ui,sans-serif;background:#000;color:#f5f5f5;margin:0;line-height:1.5}
.wrap{max-width:28rem;margin:0 auto;padding:2rem 1.15rem}
h1{font-size:1.5rem;font-weight:800;margin:0.4rem 0 0.75rem}
p{color:rgba(245,245,245,0.75);margin:0 0 0.85rem}
label{display:block;font-size:0.75rem;letter-spacing:0.1em;text-transform:uppercase;color:rgba(245,245,245,0.45);margin:0.75rem 0 0.35rem}
input{width:100%;padding:0.7rem 0.85rem;border:1px solid rgba(126,182,255,0.35);background:rgba(126,182,255,0.06);color:#f5f5f5;border-radius:8px;font:inherit}
button{margin-top:1rem;width:100%;padding:0.9rem;border:1px solid rgba(126,182,255,0.5);background:rgba(126,182,255,0.14);color:#e8f1ff;font-weight:700;border-radius:8px;cursor:pointer}
.err{color:#e8a0a0;font-size:0.9rem;margin-top:0.5rem}
a{color:#9ec5ff}
.note{font-size:0.85rem;color:rgba(245,245,245,0.45);margin-top:1.5rem}
</style>
</head>
<body>
<div class="wrap">
  <p style="font-size:0.78rem;letter-spacing:0.12em;text-transform:uppercase;color:#7eb6ff">Engineering gate</p>
  <h1>Depth is locked</h1>
  <p>Public residual prose stays open. Depth needs institutional class or a Dualis ranking mark. Paid seats stay closed until Stripe links exist.</p>
  <label for="email">Institutional email</label>
  <input id="email" type="email" autocomplete="email" placeholder="name@university.edu"/>
  <label for="seal">Or SEAL mark</label>
  <input id="seal" type="text" placeholder="SEAL-1"/>
  <button type="button" id="go">Request grant</button>
  <p class="err" id="err" hidden></p>
  <p class="note">Not a P.Eng. stamp. Not safety certification. Not securities. <a href="/research/engineering/">Public engineering floor</a> · <a href="/research/IP-GATE.md">IP gate</a></p>
</div>
<script src="/js/engineering-gate.js"></script>
<script>
(function(){
  document.getElementById('go').addEventListener('click',function(){
    var email=document.getElementById('email').value;
    var seal=document.getElementById('seal').value;
    var gnt=window.DCEngGate&&DCEngGate.grant(email,seal);
    var err=document.getElementById('err');
    if(!gnt){err.hidden=false;err.textContent='No grant. Use .edu / .org / .gov / .gc.ca or a ranking SEAL.';return;}
    var next='/research/engineering/';
    try{var q=new URLSearchParams(location.search).get('next');if(q&&q.indexOf('/research/engineering')===0)next=q;}catch(e){}
    location.replace(next);
  });
})();
</script>
</body>
</html>
