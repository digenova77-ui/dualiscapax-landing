<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ice — DualisCapax</title>
  <meta name="description" content="Hockey ice. Claim a seat. Next game when TeamSnap has one. Dualis does not invent a roster.">
  <meta name="theme-color" content="#0B0E14">
  <link rel="stylesheet" href="lander.css">
  <link rel="stylesheet" href="css/ice-skills.css">
  <link rel="stylesheet" href="css/ice-gameday.css">
  <style>
    body.ice-body{margin:0;background:#0B0E14;color:#e8eefc;font-family:ui-sans-serif,system-ui,sans-serif;padding-bottom:4.4rem}
    .ice-fallback{max-width:28rem;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px 1rem}
    .ice-fallback h1{font-size:1.5rem;margin:.3rem 0 .6rem}
    .ice-sheet-card{border:1px solid #2a3348;border-radius:16px;padding:14px;background:rgba(56,189,248,.05);margin:10px 0}
    .ice-sheet-card p{color:#8b96b3;font-size:14px;line-height:1.45;margin:.35rem 0}
    .kicker{letter-spacing:.16em;font-size:11px;text-transform:uppercase;color:#8b96b3}
    .ice-dock{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:space-around;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#0B0E14;border-top:1px solid #2a3348}
    .ice-dock a{color:#8b96b3;text-decoration:none;font-size:12px}
    .ice-dock a.on{color:#38BDF8}
    .ice-rink:empty + .ice-fallback{display:block}
  </style>
</head>
<body class="ice-body" id="top">
  <header class="ice-chrome">
    <a href="index.html" class="brand-group">
      <span class="brand-name">Dualiscapax</span>
    </a>
    <div class="ice-chrome-right">
      <a class="ice-iris-hint" href="iris.html">Iris</a>
      <button type="button" id="seatChip" class="ice-seat-chip is-empty">Claim seat</button>
    </div>
  </header>
  <div class="ice-demo-banner">
    <span>Demo ice · Look $0 · pay on /pay</span>
    <a href="hockey.html">OHF five</a>
  </div>
  <div class="ice-rink">
    <nav class="ice-rail" id="iceRail" aria-label="Ice stages"></nav>
    <main class="ice-sheet">
      <div id="iceStage" class="ice-stage" role="region" aria-live="polite"></div>
    </main>
  </div>
  <div class="ice-fallback" id="iceFallback">
    <p class="kicker">The rink</p>
    <h1>Ice is this phone.</h1>
    <div class="ice-sheet-card">
      <p class="kicker">Seat</p>
      <p id="fbSeat">No seat claimed. Dualis does not invent a name.</p>
    </div>
    <div class="ice-sheet-card">
      <p class="kicker">Next game</p>
      <p id="fbGame">Empty until TeamSnap has a next event here.</p>
    </div>
    <p><a href="gameday.html" style="color:#38BDF8">Game day</a> · <a href="schedule.html" style="color:#38BDF8">Schedule</a> · <a href="hockey.html" style="color:#38BDF8">Five leagues</a></p>
  </div>
  <div id="iceSheet" class="ice-bind-sheet" hidden></div>
  <nav class="ice-dock" aria-label="Ice">
    <a class="on" href="./ice.html">Ice</a>
    <a href="./schedule.html">Schedule</a>
    <a href="./gameday.html">Gameday</a>
    <a href="./hockey.html">OHF</a>
  </nav>
  <script src="js/api-config.js"></script>
  <script src="js/dc-passkey.js"></script>
  <script src="js/teamsnap-oauth.js"></script>
  <script src="js/ice-portal.js"></script>
  <script src="js/ice-seat-teamsnap-only.js"></script>
  <script src="js/ice-skills.js"></script>
  <script src="js/ice-gameday.js"></script>
  <script>
  (function(){
    function text(id,s){var n=document.getElementById(id);if(n)n.textContent=s}
    try{
      var seat=JSON.parse(localStorage.getItem("dc.ice.seat")||"null");
      if(seat){
        var bits=[seat.first,seat.last,seat.jersey?("#"+seat.jersey):"",seat.team||seat.org].filter(Boolean);
        if(bits.length) text("fbSeat", bits.join(" ")+". From this phone. Dualis did not invent it.");
      }
    }catch(e){}
    try{
      var raw=localStorage.getItem("dc.teamsnap.events")||localStorage.getItem("dc.ice.events");
      if(raw){
        var ev=JSON.parse(raw);
        var next=Array.isArray(ev)?ev[0]:ev;
        if(next){
          text("fbGame", [next.name||next.title,next.start_date||next.start,next.location_name||next.location].filter(Boolean).join(" · ")+".");
        }
      }
    }catch(e){}
    function hideIfPortal(){
      var st=document.getElementById("iceStage");
      var fb=document.getElementById("iceFallback");
      if(st && st.children.length && fb) fb.hidden=true;
    }
    document.addEventListener("dc-ice-portal-ready", hideIfPortal);
    setTimeout(hideIfPortal, 800);
  })();
  </script>
</body>
</html>
