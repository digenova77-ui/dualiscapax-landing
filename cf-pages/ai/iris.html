<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Iris</title>
<meta name="theme-color" content="#04060c">
<link rel="icon" href="../brand/seal.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark;--bg:#04060c;--iris:#8eb4c8;--text:#e8eef2;--mute:#8b99a4;--line:rgba(200,220,230,.16)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,sans-serif}
body{display:flex;flex-direction:column}
header{display:flex;gap:.5rem;align-items:center;padding:.7rem .8rem;border-bottom:1px solid var(--line)}
a{color:var(--iris);text-decoration:none}.brand{letter-spacing:.16em;font-size:.72rem;margin-inline-end:auto;color:inherit}
#log{flex:1;overflow:auto;padding:.8rem;display:flex;flex-direction:column;gap:.5rem}
.b{max-width:34rem;padding:.7rem .85rem;border:1px solid var(--line);border-radius:12px}
.them{align-self:flex-start;background:rgba(142,180,200,.08)}
.you{align-self:flex-end;background:rgba(255,255,255,.04)}
form{display:flex;gap:.4rem;padding:.6rem .8rem calc(.6rem + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
input{flex:1;border-radius:999px;border:1px solid var(--line);background:#0a0e14;color:inherit;padding:.65rem .9rem;font:inherit}
button{border:0;border-radius:999px;background:var(--iris);color:#061018;font-weight:700;padding:.65rem .9rem}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;padding:0 .8rem .4rem}
.chips a,.chips button{background:transparent;color:var(--iris);border:1px solid var(--line);border-radius:999px;padding:.3rem .6rem;font-size:.78rem}
</style>
</head>
<body>
<header>
  <a class="brand" href="../hub.html">ASK</a>
  <a href="../pay.html">Pay</a>
  <a href="../law.html">Law</a>
</header>
<div class="chips">
  <button type="button" data-q="What can you do?">Help</button>
  <button type="button" data-q="How do I pay?">Pay</button>
  <button type="button" data-q="go to rooms">Rooms</button>
  <button type="button" data-q="go to compute">Engine</button>
</div>
<div id="log"></div>
<form id="f"><input id="q" placeholder="Ask Iris" autocomplete="off"><button type="submit">Send</button></form>
<script src="go.js"></script>
<script src="answer-store.js"></script>
<script src="iris-book.js"></script>
<script src="dclm-look.js"></script>
<script>
(function(){
  var log=document.getElementById("log");
  function bubble(who,t){
    var d=document.createElement("div");
    d.className="b "+who; d.textContent=t; log.appendChild(d); log.scrollTop=log.scrollHeight;
  }
  async function send(text){
    text=String(text||"").trim(); if(!text) return;
    bubble("you",text);
    var rec={spoken:"Ask about pay, law, rooms, or a public name."};
    try{
      if(window.DCLMLook&&DCLMLook.run) rec=await DCLMLook.run(text);
    }catch(e){ rec={spoken:"I stumbled. Ask again in plain words."}; }
    var spoken=(rec&&rec.spoken)||"I heard you.";
    bubble("them",spoken);
    if(window.dcStoreAnswer) dcStoreAnswer(text,spoken);
  }
  document.getElementById("f").onsubmit=function(e){e.preventDefault(); var i=document.getElementById("q"); send(i.value); i.value="";};
  document.querySelectorAll(".chips button").forEach(function(b){ b.onclick=function(){ send(b.getAttribute("data-q")); }; });
  var seed=""; try{ seed=sessionStorage.getItem("dc.ask")||""; }catch(e){}
  if(seed) send(seed);
  else bubble("them","Hi. I'm Iris. Looking is free. Grind is on Pay. Ask, or say go to pay.");
})();
</script>
</body>
</html>
