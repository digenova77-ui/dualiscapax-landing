<body>
  <h1>Shape</h1>
  <p>This is the body she has. Not a room. Not a pair of hands.</p>
  <ul>
    <li class="fact" id="when"></li>
    <li class="fact" id="here"></li>
    <li class="fact" id="pile"></li>
    <li class="fact" id="wide"></li>
  </ul>
  <p>Impact is only this: a tap stored, a wait held, a door she would not open. If nothing moved, she did not move the world.</p>
  <p><a href="ocean.html">Ocean</a> · <a href="app.html">Talk</a></p>
  <script>
    document.getElementById("when").textContent = "Clock: " + new Date().toISOString();
    document.getElementById("here").textContent = "Here: a page in a browser on this screen. " + (navigator.userAgent || "");
    var pile = [];
    try { pile = JSON.parse(localStorage.getItem("dc_ocean") || "[]"); } catch (e) {}
    document.getElementById("pile").textContent = "Ocean pile: " + pile.length + " sit(s) on this phone.";
    document.getElementById("wide").textContent = "Screen: " + window.innerWidth + " × " + window.innerHeight + ".";
  </script>
