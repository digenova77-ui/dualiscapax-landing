<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teacher desks · Tri-Board — DualisCapax</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b1220">
<style>
:root{--bg:#0b1220;--ink:#f3efe4;--mute:#9aa7b5;--gold:#e8c36a;--line:rgba(232,195,106,.22);--card:#121a2a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 Georgia,serif}
.wrap{max-width:44rem;margin:0 auto;padding:1.15rem 1.05rem 5.4rem}
.brand{font:11px ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
h1{font-size:clamp(1.7rem,6vw,2.4rem);line-height:1.05}
.note{color:var(--mute)}
button.b,button.s{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:.7rem .85rem;margin:.35rem 0;font:16px Georgia,serif}
button.b.on,button.s.on{border-color:var(--gold);color:var(--gold)}
label{font:11px ui-monospace,monospace;color:var(--mute)}
select{width:100%;background:#0a101c;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:.5rem;margin:.3rem 0 1rem;font:16px Georgia,serif}
a.go{display:inline-block;margin-top:.4rem;color:var(--gold)}
.dock{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:#0b1220;border-top:1px solid var(--line);padding:.5rem;font:10px ui-monospace,monospace;text-transform:uppercase}
.dock a{color:var(--mute);text-decoration:none}.dock a.on{color:var(--gold)}
</style></head>
<body>
<div class="wrap">
<p class="brand">DualisCapax · HPEDSB · ALCDSB · Limestone</p>
<h1>Pick the board.<br>Then the school.</h1>
<p class="note">Every teacher uses the same desk. Dualis does not invent staff. The door is the board login — Dualis does not hold that password.</p>
<label>Board</label>
<div id="boards"></div>
<label>School</label>
<div id="schools"></div>
<label>Grade / assignment</label>
<select id="grade">
<option>JK</option><option>SK</option><option>Grade 1</option><option selected>Grade 2</option>
<option>Grade 3</option><option>Grade 4</option><option>Grade 5</option><option>Grade 6</option>
<option>Grade 7</option><option>Grade 8</option><option>Secondary</option><option>Spec Ed / LST</option><option>Prep / other</option>
</select>
<p><a class="go" id="enter" href="./desk.html">Open the desk</a></p>
<p class="note"><a href="./door.html" style="color:#e8c36a">Board login (named hole)</a> · <a href="/rte/easthill/" style="color:#e8c36a">Sara’s Easthill Grade 2 room</a></p>
</div>
<nav class="dock"><a class="on" href="./index.html">Boards</a><a href="./door.html">Door</a><a href="./desk.html">Desk</a><a href="/">Home</a></nav>
<script src="./schools.js"></script>
<script>
var board='hpedsb', school='Easthill Elementary School';
function drawB(){
  var h='';
  BOARDS.forEach(function(b){
    h+='<button type="button" class="b'+(b.id===board?' on':'')+'" data-id="'+b.id+'">'+b.name+'<br><small style="color:#9aa7b5">'+b.mail+'</small></button>';
  });
  document.getElementById('boards').innerHTML=h;
  document.querySelectorAll('#boards .b').forEach(function(x){x.onclick=function(){board=x.getAttribute('data-id');school=SCHOOLS[board][0];drawB();drawS();link();};});
}
function drawS(){
  var h='';
  SCHOOLS[board].forEach(function(n){
    h+='<button type="button" class="s'+(n===school?' on':'')+'">'+n+'</button>';
  });
  document.getElementById('schools').innerHTML=h;
  document.querySelectorAll('#schools .s').forEach(function(x){x.onclick=function(){school=x.textContent;drawS();link();};});
}
function link(){
  var g=document.getElementById('grade').value;
  document.getElementById('enter').href='./desk.html?board='+encodeURIComponent(board)+'&school='+encodeURIComponent(school)+'&grade='+encodeURIComponent(g);
}
document.getElementById('grade').onchange=link;
drawB();drawS();link();
</script>
</body></html>
