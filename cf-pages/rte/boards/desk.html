<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Teacher desk · DualisCapax</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#05070c">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070c;--ink:#eef4f8;--mute:#8b9caa;--cyan:#3ee8ff;--gold:#ffb703;--line:rgba(62,232,255,.14);--card:rgba(8,14,22,.72)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:18px/1.55 Fraunces,Georgia,serif;background:#05070c}
.wrap{max-width:42rem;margin:0 auto;padding:1.25rem 1.1rem 5.5rem}
.brand{font:11px IBM Plex Mono,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
h1{font-size:clamp(1.8rem,7vw,2.6rem);font-weight:600}h1 em{font-style:italic;color:var(--cyan);font-weight:400}
.note{color:var(--mute)}
a.row{display:block;color:var(--ink);text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.85rem 1rem;margin:.45rem 0}
a.row span{display:block;color:var(--mute);font-size:.9rem}
.seal{border:1px solid rgba(255,183,3,.35);border-radius:16px;padding:1rem;margin:1rem 0}
.dock{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:rgba(5,7,12,.92);border-top:1px solid var(--line);padding:.5rem;font:10px IBM Plex Mono,monospace;text-transform:uppercase}
.dock a{color:var(--mute);text-decoration:none}.dock a.on{color:var(--cyan)}
</style></head>
<body>
<div class="wrap">
<p class="brand" id="who">Teacher desk</p>
<h1 id="h">This classroom</h1>
<div id="gate"></div>
</div>
<nav class="dock"><a href="./phrase.html">Phrase</a><a href="./confirm.html">Confirm</a><a class="on" href="./desk.html">Desk</a><a href="./door.html">Door</a></nav>
<script src="/js/device-pass.js"></script>
<script>
function session(){try{return DCVault.session()}catch(e){return null}}
function confirmed(){
  try{
    var x=JSON.parse(localStorage.getItem('dc.teacher.confirmed')||'null');
    if(x&&x.ok===1)return x;
    var b=JSON.parse(localStorage.getItem('dc.teacher.bind')||'null');
    if(b&&b.confirmed)return {ok:1,board:b.board,boardName:b.boardName,school:b.school,grade:b.grade};
    return null;
  }catch(e){return null}
}
var gate=document.getElementById('gate');
if(!session()){
  document.getElementById('h').innerHTML='Phrase first.<br><em>Same as Ice.</em>';
  gate.innerHTML='<div class="seal"><p class="note">Eight words on this phone. Then Dualis looks. Then you confirm.</p><a class="row" href="./phrase.html"><strong>Open the phrase</strong><span>Make words or use the Ice words already here.</span></a></div>';
}else{
  var c=confirmed();
  var school=c&&c.school||'';
  var grade=c&&c.grade||'';
  var board=c&&(c.boardName||c.board)||'';
  document.getElementById('who').textContent=(board||'tri-board')+' · phrase open';
  document.getElementById('h').textContent=(school||'School not named')+(grade?(' · '+grade):'');
  if(!c){
    document.getElementById('h').innerHTML='Classroom<br><em>sealed.</em>';
    gate.innerHTML='<div class="seal"><p class="note">Phrase is open. Confirm the room before class, IEP, or report exist.</p><a class="row" href="./confirm.html"><strong>Confirm the room</strong><span>Proposal first. Then the desk.</span></a></div>';
  }else{
    gate.innerHTML='<p class="note">Phrase open. Room confirmed on this phone.</p>'
      +'<a class="row" href="/rte/easthill/class.html"><strong>Class list</strong><span>Paste names. Stays on this device.</span></a>'
      +'<a class="row" href="/rte/easthill/plan.html"><strong>Lesson plan</strong><span>Ontario strands.</span></a>'
      +'<a class="row" href="/rte/easthill/iep.html"><strong>IEP draft</strong><span>Empty until a child is named here.</span></a>'
      +'<a class="row" href="/rte/easthill/report.html"><strong>Report comments</strong><span>Growing Success draft.</span></a>';
  }
}
</script>
</body></html>
