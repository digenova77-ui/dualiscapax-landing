<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iris on the desk · SIMA</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#05070c">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070c;--ink:#eef4f8;--mute:#8b9caa;--cyan:#3ee8ff;--gold:#ffb703}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:18px/1.4 Fraunces,Georgia,serif;overflow:hidden}
#field{position:fixed;inset:0;width:100%;height:100%}
video{position:fixed;right:1rem;top:3.2rem;width:28vw;max-width:140px;border-radius:12px;border:1px solid rgba(62,232,255,.25);z-index:2;display:none}
.hud{position:fixed;left:1rem;right:1rem;top:.7rem;display:flex;justify-content:space-between;font:11px IBM Plex Mono,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);z-index:2}
.pill{color:var(--gold);border:1px solid rgba(255,183,3,.35);padding:.25rem .5rem;border-radius:999px}
.status{position:fixed;left:1rem;right:1rem;bottom:1.4rem;text-align:center;color:var(--mute);font-size:.95rem;z-index:2}
.status em{color:var(--cyan);font-style:italic}
.wake{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:.7rem;z-index:3;background:rgba(5,7,12,.78)}
.wake button{appearance:none;border:1px solid var(--cyan);background:rgba(62,232,255,.08);color:var(--ink);border-radius:999px;padding:1rem 1.3rem;font:1.05rem Fraunces,Georgia,serif}
.wake p{color:var(--mute);max-width:20rem;text-align:center;margin:0}
</style></head>
<body>
<canvas id="field"></canvas>
<video id="eye" playsinline muted></video>
<div class="hud"><span>Iris · desk</span><span class="pill" id="st">Asleep</span></div>
<p class="status" id="status"><em>She hears you, or she sees you, or she is not here.</em></p>
<div class="wake" id="wake">
  <button type="button" id="go">Wake Iris</button>
  <p>No typing. After this tap she listens. Camera only if this phone allows it.</p>
</div>
<script src="../../js/api-config.js"></script>
<script src="../../js/dsap.js"></script>
<script src="../../js/dsap-v2-jacket.js"></script>
<script>
(function(){
  var b={};
  try{b=JSON.parse(localStorage.getItem("dc.sima.iris")||"{}")}catch(e){}
  var KNOW="You are Iris on the SIMA desk. Speak short. Model the leftover hour, not the chart. Place: "+(b.place||"unpicked")+". Paid book: "+(b.paid||"unnamed")+". Seed: "+(b.mins||"?")+" min × "+(b.times||"?")+" × $"+(b.wage||"?")+"/h. No patient names. Simulation is not treatment.";
  var c=document.getElementById("field"),x=c.getContext("2d"),pts=[],amp=0,alive=false,rec;
  function size(){c.width=innerWidth;c.height=innerHeight}
  size(); addEventListener("resize",size);
  for(var i=0;i<64;i++) pts.push({a:i/64*Math.PI*2,r:0.28+Math.random()*0.06});
  (function draw(){
    x.fillStyle="rgba(5,7,12,0.22)"; x.fillRect(0,0,c.width,c.height);
    var cx=c.width/2,cy=c.height*0.46;
    x.strokeStyle="rgba(62,232,255,"+(0.12+amp*0.5)+")"; x.beginPath();
    for(var i=0;i<64;i++){
      var p=pts[i],rr=Math.min(cx,cy)*(p.r+amp*0.05);
      var px=cx+Math.cos(p.a)*rr,py=cy+Math.sin(p.a)*rr*0.72;
      i?x.lineTo(px,py):x.moveTo(px,py);
    }
    x.closePath(); x.stroke();
    x.fillStyle="rgba(62,232,255,"+(0.3+amp)+")";
    for(var j=0;j<64;j++){
      var p=pts[j],rr=Math.min(cx,cy)*(p.r+amp*0.05);
      x.beginPath(); x.arc(cx+Math.cos(p.a)*rr,cy+Math.sin(p.a)*rr*0.72,2,0,Math.PI*2); x.fill();
    }
    amp*=0.94; requestAnimationFrame(draw);
  })();
  function line(t){document.getElementById("status").innerHTML="<em>"+String(t).replace(/</g,"")+"</em>"}
  async function hear(text){
    if(!text||!window.DSAPJacket) return;
    amp=1;
    if(window.DSAP) DSAP.place("puck",20);
    try{
      var data=await DSAPJacket.ask(KNOW+"\nSpoken: "+text,{max_tokens:160,seat:20});
      var reply=(data&&(data.reply||data.text||data.message))||"";
      if(reply) line(reply);
    }catch(e){ line(e.message||"V2 quiet"); }
  }
  document.getElementById("go").onclick=async function(){
    document.getElementById("wake").style.display="none";
    document.getElementById("st").textContent="Live";
    alive=true;
    if(window.DSAP){ DSAP.wake(); DSAP.place("whistle",0); }
    try{
      var s=await navigator.mediaDevices.getUserMedia({audio:true,video:true});
      var v=document.getElementById("eye"); v.srcObject=s; v.style.display="block"; v.play();
      line("I can see you and hear you. "+(b.place||"Desk unpicked")+".");
    }catch(e){
      try{
        await navigator.mediaDevices.getUserMedia({audio:true});
        line("I can hear you. Camera stayed off. "+(b.place||"Desk unpicked")+".");
      }catch(e2){
        line("This phone gave no mic. She is not here.");
        document.getElementById("st").textContent="Not here";
        return;
      }
    }
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){ line("This browser has no listen. She is not here."); return; }
    rec=new SR(); rec.continuous=true; rec.interimResults=false; rec.lang="en-CA";
    rec.onresult=function(ev){ hear(ev.results[ev.results.length-1][0].transcript); amp=1; };
    rec.onend=function(){ if(alive) try{rec.start()}catch(e){} };
    try{rec.start()}catch(e){}
  };
})();
</script>
</body></html>
