<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game day · Ice — DualisCapax</title>
<meta name="description" content="This game. Seat first. Dualis does not invent the opponent.">
<meta name="theme-color" content="#07080d">
<link rel="stylesheet" href="./css/ice-windows.css">
<style>
  body{margin:0;background:#07080d;color:#e8eefc;font-family:ui-sans-serif,system-ui,sans-serif}
  .wrap{max-width:28rem;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px 5.5rem}
  .kicker{letter-spacing:.16em;font-size:11px;text-transform:uppercase;color:#8b96b3}
  h1{font-size:1.55rem;line-height:1.15;margin:.35rem 0 .8rem}
  .board{border:1px solid #2a3348;border-radius:16px;padding:16px;background:rgba(56,189,248,.04)}
  .vs{font-size:1.35rem;color:#ffb703;margin:.2rem 0}
  .clock{font-size:2.2rem;font-variant-numeric:tabular-nums;color:#e8eefc}
  .note{color:#8b96b3;font-size:13px;line-height:1.45}
  #dvp{width:100%;height:88px;display:block;border-radius:12px;background:#05070c;margin-top:.6rem}
  .dock{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:space-around;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#07080d;border-top:1px solid #2a3348}
  .dock a{color:#8b96b3;text-decoration:none;font-size:12px}
  .dock a.on{color:#ffb703}
</style>
</head>
<body>
<div class="wrap">
  <p class="kicker">This game</p>
  <h1>The rink in front of you.</h1>
  <div class="board">
    <p class="kicker" id="kicker">Seat first</p>
    <p class="vs" id="vs">—</p>
    <div class="clock" id="clock">—</div>
    <p class="note" id="when">Empty until TeamSnap has a next event on this phone. Dualis does not invent an arrival time.</p>
  </div>
  <canvas id="dvp" width="640" height="176" aria-label="Room wave"></canvas>
  <p class="note">First tap may speak the measured line. Roster stays TeamSnap.</p>
</div>
<nav class="dock" aria-label="Ice">
  <a href="./ice.html">Ice</a>
  <a href="./schedule.html">Schedule</a>
  <a class="on" href="./gameday.html">Gameday</a>
  <a href="./hockey.html">OHF</a>
</nav>
<script src="js/api-config.js"></script>
<script src="js/dsap.js"></script>
<script src="js/dvp.js"></script>
<script src="js/dc-av.js"></script>
<script src="js/iris-voice.js"></script>
<script src="js/iris-ice-voice.js"></script>
<script src="js/iris-ice-role.js"></script>
<script src="js/iris-page-voice.js"></script>
<script src="js/iris-page-hook.js"></script>
<script>
(function(){
  function paint(){
    var m = window.IrisIceRole && IrisIceRole.measured && IrisIceRole.measured();
    if(!m) return;
    var vs = m.vs || "";
    if(!vs && m.title && /\bvs\.?\b|\bagainst\b/i.test(m.title)) vs = m.title;
    document.getElementById("kicker").textContent = "They measured that";
    document.getElementById("vs").textContent = vs || m.title || "Named game";
    document.getElementById("clock").textContent = m.when || "—";
    var bits = [m.title, m.when, m.loc].filter(Boolean);
    document.getElementById("when").textContent = bits.join(" · ") + ". Dualis did not invent this row.";
  }
  paint();
  var c = document.getElementById("dvp");
  if(window.DVP) DVP.mount("dvp");
  c.addEventListener("click", function(){
    if(window.DualisAV) DualisAV.wake("dvp","puck",16);
    else if(window.DVP) DVP.mount("dvp");
  });
})();
</script>
</body></html>
