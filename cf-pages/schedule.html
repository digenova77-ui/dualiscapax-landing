<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schedule · Ice</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#07080d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080d;--ink:#e8eefc;--mute:#8b96b3;--cyan:#38bdf8;--gold:#ffb830;--line:#2a3348;--card:#10141c}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);min-height:100dvh}
body{font:18px/1.5 Fraunces,Georgia,serif}
.wrap{max-width:42rem;margin:0 auto;padding:1rem 1rem 5.2rem}
.top{display:flex;justify-content:space-between;align-items:center;font:11px IBM Plex Mono,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.pill{color:var(--gold);border:1px solid rgba(255,184,48,.35);padding:.3rem .55rem;border-radius:999px}
h1{font-size:clamp(2rem,8vw,2.8rem);line-height:.98;margin:.8rem 0 .5rem}
h1 em{font-style:italic;color:var(--cyan);font-weight:400}
.lede{color:#c5cee0;margin:0 0 .9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:.9rem 1rem;margin:0 0 .55rem}
.card strong{display:block;font-size:1.02rem}
.card span{display:block;color:var(--mute);font-size:.88rem;margin-top:.2rem}
.empty{color:var(--mute);border:1px dashed var(--line);border-radius:16px;padding:1rem}
.dock{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:rgba(7,8,13,.94);border-top:1px solid var(--line);padding:.4rem .15rem calc(.4rem + env(safe-area-inset-bottom));font:10px IBM Plex Mono,monospace;letter-spacing:.04em;text-transform:uppercase}
.dock a{color:var(--mute);text-decoration:none}.dock a.on{color:var(--cyan)}
</style></head>
<body>
<div class="wrap">
  <div class="top"><span>DualisCapax · Ice</span><span class="pill">Till closed</span></div>
  <h1>The week.<br><em>Not this shift.</em></h1>
  <p class="lede">Schedule is its own window. Game day is the game in front of you. Dualis does not invent these rows.</p>
  <div id="list"></div>
</div>
<nav class="dock">
  <a href="./ice.html">Rink</a>
  <a class="on" href="./schedule.html">Schedule</a>
  <a href="./gameday.html">Game day</a>
  <a href="./hockey.html">Leagues</a>
</nav>
<script>
(function(){
  var box=document.getElementById("list");
  function row(t,s){return '<article class="card"><strong>'+t+"</strong><span>"+s+"</span></article>"}
  try{
    var raw=localStorage.getItem("dc.teamsnap.events");
    var ev=raw?JSON.parse(raw):[];
    if(!Array.isArray(ev)) ev=ev?[ev]:[];
    if(!ev.length){
      box.innerHTML='<p class="empty">No times on this phone yet. Claim a seat on the rink with TeamSnap. Then the week lands here. Dualis does not type a schedule.</p>';
      return;
    }
    box.innerHTML=ev.map(function(n){
      var title=n.name||n.title||"Event";
      var when=n.start_date||n.start||"";
      var loc=n.location_name||n.location||"";
      return row(title,[when,loc].filter(Boolean).join(" · ")||"Time comes from TeamSnap.");
    }).join("");
  }catch(e){
    box.innerHTML='<p class="empty">No times on this phone yet. Claim a seat on the rink with TeamSnap.</p>';
  }
})();
</script>
</body></html>
