<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schedule · Ice</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#07080d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/ice-windows.css">
</head>
<body>
<div class="wrap">
  <div class="top"><span>DualisCapax · Ice</span><span class="pill">Till closed</span></div>
  <h1>The week.<br><em>Not this shift.</em></h1>
  <p class="lede">Schedule is its own window. Game day is the game in front of you. Dualis does not invent these rows.</p>
  <div id="list"></div>
</div>
<nav class="dock">
  <a href="./ice.html">Rink</a>
  <a class="on" href="./schedule.html">Schedule</a>
  <a href="./gameday.html">Game day</a>
  <a href="./hockey.html">Leagues</a>
</nav>
<script>
(function(){
  var box=document.getElementById("list");
  function row(t,s){return '<article class="card"><strong>'+t+"</strong><span>"+s+"</span></article>"}
  try{
    var raw=localStorage.getItem("dc.teamsnap.events");
    var ev=raw?JSON.parse(raw):[];
    if(!Array.isArray(ev)) ev=ev?[ev]:[];
    if(!ev.length){
      box.innerHTML='<p class="empty">No times on this phone yet. Claim a seat on the rink with TeamSnap. Then the week lands here. Dualis does not type a schedule.</p>';
      return;
    }
    box.innerHTML=ev.map(function(n){
      var title=n.name||n.title||"Event";
      var when=n.start_date||n.start||"";
      var loc=n.location_name||n.location||"";
      return row(title,[when,loc].filter(Boolean).join(" · ")||"Time comes from TeamSnap.");
    }).join("");
  }catch(e){
    box.innerHTML='<p class="empty">No times on this phone yet. Claim a seat on the rink with TeamSnap.</p>';
  }
})();
</script>
</body></html>
