      - paragraph [ref=f1e27]: Protocol-depth ≈ 0.1% → ~$20,000
      - paragraph [ref=f1e28]: Sponsor sim + docs ≈ 1% → ~$200,000
      - paragraph [ref=f1e29]: The trial itself — not Dualis
      - paragraph [ref=f1e30]: Oncology Phase 3 neighborhoods run higher (often $50M–$150M+). The *percent* stays. The dollar on an invoice would scale. There is still no button.
