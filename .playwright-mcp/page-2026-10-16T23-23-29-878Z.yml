    - heading "One schema. Every medical leaf." [level=1] [ref=f1e8]
    - paragraph [ref=f1e9]: ALS was the prototype. Osteosarcoma, neurology, oncology, and any later leaf use the same depths. We do not sell a disease. Look is $0. This gateway prices Merit at the energy cost, in joules. The joule has not been read, so the amounts below are the schedule and nothing is offered.
    - generic [ref=f1e10]:
      - heading "How detailed the ALS schema is" [level=2] [ref=f1e11]
      - paragraph [ref=f1e12]: Four named depths. Four gated depths. No per-drug SKU. No “ALS = $200 million” button.
      - paragraph [ref=f1e13]: "Peg used for gated math: ~$20M US to run one late-stage ALS regimen (HEALEY-class) over ~37 months. Other fields use the same percentages against their own public Phase 3 neighborhood when a sponsor pack is ever invoiced."
    - generic [ref=f1e14]:
      - heading "Applies to all medical" [level=2] [ref=f1e15]
      - paragraph [ref=f1e16]: ALS · other neurology · oncology · osteosarcoma · any study file on this house.
      - paragraph [ref=f1e17]: The leaf name changes. The prices do not.
