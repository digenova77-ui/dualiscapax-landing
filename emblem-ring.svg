<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" role="img" aria-label="DualisCapax mark">
  <defs>
    <linearGradient id="arc" x1="32" y1="40" x2="224" y2="216" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8B923"/>
      <stop offset="0.45" stop-color="#3D9BE9"/>
      <stop offset="1" stop-color="#2B6CB0"/>
    </linearGradient>
    <linearGradient id="pathA" x1="88" y1="48" x2="128" y2="208" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0C93A"/>
      <stop offset="1" stop-color="#2A9B5C"/>
    </linearGradient>
    <linearGradient id="pathB" x1="168" y1="48" x2="128" y2="208" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3D9BE9"/>
      <stop offset="1" stop-color="#E8A317"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Outer residual ring -->
  <circle cx="128" cy="128" r="102" stroke="url(#arc)" stroke-width="5" stroke-linecap="round" opacity="0.95"/>
  <circle cx="128" cy="128" r="102" stroke="#ffffff" stroke-width="0.5" opacity="0.12"/>
  <!-- Dual paths (infinity / affinity fold) -->
  <path filter="url(#soft)" d="M96 56
    C118 78 118 100 96 122
    C74 144 74 166 96 188
    C110 202 122 208 128 210"
    stroke="url(#pathA)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path filter="url(#soft)" d="M160 56
    C138 78 138 100 160 122
    C182 144 182 166 160 188
    C146 202 134 208 128 210"
    stroke="url(#pathB)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cross-links (base pairs) -->
  <path d="M108 86 L148 86" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <path d="M100 122 L156 122" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <path d="M108 158 L148 158" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <!-- Nodes — residual accents only -->
  <circle cx="96" cy="56" r="7" fill="#E24B4B"/>
  <circle cx="160" cy="56" r="7" fill="#3D9BE9"/>
  <circle cx="96" cy="122" r="6.5" fill="#2A9B5C"/>
  <circle cx="160" cy="122" r="6.5" fill="#E8A317"/>
  <circle cx="128" cy="210" r="5" fill="#f4f4f2" opacity="0.9"/>
</svg>
