<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DCLM walk</title>
  <style>
    :root{color-scheme:dark;--bg:#02030a;--ink:#e1fffb;--cyan:#63f7dd;--amber:#ffd37d}
    html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.3 ui-monospace,Menlo,monospace;overflow:hidden;touch-action:none}
    canvas{position:fixed;inset:0;width:100%;height:100%}
    #top{position:fixed;left:12px;right:12px;top:12px}
    #step{color:var(--cyan);letter-spacing:.12em;font-size:11px}
    #log{margin-top:6px;color:var(--amber);white-space:pre-wrap;word-break:break-all}
    #bar{position:fixed;left:12px;right:12px;bottom:16px;display:flex;align-items:flex-end;justify-content:space-between}
    #stick{width:96px;height:96px;border:1px solid var(--cyan);border-radius:50%;position:relative}
    #nub{width:28px;height:28px;border-radius:50%;background:var(--cyan);position:absolute;left:34px;top:34px}
    button{border:1px solid var(--cyan);background:#02030acc;color:var(--ink);padding:12px 14px;font:700 13px ui-monospace,Menlo,monospace}
    button:disabled{opacity:.4}
  </style>
  <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.169.0/build/three.module.js"}}</script>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="top"><div id="step">1 · WALK</div><div id="log">Drag the right side to look. Drag the circle to move. Walk onto a pad.</div></div>
  <div id="bar"><div id="stick"><div id="nub"></div></div><button id="act" type="button" disabled>VOTE</button></div>
  <script type="module">
    import * as THREE from "three";
    const step = document.getElementById("step");
    const log = document.getElementById("log");
    const act = document.getElementById("act");
    const canvas = document.getElementById("view");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
    renderer.setSize(innerWidth, innerHeight);
    renderer.setClearColor(0x02030a);
    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x02030a, 10, 32);
    const camera = new THREE.PerspectiveCamera(68, innerWidth / innerHeight, 0.1, 60);
    const yaw = new THREE.Object3D();
    const pitch = new THREE.Object3D();
    yaw.position.set(0, 1.6, 7.5);
    yaw.add(pitch); pitch.add(camera); scene.add(yaw);
    scene.add(new THREE.HemisphereLight(0xd8fff8, 0x101018, 0.9));
    const sun = new THREE.DirectionalLight(0xfff4e5, 0.55);
    sun.position.set(5, 8, 3); scene.add(sun);
    scene.add(new THREE.GridHelper(28, 28, 0x1f6f66, 0x10201c));
    const walls = [];
    function wall(w, h, d, x, y, z, color) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color, roughness: 0.45 }));
      m.position.set(x, y, z); scene.add(m);
      walls.push({ x, z, hx: w / 2 + 0.35, hz: d / 2 + 0.35 });
    }
    function sign(text, x, y, z, color) {
      const c = document.createElement("canvas");
      c.width = 512; c.height = 128;
      const g = c.getContext("2d");
      g.fillStyle = color; g.font = "700 54px sans-serif"; g.fillText(text, 12, 78);
      const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true }));
      s.position.set(x, y, z); s.scale.set(2.4, 0.6, 1); scene.add(s);
    }
    wall(1.2, 3.4, 1.2, -4, 1.7, 0, 0x3dceb8); sign("DCLM", -4, 3.7, 0, "#63f7dd");
    wall(1.2, 3.4, 1.2, 4, 1.7, 0, 0x6d5bd0); sign("IRIS", 4, 3.7, 0, "#a68cff");
    wall(2.2, 1.4, 2.2, 0, 0.7, 0, 0x102028); sign("CORE", 0, 1.8, 0, "#63f7dd");
    const pads = [
      { name: "FATHER", at: new THREE.Vector3(-2.4, 0.04, 2.6), color: 0xffd37d },
      { name: "SON", at: new THREE.Vector3(2.4, 0.04, 2.6), color: 0x63f7dd },
      { name: "SPIRIT", at: new THREE.Vector3(0, 0.04, -2.8), color: 0xa68cff }
    ];
    const votes = {};
    pads.forEach(p => {
      const m = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 0.06, 24), new THREE.MeshStandardMaterial({ color: p.color }));
      m.position.copy(p.at); scene.add(m); p.mesh = m;
      sign(p.name, p.at.x, 0.9, p.at.z, "#" + p.color.toString(16).padStart(6, "0"));
    });
    let lookX = 0, lookY = 0, moveX = 0, moveZ = 0, near = null;
    const stick = document.getElementById("stick");
    const nub = document.getElementById("nub");
    stick.addEventListener("pointerdown", e => stick.setPointerCapture(e.pointerId));
    stick.addEventListener("pointermove", e => {
      if (!stick.hasPointerCapture(e.pointerId)) return;
      const r = stick.getBoundingClientRect();
      moveX = Math.max(-1, Math.min(1, (e.clientX - r.left - 48) / 36));
      moveZ = Math.max(-1, Math.min(1, (e.clientY - r.top - 48) / 36));
      nub.style.left = (34 + moveX * 28) + "px";
      nub.style.top = (34 + moveZ * 28) + "px";
    });
    function dropStick() { moveX = 0; moveZ = 0; nub.style.left = "34px"; nub.style.top = "34px"; }
    stick.addEventListener("pointerup", dropStick);
    stick.addEventListener("pointercancel", dropStick);
    canvas.addEventListener("pointerdown", e => { if (e.clientX > innerWidth * 0.45) canvas.setPointerCapture(e.pointerId); });
    canvas.addEventListener("pointermove", e => {
      if (!canvas.hasPointerCapture(e.pointerId)) return;
      lookX -= e.movementX * 0.005; lookY -= e.movementY * 0.004;
    });
    const keys = {};
    addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
    addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);
    function blocked(x, z) { return walls.some(w => Math.abs(x - w.x) < w.hx && Math.abs(z - w.z) < w.hz); }
    function tally() { return Object.values(votes).filter(Boolean).length; }
    act.onclick = async () => {
      if (act.textContent === "RUN") {
        log.textContent = "Vote passed. Asking the public kernel.";
        const base = location.host.endsWith("dualiscapax.ai") ? "" : "https://dualiscapax.ai";
        try {
          const data = await fetch(base + "/api/v2/compute", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ payload: "vote:" + Object.keys(votes).filter(k => votes[k]).join("-") }) }).then(r => r.json());
          step.textContent = data.accepted ? "3 · SEE" : "3 · HOLE";
          log.textContent = "seq " + data.sequence + "\n" + data.inputDigest + "\nwrite not granted";
        } catch (err) { step.textContent = "3 · HOLE"; log.textContent = err.message; }
        return;
      }
      if (!near) return;
      votes[near.name] = !votes[near.name];
      const n = tally();
      step.textContent = n >= 2 ? "3 · RUN" : "2 · VOTE " + n + "/2";
      log.textContent = near.name + (votes[near.name] ? " voted" : " cleared") + ". Need two. Authority stays none.";
    };
    (function frame() {
      lookY = Math.max(-1, Math.min(1, lookY));
      yaw.rotation.y = lookX; pitch.rotation.x = lookY;
      const forward = Number(keys.w || keys.arrowup) - Number(keys.s || keys.arrowdown);
      const side = Number(keys.d || keys.arrowright) - Number(keys.a || keys.arrowleft);
      const dir = new THREE.Vector3(side + moveX, 0, -forward - moveZ);
      if (dir.lengthSq() > 0.01) {
        dir.normalize().applyEuler(new THREE.Euler(0, lookX, 0)).multiplyScalar(0.07);
        const nx = yaw.position.x + dir.x, nz = yaw.position.z + dir.z;
        if (!blocked(nx, yaw.position.z)) yaw.position.x = nx;
        if (!blocked(yaw.position.x, nz)) yaw.position.z = nz;
      }
      near = pads.find(p => yaw.position.distanceTo(p.at) < 1.3) || null;
      pads.forEach(p => { p.mesh.scale.y = p === near ? 2.4 : 1; });
      const n = tally();
      if (n >= 2) { act.disabled = false; act.textContent = "RUN"; }
      else if (near) { act.disabled = false; act.textContent = votes[near.name] ? "CLEAR" : "VOTE"; }
      else { act.disabled = true; act.textContent = "VOTE"; step.textContent = "1 · WALK"; }
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    })();
    addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
  </script>
</body>
</html>
