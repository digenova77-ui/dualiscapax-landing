<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Runtime — DualisCapax</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="brand">DUALISCAPAX <span class="orb"></span></div>
  <nav>
    <a href="index.html">Gateway</a>
    <a href="onboard.html">Onboard</a>
    <a href="runtime.html">Runtime</a>
    <a href="pay.html">Pay</a>
  </nav>
</header>
<main>
  <h1>Runtime</h1>
  <p class="lead">Reads the Unity packet this browser sealed. Dualis does not host the OS. Open a downloaded pack on any other device.</p>
  <div class="card" id="box"><p class="lead">No packet in this browser. Seal on Onboard.</p></div>
  <p style="margin-top:1rem"><a class="btn" href="onboard.html">Onboard</a> <a class="btn ghost" href="pay.html">Pay</a></p>
</main>
<script>
(function () {
  var box = document.getElementById("box");
  var raw = null;
  try { raw = localStorage.getItem("dc.unity.id"); } catch (e) {}
  if (!raw) return;
  var p;
  try { p = JSON.parse(raw); } catch (e) { box.innerHTML = "<p>Packet unreadable.</p>"; return; }
  var look = p.look || {};
  var eth = (p.eth && p.eth.address) || "none";
  var firm = (p.llp && p.llp.status) || "NEED_FIRM";
  box.innerHTML =
    "<p><strong>" + (look.name || "unnamed") + "</strong> · " + (look.kind || "") + "</p>" +
    "<p>" + (look.municipality || "no municipality") + " · " + (look.email || "no email") + "</p>" +
    "<p>ETH " + eth + "</p>" +
    "<p>Firm chair " + firm + "</p>" +
    "<p>Phrase hash " + (p.passphrase_sha256 ? "present" : "missing") +
    " · Passkey " + (p.passkey ? "present" : "missing") + "</p>" +
    "<p class=\"lead\">Grant still class 0 until Fuel or a seat is paid.</p>";
})();
</script>
</body>
</html>
