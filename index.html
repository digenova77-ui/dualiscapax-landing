  <style>
    :root {
      color-scheme: dark;
      --bg: #050505;
      --bg-elevated: #0c0c0c;
      --fg: #f5f5f5;
      --fg-muted: rgba(245, 245, 245, 0.75);
      --fg-soft: rgba(245, 245, 245, 0.72);
      --quark: #7eb6ff;
      --quark-glow: rgba(126, 182, 255, 0.85);
      --quark-glow-soft: rgba(90, 150, 255, 0.35);
      --nav: var(--fg-muted);
      --theme-color: #050505;
    }
    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --bg: #f4f5f7;
        --bg-elevated: #ffffff;
        --fg: #0a0a0a;
        --fg-muted: rgba(10, 10, 10, 0.72);
        --fg-soft: rgba(10, 10, 10, 0.68);
        --quark: #2a6fd4;
        --quark-glow: rgba(42, 111, 212, 0.55);
        --quark-glow-soft: rgba(42, 111, 212, 0.25);
        --nav: var(--fg-muted);
        --theme-color: #f4f5f7;
      }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; -webkit-text-size-adjust: 100%; }
    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;

      color: var(--fg);

      overflow: hidden;

    a { color: inherit; text-decoration: none; }

    .quark-field {
      position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
      opacity: 0;
      animation: fieldIn 1.4s ease-out 0.15s forwards;
    }
    @keyframes fieldIn { to { opacity: 1; } }
    .quark {
      position: absolute; width: 2px; height: 2px; border-radius: 50%;
      background: var(--quark);
      box-shadow: 0 0 4px 1px var(--quark-glow), 0 0 10px 2px var(--quark-glow-soft);

    .quark:nth-child(1)  { left: 8%;  top: 12%; animation-delay: 0s; opacity: 0.4; }
    .quark:nth-child(2)  { left: 22%; top: 28%; width: 1.5px; height: 1.5px; animation-delay: 0.5s; }

    .quark:nth-child(5)  { left: 78%; top: 11%; animation-delay: 1.6s; }
    .quark:nth-child(6)  { left: 91%; top: 24%; width: 1.5px; height: 1.5px; animation-delay: 2.2s; opacity: 0.45; }
    .quark:nth-child(7)  { left: 14%; top: 48%; width: 1px; height: 1px; animation-delay: 0.9s; opacity: 0.3; }

    .quark:nth-child(10) { left: 71%; top: 51%; animation-delay: 0.7s; opacity: 0.4; }
    .quark:nth-child(11) { left: 88%; top: 58%; width: 1px; height: 1px; animation-delay: 2.5s; opacity: 0.35; }
    .quark:nth-child(12) { left: 6%;  top: 72%; animation-delay: 1.8s; opacity: 0.5; }
    .quark:nth-child(13) { left: 27%; top: 81%; width: 1.5px; height: 1.5px; animation-delay: 0.4s; }
    .quark:nth-child(14) { left: 48%; top: 68%; width: 1px; height: 1px; animation-delay: 2.8s; opacity: 0.3; }
    .quark:nth-child(15) { left: 66%; top: 84%; animation-delay: 1.2s; opacity: 0.6; }
    .quark:nth-child(16) { left: 84%; top: 76%; width: 1.5px; height: 1.5px; animation-delay: 2.1s; opacity: 0.4; }
    .quark:nth-child(17) { left: 18%; top: 38%; width: 1px; height: 1px; animation-delay: 3.0s; opacity: 0.25; }

    header nav {

    .logo-stage canvas,

      position: absolute;

      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }
    .logo-stage img.logo-exact {
      opacity: 0;

      z-index: 2;
    }
    .logo-stage img.logo-exact.is-on { opacity: 1; }
    .logo-stage canvas { z-index: 1; }

    .geo-wrap {
      width: min(52vw, 180px);
      height: min(52vw, 180px);
      margin: 0 0 1.15rem;
      flex-shrink: 0;
      overflow: visible;
      background: transparent;
      opacity: 1;
    }
    #geo-earth {
      width: 100%; height: 100%;
      display: block;
      background: transparent;

    h1 {
      font-size: clamp(2.6rem, 11vw, 4.5rem); font-weight: 900;
      line-height: 0.9; letter-spacing: -0.05em; text-transform: uppercase;
      margin: 0 0 0.65rem;
      color: var(--fg);

    .lines {
      display: flex; flex-direction: column; align-items: center;

    .line {

    @media (max-height: 640px) {

      .geo-wrap { width: min(40vw, 140px); height: min(40vw, 140px); margin-bottom: 0.7rem; }
      h1 { font-size: clamp(2.2rem, 9vw, 3.2rem); margin-bottom: 0.45rem; }
      .line { font-size: 0.95rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .arrive, header nav a, .line, .quark-field, .logo-stage {
        animation: none !important;
        opacity: 1 !important;
        filter: none !important;
        transform: none !important;
      }
      .logo-stage img.logo-exact { opacity: 1 !important; }
    }
  </style>

  <script>
  (function logoParticles() {
    const canvas = document.getElementById('logo-particles');
    const exact = document.getElementById('logo-exact');
    const ctx = canvas.getContext('2d');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const LOGO_SRC = 'brand/logo-dna-x.svg';

    let particles = [];
    let orbiters = [];
    let start = null;
    let logoImg = null;
    let settled = false;
    const ASSEMBLE_MS = 3600;

    function loadLogo() {
      return new Promise(function (resolve) {
        const img = new Image();
        img.decoding = 'sync';
        img.onload = function () { logoImg = img; resolve(img); };
        img.onerror = function () { logoImg = null; resolve(null); };
        img.src = LOGO_SRC;
      });
    }

    function sampleFromExact() {
      const w = canvas.clientWidth || 360;
      const h = canvas.clientHeight || 90;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const off = document.createElement('canvas');
      off.width = Math.floor(w * dpr);
      off.height = Math.floor(h * dpr);
      const o = off.getContext('2d');
      o.setTransform(dpr, 0, 0, dpr, 0, 0);
      o.clearRect(0, 0, w, h);

      if (logoImg) {
        const ar = 900 / 200;
        let dw = w, dh = w / ar;
        if (dh > h) { dh = h; dw = h * ar; }
        o.drawImage(logoImg, (w - dw) / 2, (h - dh) / 2, dw, dh);
      }

      const data = o.getImageData(0, 0, off.width, off.height).data;
      const targets = [];
      const step = Math.max(1, Math.floor(1.25 * dpr));
      for (let y = 0; y < off.height; y += step) {
        for (let x = 0; x < off.width; x += step) {
          const i = (y * off.width + x) * 4;
          if (data[i + 3] < 40) continue;
          const r = data[i], g = data[i + 1], b = data[i + 2];
          targets.push({ x: x / dpr, y: y / dpr, dna: b > 160 && g > 140 && r < 140 });
        }
      }
      targets.sort(function (a, b) { return a.x - b.x || a.y - b.y; });
      return { targets: targets, w: w, h: h };
    }

    function rebuild() {
      settled = false;
      exact.classList.remove('is-on');
      const sample = sampleFromExact();
      const targets = sample.targets;
      const w = sample.w, h = sample.h, n = targets.length;

      particles = targets.map(function (t, i) {
        const rank = n <= 1 ? 0 : i / (n - 1);
        const angle = Math.random() * Math.PI * 2;
        const dist = (0.4 + Math.random() * 1.1) * Math.max(w, h);
        return {
          tx: t.x, ty: t.y,
          x: w / 2 + Math.cos(angle) * dist,
          y: h / 2 + Math.sin(angle) * dist,
          r: t.dna ? 1.05 + Math.random() * 1.1 : 0.9 + Math.random() * 1.1,
          phase: Math.random() * Math.PI * 2,
          bright: 0.8 + Math.random() * 0.2,
          rank: rank,
          dna: t.dna
        };
      });

      const cx = w / 2, cy = h / 2;
      orbiters = [];
      for (let i = 0; i < 36; i++) {
        const radius = (0.32 + Math.random() * 0.4) * Math.min(w, h * 2.1);
        orbiters.push({
          a: (i / 36) * Math.PI * 2 + Math.random() * 0.35,
          speed: 0.0003 + Math.random() * 0.0005,
          rx: radius * (0.9 + Math.random() * 0.3),
          ry: radius * (0.32 + Math.random() * 0.22),
          cx: cx + (Math.random() - 0.5) * w * 0.06,
          cy: cy + (Math.random() - 0.5) * h * 0.1,
          r: 0.9 + Math.random() * 1.3,
          phase: Math.random() * Math.PI * 2,
          flash: Math.random() * Math.PI * 2,
          flashSpeed: 0.002 + Math.random() * 0.0035
        });
      }
      start = performance.now();
    }

    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
    function smoothstep(a, b, x) {
      const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
      return t * t * (3 - 2 * t);
    }

    function frame(now) {
      if (start == null) start = now;
      const w = canvas.clientWidth, h = canvas.clientHeight;
      ctx.clearRect(0, 0, w, h);

      const t = Math.min(1, (now - start) / ASSEMBLE_MS);
      const density = easeOutCubic(t);
      const front = density * 1.15;
      const shine = smoothstep(0.7, 1, t);
      const glisten = smoothstep(0.85, 1, t);

      if (!settled && t >= 0.92) {
        settled = true;
        exact.classList.add('is-on');
      }
      const coreFade = settled ? 0.22 : 1;

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        const local = smoothstep(p.rank - 0.08, p.rank + 0.02, front);
        if (local <= 0.001) continue;
        const pull = 0.05 + local * 0.2;
        p.x += (p.tx - p.x) * pull;
        p.y += (p.ty - p.y) * pull;
        const pulse = 0.85 + 0.15 * Math.sin(now * 0.0035 + p.phase);
        const alpha = Math.min(1, local * p.bright * pulse * (0.55 + 0.45 * density) * coreFade);
        const radius = p.r * (0.7 + 0.3 * local);
        ctx.beginPath();
        ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
        if (p.dna) {
          ctx.fillStyle = 'rgba(0, 212, 232, ' + alpha + ')';
          ctx.shadowColor = 'rgba(0, 212, 232, ' + (0.4 * alpha) + ')';
        } else {
          ctx.fillStyle = 'rgba(245, 245, 245, ' + alpha + ')';
          ctx.shadowColor = 'rgba(200, 220, 255, ' + (0.25 * alpha) + ')';
        }
        ctx.shadowBlur = 2 + 2 * shine;
        ctx.fill();
      }

      if (glisten > 0.01) {
        for (let i = 0; i < orbiters.length; i++) {
          const o = orbiters[i];
          o.a += o.speed * 16;
          const x = o.cx + Math.cos(o.a) * o.rx;
          const y = o.cy + Math.sin(o.a) * o.ry;
          const flash = Math.pow(0.5 + 0.5 * Math.sin(now * o.flashSpeed + o.flash), 10);
          const pulse = 0.5 + 0.5 * Math.sin(now * 0.003 + o.phase);
          const alpha = glisten * (0.2 + 0.8 * flash) * (0.5 + 0.5 * pulse) * 0.9;
          ctx.beginPath();
          ctx.arc(x, y, o.r * (0.55 + flash), 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(220, 240, 255, ' + alpha + ')';
          ctx.shadowColor = 'rgba(160, 210, 255, ' + (0.7 * alpha) + ')';
          ctx.shadowBlur = 3 + 10 * flash;
          ctx.fill();
        }
      }

      ctx.shadowBlur = 0;
      requestAnimationFrame(frame);
    }

    loadLogo().then(function () {
      rebuild();
      requestAnimationFrame(frame);
    });

    window.addEventListener('resize', function () {
      clearTimeout(window.__logoResize);
      window.__logoResize = setTimeout(rebuild, 120);
    });
  })();
  </script>

  <script type="module">
  import * as THREE from 'three';

  const canvas = document.getElementById('geo-earth');
  const renderer = new THREE.WebGLRenderer({
    canvas, antialias: true, alpha: true,
    powerPreference: 'high-performance', premultipliedAlpha: false
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);
  renderer.setClearColor(0x000000, 0);
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 20);
  camera.position.z = 3.55;

  scene.add(new THREE.AmbientLight(0xffffff, 0.65));
  const key = new THREE.DirectionalLight(0xffffff, 1.2);
  key.position.set(2.4, 1.6, 3.0);
  scene.add(key);
  const fill = new THREE.DirectionalLight(0x8899aa, 0.5);
  fill.position.set(-2, -0.5, 1.5);
  scene.add(fill);

  /* target geodesic positions from icosahedron vertices */
  const geo = new THREE.IcosahedronGeometry(0.92, 2);
  const posAttr = geo.attributes.position;
  const targetCount = posAttr.count;
  const targets = new Float32Array(targetCount * 3);
  for (let i = 0; i < targetCount; i++) {
    targets[i * 3] = posAttr.getX(i);
    targets[i * 3 + 1] = posAttr.getY(i);
    targets[i * 3 + 2] = posAttr.getZ(i);
  }

  /* burst particles start at center, fly out to digitize the shell */
  const burstGeo = new THREE.BufferGeometry();
  const burstPos = new Float32Array(targetCount * 3); /* all at 0 */
  burstGeo.setAttribute('position', new THREE.BufferAttribute(burstPos, 3));
  const burstMat = new THREE.PointsMaterial({
    color: 0xffffff,
    size: 0.055,
    sizeAttenuation: true,
    transparent: true,
    opacity: 0,
    depthWrite: false
  });
  const burst = new THREE.Points(burstGeo, burstMat);

  const bodyMat = new THREE.MeshStandardMaterial({
    color: 0x6a7a88, flatShading: true, metalness: 0.35, roughness: 0.35,
    transparent: true, opacity: 0, depthWrite: false,
    emissive: 0xffffff, emissiveIntensity: 0
  });
  const body = new THREE.Mesh(geo, bodyMat);

  const wireMat = new THREE.LineBasicMaterial({ color: 0xd0d8e0, transparent: true, opacity: 0 });
  const wire = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 1), wireMat);
  wire.scale.setScalar(1.002);

  const wireOuterMat = new THREE.LineBasicMaterial({ color: 0x8a98a8, transparent: true, opacity: 0 });
  const wireOuter = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(0.97, 1), 1),
    wireOuterMat
  );

  const pointsMat = new THREE.PointsMaterial({
    color: 0xe8ecf0, size: 0.032, sizeAttenuation: true,
    transparent: true, opacity: 0
  });
  const points = new THREE.Points(geo.clone(), pointsMat);

  const coreMat = new THREE.MeshBasicMaterial({
    color: 0xffffff, transparent: true, opacity: 0, depthWrite: false
  });
  const core = new THREE.Mesh(new THREE.SphereGeometry(0.14, 24, 24), coreMat);
  const haloMat = new THREE.MeshBasicMaterial({
    color: 0xffffff, transparent: true, opacity: 0, depthWrite: false
  });
  const halo = new THREE.Mesh(new THREE.SphereGeometry(0.28, 24, 24), haloMat);

  const group = new THREE.Group();
  group.add(core);
  group.add(halo);
  group.add(burst);
  group.add(body);
  group.add(wire);
  group.add(wireOuter);
  group.add(points);
  scene.add(group);

  /* timeline */
  const BIRTH_DELAY = 2.3;
  const FLASH_MS = 380;
  const BURST_MS = 900;   /* particles fly out / digitize */
  const ZOOM_MS = 750;    /* rapid zoom concurrent with burst */
  const pageStart = performance.now();
  let last = pageStart;
  const Y_SPEED = (Math.PI * 2) / 22;

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
  function smoothstep(a, b, x) {
    const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
    return t * t * (3 - 2 * t);
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    const age = (now - pageStart) / 1000;
    const since = age - BIRTH_DELAY;

    let scale = 0.001;
    let coreOp = 0, haloOp = 0, burstOp = 0;
    let meshOp = 0, wireOp = 0, emissive = 0;
    let assemble = 0;

    if (since >= 0) {
      const ms = since * 1000;
      const flashT = Math.min(1, ms / FLASH_MS);
      const burstT = Math.min(1, Math.max(0, (ms - FLASH_MS * 0.35) / BURST_MS));
      const zoomT = Math.min(1, Math.max(0, (ms - FLASH_MS * 0.2) / ZOOM_MS));

      const flashPulse = Math.max(0, Math.sin(flashT * Math.PI * 3.5)) * (1 - flashT * 0.4);
      const flashBoost = flashPulse * (1 - burstT * 0.85);

      assemble = easeOutCubic(burstT);

      /* rapid zoom from seed → full */
      const seed = 0.05 + flashBoost * 0.06;
      scale = seed + (1 - seed) * easeOutCubic(zoomT);

      coreOp = (0.98 + 0.02 * flashBoost) * (1 - smoothstep(0.25, 0.85, burstT));
      haloOp = (0.55 + 0.4 * flashBoost) * (1 - smoothstep(0.1, 0.7, burstT));
      burstOp = smoothstep(0.05, 0.25, burstT) * (1 - smoothstep(0.55, 1, burstT)) * 0.95
               + smoothstep(0.2, 0.6, burstT) * 0.35;
      meshOp = 0.55 * smoothstep(0.35, 0.9, burstT);
      wireOp = 0.72 * smoothstep(0.4, 0.95, burstT);
      emissive = (3.2 + 5 * flashBoost) * (1 - smoothstep(0.3, 0.95, burstT))
               + 0.35 * smoothstep(0.7, 1, burstT);
    }

    /* particulate digitize: vertices expand from center → shell */
    const arr = burstGeo.attributes.position.array;
    for (let i = 0; i < targetCount; i++) {
      const j = i * 3;
      /* slight stagger by index so it reads as a wave, not a rigid scale */
      const lag = (i % 17) / 17;
      const local = smoothstep(lag * 0.35, lag * 0.35 + 0.65, assemble);
      arr[j]     = targets[j] * local;
      arr[j + 1] = targets[j + 1] * local;
      arr[j + 2] = targets[j + 2] * local;
    }
    burstGeo.attributes.position.needsUpdate = true;

    group.scale.setScalar(scale);
    group.rotation.y += Y_SPEED * dt;
    group.rotation.x = 0.25;

    coreMat.opacity = coreOp;
    haloMat.opacity = haloOp;
    burstMat.opacity = burstOp;
    burstMat.size = 0.04 + 0.04 * (1 - assemble);
    bodyMat.opacity = meshOp;
    bodyMat.emissiveIntensity = emissive;
    wireMat.opacity = wireOp;
    wireOuterMat.opacity = wireOp * 0.55;
    pointsMat.opacity = wireOp * 0.85;

    core.visible = coreOp > 0.01;
    halo.visible = haloOp > 0.01;
    burst.visible = burstOp > 0.01;

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function onResize() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (w < 1 || h < 1) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', onResize);
  onResize();
  </script>
</body>
</html>
