<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DualisCapax</title>
  <meta name="description" content="Residual Law Finance. Cutting Edge Technology. Adaptive AI. Research." />
  <meta name="theme-color" content="#050505" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; -webkit-text-size-adjust: 100%; }
    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: #050505;
      color: #f5f5f5;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow: hidden;
    }
    a { color: inherit; text-decoration: none; }

    .quark-field {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .quark {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: #7eb6ff;
      box-shadow:
        0 0 4px 1px rgba(126, 182, 255, 0.85),
        0 0 10px 2px rgba(90, 150, 255, 0.35);
      opacity: 0.55;
      animation: quarkPulse 3.8s ease-in-out infinite;
    }
    .quark:nth-child(1)  { left: 8%;  top: 12%; animation-delay: 0s; opacity: 0.4; }
    .quark:nth-child(2)  { left: 22%; top: 28%; width: 1.5px; height: 1.5px; animation-delay: 0.5s; }
    .quark:nth-child(3)  { left: 41%; top: 9%;  animation-delay: 1.1s; opacity: 0.65; }
    .quark:nth-child(4)  { left: 63%; top: 18%; width: 1.5px; height: 1.5px; animation-delay: 0.3s; opacity: 0.35; }
    .quark:nth-child(5)  { left: 78%; top: 11%; animation-delay: 1.6s; }
    .quark:nth-child(6)  { left: 91%; top: 24%; width: 1.5px; height: 1.5px; animation-delay: 2.2s; opacity: 0.45; }
    .quark:nth-child(7)  { left: 14%; top: 48%; width: 1px; height: 1px; animation-delay: 0.9s; opacity: 0.3; }
    .quark:nth-child(8)  { left: 33%; top: 56%; animation-delay: 1.4s; opacity: 0.55; }
    .quark:nth-child(9)  { left: 52%; top: 42%; width: 1.5px; height: 1.5px; animation-delay: 2.0s; }
    .quark:nth-child(10) { left: 71%; top: 51%; animation-delay: 0.7s; opacity: 0.4; }
    .quark:nth-child(11) { left: 88%; top: 58%; width: 1px; height: 1px; animation-delay: 2.5s; opacity: 0.35; }
    .quark:nth-child(12) { left: 6%;  top: 72%; animation-delay: 1.8s; opacity: 0.5; }
    .quark:nth-child(13) { left: 27%; top: 81%; width: 1.5px; height: 1.5px; animation-delay: 0.4s; }
    .quark:nth-child(14) { left: 48%; top: 68%; width: 1px; height: 1px; animation-delay: 2.8s; opacity: 0.3; }
    .quark:nth-child(15) { left: 66%; top: 84%; animation-delay: 1.2s; opacity: 0.6; }
    .quark:nth-child(16) { left: 84%; top: 76%; width: 1.5px; height: 1.5px; animation-delay: 2.1s; opacity: 0.4; }
    .quark:nth-child(17) { left: 18%; top: 38%; width: 1px; height: 1px; animation-delay: 3.0s; opacity: 0.25; }
    .quark:nth-child(18) { left: 57%; top: 22%; animation-delay: 1.5s; opacity: 0.45; }
    .quark:nth-child(19) { left: 39%; top: 91%; width: 1.5px; height: 1.5px; animation-delay: 0.8s; }
    .quark:nth-child(20) { left: 95%; top: 88%; width: 1px; height: 1px; animation-delay: 2.4s; opacity: 0.35; }
    @keyframes quarkPulse {
      0%, 100% { opacity: 0.2; transform: scale(0.85); }
      50% { opacity: 0.9; transform: scale(1.2); }
    }

    .shell {
      position: relative;
      z-index: 1;
      height: 100dvh;
      height: 100svh;
      max-width: 44rem;
      margin: 0 auto;
      padding: 0 1.25rem;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 0 0;
      gap: 1rem;
      flex: 0 0 auto;
    }
    .mark { font-size: 1.15rem; font-weight: 800; letter-spacing: -0.04em; }
    nav { display: flex; gap: 1.35rem; flex-wrap: wrap; }
    nav a { font-size: 0.95rem; font-weight: 600; color: rgba(245,245,245,0.7); }

    main {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 0;
      gap: 0.55rem;
    }

    #geo-earth {
      width: min(44vw, 156px);
      height: min(44vw, 156px);
      margin-bottom: 0.75rem;
      flex-shrink: 0;
      display: block;
    }

    h1 {
      font-size: clamp(2.85rem, 12vw, 4.75rem);
      font-weight: 900;
      line-height: 0.88;
      letter-spacing: -0.05em;
      text-transform: uppercase;
      margin-bottom: 0.55rem;
    }
    .line {
      font-size: clamp(1.05rem, 3.8vw, 1.25rem);
      font-weight: 600;
      color: rgba(245,245,245,0.75);
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <div class="quark-field" aria-hidden="true">
    <span class="quark"></span><span class="quark"></span><span class="quark"></span><span class="quark"></span>
    <span class="quark"></span><span class="quark"></span><span class="quark"></span><span class="quark"></span>
    <span class="quark"></span><span class="quark"></span><span class="quark"></span><span class="quark"></span>
    <span class="quark"></span><span class="quark"></span><span class="quark"></span><span class="quark"></span>
    <span class="quark"></span><span class="quark"></span><span class="quark"></span><span class="quark"></span>
  </div>
  <div class="shell">
    <header>
      <a href="index.html" class="mark">DualisCapax</a>
      <nav>
        <a href="research/">Research</a>
        <a href="corporate.html">Financial</a>
        <a href="ai/">AI</a>
      </nav>
    </header>
    <main>
      <canvas id="geo-earth" width="312" height="312" aria-hidden="true"></canvas>
      <h1>Truth<br>Prevails.</h1>
      <p class="line">Residual Law Finance.</p>
      <p class="line">Cutting Edge Technology.</p>
      <p class="line">Adaptive AI.</p>
      <p class="line">Research.</p>
    </main>
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js"
    }
  }
  </script>
  <script type="module">
  import * as THREE from 'three';

  const canvas = document.getElementById('geo-earth');
  if (!canvas) throw new Error('no canvas');

  const renderer = new THREE.WebGLRenderer({
    canvas,
    antialias: true,
    alpha: true,
    powerPreference: 'low-power'
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);
  renderer.setClearColor(0x000000, 0);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 20);
  camera.position.z = 3.35;

  const ambient = new THREE.AmbientLight(0xb0c4de, 0.55);
  scene.add(ambient);
  const key = new THREE.DirectionalLight(0xffffff, 1.05);
  key.position.set(2.2, 1.4, 2.8);
  scene.add(key);
  const fill = new THREE.DirectionalLight(0x6a8caf, 0.35);
  fill.position.set(-2, -0.5, 1.5);
  scene.add(fill);

  // Faceted geodesic (subdivided icosahedron) — mathematical bucky structure
  const geometry = new THREE.IcosahedronGeometry(1, 3);

  // Procedural Earth-like map on canvas (no external texture dependency)
  function makeEarthTexture() {
    const s = 1024;
    const c = document.createElement('canvas');
    c.width = s;
    c.height = s;
    const ctx = c.getContext('2d');
    // ocean
    const ocean = ctx.createLinearGradient(0, 0, s, s);
    ocean.addColorStop(0, '#0a2a4a');
    ocean.addColorStop(0.5, '#0d3d6b');
    ocean.addColorStop(1, '#0a3058');
    ctx.fillStyle = ocean;
    ctx.fillRect(0, 0, s, s);
    // continents — irregular blobs, recognizable as land masses
    const lands = [
      [0.18, 0.32, 0.14, 0.22], [0.28, 0.28, 0.10, 0.16], // Americas-ish
      [0.48, 0.30, 0.08, 0.14], [0.55, 0.38, 0.12, 0.20], // Africa/Europe-ish
      [0.62, 0.28, 0.16, 0.14], [0.72, 0.36, 0.12, 0.18], // Asia-ish
      [0.78, 0.62, 0.10, 0.10], // Australia-ish
      [0.42, 0.68, 0.20, 0.12]  // southern band
    ];
    for (const [u, v, w, h] of lands) {
      const x = u * s, y = v * s, bw = w * s, bh = h * s;
      const g = ctx.createRadialGradient(x, y, 0, x, y, Math.max(bw, bh));
      g.addColorStop(0, '#3d6b3a');
      g.addColorStop(0.55, '#2a5530');
      g.addColorStop(1, 'rgba(20,50,40,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(x, y, bw, bh, 0.3, 0, Math.PI * 2);
      ctx.fill();
    }
    // ice caps
    ctx.fillStyle = 'rgba(220,230,240,0.55)';
    ctx.fillRect(0, 0, s, s * 0.08);
    ctx.fillRect(0, s * 0.92, s, s * 0.08);
    // subtle noise for density
    const img = ctx.getImageData(0, 0, s, s);
    for (let i = 0; i < img.data.length; i += 4) {
      const n = (Math.random() - 0.5) * 12;
      img.data[i] = Math.min(255, Math.max(0, img.data[i] + n));
      img.data[i + 1] = Math.min(255, Math.max(0, img.data[i + 1] + n));
      img.data[i + 2] = Math.min(255, Math.max(0, img.data[i + 2] + n));
    }
    ctx.putImageData(img, 0, 0);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = 4;
    return tex;
  }

  const earthMap = makeEarthTexture();

  // Opaque faceted body — carbon-gray base with Earth map (flatShading = mathematical faces)
  const bodyMat = new THREE.MeshStandardMaterial({
    map: earthMap,
    color: 0x9aa3ad,
    flatShading: true,
    metalness: 0.35,
    roughness: 0.72,
    emissive: 0x0a1218,
    emissiveIntensity: 0.15
  });
  const body = new THREE.Mesh(geometry, bodyMat);
  scene.add(body);

  // Dense carbon wire geodesic overlay (edges of same geometry)
  const edges = new THREE.EdgesGeometry(geometry, 15);
  const wireMat = new THREE.LineBasicMaterial({
    color: 0x2a2e32,
    transparent: true,
    opacity: 0.85
  });
  const wire = new THREE.LineSegments(edges, wireMat);
  wire.scale.setScalar(1.002);
  scene.add(wire);

  // Soft outer shell hint (slightly larger, very dark carbon)
  const shellGeo = new THREE.IcosahedronGeometry(1.04, 2);
  const shellEdges = new THREE.EdgesGeometry(shellGeo, 20);
  const shellWire = new THREE.LineSegments(
    shellEdges,
    new THREE.LineBasicMaterial({ color: 0x1a1c1e, transparent: true, opacity: 0.35 })
  );
  scene.add(shellWire);

  const group = new THREE.Group();
  group.add(body);
  group.add(wire);
  group.add(shellWire);
  scene.add(group);

  // ~Earth display pace (slow Y)
  const Y_SPEED = (Math.PI * 2) / 48;

  function frame(t) {
    const sec = t * 0.001;
    group.rotation.y = sec * Y_SPEED;
    // slight tilt so facets read in depth (not pure billboard)
    group.rotation.x = 0.22;
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function onResize() {
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    if (w < 1 || h < 1) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', onResize);
  onResize();
  </script>
</body>
</html>
