<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DualisCapax</title>
  <meta name="description" content="No tribes preferred. Truth prevails. DualisCapax — Financial, Research, AI." />
  <meta name="theme-color" content="#030308" />
  <link rel="icon" href="brand/emblem-helix.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: #030308;
      color: #f5f5f5;
      font-family: Inter, system-ui, sans-serif;
    }

    /* Strict document flow: header → dome → words */
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.65rem;
      padding: calc(0.85rem + env(safe-area-inset-top)) 0.9rem 0.75rem;
    }
    .brand {
      font-size: clamp(1.05rem, 3.8vw, 1.55rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #fff;
      text-decoration: none;
      white-space: nowrap;
    }
    .menu {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      gap: 0.35rem;
    }
    .menu a {
      color: rgba(255,255,255,0.88);
      text-decoration: none;
      font-size: clamp(0.72rem, 2.5vw, 0.9rem);
      font-weight: 600;
      padding: 0.48rem 0.62rem;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 999px;
      background: rgba(0,0,0,0.3);
      white-space: nowrap;
    }

    /* Dome only lives in this box — 75% viewport height max */
    .dome {
      width: 100%;
      height: 75vh;
      height: 75dvh;
      max-height: 75dvh;
      background: #030308;
      overflow: hidden;
      position: relative;
    }
    .dome canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    /* Words are in normal flow BELOW the dome box */
    .words {
      width: 100%;
      padding: 1.5rem 1.25rem calc(1.75rem + env(safe-area-inset-bottom));
      text-align: center;
      background: #030308;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .words .subtitle {
      font-size: clamp(1rem, 3.8vw, 1.15rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.72);
      margin-bottom: 0.45rem;
    }
    .words .title {
      font-size: clamp(2rem, 7.5vw, 3.1rem);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      margin-bottom: 1.1rem;
    }
    .audio-bar {
      display: flex;
      justify-content: center;
      gap: 0.65rem;
      flex-wrap: wrap;
    }
    .audio-bar button {
      font: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: 999px;
      padding: 0.7rem 1rem;
      border: 0;
      cursor: pointer;
    }
    #btn-narrate { background: #fff; color: #0a0a0c; }
    #btn-stop {
      background: transparent;
      color: rgba(255,255,255,0.85);
      border: 1px solid rgba(255,255,255,0.18);
    }
    .status {
      margin-top: 0.7rem;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.42);
    }
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="index.html">DualisCapax</a>
    <nav class="menu" aria-label="Primary">
      <a href="corporate.html">Financial</a>
      <a href="research/">Research</a>
      <a href="ai/chat.html">AI</a>
    </nav>
  </header>

  <section class="dome" aria-label="Residual dome">
    <canvas id="stage"></canvas>
  </section>

  <section class="words">
    <p class="subtitle">No Tribes Preferred.</p>
    <h1 class="title">Truth Prevails.</h1>
    <div class="audio-bar">
      <button type="button" id="btn-narrate">Play narration</button>
      <button type="button" id="btn-stop">Stop</button>
    </div>
    <p class="status" id="status">Dome above · words below</p>
  </section>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
  <script type="module">
    import { startMaxEngine } from './js/max-engine.js?v=75';

    const status = document.getElementById('status');
    const canvas = document.getElementById('stage');
    const engine = startMaxEngine(canvas, {
      narratorUrl: './assets/audio/narrator.mp3'
    });

    // Force resize to the dome box, not the full window
    function fit() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = Math.floor(rect.width * Math.min(devicePixelRatio, 2));
      canvas.height = Math.floor(rect.height * Math.min(devicePixelRatio, 2));
      canvas.style.width = rect.width + 'px';
      canvas.style.height = rect.height + 'px';
      window.dispatchEvent(new Event('resize'));
    }
    fit();
    window.addEventListener('resize', fit);

    document.getElementById('btn-narrate').addEventListener('click', async () => {
      const result = await engine.playNarration();
      if (result.ok) status.textContent = 'Narration playing';
      else if (result.reason === 'missing-narrator-file') status.textContent = 'Add narrator.mp3 under assets/audio';
      else status.textContent = 'Audio unavailable';
    });

    document.getElementById('btn-stop').addEventListener('click', () => {
      engine.stopNarration();
      status.textContent = 'Dome above · words below';
    });
  </script>
</body>
</html>
