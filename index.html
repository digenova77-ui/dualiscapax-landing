<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>DualisCapax</title>
<meta name="theme-color" content="#000000"/>
<link rel="stylesheet" href="/css/pipe.css"/>
</head>
<body>
<p class="word" id="word">
  <span class="lock" aria-hidden="true">
    <svg class="geo" viewBox="0 0 32 32" focusable="false">
      <g fill="none" stroke="currentColor" stroke-width="0.85" stroke-linejoin="round">
        <circle cx="16" cy="16" r="14"/>
        <ellipse cx="16" cy="16" rx="14" ry="5"/>
        <ellipse cx="16" cy="16" rx="14" ry="9.4"/>
        <ellipse cx="16" cy="16" rx="5" ry="14"/>
        <ellipse cx="16" cy="16" rx="9.4" ry="14"/>
        <path d="M16 2v28M2 16h28"/>
      </g>
    </svg>
    <span class="d">D</span>
  </span><span class="rest">ualisCapax</span>
</p>
<a class="leave" href="#" id="leave">Leave</a>
<main class="pipe" id="pipe" data-sector="core">
  <canvas class="weather" id="weather"></canvas>
  <div class="tunnel" id="tunnel"></div>
  <img class="world" id="world" alt="" />
  <img class="dna" id="dna" src="/brand/holo-helix.svg" alt=""/>
  <div class="stream" id="stream"></div>
  <div class="iris" aria-hidden="true"></div>
  <button class="door" id="door" type="button" aria-label="Door"></button>
  <div class="grains" id="grains" hidden></div>
  <div class="zap" id="zap" aria-hidden="true"></div>
  <div class="vignette"></div>
</main>
<script src="/js/pipe.js"></script>
</body>
</html>
