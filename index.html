<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DualisCapax</title>
  <meta name="description" content="No tribes preferred. Truth prevails. DualisCapax — Financial, Research, AI." />
  <meta name="theme-color" content="#030308" />
  <link rel="icon" href="brand/emblem-helix.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      min-height: 100%;
      background: #030308;
      color: #f5f5f5;
      font-family: Inter, system-ui, sans-serif;
      overflow-x: hidden;
    }
    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 0;
    }
    .ui {
      position: relative;
      z-index: 2;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding:
        calc(1rem + env(safe-area-inset-top))
        1.25rem
        calc(1.25rem + env(safe-area-inset-bottom));
      pointer-events: none;
    }
    .ui a, .ui button { pointer-events: auto; }
    .top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
    }
    .brand {
      font-size: clamp(1.45rem, 5vw, 2rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: rgba(255,255,255,0.96);
      text-decoration: none;
    }
    .menu {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.55rem;
    }
    @media (min-width: 720px) {
      .menu { flex-direction: row; flex-wrap: wrap; }
    }
    .menu a {
      color: rgba(255,255,255,0.82);
      text-decoration: none;
      font-size: clamp(0.95rem, 3.2vw, 1.05rem);
      font-weight: 600;
      padding: 0.55rem 0.9rem;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 999px;
      background: rgba(0,0,0,0.28);
      backdrop-filter: blur(10px);
    }
    .hero {
      flex: 1;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 2rem 0;
    }
    .copy {
      display: grid;
      gap: 0.75rem;
      justify-items: center;
      max-width: min(88vw, 22rem);
    }
    .subtitle {
      font-size: clamp(1rem, 3.8vw, 1.15rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.72);
    }
    .title {
      font-size: clamp(2.1rem, 8vw, 3.4rem);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      text-shadow: 0 0 40px rgba(255,255,255,0.16);
    }
    .audio-bar {
      display: flex;
      justify-content: center;
      gap: 0.65rem;
      flex-wrap: wrap;
      padding-bottom: 0.25rem;
    }
    .audio-bar button {
      font: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      color: #0a0a0c;
      background: #fff;
      border: 0;
      border-radius: 999px;
      padding: 0.7rem 1rem;
      cursor: pointer;
    }
    .audio-bar button.ghost {
      color: rgba(255,255,255,0.85);
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(10px);
    }
    .status {
      margin-top: 0.55rem;
      text-align: center;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.45);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="stage" aria-hidden="true"></canvas>

  <div class="ui">
    <header class="top">
      <a class="brand" href="index.html">DualisCapax</a>
      <nav class="menu" aria-label="Primary">
        <a href="corporate.html">Financial</a>
        <a href="research/">Research</a>
        <a href="ai/chat.html">AI</a>
      </nav>
    </header>

    <main class="hero">
      <div class="copy">
        <p class="subtitle">No Tribes Preferred.</p>
        <h1 class="title">Truth Prevails.</h1>
      </div>
    </main>

    <div class="audio-bar">
      <button type="button" id="btn-narrate">Play narration</button>
      <button type="button" class="ghost" id="btn-stop">Stop</button>
    </div>
    <p class="status" id="status">3D vector engine · Web Audio · no bitmap assets</p>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
  <script type="module">
    import { startMaxEngine } from './js/max-engine.js';

    const status = document.getElementById('status');
    const engine = startMaxEngine(document.getElementById('stage'), {
      narratorUrl: './assets/audio/narrator.mp3'
    });

    document.getElementById('btn-narrate').addEventListener('click', async () => {
      const result = await engine.playNarration();
      if (result.ok) {
        status.textContent = 'Narration playing';
      } else if (result.reason === 'missing-narrator-file') {
        status.textContent = 'Add real narration file at assets/audio/narrator.mp3';
      } else {
        status.textContent = 'Audio unavailable in this browser';
      }
    });

    document.getElementById('btn-stop').addEventListener('click', () => {
      engine.stopNarration();
      status.textContent = '3D vector engine · Web Audio · no bitmap assets';
    });
  </script>
</body>
</html>
