<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DualisCapax</title>
  <meta name="description" content="Residual Law Finance. Cutting Edge Technology. Adaptive AI. Research." />
  <meta name="theme-color" content="#050505" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; -webkit-text-size-adjust: 100%; }
    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: #050505;
      color: #f5f5f5;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    .shell {
      height: 100dvh;
      height: 100svh;
      max-width: 44rem;
      margin: 0 auto;
      padding: 0 1.25rem;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 0 0;
      gap: 1rem;
      flex: 0 0 auto;
    }
    .mark { font-size: 1.15rem; font-weight: 800; letter-spacing: -0.04em; }
    nav { display: flex; gap: 1.35rem; flex-wrap: wrap; }
    nav a { font-size: 0.95rem; font-weight: 600; color: rgba(245,245,245,0.7); }
    main {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 0;
      gap: 0.65rem;
    }
    .quark-field {
      position: relative;
      width: min(16rem, 70vw);
      height: 2.25rem;
      margin-bottom: 0.35rem;
    }
    .quark {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: #7eb6ff;
      box-shadow:
        0 0 4px 1px rgba(126, 182, 255, 0.85),
        0 0 10px 2px rgba(90, 150, 255, 0.35);
      opacity: 0.55;
      animation: quarkPulse 3.8s ease-in-out infinite;
    }
    .quark:nth-child(1) { left: 12%; top: 40%; animation-delay: 0s; opacity: 0.4; }
    .quark:nth-child(2) { left: 28%; top: 18%; width: 1.5px; height: 1.5px; animation-delay: 0.6s; }
    .quark:nth-child(3) { left: 45%; top: 55%; animation-delay: 1.2s; opacity: 0.7; }
    .quark:nth-child(4) { left: 58%; top: 22%; width: 1.5px; height: 1.5px; animation-delay: 0.3s; opacity: 0.35; }
    .quark:nth-child(5) { left: 72%; top: 48%; animation-delay: 1.8s; }
    .quark:nth-child(6) { left: 84%; top: 30%; width: 1.5px; height: 1.5px; animation-delay: 2.4s; opacity: 0.45; }
    .quark:nth-child(7) { left: 38%; top: 8%; width: 1px; height: 1px; animation-delay: 1.1s; opacity: 0.3; }
    .quark:nth-child(8) { left: 66%; top: 70%; width: 1px; height: 1px; animation-delay: 2.1s; opacity: 0.35; }
    @keyframes quarkPulse {
      0%, 100% { opacity: 0.25; transform: scale(0.9); }
      50% { opacity: 0.85; transform: scale(1.15); }
    }
    h1 {
      font-size: clamp(3.25rem, 14vw, 5.5rem);
      font-weight: 900;
      line-height: 0.88;
      letter-spacing: -0.05em;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
    }
    .line {
      font-size: clamp(1.05rem, 3.8vw, 1.25rem);
      font-weight: 600;
      color: rgba(245,245,245,0.75);
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <a href="index.html" class="mark">DualisCapax</a>
      <nav>
        <a href="research/">Research</a>
        <a href="corporate.html">Financial</a>
        <a href="ai/">AI</a>
      </nav>
    </header>
    <main>
      <div class="quark-field" aria-hidden="true">
        <span class="quark"></span>
        <span class="quark"></span>
        <span class="quark"></span>
        <span class="quark"></span>
        <span class="quark"></span>
        <span class="quark"></span>
        <span class="quark"></span>
        <span class="quark"></span>
      </div>
      <h1>Truth<br>Prevails.</h1>
      <p class="line">Residual Law Finance.</p>
      <p class="line">Cutting Edge Technology.</p>
      <p class="line">Adaptive AI.</p>
      <p class="line">Research.</p>
    </main>
  </div>
</body>
</html>
