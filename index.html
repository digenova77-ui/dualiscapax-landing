<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>DualisCapax</title>
<meta name="theme-color" content="#050505"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet"/>
<style>
@layer reset, base, intro, site, motion;

@layer reset {
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;-webkit-text-size-adjust:100%}
}

@layer base {
  :root{
    color-scheme:dark;
    --fg:#f5f5f5;
    --fg-soft:rgba(245,245,245,.72);
    --quark:#7eb6ff;
    --z-site:1;
    --z-smoke:35;
    --z-intro:40;
  }
  body{
    font-family:Inter,system-ui,sans-serif;
    background:#000;
    color:var(--fg);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
}

@layer intro {
  .intro{
    position:fixed;inset:0;
    z-index:var(--z-intro);
    background:#000;
    display:flex;align-items:center;justify-content:center;
  }
  .intro.is-out{opacity:0;pointer-events:none}
  .intro video{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;background:#000;opacity:0;
  }
  .intro video.is-on{opacity:1}
  .intro video.is-fade{opacity:0}
  .question{
    position:relative;z-index:3;
    max-width:22rem;padding:0 1.5rem;text-align:center;
    opacity:0;transform:translateY(8px);
  }
  .question.is-in{opacity:1;transform:translateY(0)}
  .question.is-out{opacity:0;transform:scale(.92);filter:blur(12px)}
  .question p{
    font-size:clamp(1.15rem,4.2vw,1.45rem);
    font-weight:600;line-height:1.45;color:rgba(245,245,245,.92);
  }
  .question p+p{margin-top:.85rem;color:rgba(245,245,245,.62);font-weight:500;font-size:clamp(1rem,3.6vw,1.2rem)}
  .seed{
    position:absolute;z-index:2;left:50%;top:50%;
    width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;
    background:#fff;
    box-shadow:0 0 12px 4px rgba(255,255,255,.95),0 0 40px 12px rgba(200,220,255,.55),0 0 80px 28px rgba(140,180,255,.25);
    opacity:0;transform:scale(.2);pointer-events:none;
  }
  .seed.is-on{opacity:1;transform:scale(1)}
  .seed.is-bloom{transform:scale(18);opacity:.85}
  .seed.is-gone{opacity:0}
  .intro .credit{
    position:absolute;left:.75rem;bottom:max(.6rem,env(safe-area-inset-bottom));
    font-size:.65rem;letter-spacing:.04em;color:rgba(255,255,255,.45);
    opacity:0;z-index:4;
  }
  .intro .credit.is-on{opacity:1}
  .intro .skip{
    position:absolute;right:.75rem;bottom:max(.6rem,env(safe-area-inset-bottom));
    font-size:.78rem;font-weight:600;color:rgba(255,255,255,.7);
    background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.2);
    border-radius:999px;padding:.4rem .85rem;cursor:pointer;z-index:4;
  }
  .smoke{
    position:fixed;inset:0;z-index:var(--z-smoke);
    pointer-events:none;opacity:0;
    background:radial-gradient(ellipse 80% 60% at 50% 45%,rgba(180,200,220,.12),transparent 62%),transparent;
  }
  .smoke.is-on{opacity:1}
  .smoke.is-clear{opacity:0}
}

@layer site {
  .site{
    position:fixed;inset:0;
    z-index:var(--z-site);
    opacity:0;
    visibility:hidden;
    background:#000;
  }
  body.is-live .site{
    opacity:1;
    visibility:visible;
  }
  .shell{
    position:relative;
    height:100dvh;
    width:100%;
    max-width:48rem;
    margin:0 auto;
    padding:
      max(0.75rem, env(safe-area-inset-top))
      max(1rem, env(safe-area-inset-right))
      max(0.85rem, env(safe-area-inset-bottom))
      max(1rem, env(safe-area-inset-left));
    display:flex;
    flex-direction:column;
  }
  header{flex-shrink:0}
  header nav{display:flex;justify-content:space-between;width:100%}
  header nav a{font-size:.88rem;font-weight:600;color:rgba(245,245,245,.75)}
  main{
    flex:1;min-height:0;width:100%;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
  }
  .stack{
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;width:100%;
  }
  /* Mark sized by the art — full width, height from aspect (no empty pad box) */
  .logo-stage{
    width:min(96vw, 44rem);
    height:auto;
    aspect-ratio:630 / 160;
    margin:0 0 0.35rem;
    flex-shrink:0;
  }
  .logo-stage img{
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center;
    display:block;
  }
  .motto{margin:0.1rem 0 0.55rem}
  .motto p{
    font-size:clamp(0.95rem, 3.2vw, 1.15rem);
    font-weight:600;color:var(--fg-soft);line-height:1.35;margin:0;
  }
  .geo-wrap{
    width:min(48vw,160px);height:min(48vw,160px);
    margin:0 0 0.8rem;flex-shrink:0;
  }
  #geo-earth{width:100%;height:100%;display:block}
  h1{
    font-size:clamp(2.4rem,10vw,4.2rem);font-weight:900;
    line-height:.9;letter-spacing:-.05em;text-transform:uppercase;
    margin:0 0 0.5rem;
  }
  .line{
    font-size:clamp(.95rem,3.2vw,1.12rem);font-weight:600;
    color:var(--fg-soft);margin:0 0 0.1rem;
  }
}

@layer motion {
  .intro{transition:opacity 2.4s ease}
  .intro video{transition:opacity 2.4s ease}
  .question{transition:opacity 1.4s ease,transform 1.4s ease,filter 1.4s ease}
  .seed{transition:opacity .5s ease,transform 1.1s cubic-bezier(.22,1,.36,1)}
  .seed.is-bloom{transition:opacity .9s ease,transform 1.35s cubic-bezier(.22,1,.36,1)}
  .seed.is-gone{transition:opacity .6s ease}
  .intro .credit{transition:opacity .6s ease}
  .smoke{transition:opacity 2s ease}
  .smoke.is-clear{transition:opacity 2s ease}
  .site{transition:opacity 2.4s ease,visibility 0s linear 2.4s}
  body.is-live .site{transition:opacity 2.4s ease,visibility 0s}
}
</style>
</head>
<body>
<div class="intro" id="intro">
  <video id="nasa-bb" playsinline muted src="https://svs.gsfc.nasa.gov/vis/a010000/a012600/a012656/12656_Big_Bang_1080.webm"></video>
  <div class="seed" id="seed" aria-hidden="true"></div>
  <div class="question" id="question">
    <p>Every decision leaves a residual.</p>
    <p>What will yours cost?</p>
  </div>
  <span class="credit" id="credit">NASA / GSFC</span>
  <button type="button" class="skip" id="skip-intro">Skip</button>
</div>
<div class="smoke" id="smoke" aria-hidden="true"></div>
<div class="site" id="site">
  <div class="shell">
    <header>
      <nav aria-label="Primary">
        <a href="corporate.html">Financial</a>
        <a href="ai/">Tech</a>
        <a href="research/">Research + AI</a>
      </nav>
    </header>
    <main>
      <div class="stack">
        <div class="logo-stage">
          <img src="brand/logo-dna-x.svg" alt="DualisCapax" width="630" height="160"/>
        </div>
        <div class="motto">
          <p>All haters welcome.</p>
          <p>No tribes preferred.</p>
        </div>
        <div class="geo-wrap">
          <canvas id="geo-earth" width="360" height="360"></canvas>
        </div>
        <h1>Truth<br>Prevails</h1>
        <p class="line">Residual Law Finance.</p>
        <p class="line">Cutting Edge Technology.</p>
        <p class="line">Adaptive AI.</p>
        <p class="line">Research.</p>
      </div>
    </main>
  </div>
</div>
<script>
(function(){
  const intro=document.getElementById('intro');
  const video=document.getElementById('nasa-bb');
  const smoke=document.getElementById('smoke');
  const skip=document.getElementById('skip-intro');
  const question=document.getElementById('question');
  const seed=document.getElementById('seed');
  const credit=document.getElementById('credit');
  let done=false, phase='question', residualLive=false, crossfading=false;
  let audioCtx=null, osc=null, gain=null;

  const PLAYBACK_RATE = 2;
  const CROSSFADE_AT = 0.74;

  function buzz(pattern){
    try{
      if(typeof navigator.vibrate==='function') navigator.vibrate(pattern);
    }catch(e){}
  }

  function ensureCtx(){
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC) return null;
      if(!audioCtx || audioCtx.state==='closed'){
        audioCtx=new AC();
      }
      if(audioCtx.state==='suspended'){
        audioCtx.resume().catch(function(){});
      }
      return audioCtx;
    }catch(e){
      return null;
    }
  }

  function startResidual(){
    if(residualLive && audioCtx && audioCtx.state!=='closed'){
      ensureCtx();
      return;
    }
    residualLive=true;
    try{
      const ctx=ensureCtx();
      if(!ctx) return;

      osc=ctx.createOscillator();
      gain=ctx.createGain();
      const filter=ctx.createBiquadFilter();
      filter.type='lowpass';
      filter.frequency.value=180;
      osc.type='sawtooth';
      osc.frequency.value=42;
      gain.gain.value=0.0001;
      osc.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      osc.start();

      const now=ctx.currentTime;
      gain.gain.cancelScheduledValues(now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.22, now+1.0);
    }catch(e){
      residualLive=false;
      console.warn('residual fail', e);
    }
  }

  function fireBang(){
    const ctx=ensureCtx();
    buzz([50, 18, 70, 14, 40, 12, 25]);

    if(!ctx) return;
    try{
      const now=ctx.currentTime;

      if(gain){
        gain.gain.cancelScheduledValues(now);
        const cur=Math.max(gain.gain.value, 0.0001);
        gain.gain.setValueAtTime(cur, now);
        gain.gain.exponentialRampToValueAtTime(0.32, now+0.05);
        gain.gain.exponentialRampToValueAtTime(0.18, now+0.9);
      }

      const boom=ctx.createOscillator();
      const boomGain=ctx.createGain();
      boom.type='sine';
      boom.frequency.setValueAtTime(55, now);
      boom.frequency.exponentialRampToValueAtTime(28, now+0.55);
      boomGain.gain.setValueAtTime(0.0001, now);
      boomGain.gain.exponentialRampToValueAtTime(0.55, now+0.03);
      boomGain.gain.exponentialRampToValueAtTime(0.0001, now+0.7);
      boom.connect(boomGain);
      boomGain.connect(ctx.destination);
      boom.start(now);
      boom.stop(now+0.75);

      const frames=Math.floor(ctx.sampleRate*0.18);
      const buffer=ctx.createBuffer(1, frames, ctx.sampleRate);
      const data=buffer.getChannelData(0);
      for(let i=0;i<frames;i++){
        data[i]=(Math.random()*2-1)*Math.pow(1-i/frames, 2.2);
      }
      const noise=ctx.createBufferSource();
      noise.buffer=buffer;
      const noiseFilter=ctx.createBiquadFilter();
      noiseFilter.type='bandpass';
      noiseFilter.frequency.value=420;
      noiseFilter.Q.value=0.7;
      const noiseGain=ctx.createGain();
      noiseGain.gain.setValueAtTime(0.28, now);
      noiseGain.gain.exponentialRampToValueAtTime(0.0001, now+0.18);
      noise.connect(noiseFilter);
      noiseFilter.connect(noiseGain);
      noiseGain.connect(ctx.destination);
      noise.start(now);
    }catch(e){
      console.warn('bang fail', e);
    }
  }

  function stopResidual(then){
    residualLive=false;
    seed.style.transform='';

    if(audioCtx && gain){
      try{
        const now=audioCtx.currentTime;
        gain.gain.cancelScheduledValues(now);
        const cur=Math.max(gain.gain.value, 0.0001);
        gain.gain.setValueAtTime(cur, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now+0.4);
        setTimeout(function(){
          try{ if(osc) osc.stop(); }catch(e){}
          try{ if(audioCtx) audioCtx.close(); }catch(e){}
          osc=null; gain=null; audioCtx=null;
          if(typeof then==='function') then();
        }, 420);
        return;
      }catch(e){}
    }
    try{ if(osc) osc.stop(); }catch(e){}
    try{ if(audioCtx) audioCtx.close(); }catch(e){}
    osc=null; gain=null; audioCtx=null;
    if(typeof then==='function') then();
  }

  function beginCrossfade(){
    if(done || crossfading) return;
    crossfading=true;
    done=true;

    stopResidual(function(){
      video.classList.add('is-fade');
      smoke.classList.add('is-on');
      intro.classList.add('is-out');
      document.body.classList.add('is-live');
      setTimeout(function(){ buzz([12, 40, 10]); }, 500);

      setTimeout(function(){
        smoke.classList.add('is-clear');
      }, 1200);

      setTimeout(function(){
        try{ video.pause(); }catch(e){}
        try{ intro.remove(); smoke.remove(); }catch(e){}
      }, 2600);
    });
  }

  function startVideo(){
    if(phase==='video'||done) return;
    phase='video';
    credit.classList.add('is-on');
    video.classList.add('is-on');
    seed.classList.add('is-gone');
    try{ video.playbackRate = PLAYBACK_RATE; }catch(e){}

    startResidual();
    ensureCtx();
    fireBang();

    const p=video.play();
    if(p && p.catch) p.catch(function(){});
  }

  function collapseToOrb(){
    if(phase!=='question') return;
    phase='orb';
    question.classList.remove('is-in');
    question.classList.add('is-out');
    seed.classList.add('is-on');
    setTimeout(function(){ seed.classList.add('is-bloom'); }, 380);
    setTimeout(startVideo, 1200);
  }

  function unlock(){
    ensureCtx();
    startResidual();
  }
  ['pointerdown','touchstart','click','keydown'].forEach(function(ev){
    document.addEventListener(ev, unlock, { once:true, passive:true });
  });

  video.addEventListener('timeupdate', function(){
    if(phase!=='video' || done) return;
    const d=video.duration;
    if(!d || !isFinite(d)) return;
    if(video.currentTime / d >= CROSSFADE_AT){
      beginCrossfade();
    }
  });

  video.addEventListener('ended', function(){
    if(!done) beginCrossfade();
  });
  video.addEventListener('error', function(){
    if(phase==='video' && !done) beginCrossfade();
  });

  startResidual();
  setTimeout(function(){ question.classList.add('is-in'); }, 400);
  setTimeout(collapseToOrb, 4800);

  skip.addEventListener('click', function(){
    unlock();
    try{ video.pause(); }catch(e){}
    beginCrossfade();
  });

  setTimeout(function(){
    if(!done && phase==='video' && video.readyState<2) beginCrossfade();
  }, 9000);
  setTimeout(function(){
    if(!done) beginCrossfade();
  }, 22000);
})();
</script>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.170.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const canvas=document.getElementById('geo-earth');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.setSize(canvas.clientWidth,canvas.clientHeight,false);
renderer.setClearColor(0x000000,0);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(36,1,0.1,20);
camera.position.z=3.55;
scene.add(new THREE.AmbientLight(0xffffff,0.65));
const key=new THREE.DirectionalLight(0xffffff,1.2);key.position.set(2.4,1.6,3);scene.add(key);
const geo=new THREE.IcosahedronGeometry(0.92,2);
const body=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0x6a7a88,flatShading:true,metalness:0.35,roughness:0.35,transparent:true,opacity:0.55,depthWrite:false}));
const wire=new THREE.LineSegments(new THREE.EdgesGeometry(geo,1),new THREE.LineBasicMaterial({color:0xd0d8e0,transparent:true,opacity:0.7}));
const group=new THREE.Group();group.add(body);group.add(wire);scene.add(group);
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  group.rotation.y+=(Math.PI*2/22)*dt;
  group.rotation.x=0.25;
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
function onResize(){
  const w=canvas.clientWidth,h=canvas.clientHeight;
  if(w<1||h<1)return;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;camera.updateProjectionMatrix();
}
window.addEventListener('resize',onResize);onResize();
</script>
</body>
</html>
