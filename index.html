<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DualisCapax</title>
  <meta name="description" content="No tribes preferred. Truth prevails." />
  <meta name="theme-color" content="#050505" />
  <link rel="icon" type="image/svg+xml" href="emblem-ring.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050505;
      --fg: #f5f5f5;
      --muted: rgba(245,245,245,0.55);
      --line: rgba(255,255,255,0.09);
      --white: #ffffff;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      -webkit-text-size-adjust: 100%;
    }
    body {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100dvh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }

    .shell {
      height: 100dvh;
      height: 100svh;
      max-width: 42rem;
      margin: 0 auto;
      padding: 0 1.5rem;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.1rem 0;
      gap: 1rem;
      z-index: 2;
    }
    .mark {
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    nav { display: flex; gap: 1.25rem; flex-wrap: wrap; }
    nav a {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
    }

    .stage {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 0;
      padding-bottom: 5.5rem;
      position: relative;
    }

    /* Y-axis geodesic — horizontal spin */
    .geo-wrap {
      width: min(72vw, 280px);
      height: min(72vw, 280px);
      perspective: 900px;
      margin-bottom: 1.75rem;
    }
    .geo {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      animation: spinY 18s linear infinite, expand 4.5s ease-in-out infinite;
    }
    .ring {
      position: absolute;
      inset: 8%;
      border: 1.25px solid rgba(245,245,245,0.55);
      border-radius: 50%;
      transform-style: preserve-3d;
    }
    .ring:nth-child(1) { transform: rotateY(0deg) rotateX(0deg); }
    .ring:nth-child(2) { transform: rotateY(30deg) rotateX(60deg); opacity: 0.7; }
    .ring:nth-child(3) { transform: rotateY(60deg) rotateX(120deg); opacity: 0.55; }
    .ring:nth-child(4) { transform: rotateY(90deg) rotateX(20deg); opacity: 0.65; }
    .ring:nth-child(5) { transform: rotateY(120deg) rotateX(80deg); opacity: 0.5; }
    .ring:nth-child(6) { transform: rotateY(150deg) rotateX(140deg); opacity: 0.45; }
    .ring:nth-child(7) {
      inset: 28%;
      border-color: rgba(245,245,245,0.35);
      transform: rotateY(45deg) rotateX(45deg);
    }

    @keyframes spinY {
      from { transform: rotateY(0deg); }
      to   { transform: rotateY(360deg); }
    }
    @keyframes expand {
      0%, 100% { transform: rotateY(0deg) scale(1); }
      50%      { transform: rotateY(180deg) scale(1.06); }
    }
    /* expand keyframes conflict with spin — isolate expand on wrapper scale */
    .geo-wrap {
      animation: pulse 4.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .geo {
      animation: spinY 18s linear infinite;
    }

    .eyebrow {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.85rem;
      text-align: center;
    }
    h1 {
      font-size: clamp(2.4rem, 11vw, 3.6rem);
      font-weight: 800;
      line-height: 0.92;
      letter-spacing: -0.045em;
      text-transform: uppercase;
      text-align: center;
    }

    .cta-pin {
      position: absolute;
      left: 1.5rem;
      right: 1.5rem;
      bottom: calc(7px + env(safe-area-inset-bottom, 0px));
      z-index: 3;
    }
    .btn-solid {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 3.15rem;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 999px;
      background: var(--white);
      color: #050505;
      border: none;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <a href="index.html" class="mark">DualisCapax</a>
      <nav>
        <a href="research/">Research</a>
        <a href="corporate.html">Financial</a>
        <a href="ai/">AI</a>
      </nav>
    </header>

    <main class="stage">
      <div class="geo-wrap" aria-hidden="true">
        <div class="geo">
          <div class="ring"></div>
          <div class="ring"></div>
          <div class="ring"></div>
          <div class="ring"></div>
          <div class="ring"></div>
          <div class="ring"></div>
          <div class="ring"></div>
        </div>
      </div>
      <div class="eyebrow">No Tribes Preferred</div>
      <h1>Truth<br>Prevails.</h1>
    </main>

    <div class="cta-pin">
      <a href="playground.html" class="btn-solid">Enter L2 Playground</a>
    </div>
  </div>
</body>
</html>
