<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>DualisCapax</title>
<meta name="description" content="Have an open mind. A playground. You can leave."/>
<meta name="theme-color" content="#000000"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;color:#efe8d8;height:100%;min-height:100dvh}
body{font-family:Palatino,"Iowan Old Style","Times New Roman",serif;-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:inherit;text-decoration:none}
.leave{position:fixed;top:max(.9rem,env(safe-area-inset-top));right:max(1rem,env(safe-area-inset-right));z-index:8;font:.62rem/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.28em;text-transform:uppercase;color:rgba(239,232,216,.3)}
.leave:hover{color:#fff}
.stage{--lx:0;--ly:0;position:relative;height:100dvh;overflow:hidden;background:#000}
.sky{position:absolute;inset:-10%;background:
 radial-gradient(1px 1px at 12% 22%,rgba(255,255,255,.55),transparent),
 radial-gradient(1px 1px at 28% 68%,rgba(255,255,255,.35),transparent),
 radial-gradient(1px 1px at 61% 18%,rgba(232,195,106,.55),transparent),
 radial-gradient(1px 1px at 78% 44%,rgba(120,180,255,.45),transparent),
 radial-gradient(1px 1px at 88% 81%,rgba(255,255,255,.3),transparent),
 radial-gradient(1.5px 1.5px at 41% 39%,rgba(232,195,106,.4),transparent),
 radial-gradient(1200px 700px at 50% 40%,rgba(40,70,120,.18),transparent 60%),
 #000;
 transform:translate3d(calc(var(--lx)*-16px),calc(var(--ly)*-10px),0);pointer-events:none}
.sphere{position:absolute;left:50%;top:46%;width:min(92vw,42rem);transform:translate(-50%,-50%) translate3d(calc(var(--lx)*-10px),calc(var(--ly)*-8px),0);opacity:.28;pointer-events:none;filter:saturate(1.1)}
.sigil{position:absolute;left:50%;top:46%;width:min(42vw,22rem);transform:translate(-50%,-50%) translate3d(calc(var(--lx)*24px),calc(var(--ly)*16px),0);filter:drop-shadow(0 0 36px rgba(212,168,72,.35)) drop-shadow(0 0 70px rgba(60,140,255,.16));pointer-events:none;animation:hold 8s ease-in-out infinite}
@keyframes hold{0%,100%{opacity:.92}50%{opacity:1}}
.caption{position:absolute;left:0;right:0;bottom:10vh;text-align:center;font-size:clamp(1.05rem,2.4vw,1.5rem);letter-spacing:.04em;color:rgba(239,232,216,.78);text-shadow:0 8px 40px #000;animation:title 10s ease forwards;pointer-events:none}
@keyframes title{0%{opacity:0}14%{opacity:1}72%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>
<a class="leave" href="/leave.html">Leave</a>
<main class="stage" id="stage">
  <div class="sky" aria-hidden="true"></div>
  <img class="sphere" src="/emblem-sphere.svg" alt=""/>
  <img class="sigil" src="/brand/holo-helix.svg" alt="DualisCapax"/>
  <p class="caption">Have an open mind.</p>
</main>
<script>
(function(){
  var s=document.getElementById('stage'); if(!s) return;
  var lx=0,ly=0,tx=0,ty=0;
  function c(n){return Math.max(-1,Math.min(1,n))}
  function loop(){tx+=(lx-tx)*0.05;ty+=(ly-ty)*0.05;s.style.setProperty('--lx',tx.toFixed(4));s.style.setProperty('--ly',ty.toFixed(4));requestAnimationFrame(loop)}
  requestAnimationFrame(loop);
  s.addEventListener('pointermove',function(e){var r=s.getBoundingClientRect();lx=c(((e.clientX-r.left)/r.width)*2-1);ly=c(((e.clientY-r.top)/r.height)*2-1)});
  s.addEventListener('pointerleave',function(){lx=0;ly=0});
})();
</script>
</body>
</html>
