<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>DualisCapax</title>
<meta name="theme-color" content="#000000"/>
<link rel="stylesheet" href="/css/pipe.css"/>
<link rel="stylesheet" href="/css/word-lock.css"/>
</head>
<body>
<p class="word" id="word">
  <img class="lockup" src="/brand/9672.jpg" alt="DualisCapax"/>
</p>
<a class="leave" href="#" id="leave">Leave</a>
<main class="pipe" id="pipe" data-sector="core">
  <canvas class="weather" id="weather"></canvas>
  <div class="tunnel" id="tunnel"></div>
  <img class="world" id="world" alt="" />
  <img class="dna" id="dna" src="/brand/11180.jpg" alt=""/>
  <div class="stream" id="stream"></div>
  <div class="iris" aria-hidden="true"></div>
  <button class="door" id="door" type="button" aria-label="Door"></button>
  <div class="grains" id="grains" hidden></div>
  <p class="said" id="said" hidden>
    <strong id="said-title"></strong>
    <span id="said-line"></span>
  </p>
  <a class="enter" id="enter" href="/school.html">Start</a>
  <div class="zap" id="zap" aria-hidden="true"></div>
  <div class="vignette"></div>
</main>
<script src="/js/pipe.js"></script>
</body>
</html>
