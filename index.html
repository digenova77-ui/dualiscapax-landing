<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>dualiscapax</title>
  <meta name="description" content="Three rings. Iris is teal and blue. The cosmos is the field. The passphrase glows green or red.">
  <meta name="theme-color" content="#07060e">
  <link rel="icon" href="brand/seal.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: dark;
      --bg: #07060e;
      --ink: #f4f1fb;
      --quiet: #c9c2de;
      --faint: #a89fbe;
      --line: rgba(170, 140, 255, 0.28);
      --cyan: #63f7dd;
      --violet: #aa8cff;
      --iris: #3ee0ff;
      --cosmos: var(--violet);
      --pass: #7dff9a;
      --stop: #ff5c64;
      --wash: rgba(90, 255, 150, 0.10);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      color: var(--ink);
      background:
        radial-gradient(ellipse 48% 42% at 16% 18%, rgba(170, 140, 255, 0.24), transparent 68%),
        radial-gradient(ellipse 42% 38% at 84% 78%, rgba(99, 247, 221, 0.12), transparent 70%),
        radial-gradient(ellipse 22% 18% at 70% 24%, var(--wash), transparent 72%),
        var(--bg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    .skip {
      position: absolute;
      left: 1rem;
      top: 0;
      transform: translateY(-120%);
      background: var(--ink);
      color: var(--bg);
      padding: 0.4rem 0.7rem;
      z-index: 2;
    }
    .skip:focus { transform: none; }
    .float {
      width: 100%;
      margin-block: auto;
      padding-top: max(1.4rem, env(safe-area-inset-top));
      padding-bottom: max(1.4rem, env(safe-area-inset-bottom));
    }
    header {
      width: min(1120px, calc(100% - 2.4rem));
      margin: 0 auto;
      padding: 0;
    }
    .name {
      margin: 0;
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      text-transform: lowercase;
      color: var(--cyan);
    }
    .plate {
      width: min(1120px, calc(100% - 2.4rem));
      margin: 0 auto;
      padding: 1.15rem 0 0;
      display: grid;
      grid-template-columns: minmax(260px, 0.82fr) minmax(0, 1.15fr);
      gap: clamp(1.2rem, 4vw, 3.5rem);
      align-items: center;
    }
    .read { max-width: 38rem; }
    .eyebrow {
      margin: 0 0 0.8rem;
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--cyan);
    }
    h1 {
      margin: 0;
      font-size: clamp(2.7rem, 6vw, 4.7rem);
      font-weight: 500;
      letter-spacing: -0.045em;
      line-height: 0.92;
    }
    h1 em { font-style: normal; }
    body:has(#pass-red:checked) { --pass: var(--stop); --wash: rgba(255, 70, 80, 0.16); }
    body:has(#pass-green:checked) { --wash: rgba(90, 255, 150, 0.12); }
    .lede {
      margin: 1.1rem 0 0;
      max-width: 34ch;
      color: var(--quiet);
      font-size: 1.12rem;
    }
    .show-all {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      margin: 1.25rem 0 0;
      color: var(--quiet);
      font-size: 0.92rem;
      cursor: pointer;
    }
    .show-all:has(input:checked) { color: var(--ink); }
    .rings {
      list-style: none;
      margin: 0.8rem 0 0;
      padding: 0;
      display: grid;
      gap: 0.35rem;
    }
    .ring-card, .show-all {
      position: relative;
    }
    .ring-card {
      display: grid;
      grid-template-columns: 7.2rem 1fr;
      gap: 0.35rem 0.8rem;
      align-items: baseline;
      margin: 0;
      padding: 0.72rem 0.2rem 0.72rem 0.85rem;
      border-left: 2px solid transparent;
      cursor: pointer;
    }
    .ring-card:has(input:checked) {
      border-left-color: var(--c);
      background: linear-gradient(90deg, color-mix(in srgb, var(--c) 16%, transparent), transparent 78%);
    }
    .ring-card:has(input:focus-visible),
    .show-all:has(input:focus-visible),
    .lamps label:has(input:focus-visible),
    .doors a:focus-visible,
    .skip:focus {
      outline: 2px solid var(--cyan);
      outline-offset: 3px;
    }
    .ring-card input, .show-all input {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px;
      margin: 0;
    }
    .kicker {
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 0.74rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--c);
    }
    .say { color: var(--ink); font-size: 1.02rem; }
    .close {
      margin: 1.15rem 0 0;
      max-width: 38ch;
      color: var(--quiet);
    }
    .doors {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem 1.1rem;
      margin-top: 1.6rem;
      padding-top: 1rem;
      border-top: 1px solid var(--line);
    }
    .doors a {
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
    }
    .doors a:hover { color: var(--cyan); }
    .lamps {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem 0.85rem;
      margin-top: 0.9rem;
    }
    .lamp-name {
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--faint);
    }
    .lamps label {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 0.76rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .lamps label.hold { color: #7dff9a; }
    .lamps label.break { color: var(--stop); }
    .lamps label i {
      width: 0.48rem;
      height: 0.48rem;
      border-radius: 50%;
      border: 1px solid currentColor;
      display: block;
    }
    .lamps label:has(input:checked) i {
      background: currentColor;
      box-shadow: 0 0 10px currentColor;
    }
    .lamps input {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px;
      margin: 0;
    }
    .honest {
      margin: 0.85rem 0 0;
      color: var(--faint);
      font-size: 0.88rem;
    }
    figure {
      margin: 0;
      min-width: 0;
    }
    svg {
      display: block;
      width: min(100%, 640px);
      height: auto;
      margin-inline: auto;
    }
    .ring { transition: opacity 280ms ease; }
    .plate:has(#pick-iris:checked) .ring:not(.is-iris),
    .plate:has(#pick-cosmos:checked) .ring:not(.is-cosmos),
    .plate:has(#pick-sym:checked) .ring:not(.is-sym) {
      opacity: 0.2;
    }
    .pass-red { display: none; }
    body:has(#pass-red:checked) .pass-green { display: none; }
    body:has(#pass-red:checked) .pass-red { display: inline; }
    .stars { fill: var(--violet); transform-box: view-box; transform-origin: center; animation: drift 180s linear infinite; }
    .breath { transform-box: view-box; transform-origin: center; animation: breath 7.5s ease-in-out infinite; }
    @keyframes drift { to { transform: rotate(360deg); } }
    @keyframes breath { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.5; } }
    @media (prefers-reduced-motion: reduce) {
      .stars, .breath { animation: none; }
      .ring { transition: none; }
    }
    @media (max-width: 860px) {
      .plate {
        grid-template-columns: 1fr;
        padding-top: 0.4rem;
      }
      figure { order: -1; width: min(100%, 460px); margin-inline: auto; }
      .ring-card { grid-template-columns: 6.4rem 1fr; }
      h1 { font-size: clamp(2.5rem, 12vw, 3.6rem); }
    }
  </style>
</head>
<body>
  <a class="skip" href="#rings">Skip to the three rings</a>
  <div class="float">
  <header>
    <p class="name">dualiscapax</p>
  </header>
  <main class="plate">
    <div class="read">
      <p class="eyebrow">Philosophy · Science · Law</p>
      <h1>Science under<br><em>law</em></h1>
      <p class="lede">Philosophy and science, governed by law. Three rings. One constraint.</p>
      <label class="show-all">
        <input type="radio" name="ring" id="all" checked>
        All three
      </label>
      <ol class="rings" id="rings">
        <li>
          <label class="ring-card" style="--c: var(--iris)">
            <input type="radio" name="ring" id="pick-iris">
            <span class="kicker">Iris</span>
            <span class="say">Teal and blue. The living light.</span>
          </label>
        </li>
        <li>
          <label class="ring-card" style="--c: var(--cosmos)">
            <input type="radio" name="ring" id="pick-cosmos">
            <span class="kicker">Cosmos</span>
            <span class="say">The field that record is written on. It has no outside.</span>
          </label>
        </li>
        <li>
          <label class="ring-card" style="--c: var(--pass)">
            <input type="radio" name="ring" id="pick-sym">
            <span class="kicker">Symbiosis</span>
            <span class="say">The biosynthetic passphrase glows green or red.</span>
          </label>
        </li>
      </ol>
      <p class="close">Iris is teal and blue. The passphrase reads green or red.</p>
      <div class="lamps" role="group" aria-label="Passphrase glow">
        <span class="lamp-name">Passphrase</span>
        <label class="hold">
          <input type="radio" name="pass" id="pass-green" checked>
          <i aria-hidden="true"></i>
          Green
        </label>
        <label class="break">
          <input type="radio" name="pass" id="pass-red">
          <i aria-hidden="true"></i>
          Red
        </label>
      </div>
      <nav class="doors" aria-label="Further">
        <a href="law.html">Law</a>
        <a href="research/philosophy/">Philosophy</a>
        <a href="for-people.html">For you</a>
      </nav>
      <p class="honest">Look is free. This page stores nothing.</p>
    </div>
    <figure>
      <svg viewBox="0 0 640 640" role="img" aria-labelledby="fig-title fig-desc">
        <title id="fig-title">Three rings</title>
        <desc id="fig-desc">An armillary of three rings. The inner ring is Iris, a teal and blue light. The middle ring is the cosmos, a thin orbit with a few stars. The outer ring is law. Its arc is the biosynthetic passphrase: green, or red.</desc>
        <defs>
          <radialGradient id="iris-core" cx="38%" cy="34%" r="68%">
            <stop offset="0" stop-color="#e8fbff"/>
            <stop offset="0.28" stop-color="#3ee0ff"/>
            <stop offset="0.62" stop-color="#1494d6"/>
            <stop offset="1" stop-color="#062848"/>
          </radialGradient>
          <radialGradient id="iris-shine" cx="32%" cy="28%" r="40%">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="iris-moon" cx="35%" cy="32%" r="70%">
            <stop offset="0" stop-color="#e4c8ff"/>
            <stop offset="0.45" stop-color="#9b5cff"/>
            <stop offset="1" stop-color="#3a146e"/>
          </radialGradient>
          <radialGradient id="phos-green" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#b6ff9a" stop-opacity="0.75"/>
            <stop offset="1" stop-color="#b6ff9a" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="phos-red" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#ff6a70" stop-opacity="0.75"/>
            <stop offset="1" stop-color="#ff6a70" stop-opacity="0"/>
          </radialGradient>
          <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="1.1" result="b"/>
            <feMerge>
              <feMergeNode in="b"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
          <filter id="phosphor" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="3.2" result="b"/>
            <feMerge>
              <feMergeNode in="b"/>
              <feMergeNode in="b"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
          <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="14"/>
          </filter>
        </defs>

        <g class="ring is-sym" id="ring-sym">
          <ellipse class="breath pass-green" cx="320" cy="168" rx="108" ry="46" fill="url(#phos-green)" filter="url(#bloom)"/>
          <ellipse class="breath pass-red" cx="320" cy="168" rx="108" ry="46" fill="url(#phos-red)" filter="url(#bloom)"/>
          <g fill="none" stroke="rgba(99,247,221,0.62)" stroke-linecap="round">
            <line x1="320.0" y1="96.0" x2="320.0" y2="84.0" stroke-width="1.15"/>
            <line x1="432.0" y1="126.0" x2="438.0" y2="115.6" stroke-width="1.15"/>
            <line x1="514.0" y1="208.0" x2="524.4" y2="202.0" stroke-width="1.15"/>
            <line x1="544.0" y1="320.0" x2="556.0" y2="320.0" stroke-width="1.15"/>
            <line x1="514.0" y1="432.0" x2="524.4" y2="438.0" stroke-width="1.15"/>
            <line x1="432.0" y1="514.0" x2="438.0" y2="524.4" stroke-width="1.15"/>
            <line x1="320.0" y1="544.0" x2="320.0" y2="556.0" stroke-width="1.15"/>
            <line x1="208.0" y1="514.0" x2="202.0" y2="524.4" stroke-width="1.15"/>
            <line x1="126.0" y1="432.0" x2="115.6" y2="438.0" stroke-width="1.15"/>
            <line x1="96.0" y1="320.0" x2="84.0" y2="320.0" stroke-width="1.15"/>
            <line x1="126.0" y1="208.0" x2="115.6" y2="202.0" stroke-width="1.15"/>
            <line x1="208.0" y1="126.0" x2="202.0" y2="115.6" stroke-width="1.15"/>
          </g>
          <circle cx="320" cy="320" r="236" fill="none" stroke="rgba(99,247,221,0.46)" stroke-width="1.15"/>
        </g>

        <g class="ring is-cosmos" id="ring-cosmos">
          <circle cx="320" cy="320" r="176" fill="none" stroke="rgba(170,140,255,0.62)" stroke-width="1.15"/>
          <ellipse cx="320" cy="320" rx="176" ry="54" fill="none" stroke="rgba(170,140,255,0.38)" stroke-width="0.9" transform="rotate(-24 320 320)"/>
          <g class="stars">
            <circle cx="505.0" cy="317.9" r="1.5" opacity="1"/>
            <circle cx="490.8" cy="391.1" r="0.9" opacity="0.7"/>
            <circle cx="437.7" cy="456.2" r="0.9" opacity="0.45"/>
            <circle cx="388.2" cy="479.0" r="0.7" opacity="0.45"/>
            <circle cx="315.9" cy="500.0" r="1.5" opacity="0.7"/>
            <circle cx="244.2" cy="488.8" r="0.7" opacity="0.45"/>
            <circle cx="212.0" cy="455.2" r="0.7" opacity="1"/>
            <circle cx="152.2" cy="397.9" r="0.9" opacity="0.7"/>
            <circle cx="140.1" cy="313.9" r="0.7" opacity="0.45"/>
            <circle cx="156.7" cy="254.3" r="1.5" opacity="0.45"/>
            <circle cx="201.9" cy="189.5" r="0.9" opacity="0.9"/>
            <circle cx="230.4" cy="158.1" r="0.7" opacity="1"/>
            <circle cx="303.5" cy="144.8" r="1.5" opacity="0.45"/>
            <circle cx="400.9" cy="172.8" r="0.9" opacity="0.7"/>
            <circle cx="450.3" cy="214.0" r="1.5" opacity="1"/>
            <circle cx="493.1" cy="270.7" r="1.5" opacity="0.45"/>
          </g>
        </g>

        <g class="ring is-iris" id="ring-iris">
          <circle class="breath" cx="320" cy="320" r="108" fill="url(#iris-core)"/>
          <circle cx="320" cy="320" r="108" fill="url(#iris-shine)"/>
          <circle cx="248" cy="392" r="38" fill="url(#iris-moon)" opacity="0.92"/>
          <circle cx="248" cy="392" r="38" fill="url(#iris-shine)" opacity="0.45"/>
          <circle cx="404" cy="246" r="34" fill="url(#iris-moon)" opacity="0.92"/>
          <circle cx="404" cy="246" r="34" fill="url(#iris-shine)" opacity="0.4"/>
        </g>

        <g class="ring is-sym" id="ring-meet">
          <circle class="pass-green" cx="320" cy="320" r="236" fill="none" stroke="#c8ffb4" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="250 1233" stroke-dashoffset="0" transform="rotate(-128 320 320)" filter="url(#phosphor)"/>
          <circle class="pass-red" cx="320" cy="320" r="236" fill="none" stroke="#ff6a70" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="250 1233" stroke-dashoffset="0" transform="rotate(-128 320 320)" filter="url(#phosphor)"/>
        </g>
      </svg>
    </figure>
  </main>
  </div>
</body>
</html>
