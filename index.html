<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DualisCapax</title>
  <meta name="description" content="No tribes preferred. Truth prevails. DualisCapax — Financial, Research, AI." />
  <meta name="theme-color" content="#030308" />
  <link rel="icon" href="brand/emblem-helix.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #030308;
      color: #f5f5f5;
      font-family: Inter, system-ui, sans-serif;
      overflow: hidden;
    }

    /* Unrestricted field — no section frames */
    #stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      display: block;
      z-index: 0;
    }

    .hud {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding:
        calc(0.85rem + env(safe-area-inset-top))
        0.9rem
        calc(1rem + env(safe-area-inset-bottom));
    }
    .hud a, .hud button { pointer-events: auto; }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.65rem;
    }
    .brand {
      font-size: clamp(1.05rem, 3.8vw, 1.55rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #fff;
      text-decoration: none;
      white-space: nowrap;
    }
    .menu {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      gap: 0.35rem;
    }
    .menu a {
      color: rgba(255,255,255,0.88);
      text-decoration: none;
      font-size: clamp(0.72rem, 2.5vw, 0.9rem);
      font-weight: 600;
      padding: 0.48rem 0.62rem;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 999px;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(10px);
      white-space: nowrap;
    }

    .bottom {
      text-align: center;
    }
    .subtitle {
      font-size: clamp(1rem, 3.8vw, 1.15rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.72);
      margin-bottom: 0.4rem;
      text-shadow: 0 2px 16px rgba(0,0,0,0.65);
    }
    .title {
      font-size: clamp(2rem, 7.5vw, 3.1rem);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      margin-bottom: 0.9rem;
      text-shadow: 0 2px 18px rgba(0,0,0,0.7);
    }
    .audio-bar {
      display: flex;
      justify-content: center;
      gap: 0.55rem;
      flex-wrap: wrap;
    }
    .audio-bar button {
      font: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: 999px;
      padding: 0.65rem 0.95rem;
      border: 0;
      cursor: pointer;
    }
    #btn-narrate { background: #fff; color: #0a0a0c; }
    #btn-stop {
      background: rgba(0,0,0,0.35);
      color: rgba(255,255,255,0.88);
      border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>

  <div class="hud">
    <header class="top">
      <a class="brand" href="index.html">DualisCapax</a>
      <nav class="menu" aria-label="Primary">
        <a href="corporate.html">Financial</a>
        <a href="research/">Research</a>
        <a href="ai/chat.html">AI</a>
      </nav>
    </header>

    <div class="bottom">
      <p class="subtitle">No Tribes Preferred.</p>
      <h1 class="title">Truth Prevails.</h1>
      <div class="audio-bar">
        <button type="button" id="btn-narrate">Play narration</button>
        <button type="button" id="btn-stop">Stop</button>
      </div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
  <script type="module">
    import { startMaxEngine } from './js/max-engine.js?v=free';

    const engine = startMaxEngine(document.getElementById('stage'), {
      narratorUrl: './assets/audio/narrator.mp3'
    });

    document.getElementById('btn-narrate').addEventListener('click', () => {
      engine.playNarration();
    });
    document.getElementById('btn-stop').addEventListener('click', () => {
      engine.stopNarration();
    });
  </script>
</body>
</html>
