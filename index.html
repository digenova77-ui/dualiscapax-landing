<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DualisCapax</title>
<meta name="description" content="DualisCapax residual plane">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="emblem-ring.svg">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#f2f2f0;font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

.stage{
  position:relative;
  min-height:100vh;min-height:100dvh;
  overflow:hidden;
  display:flex;flex-direction:column;
}
#field{
  position:absolute;inset:0;
  width:100%;height:100%;
  display:block;z-index:0;
}
.stage::after{
  content:"";
  position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(ellipse 80% 70% at 55% 45%, transparent 0%, rgba(0,0,0,.25) 55%, rgba(0,0,0,.7) 100%),
    linear-gradient(180deg, rgba(0,0,0,.35) 0%, transparent 20%, transparent 70%, rgba(0,0,0,.8) 100%);
}

.ui{
  position:relative;z-index:2;
  flex:1;
  display:flex;flex-direction:column;
  justify-content:space-between;
  padding:clamp(1.25rem,3vw,2.5rem);
  pointer-events:none;
}
.ui a{pointer-events:auto}

.top{
  display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  font-size:.7rem;letter-spacing:.16em;color:rgba(255,255,255,.5);
  text-transform:uppercase;
}
.top b{color:#fff;font-weight:600;text-shadow:0 0 20px rgba(212,175,55,.4)}
.dot{
  width:8px;height:8px;border-radius:50%;background:#d4af37;
  display:inline-block;margin-right:.45rem;
  box-shadow:0 0 16px #d4af37, 0 0 32px rgba(212,175,55,.5);
}

.hero{
  max-width:22rem;
  margin:auto 0;
  padding:1rem 0;
}
@media(min-width:720px){
  .hero{max-width:36rem;margin-left:clamp(1rem,8vw,7rem)}
}
.hero .label{
  font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:.75rem;letter-spacing:.32em;text-transform:uppercase;
  color:#d4af37;
  text-shadow:0 0 24px rgba(212,175,55,.6);
  margin-bottom:1.5rem;
}
.hero h1{
  font-size:clamp(3.4rem, 8vw + 1rem, 7.5rem);
  font-weight:800;
  letter-spacing:-.045em;
  line-height:.88;
  margin-bottom:1.5rem;
  text-shadow:
    0 0 80px rgba(61,155,233,.45),
    0 0 120px rgba(212,175,55,.25),
    0 8px 40px rgba(0,0,0,.9);
}
.hero h1 span{
  display:block;
  background:linear-gradient(135deg,#ffffff 0%,#e8eef5 35%,#d4af37 70%,#3d9be9 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 30px rgba(61,155,233,.35));
}
.hero p{
  font-size:clamp(1rem,.95rem + .5vw,1.25rem);
  line-height:1.55;
  color:rgba(255,255,255,.65);
  max-width:32ch;
  margin-bottom:2rem;
  text-shadow:0 2px 16px rgba(0,0,0,.8);
}
.hero .go{
  display:inline-flex;align-items:center;gap:.7rem;
  padding:1.1rem 1.75rem;
  font-size:.9rem;font-weight:700;letter-spacing:.08em;
  background:#fff;color:#000;
  border:none;
  box-shadow:
    0 0 60px rgba(61,155,233,.35),
    0 0 100px rgba(212,175,55,.15),
    0 12px 40px rgba(0,0,0,.5);
  transition:transform .2s, box-shadow .2s;
}
.hero .go:hover{
  transform:translateY(-3px) scale(1.02);
  box-shadow:
    0 0 80px rgba(212,175,55,.4),
    0 0 120px rgba(61,155,233,.3),
    0 16px 48px rgba(0,0,0,.6);
}

.bottom{
  display:flex;flex-wrap:wrap;gap:1rem 1.75rem;
  align-items:flex-end;justify-content:space-between;
}
.links{display:flex;flex-wrap:wrap;gap:.6rem 1.1rem}
.links a{
  font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(255,255,255,.5);
  border-bottom:1px solid transparent;
  padding-bottom:3px;
  text-shadow:0 2px 12px rgba(0,0,0,.8);
  transition:color .15s, border-color .15s, text-shadow .15s;
}
.links a:hover{
  color:#fff;
  border-color:#d4af37;
  text-shadow:0 0 20px rgba(212,175,55,.5);
}
.slogans{
  font-size:.6rem;letter-spacing:.1em;
  color:rgba(255,255,255,.32);
  max-width:22rem;text-align:right;
}
.slogans b{color:rgba(212,175,55,.7);font-weight:600}

@media(prefers-reduced-motion:reduce){
  #field{opacity:.65}
}
</style>
</head>
<body>
  <div class="stage">
    <canvas id="field" aria-hidden="true"></canvas>
    <div class="ui">
      <div class="top">
        <span><span class="dot"></span><b>Residual</b> · plane</span>
        <span>Ontario · CA</span>
      </div>
      <div class="hero">
        <p class="label">White / black ledger</p>
        <h1><span>Dualis<br>Capax</span></h1>
        <p>Open research. Adaptive depth when rails are live. One underweight point under playground expanse.</p>
        <a class="go" href="research/">Enter research →</a>
      </div>
      <div class="bottom">
        <nav class="links" aria-label="Paths">
          <a href="manifesto.html">Manifesto</a>
          <a href="residual-law.html">Residual Law</a>
          <a href="model.html">Model</a>
          <a href="gateway.html">Gateway</a>
          <a href="research/healthcare/">Healthcare</a>
        </nav>
        <p class="slogans"><b>No Tribes Preferred</b> · All Haters Welcome · Truth and Unity Prevail</p>
      </div>
    </div>
  </div>
<script>
(function(){
  const c = document.getElementById('field');
  if(!c) return;
  const ctx = c.getContext('2d');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w, h, dpr, t = 0;
  const GOLD = [212, 175, 55];
  const BLUE = [61, 155, 233];
  const GREEN = [42, 180, 120];
  const particles = [];
  const N = reduce ? 28 : 90;

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    c.width = w * dpr;
    c.height = h * dpr;
    c.style.width = w + 'px';
    c.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function init(){
    particles.length = 0;
    for(let i = 0; i < N; i++){
      particles.push({
        phase: Math.random() * Math.PI * 2,
        speed: 0.35 + Math.random() * 0.9,
        y0: Math.random(),
        r: 1.2 + Math.random() * 3.5,
        strand: i % 2
      });
    }
  }

  function mix(a, b, u){
    return [a[0]+(b[0]-a[0])*u, a[1]+(b[1]-a[1])*u, a[2]+(b[2]-a[2])*u];
  }

  function frame(){
    t += reduce ? 0.004 : 0.012;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, w, h);

    // Deep residual wells — scaled up
    let g = ctx.createRadialGradient(w*0.3, h*0.35, 0, w*0.3, h*0.35, w*0.7);
    g.addColorStop(0, 'rgba(61,155,233,0.28)');
    g.addColorStop(0.4, 'rgba(61,155,233,0.08)');
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g; ctx.fillRect(0,0,w,h);

    g = ctx.createRadialGradient(w*0.72, h*0.55, 0, w*0.72, h*0.55, w*0.6);
    g.addColorStop(0, 'rgba(212,175,55,0.22)');
    g.addColorStop(0.45, 'rgba(212,175,55,0.06)');
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g; ctx.fillRect(0,0,w,h);

    g = ctx.createRadialGradient(w*0.55, h*0.75, 0, w*0.55, h*0.75, w*0.4);
    g.addColorStop(0, 'rgba(42,180,120,0.12)');
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g; ctx.fillRect(0,0,w,h);

    const cx = w * 0.58;
    const amp = Math.min(w, 900) * 0.22; // was ~0.12 — scaled hard
    const turns = 6;
    const steps = reduce ? 50 : 100;

    // Outer glow pass on helix
    for(let strand = 0; strand < 2; strand++){
      ctx.beginPath();
      for(let i = 0; i <= steps; i++){
        const u = i / steps;
        const y = h * 0.04 + u * h * 0.92;
        const swing = Math.sin(u * Math.PI * turns + t * 1.4 + strand * Math.PI) * amp;
        const x = cx + (strand === 0 ? swing : -swing);
        if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      const col = strand === 0 ? BLUE : GOLD;
      ctx.strokeStyle = 'rgba('+col[0]+','+col[1]+','+col[2]+',0.2)';
      ctx.lineWidth = 14;
      ctx.lineCap = 'round';
      ctx.shadowColor = 'rgba('+col[0]+','+col[1]+','+col[2]+',0.8)';
      ctx.shadowBlur = 40;
      ctx.stroke();
    }

    // Core helix strokes
    for(let strand = 0; strand < 2; strand++){
      ctx.beginPath();
      for(let i = 0; i <= steps; i++){
        const u = i / steps;
        const y = h * 0.04 + u * h * 0.92;
        const swing = Math.sin(u * Math.PI * turns + t * 1.4 + strand * Math.PI) * amp;
        const x = cx + (strand === 0 ? swing : -swing);
        if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      const col = strand === 0 ? BLUE : GOLD;
      ctx.strokeStyle = 'rgba('+col[0]+','+col[1]+','+col[2]+',0.85)';
      ctx.lineWidth = 2.8;
      ctx.shadowColor = 'rgba('+col[0]+','+col[1]+','+col[2]+',0.9)';
      ctx.shadowBlur = 18;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    // Base pairs — denser, brighter
    const links = reduce ? 16 : 28;
    for(let i = 0; i <= links; i++){
      const u = i / links;
      const y = h * 0.06 + u * h * 0.88;
      const swing = Math.sin(u * Math.PI * turns + t * 1.4) * amp;
      const x1 = cx + swing;
      const x2 = cx - swing;
      const pulse = 0.35 + 0.55 * Math.sin(t * 2.5 + u * 10);
      const rgb = mix(BLUE, GOLD, (Math.sin(u * Math.PI * 2 + t) + 1) / 2);
      ctx.strokeStyle = 'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+pulse+')';
      ctx.lineWidth = 1.6;
      ctx.shadowColor = 'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',0.6)';
      ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, y); ctx.stroke();
      ctx.shadowBlur = 0;

      const nr = 2.8 + pulse * 1.5;
      ctx.fillStyle = 'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+(0.65+pulse*0.35)+')';
      ctx.shadowColor = 'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',0.9)';
      ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.arc(x1, y, nr, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x2, y, nr, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
    }

    // Particle swarm
    for(let i = 0; i < particles.length; i++){
      const p = particles[i];
      const u = (p.y0 + t * p.speed * 0.06) % 1;
      const y = h * 0.02 + u * h * 0.96;
      const swing = Math.sin(u * Math.PI * turns + t * 1.4 + p.strand * Math.PI) * amp;
      const x = cx + (p.strand === 0 ? swing : -swing) + Math.sin(t + p.phase) * 8;
      const rgb = p.strand === 0 ? BLUE : (i % 5 === 0 ? GREEN : GOLD);
      ctx.fillStyle = 'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',0.85)';
      ctx.shadowColor = 'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',0.8)';
      ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(x, y, p.r, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
    }

    // Center residual spark line
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, h); ctx.stroke();

    if(!reduce) requestAnimationFrame(frame);
  }

  resize(); init(); frame();
  window.addEventListener('resize', function(){ resize(); if(reduce) frame(); }, {passive:true});
})();
</script>
</body>
</html>
