<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DualisCapax</title>
  <meta name="description" content="No tribes preferred. Truth prevails." />
  <meta name="theme-color" content="#050505" />
  <link rel="icon" type="image/svg+xml" href="emblem-ring.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050505;
      --fg: #f5f5f5;
      --muted: rgba(245,245,245,0.55);
      --line: rgba(255,255,255,0.09);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
    }
    body {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }

    .shell {
      max-width: 42rem;
      margin: 0 auto;
      padding: 0 1.5rem 4rem;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.1rem 0;
      gap: 1rem;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 2;
    }
    .mark {
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    nav { display: flex; gap: 1.25rem; flex-wrap: wrap; }
    nav a {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3.5rem 0 3rem;
      text-align: center;
      min-height: 70dvh;
    }

    .geo-wrap {
      width: min(72vw, 280px);
      height: min(72vw, 280px);
      perspective: 900px;
      margin-bottom: 1.75rem;
      animation: pulse 4.5s ease-in-out infinite;
    }
    .geo {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      animation: spinY 18s linear infinite;
    }
    .ring {
      position: absolute;
      inset: 8%;
      border: 1.25px solid rgba(245,245,245,0.55);
      border-radius: 50%;
      transform-style: preserve-3d;
    }
    .ring:nth-child(1) { transform: rotateY(0deg) rotateX(0deg); border-color: rgba(232,185,35,0.7); }
    .ring:nth-child(2) { transform: rotateY(30deg) rotateX(60deg); opacity: 0.7; border-color: rgba(61,155,233,0.65); }
    .ring:nth-child(3) { transform: rotateY(60deg) rotateX(120deg); opacity: 0.55; }
    .ring:nth-child(4) { transform: rotateY(90deg) rotateX(20deg); opacity: 0.65; border-color: rgba(232,185,35,0.45); }
    .ring:nth-child(5) { transform: rotateY(120deg) rotateX(80deg); opacity: 0.5; border-color: rgba(61,155,233,0.4); }
    .ring:nth-child(6) { transform: rotateY(150deg) rotateX(140deg); opacity: 0.45; }
    .ring:nth-child(7) {
      inset: 28%;
      border-color: rgba(245,245,245,0.35);
      transform: rotateY(45deg) rotateX(45deg);
    }

    @keyframes spinY {
      from { transform: rotateY(0deg); }
      to   { transform: rotateY(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .eyebrow {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.85rem;
    }
    h1 {
      font-size: clamp(2.4rem, 11vw, 3.6rem);
      font-weight: 800;
      line-height: 0.92;
      letter-spacing: -0.045em;
      text-transform: uppercase;
    }

    /* Empty scroll pane — real content later */
    .pane {
      flex: 1;
      min-height: 40dvh;
      border-top: 1px solid var(--line);
      padding-top: 2rem;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <a href="index.html" class="mark">DualisCapax</a>
      <nav>
        <a href="research/">Research</a>
        <a href="corporate.html">Financial</a>
        <a href="ai/">AI</a>
      </nav>
    </header>

    <main class="hero">
      <div class="geo-wrap" aria-hidden="true">
        <div class="geo">
          <div class="ring"></div>
          <div class="ring"></div>
          <div class="ring"></div>
          <div class="ring"></div>
          <div class="ring"></div>
          <div class="ring"></div>
          <div class="ring"></div>
        </div>
      </div>
      <div class="eyebrow">No Tribes Preferred</div>
      <h1>Truth<br>Prevails.</h1>
    </main>

    <section class="pane" aria-label="Content"></section>
  </div>
</body>
</html>
