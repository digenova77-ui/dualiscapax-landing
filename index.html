<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DualisCapax</title>
  <meta name="description" content="Residual Law Finance. Cutting Edge Technology. Adaptive AI. Research." />
  <meta name="theme-color" content="#050505" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; -webkit-text-size-adjust: 100%; }
    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: #050505;
      color: #f5f5f5;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow: hidden;
    }
    a { color: inherit; text-decoration: none; }

    .quark-field {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .quark {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: #7eb6ff;
      box-shadow:
        0 0 4px 1px rgba(126, 182, 255, 0.85),
        0 0 10px 2px rgba(90, 150, 255, 0.35);
      opacity: 0.55;
      animation: quarkPulse 3.8s ease-in-out infinite;
    }
    .quark:nth-child(1)  { left: 8%;  top: 12%; animation-delay: 0s; opacity: 0.4; }
    .quark:nth-child(2)  { left: 22%; top: 28%; width: 1.5px; height: 1.5px; animation-delay: 0.5s; }
    .quark:nth-child(3)  { left: 41%; top: 9%;  animation-delay: 1.1s; opacity: 0.65; }
    .quark:nth-child(4)  { left: 63%; top: 18%; width: 1.5px; height: 1.5px; animation-delay: 0.3s; opacity: 0.35; }
    .quark:nth-child(5)  { left: 78%; top: 11%; animation-delay: 1.6s; }
    .quark:nth-child(6)  { left: 91%; top: 24%; width: 1.5px; height: 1.5px; animation-delay: 2.2s; opacity: 0.45; }
    .quark:nth-child(7)  { left: 14%; top: 48%; width: 1px; height: 1px; animation-delay: 0.9s; opacity: 0.3; }
    .quark:nth-child(8)  { left: 33%; top: 56%; animation-delay: 1.4s; opacity: 0.55; }
    .quark:nth-child(9)  { left: 52%; top: 42%; width: 1.5px; height: 1.5px; animation-delay: 2.0s; }
    .quark:nth-child(10) { left: 71%; top: 51%; animation-delay: 0.7s; opacity: 0.4; }
    .quark:nth-child(11) { left: 88%; top: 58%; width: 1px; height: 1px; animation-delay: 2.5s; opacity: 0.35; }
    .quark:nth-child(12) { left: 6%;  top: 72%; animation-delay: 1.8s; opacity: 0.5; }
    .quark:nth-child(13) { left: 27%; top: 81%; width: 1.5px; height: 1.5px; animation-delay: 0.4s; }
    .quark:nth-child(14) { left: 48%; top: 68%; width: 1px; height: 1px; animation-delay: 2.8s; opacity: 0.3; }
    .quark:nth-child(15) { left: 66%; top: 84%; animation-delay: 1.2s; opacity: 0.6; }
    .quark:nth-child(16) { left: 84%; top: 76%; width: 1.5px; height: 1.5px; animation-delay: 2.1s; opacity: 0.4; }
    .quark:nth-child(17) { left: 18%; top: 38%; width: 1px; height: 1px; animation-delay: 3.0s; opacity: 0.25; }
    .quark:nth-child(18) { left: 57%; top: 22%; animation-delay: 1.5s; opacity: 0.45; }
    .quark:nth-child(19) { left: 39%; top: 91%; width: 1.5px; height: 1.5px; animation-delay: 0.8s; }
    .quark:nth-child(20) { left: 95%; top: 88%; width: 1px; height: 1px; animation-delay: 2.4s; opacity: 0.35; }
    @keyframes quarkPulse {
      0%, 100% { opacity: 0.2; transform: scale(0.85); }
      50% { opacity: 0.9; transform: scale(1.2); }
    }

    .shell {
      position: relative;
      z-index: 1;
      height: 100dvh;
      height: 100svh;
      max-width: 44rem;
      margin: 0 auto;
      padding: 0 1.25rem;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 0 0;
      gap: 1rem;
      flex: 0 0 auto;
    }
    .mark { font-size: 1.15rem; font-weight: 800; letter-spacing: -0.04em; }
    nav { display: flex; gap: 1.35rem; flex-wrap: wrap; }
    nav a { font-size: 0.95rem; font-weight: 600; color: rgba(245,245,245,0.7); }

    main {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 0;
      gap: 0.55rem;
      padding-top: 0.5rem;
    }

    /* Condensed geodesic-Earth — Y-axis spin, globe pace */
    .globe-stage {
      width: min(42vw, 148px);
      height: min(42vw, 148px);
      margin-bottom: 0.85rem;
      perspective: 600px;
      flex-shrink: 0;
    }
    .globe {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      animation: spinY 48s linear infinite;
    }
    .crust {
      position: absolute;
      inset: 10%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 32% 28%, rgba(180, 220, 255, 0.35), transparent 42%),
        radial-gradient(ellipse 40% 30% at 55% 45%, rgba(46, 120, 72, 0.75), transparent 55%),
        radial-gradient(ellipse 35% 28% at 30% 55%, rgba(52, 110, 64, 0.7), transparent 50%),
        radial-gradient(ellipse 25% 20% at 70% 60%, rgba(40, 95, 55, 0.65), transparent 45%),
        radial-gradient(ellipse 20% 18% at 48% 30%, rgba(90, 140, 70, 0.5), transparent 40%),
        radial-gradient(circle at 70% 25%, rgba(200, 180, 120, 0.25), transparent 35%),
        linear-gradient(165deg, #1a4a7a 0%, #0d3d6b 35%, #1560a0 55%, #0a3058 100%);
      box-shadow:
        inset -8px -6px 20px rgba(0, 0, 0, 0.45),
        inset 6px 4px 14px rgba(120, 180, 255, 0.15),
        0 0 24px rgba(80, 140, 220, 0.2);
      transform: translateZ(0);
    }
    .ring {
      position: absolute;
      inset: 6%;
      border: 1px solid rgba(220, 235, 255, 0.45);
      border-radius: 50%;
      transform-style: preserve-3d;
    }
    .ring:nth-child(2) { transform: rotateY(0deg) rotateX(0deg); border-color: rgba(232, 185, 35, 0.35); }
    .ring:nth-child(3) { transform: rotateY(30deg) rotateX(55deg); opacity: 0.65; border-color: rgba(126, 182, 255, 0.5); }
    .ring:nth-child(4) { transform: rotateY(60deg) rotateX(110deg); opacity: 0.5; }
    .ring:nth-child(5) { transform: rotateY(90deg) rotateX(25deg); opacity: 0.55; border-color: rgba(232, 185, 35, 0.25); }
    .ring:nth-child(6) { transform: rotateY(120deg) rotateX(75deg); opacity: 0.45; border-color: rgba(126, 182, 255, 0.35); }
    .ring:nth-child(7) { transform: rotateY(150deg) rotateX(130deg); opacity: 0.4; }
    .ring:nth-child(8) {
      inset: 22%;
      border-color: rgba(245, 245, 245, 0.28);
      transform: rotateY(45deg) rotateX(40deg);
    }

    @keyframes spinY {
      from { transform: rotateY(0deg); }
      to   { transform: rotateY(360deg); }
    }

    h1 {
      font-size: clamp(2.85rem, 12vw, 4.75rem);
      font-weight: 900;
      line-height: 0.88;
      letter-spacing: -0.05em;
      text-transform: uppercase;
      margin-bottom: 0.55rem;
    }
    .line {
      font-size: clamp(1.05rem, 3.8vw, 1.25rem);
      font-weight: 600;
      color: rgba(245,245,245,0.75);
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <div class="quark-field" aria-hidden="true">
    <span class="quark"></span><span class="quark"></span><span class="quark"></span><span class="quark"></span>
    <span class="quark"></span><span class="quark"></span><span class="quark"></span><span class="quark"></span>
    <span class="quark"></span><span class="quark"></span><span class="quark"></span><span class="quark"></span>
    <span class="quark"></span><span class="quark"></span><span class="quark"></span><span class="quark"></span>
    <span class="quark"></span><span class="quark"></span><span class="quark"></span><span class="quark"></span>
  </div>
  <div class="shell">
    <header>
      <a href="index.html" class="mark">DualisCapax</a>
      <nav>
        <a href="research/">Research</a>
        <a href="corporate.html">Financial</a>
        <a href="ai/">AI</a>
      </nav>
    </header>
    <main>
      <div class="globe-stage" aria-hidden="true">
        <div class="globe">
          <div class="crust"></div>
          <div class="ring"></div>
          <div class="ring"></div>
          <div class="ring"></div>
          <div class="ring"></div>
          <div class="ring"></div>
          <div class="ring"></div>
          <div class="ring"></div>
        </div>
      </div>
      <h1>Truth<br>Prevails.</h1>
      <p class="line">Residual Law Finance.</p>
      <p class="line">Cutting Edge Technology.</p>
      <p class="line">Adaptive AI.</p>
      <p class="line">Research.</p>
    </main>
  </div>
</body>
</html>
