<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DualisCapax</title>
<meta name="description" content="DualisCapax residual plane">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="emblem-ring.svg">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#f2f2f0;font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

/* Full-bleed stage — field is the UI */
.stage{
  position:relative;
  min-height:100vh;min-height:100dvh;
  overflow:hidden;
  display:flex;flex-direction:column;
}
#field{
  position:absolute;inset:0;
  width:100%;height:100%;
  display:block;
  z-index:0;
}

/* Vignette + residual read of light */
.stage::after{
  content:"";
  position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(ellipse 70% 60% at 50% 45%, transparent 0%, rgba(0,0,0,.55) 70%, rgba(0,0,0,.85) 100%),
    linear-gradient(180deg, rgba(0,0,0,.4) 0%, transparent 18%, transparent 75%, rgba(0,0,0,.75) 100%);
}

.ui{
  position:relative;z-index:2;
  flex:1;
  display:flex;flex-direction:column;
  justify-content:space-between;
  padding:clamp(1.25rem,3vw,2rem);
  pointer-events:none;
}
.ui a,.ui button{pointer-events:auto}

.top{
  display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  font-size:.62rem;letter-spacing:.14em;color:rgba(255,255,255,.45);
  text-transform:uppercase;
}
.top b{color:rgba(255,255,255,.85);font-weight:500}
.dot{
  width:6px;height:6px;border-radius:50%;background:#d4af37;
  display:inline-block;margin-right:.4rem;
  box-shadow:0 0 12px #d4af37;
}

.hero{
  max-width:18rem;
  margin:auto 0;
  padding:1rem 0;
}
@media(min-width:720px){
  .hero{max-width:28rem;margin-left:clamp(1rem,8vw,6rem)}
}
.hero .label{
  font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:.65rem;letter-spacing:.28em;text-transform:uppercase;
  color:rgba(212,175,55,.8);
  margin-bottom:1.25rem;
}
.hero h1{
  font-size:clamp(2.8rem, 6vw + 1rem, 5.5rem);
  font-weight:700;
  letter-spacing:-.04em;
  line-height:.9;
  margin-bottom:1.25rem;
  text-shadow:0 0 60px rgba(61,155,233,.25), 0 4px 24px rgba(0,0,0,.8);
}
.hero h1 span{
  display:block;
  background:linear-gradient(135deg,#fff 0%,#c8d0d8 40%,#d4af37 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero p{
  font-size:clamp(.9rem,.85rem + .4vw,1.05rem);
  line-height:1.55;
  color:rgba(255,255,255,.55);
  max-width:28ch;
  margin-bottom:1.75rem;
}
.hero .go{
  display:inline-flex;align-items:center;gap:.6rem;
  padding:.9rem 1.4rem;
  font-size:.8rem;font-weight:600;letter-spacing:.06em;
  background:rgba(255,255,255,.95);color:#000;
  border:none;
  box-shadow:0 0 40px rgba(61,155,233,.2), 0 8px 32px rgba(0,0,0,.4);
  transition:transform .2s, box-shadow .2s;
}
.hero .go:hover{
  transform:translateY(-2px);
  box-shadow:0 0 50px rgba(212,175,55,.25), 0 12px 40px rgba(0,0,0,.5);
}

.bottom{
  display:flex;flex-wrap:wrap;gap:.75rem 1.5rem;
  align-items:flex-end;justify-content:space-between;
}
.links{
  display:flex;flex-wrap:wrap;gap:.5rem .85rem;
}
.links a{
  font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;
  color:rgba(255,255,255,.4);
  border-bottom:1px solid transparent;
  padding-bottom:2px;
  transition:color .15s, border-color .15s;
}
.links a:hover{color:#fff;border-color:rgba(212,175,55,.6)}
.slogans{
  font-size:.55rem;letter-spacing:.08em;
  color:rgba(255,255,255,.28);
  max-width:20rem;text-align:right;
}
.slogans b{color:rgba(212,175,55,.55);font-weight:500}

@media(prefers-reduced-motion:reduce){
  #field{opacity:.5}
}
</style>
</head>
<body>
  <div class="stage">
    <canvas id="field" aria-hidden="true"></canvas>

    <div class="ui">
      <div class="top">
        <span><span class="dot"></span><b>Residual</b> · plane</span>
        <span>Ontario · CA</span>
      </div>

      <div class="hero">
        <p class="label">White / black ledger</p>
        <h1><span>Dualis<br>Capax</span></h1>
        <p>Open research. Adaptive depth when rails are live. One underweight point under playground expanse.</p>
        <a class="go" href="research/">Enter research →</a>
      </div>

      <div class="bottom">
        <nav class="links" aria-label="Paths">
          <a href="manifesto.html">Manifesto</a>
          <a href="residual-law.html">Residual Law</a>
          <a href="model.html">Model</a>
          <a href="gateway.html">Gateway</a>
          <a href="research/healthcare/">Healthcare</a>
        </nav>
        <p class="slogans"><b>No Tribes Preferred</b> · All Haters Welcome · Truth and Unity Prevail</p>
      </div>
    </div>
  </div>

<script>
(function(){
  const c = document.getElementById('field');
  if(!c) return;
  const ctx = c.getContext('2d');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w, h, dpr, t = 0;
  const GOLD = [212, 175, 55];
  const BLUE = [61, 155, 233];
  const pairs = [];
  const N = reduce ? 18 : 36;

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    c.width = w * dpr;
    c.height = h * dpr;
    c.style.width = w + 'px';
    c.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function initPairs(){
    pairs.length = 0;
    for(let i = 0; i < N; i++){
      pairs.push({
        phase: Math.random() * Math.PI * 2,
        speed: 0.4 + Math.random() * 0.6,
        amp: 40 + Math.random() * 80,
        y0: Math.random(),
        thick: 1 + Math.random() * 1.5
      });
    }
  }

  function mix(a, b, u){
    return [
      a[0] + (b[0]-a[0])*u,
      a[1] + (b[1]-a[1])*u,
      a[2] + (b[2]-a[2])*u
    ];
  }

  function frame(){
    t += 0.008;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, w, h);

    // Soft residual wells
    const g1 = ctx.createRadialGradient(w*0.35, h*0.4, 0, w*0.35, h*0.4, w*0.5);
    g1.addColorStop(0, 'rgba(61,155,233,0.12)');
    g1.addColorStop(1, 'transparent');
    ctx.fillStyle = g1;
    ctx.fillRect(0,0,w,h);

    const g2 = ctx.createRadialGradient(w*0.7, h*0.55, 0, w*0.7, h*0.55, w*0.45);
    g2.addColorStop(0, 'rgba(212,175,55,0.09)');
    g2.addColorStop(1, 'transparent');
    ctx.fillStyle = g2;
    ctx.fillRect(0,0,w,h);

    const cx = w * 0.62;
    const steps = reduce ? 40 : 70;

    // Dual helix residual streams
    for(let strand = 0; strand < 2; strand++){
      ctx.beginPath();
      for(let i = 0; i <= steps; i++){
        const u = i / steps;
        const y = h * 0.08 + u * h * 0.84;
        const swing = Math.sin(u * Math.PI * 5 + t * 1.2 + strand * Math.PI) * Math.min(w, 520) * 0.12;
        const x = cx + (strand === 0 ? swing : -swing);
        if(i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      const col = strand === 0 ? BLUE : GOLD;
      ctx.strokeStyle = 'rgba('+col[0]+','+col[1]+','+col[2]+',0.55)';
      ctx.lineWidth = 1.6;
      ctx.shadowColor = 'rgba('+col[0]+','+col[1]+','+col[2]+',0.45)';
      ctx.shadowBlur = 12;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    // Cross-links (base pairs)
    for(let i = 0; i <= 18; i++){
      const u = i / 18;
      const y = h * 0.1 + u * h * 0.8;
      const swing = Math.sin(u * Math.PI * 5 + t * 1.2) * Math.min(w, 520) * 0.12;
      const x1 = cx + swing;
      const x2 = cx - swing;
      const pulse = 0.25 + 0.35 * Math.sin(t * 2 + u * 8);
      const rgb = mix(BLUE, GOLD, u);
      ctx.strokeStyle = 'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+pulse+')';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x1, y);
      ctx.lineTo(x2, y);
      ctx.stroke();

      // Nodes
      ctx.fillStyle = 'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+(0.5+pulse*0.4)+')';
      ctx.beginPath(); ctx.arc(x1, y, 2.2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x2, y, 2.2, 0, Math.PI*2); ctx.fill();
    }

    // Drift particles along residual paths
    for(let i = 0; i < pairs.length; i++){
      const p = pairs[i];
      const u = (p.y0 + t * p.speed * 0.05) % 1;
      const y = h * 0.05 + u * h * 0.9;
      const swing = Math.sin(u * Math.PI * 5 + t * 1.2) * Math.min(w, 520) * 0.12;
      const x = cx + (i % 2 === 0 ? swing : -swing);
      const rgb = i % 2 === 0 ? BLUE : GOLD;
      ctx.fillStyle = 'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',0.7)';
      ctx.beginPath();
      ctx.arc(x, y, p.thick, 0, Math.PI*2);
      ctx.fill();
    }

    if(!reduce) requestAnimationFrame(frame);
  }

  resize();
  initPairs();
  frame();
  if(reduce){
    // single paint already done
  }
  window.addEventListener('resize', function(){
    resize();
    if(reduce) frame();
  }, {passive:true});
})();
</script>
</body>
</html>
