<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache">
<title>DualisCapax</title>
<meta name="theme-color" content="#020203">
<link rel="icon" href="brand/emblem-helix.svg">
<link rel="stylesheet" href="skin/default.css?v=split1">
</head>
<body>
<canvas id="webgl"></canvas>
<img class="em" src="brand/emblem-helix.svg" alt="">

<div class="ui" id="app">
  <nav class="desktop-nav" id="desk-nav" aria-label="Desktop">
    <div class="mark">DualisCapax</div>
  </nav>
  <div class="story-col" id="story"></div>
  <div class="stage-col" aria-hidden="true"></div>
</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import { startPlaneEngine } from './js/plane-engine.js';

async function boot() {
  const data = await (await fetch('content/story.json?v=2')).json();
  const story = document.getElementById('story');
  const desk = document.getElementById('desk-nav');

  data.links.forEach(function (l) {
    const a = document.createElement('a');
    a.href = l.href;
    a.textContent = l.label;
    desk.appendChild(a);
  });

  let html = '';
  html += '<section class="screen"><div class="glass">';
  html += '<div class="brand">' + data.brand + '</div>';
  html += '<p class="tag">' + data.tag + '</p>';
  html += '<p class="intro">' + data.intro + '</p>';
  html += '<p class="hint">' + data.hint + ' ↓</p>';
  html += '</div></section>';

  data.beats.forEach(function (b) {
    html += '<section class="screen"><div class="glass">';
    html += '<div class="num">' + b.n + '</div>';
    html += '<h2 class="title">' + b.title + '</h2>';
    html += '<p class="body">' + b.body + '</p>';
    html += '</div></section>';
  });

  html += '<nav class="links"><h3>Continue</h3>';
  data.links.forEach(function (l) {
    html += '<a href="' + l.href + '">' + l.label + '</a>';
  });
  html += '</nav>';

  story.innerHTML = html;
  startPlaneEngine(document.getElementById('webgl'));
}
boot().catch(function (e) {
  document.getElementById('story').textContent = 'Could not load story.';
  console.error(e);
});
</script>
</body>
</html>
