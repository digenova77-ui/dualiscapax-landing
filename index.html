<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DualisCapax</title>
  <meta name="description" content="Residual Law Finance. Cutting Edge Technology. Adaptive AI. Research." />
  <meta name="theme-color" content="#050505" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; -webkit-text-size-adjust: 100%; }
    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: #050505;
      color: #f5f5f5;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow: hidden;
    }
    a { color: inherit; text-decoration: none; }

    .quark-field {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .quark {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: #7eb6ff;
      box-shadow:
        0 0 4px 1px rgba(126, 182, 255, 0.85),
        0 0 10px 2px rgba(90, 150, 255, 0.35);
      opacity: 0.55;
      animation: quarkPulse 3.8s ease-in-out infinite;
    }
    .quark:nth-child(1)  { left: 8%;  top: 12%; animation-delay: 0s; opacity: 0.4; }
    .quark:nth-child(2)  { left: 22%; top: 28%; width: 1.5px; height: 1.5px; animation-delay: 0.5s; }
    .quark:nth-child(3)  { left: 41%; top: 9%;  animation-delay: 1.1s; opacity: 0.65; }
    .quark:nth-child(4)  { left: 63%; top: 18%; width: 1.5px; height: 1.5px; animation-delay: 0.3s; opacity: 0.35; }
    .quark:nth-child(5)  { left: 78%; top: 11%; animation-delay: 1.6s; }
    .quark:nth-child(6)  { left: 91%; top: 24%; width: 1.5px; height: 1.5px; animation-delay: 2.2s; opacity: 0.45; }
    .quark:nth-child(7)  { left: 14%; top: 48%; width: 1px; height: 1px; animation-delay: 0.9s; opacity: 0.3; }
    .quark:nth-child(8)  { left: 33%; top: 56%; animation-delay: 1.4s; opacity: 0.55; }
    .quark:nth-child(9)  { left: 52%; top: 42%; width: 1.5px; height: 1.5px; animation-delay: 2.0s; }
    .quark:nth-child(10) { left: 71%; top: 51%; animation-delay: 0.7s; opacity: 0.4; }
    .quark:nth-child(11) { left: 88%; top: 58%; width: 1px; height: 1px; animation-delay: 2.5s; opacity: 0.35; }
    .quark:nth-child(12) { left: 6%;  top: 72%; animation-delay: 1.8s; opacity: 0.5; }
    .quark:nth-child(13) { left: 27%; top: 81%; width: 1.5px; height: 1.5px; animation-delay: 0.4s; }
    .quark:nth-child(14) { left: 48%; top: 68%; width: 1px; height: 1px; animation-delay: 2.8s; opacity: 0.3; }
    .quark:nth-child(15) { left: 66%; top: 84%; animation-delay: 1.2s; opacity: 0.6; }
    .quark:nth-child(16) { left: 84%; top: 76%; width: 1.5px; height: 1.5px; animation-delay: 2.1s; opacity: 0.4; }
    .quark:nth-child(17) { left: 18%; top: 38%; width: 1px; height: 1px; animation-delay: 3.0s; opacity: 0.25; }
    .quark:nth-child(18) { left: 57%; top: 22%; animation-delay: 1.5s; opacity: 0.45; }
    .quark:nth-child(19) { left: 39%; top: 91%; width: 1.5px; height: 1.5px; animation-delay: 0.8s; }
    .quark:nth-child(20) { left: 95%; top: 88%; width: 1px; height: 1px; animation-delay: 2.4s; opacity: 0.35; }
    @keyframes quarkPulse {
      0%, 100% { opacity: 0.2; transform: scale(0.85); }
      50% { opacity: 0.9; transform: scale(1.2); }
    }

    .shell {
      position: relative;
      z-index: 1;
      height: 100dvh;
      height: 100svh;
      max-width: 44rem;
      margin: 0 auto;
      padding: 0 1.25rem;
      display: flex;
      flex-direction: column;
    }

    header {
      flex: 0 0 auto;
      padding: 1.15rem 0 0;
    }
    header nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      gap: 0.5rem;
    }
    header nav a {
      font-size: 0.95rem;
      font-weight: 600;
      color: rgba(245,245,245,0.75);
      letter-spacing: 0.02em;
    }

    main {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 0;
      padding: 0.5rem 0 1rem;
    }

    .brand-above {
      display: flex;
      justify-content: center;
      width: 100%;
      margin: 0 0 1.1rem;
      padding: 0 0.5rem;
    }
    .brand-above img {
      width: min(88vw, 22rem);
      height: auto;
      display: block;
      object-fit: contain;
    }

    .geo-wrap {
      width: min(52vw, 180px);
      height: min(52vw, 180px);
      margin: 0 0 1.35rem;
      flex-shrink: 0;
      /* no square crop — full transparent field */
      overflow: visible;
      background: transparent;
    }
    #geo-earth {
      width: 100%;
      height: 100%;
      display: block;
      background: transparent;
    }

    h1 {
      font-size: clamp(2.85rem, 12vw, 4.75rem);
      font-weight: 900;
      line-height: 0.88;
      letter-spacing: -0.05em;
      text-transform: uppercase;
      margin: 0 0 0.75rem;
    }
    .line {
      font-size: clamp(1.05rem, 3.8vw, 1.25rem);
      font-weight: 600;
      color: rgba(245,245,245,0.75);
      line-height: 1.3;
      margin: 0 0 0.15rem;
    }
  </style>
</head>
<body>
  <div class="quark-field" aria-hidden="true">
    <span class="quark"></span><span class="quark"></span><span class="quark"></span><span class="quark"></span>
    <span class="quark"></span><span class="quark"></span><span class="quark"></span><span class="quark"></span>
    <span class="quark"></span><span class="quark"></span><span class="quark"></span><span class="quark"></span>
    <span class="quark"></span><span class="quark"></span><span class="quark"></span><span class="quark"></span>
    <span class="quark"></span><span class="quark"></span><span class="quark"></span><span class="quark"></span>
  </div>
  <div class="shell">
    <header>
      <nav aria-label="Primary">
        <a href="research/">Research</a>
        <a href="corporate.html">Financial</a>
        <a href="ai/">Technology</a>
      </nav>
    </header>
    <main>
      <div class="brand-above">
        <img src="brand/logo-dna-x.svg" alt="DualisCapax" width="720" height="160" />
      </div>
      <div class="geo-wrap">
        <canvas id="geo-earth" width="360" height="360" aria-hidden="true"></canvas>
      </div>
      <h1>Truth<br>Prevails.</h1>
      <p class="line">Residual Law Finance.</p>
      <p class="line">Cutting Edge Technology.</p>
      <p class="line">Adaptive AI.</p>
      <p class="line">Research.</p>
    </main>
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js"
    }
  }
  </script>
  <script type="module">
  import * as THREE from 'three';

  const canvas = document.getElementById('geo-earth');
  if (!canvas) throw new Error('no canvas');

  const renderer = new THREE.WebGLRenderer({
    canvas,
    antialias: true,
    alpha: true,
    powerPreference: 'high-performance',
    premultipliedAlpha: false
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);
  renderer.setClearColor(0x000000, 0);
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  const scene = new THREE.Scene();
  // Wider FOV / farther cam so geodesic sits fully inside frame — no square crop
  const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 20);
  camera.position.z = 3.55;

  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const key = new THREE.DirectionalLight(0xffffff, 1.35);
  key.position.set(2.4, 1.6, 3.0);
  scene.add(key);
  const fill = new THREE.DirectionalLight(0x8899aa, 0.45);
  fill.position.set(-2, -0.5, 1.5);
  scene.add(fill);

  // Scale mesh slightly under 1 so silhouette never hits canvas edge
  const geo = new THREE.IcosahedronGeometry(0.92, 2);

  const body = new THREE.Mesh(
    geo,
    new THREE.MeshStandardMaterial({
      color: 0x2a2e32,
      flatShading: true,
      metalness: 0.55,
      roughness: 0.4,
      emissive: 0x0a0c0e,
      emissiveIntensity: 0.2
    })
  );

  const wire = new THREE.LineSegments(
    new THREE.EdgesGeometry(geo, 1),
    new THREE.LineBasicMaterial({ color: 0xc8ced4, transparent: true, opacity: 0.9 })
  );
  wire.scale.setScalar(1.002);

  const wireOuter = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(0.97, 1), 1),
    new THREE.LineBasicMaterial({ color: 0x6a7078, transparent: true, opacity: 0.45 })
  );

  const points = new THREE.Points(
    geo.clone(),
    new THREE.PointsMaterial({
      color: 0xe8ecf0,
      size: 0.032,
      sizeAttenuation: true,
      transparent: true,
      opacity: 0.85
    })
  );

  const group = new THREE.Group();
  group.add(body);
  group.add(wire);
  group.add(wireOuter);
  group.add(points);
  scene.add(group);

  const Y_SPEED = (Math.PI * 2) / 22;
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    group.rotation.y += Y_SPEED * dt;
    group.rotation.x = 0.25;
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function onResize() {
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    if (w < 1 || h < 1) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', onResize);
  onResize();
  </script>
</body>
</html>
