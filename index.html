<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DualisCapax</title>
<meta name="description" content="DualisCapax — residual plane. Research free. Depth when rails are live.">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="emblem-ring.svg">
<style>
:root{
  --bg:#000;
  --fg:#f5f5f3;
  --muted:#8a8a86;
  --line:#1c1c1c;
  --gold:#c4a035;
  --blue:#2a7fd4;
  --font:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--fg);
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}

/* Full-viewport distinct face — not control-plane chrome */
.stage{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:2rem 1.25rem 3rem;
  text-align:center;
  position:relative;
  overflow:hidden;
}
.stage::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(ellipse 55% 40% at 50% 42%, rgba(42,127,212,.14), transparent 70%),
    radial-gradient(ellipse 40% 30% at 50% 55%, rgba(196,160,53,.08), transparent 70%);
}

.mark{
  width:min(42vw, 140px);
  height:auto;
  margin-bottom:1.5rem;
  position:relative;
  z-index:1;
}

.word{
  width:min(78vw, 320px);
  height:auto;
  margin-bottom:1.25rem;
  position:relative;
  z-index:1;
}

h1{
  font-size:clamp(1.05rem, 0.9rem + 0.8vw, 1.25rem);
  font-weight:500;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:1rem;
  position:relative;
  z-index:1;
}

.lead{
  max-width:22rem;
  font-size:.95rem;
  line-height:1.55;
  color:var(--muted);
  margin:0 auto 2rem;
  position:relative;
  z-index:1;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:.6rem;
  justify-content:center;
  position:relative;
  z-index:1;
}
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:.7rem 1.25rem;
  font-size:.8rem;
  font-weight:600;
  letter-spacing:.04em;
  border-radius:4px;
  border:1px solid transparent;
}
.btn-w{background:#fff;color:#000}
.btn-w:hover{background:#e8e8e8}
.btn-g{
  background:transparent;
  color:var(--fg);
  border-color:#333;
}
.btn-g:hover{border-color:#666}

.foot{
  position:absolute;
  bottom:1.25rem;
  left:0;right:0;
  text-align:center;
  font-size:.62rem;
  letter-spacing:.06em;
  color:#555;
  z-index:1;
}
.foot span{color:var(--gold)}

/* Secondary strip — still residual, not status-bar clone */
.links{
  margin-top:2.5rem;
  display:flex;
  flex-wrap:wrap;
  gap:.75rem 1.25rem;
  justify-content:center;
  font-size:.72rem;
  color:var(--muted);
  position:relative;
  z-index:1;
}
.links a:hover{color:var(--fg)}
</style>
</head>
<body>
  <main class="stage">
    <img class="mark" src="emblem-ring.svg" alt="">
    <img class="word" src="logo-dark.svg" alt="DualisCapax">
    <h1>Residual plane</h1>
    <p class="lead">
      Open research. Adaptive depth when rails are live.
      Black and white residual — one underweight point under playground expanse.
    </p>
    <div class="actions">
      <a class="btn btn-w" href="research/">Research</a>
      <a class="btn btn-g" href="manifesto.html">Manifesto</a>
      <a class="btn btn-g" href="residual-law.html">Residual Law</a>
    </div>
    <nav class="links" aria-label="More">
      <a href="model.html">Model</a>
      <a href="gateway.html">Gateway</a>
      <a href="participate.html">Participate</a>
      <a href="research/healthcare/">Healthcare</a>
    </nav>
    <p class="foot">
      <span>No Tribes Preferred · All Haters Welcome · Truth and Unity Prevail</span>
    </p>
  </main>
</body>
</html>
