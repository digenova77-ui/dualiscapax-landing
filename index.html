<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>DualisCapax</title>
<meta name="theme-color" content="#050505"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet"/>
<style>
:root{color-scheme:dark;--fg:#f5f5f5;--fg-soft:rgba(245,245,245,.72);--quark:#7eb6ff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;-webkit-text-size-adjust:100%}
body{font-family:Inter,system-ui,sans-serif;background:#000;color:var(--fg);overflow:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.intro{position:fixed;inset:0;z-index:40;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity 1.1s ease}
.intro.is-out{opacity:0;pointer-events:none}
.intro video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;opacity:0;transition:opacity 1.2s ease}
.intro video.is-on{opacity:1}
.question{position:relative;z-index:3;max-width:22rem;padding:0 1.5rem;text-align:center;opacity:0;transform:translateY(8px);transition:opacity 1.4s ease,transform 1.4s ease,filter 1.4s ease}
.question.is-in{opacity:1;transform:translateY(0)}
.question.is-out{opacity:0;transform:scale(.92);filter:blur(12px)}
.question p{font-size:clamp(1.15rem,4.2vw,1.45rem);font-weight:600;line-height:1.45;color:rgba(245,245,245,.92)}
.question p+p{margin-top:.85rem;color:rgba(245,245,245,.62);font-weight:500;font-size:clamp(1rem,3.6vw,1.2rem)}
.seed{position:absolute;z-index:2;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#fff;box-shadow:0 0 12px 4px rgba(255,255,255,.95),0 0 40px 12px rgba(200,220,255,.55),0 0 80px 28px rgba(140,180,255,.25);opacity:0;transform:scale(.2);transition:opacity .5s ease,transform 1.1s cubic-bezier(.22,1,.36,1);pointer-events:none}
.seed.is-on{opacity:1;transform:scale(1)}
.seed.is-bloom{transform:scale(18);opacity:.85;transition:opacity .9s ease,transform 1.35s cubic-bezier(.22,1,.36,1)}
.seed.is-gone{opacity:0;transition:opacity .6s ease}
.intro .credit{position:absolute;left:.75rem;bottom:max(.6rem,env(safe-area-inset-bottom));font-size:.65rem;letter-spacing:.04em;color:rgba(255,255,255,.45);opacity:0;transition:opacity .6s ease;z-index:4}
.intro .credit.is-on{opacity:1}
.intro .skip{position:absolute;right:.75rem;bottom:max(.6rem,env(safe-area-inset-bottom));font-size:.78rem;font-weight:600;color:rgba(255,255,255,.7);background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:.4rem .85rem;cursor:pointer;z-index:4}
.smoke{position:fixed;inset:0;z-index:35;pointer-events:none;opacity:0;background:radial-gradient(ellipse 80% 60% at 50% 45%,rgba(180,200,220,.18),transparent 60%),#000;transition:opacity .9s ease}
.smoke.is-on{opacity:1}
.smoke.is-clear{opacity:0;transition:opacity 1.4s ease}
.site{opacity:0;transition:opacity 1.2s ease}
body.is-live .site{opacity:1}
.shell{position:relative;z-index:1;height:100dvh;max-width:48rem;margin:0 auto;padding:max(.75rem,env(safe-area-inset-top)) 1rem max(.85rem,env(safe-area-inset-bottom));display:flex;flex-direction:column}
header nav{display:flex;justify-content:space-between;width:100%}
header nav a{font-size:.88rem;font-weight:600;color:rgba(245,245,245,.75)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.logo-stage{width:min(96vw,44rem);height:clamp(7rem,28vw,11rem);margin-bottom:.2rem}
.logo-stage img{width:100%;height:100%;object-fit:contain}
.geo-wrap{width:min(48vw,160px);height:min(48vw,160px);margin-bottom:.8rem}
#geo-earth{width:100%;height:100%;display:block}
h1{font-size:clamp(2.4rem,10vw,4.2rem);font-weight:900;line-height:.9;letter-spacing:-.05em;text-transform:uppercase;margin-bottom:.5rem}
.line{font-size:clamp(.95rem,3.2vw,1.12rem);font-weight:600;color:var(--fg-soft);margin:0 0 .1rem}
</style>
</head>
<body>
<div class="intro" id="intro">
  <video id="nasa-bb" playsinline muted src="https://svs.gsfc.nasa.gov/vis/a010000/a012600/a012656/12656_Big_Bang_1080.webm"></video>
  <audio id="bb-audio" preload="auto" playsinline src="https://assets.science.nasa.gov/content/dam/science/psd/photojournal/pia/pia16/pia16881/PIA16881.wav"></audio>
  <div class="seed" id="seed" aria-hidden="true"></div>
  <div class="question" id="question">
    <p>Every decision leaves a residual.</p>
    <p>What will yours cost?</p>
  </div>
  <span class="credit" id="credit">NASA / GSFC · ESA/NASA/JPL-Caltech</span>
  <button type="button" class="skip" id="skip-intro">Skip</button>
</div>
<div class="smoke" id="smoke" aria-hidden="true"></div>
<div class="site">
  <div class="shell">
    <header>
      <nav aria-label="Primary">
        <a href="corporate.html">Financial</a>
        <a href="ai/">Tech</a>
        <a href="research/">Research + AI</a>
      </nav>
    </header>
    <main>
      <div class="logo-stage">
        <img src="brand/logo-dna-x.svg" alt="DualisCapax" width="900" height="200"/>
      </div>
      <div class="geo-wrap">
        <canvas id="geo-earth" width="360" height="360"></canvas>
      </div>
      <h1>Truth<br>Prevails</h1>
      <p class="line">Residual Law Finance.</p>
      <p class="line">Cutting Edge Technology.</p>
      <p class="line">Adaptive AI.</p>
      <p class="line">Research.</p>
    </main>
  </div>
</div>
<script>
(function(){
  const intro=document.getElementById('intro');
  const video=document.getElementById('nasa-bb');
  const audio=document.getElementById('bb-audio');
  const smoke=document.getElementById('smoke');
  const skip=document.getElementById('skip-intro');
  const question=document.getElementById('question');
  const seed=document.getElementById('seed');
  const credit=document.getElementById('credit');
  let done=false, phase='question', audioStarted=false;
  let audioCtx=null, analyser=null, freqData=null, hapticRaf=null;

  function startAudio(){
    if(audioStarted)return;
    audioStarted=true;
    try{
      audio.volume=0;
      const p=audio.play();
      if(p&&p.then){
        p.then(function(){
          const t0=performance.now();
          (function fade(){
            const dt=(performance.now()-t0)/1000;
            audio.volume=Math.min(.85,dt/1.6);
            if(audio.volume<.85)requestAnimationFrame(fade);
          })();
          startHaptics();
        }).catch(function(){});
      } else startHaptics();
    }catch(e){}
  }

  function startHaptics(){
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return;
      audioCtx=new AC();
      const src=audioCtx.createMediaElementSource(audio);
      analyser=audioCtx.createAnalyser();
      analyser.fftSize=256;
      freqData=new Uint8Array(analyser.frequencyBinCount);
      src.connect(analyser);
      analyser.connect(audioCtx.destination);
      if(audioCtx.state==='suspended')audioCtx.resume();
      (function loop(){
        if(!analyser)return;
        analyser.getByteFrequencyData(freqData);
        let sum=0;
        for(let i=0;i<freqData.length;i++)sum+=freqData[i];
        const intensity=Math.min(1,sum/freqData.length/90);
        seed.style.transform='scale('+(1+intensity*.9)+')';
        if(navigator.vibrate){
          try{
            if(intensity>.55)navigator.vibrate([30,16,24]);
            else if(intensity>.28)navigator.vibrate(20);
            else if(intensity>.12)navigator.vibrate(9);
          }catch(e){}
        }
        hapticRaf=requestAnimationFrame(loop);
      })();
    }catch(e){}
  }

  function stopAudio(){
    try{audio.pause();audio.currentTime=0}catch(e){}
    if(hapticRaf){cancelAnimationFrame(hapticRaf);hapticRaf=null}
    if(audioCtx){try{audioCtx.close()}catch(e){}audioCtx=null}
    analyser=null;freqData=null;
    seed.style.transform='';
  }

  function startSite(){
    if(done)return;
    done=true;
    stopAudio();
    smoke.classList.add('is-on');
    intro.classList.add('is-out');
    setTimeout(function(){
      document.body.classList.add('is-live');
      smoke.classList.add('is-clear');
      setTimeout(function(){intro.remove();smoke.remove()},1600);
    },700);
  }

  function startVideo(){
    if(phase==='video'||done)return;
    phase='video';
    credit.classList.add('is-on');
    video.classList.add('is-on');
    seed.classList.add('is-gone');
    startAudio();
    const p=video.play();
    if(p&&p.catch)p.catch(function(){});
  }

  function collapseToOrb(){
    if(phase!=='question')return;
    phase='orb';
    question.classList.remove('is-in');
    question.classList.add('is-out');
    seed.classList.add('is-on');
    setTimeout(function(){seed.classList.add('is-bloom')},380);
    setTimeout(startVideo,1200);
  }

  setTimeout(function(){question.classList.add('is-in')},400);
  setTimeout(collapseToOrb,4200);
  skip.addEventListener('click',function(){try{video.pause()}catch(e){}stopAudio();startSite()});
  video.addEventListener('ended',startSite);
  video.addEventListener('error',function(){if(phase==='video')startSite()});
  setTimeout(function(){if(!done&&phase==='video'&&video.readyState<2)startSite()},14000);
  setTimeout(function(){if(!done)startSite()},28000);
})();
</script>

<script type="module">
import * as THREE from 'three';
const canvas=document.getElementById('geo-earth');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.setSize(canvas.clientWidth,canvas.clientHeight,false);
renderer.setClearColor(0x000000,0);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(36,1,0.1,20);
camera.position.z=3.55;
scene.add(new THREE.AmbientLight(0xffffff,0.65));
const key=new THREE.DirectionalLight(0xffffff,1.2);key.position.set(2.4,1.6,3);scene.add(key);
const geo=new THREE.IcosahedronGeometry(0.92,2);
const body=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0x6a7a88,flatShading:true,metalness:0.35,roughness:0.35,transparent:true,opacity:0.55,depthWrite:false}));
const wire=new THREE.LineSegments(new THREE.EdgesGeometry(geo,1),new THREE.LineBasicMaterial({color:0xd0d8e0,transparent:true,opacity:0.7}));
const group=new THREE.Group();group.add(body);group.add(wire);scene.add(group);
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  group.rotation.y+=(Math.PI*2/22)*dt;
  group.rotation.x=0.25;
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
function onResize(){
  const w=canvas.clientWidth,h=canvas.clientHeight;
  if(w<1||h<1)return;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;camera.updateProjectionMatrix();
}
window.addEventListener('resize',onResize);onResize();
</script>
</body>
</html>
