<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache">
<title>DualisCapax</title>
<meta name="theme-color" content="#020203">
<link rel="icon" href="brand/emblem-helix.svg">
<link rel="stylesheet" href="skin/default.css?v=ux3">
</head>
<body>
<canvas id="webgl"></canvas>
<img class="em mobile-only" src="brand/emblem-helix.svg" alt="">

<div class="ui mobile-only" id="mobile"></div>

<div class="ui desktop-only desk" id="desktop">
  <nav class="desk-nav" id="desk-nav"><div class="mark">DualisCapax</div></nav>
  <div class="desk-read" id="desk-read"></div>
  <div></div>
</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import { startPlaneEngine } from './js/plane-engine.js';

async function boot() {
  const isDesk = matchMedia('(min-width: 1024px)').matches;
  startPlaneEngine(document.getElementById('webgl'));

  if (isDesk) {
    const data = await (await fetch('content/story.json?v=3')).json();
    const nav = document.getElementById('desk-nav');
    data.links.forEach(function (l) {
      const a = document.createElement('a');
      a.href = l.href; a.textContent = l.label;
      nav.appendChild(a);
    });
    const chat = document.createElement('a');
    chat.href = 'ai/chat.html'; chat.textContent = 'AI chat';
    nav.appendChild(chat);
    let h = '';
    h += '<div class="brand">' + data.brand + '</div>';
    h += '<p class="tag">' + data.tag + '</p>';
    h += '<p class="intro">' + data.intro + '</p>';
    data.beats.forEach(function (b) {
      h += '<article class="block"><div class="n">' + b.n + '</div>';
      h += '<h2>' + b.title + '</h2><p>' + b.body + '</p></article>';
    });
    document.getElementById('desk-read').innerHTML = h;
  } else {
    const m = await (await fetch('content/mobile.json?v=2')).json();
    let h = '<div class="m-shell">';
    h += '<div class="m-brand">' + m.brand + '</div>';
    h += '<p class="m-gist">' + m.gist + '</p>';
    h += '<div class="m-beats">';
    m.beats.forEach(function (b) {
      h += '<div class="m-beat"><strong>' + b.title + '</strong><span>' + b.line + '</span></div>';
    });
    h += '</div><div class="m-actions">';
    h += '<a class="m-btn primary" href="' + m.cta_chat.href + '">' + m.cta_chat.label + '</a>';
    h += '<a class="m-btn secondary" href="' + m.cta_video.href + '">' + m.cta_video.label + '</a>';
    h += '<a class="m-btn secondary" href="' + m.cta_onboard.href + '">' + m.cta_onboard.label + '</a>';
    h += '</div></div>';
    document.getElementById('mobile').innerHTML = h;
  }
}
boot().catch(function (e) { console.error(e); });
</script>
</body>
</html>
