<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DualisCapax</title>
  <meta name="description" content="Residual Law Finance. Cutting Edge Technology. Adaptive AI. Research." />
  <meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #050505;
      --bg-elevated: #0c0c0c;
      --fg: #f5f5f5;
      --fg-muted: rgba(245, 245, 245, 0.75);
      --fg-soft: rgba(245, 245, 245, 0.72);
      --quark: #7eb6ff;
      --quark-glow: rgba(126, 182, 255, 0.85);
      --quark-glow-soft: rgba(90, 150, 255, 0.35);
      --nav: var(--fg-muted);
      --theme-color: #050505;
    }
    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --bg: #f4f5f7;
        --bg-elevated: #ffffff;
        --fg: #0a0a0a;
        --fg-muted: rgba(10, 10, 10, 0.72);
        --fg-soft: rgba(10, 10, 10, 0.68);
        --quark: #2a6fd4;
        --quark-glow: rgba(42, 111, 212, 0.55);
        --quark-glow-soft: rgba(42, 111, 212, 0.25);
        --nav: var(--fg-muted);
        --theme-color: #f4f5f7;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; -webkit-text-size-adjust: 100%; }
    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--fg);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    a { color: inherit; text-decoration: none; }

    .quark-field {
      position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
      opacity: 0;
      animation: fieldIn 1.4s ease-out 0.15s forwards;
    }
    @keyframes fieldIn { to { opacity: 1; } }
    .quark {
      position: absolute; width: 2px; height: 2px; border-radius: 50%;
      background: var(--quark);
      box-shadow: 0 0 4px 1px var(--quark-glow), 0 0 10px 2px var(--quark-glow-soft);
      opacity: 0.55; animation: quarkPulse 3.8s ease-in-out infinite;
    }
    .quark:nth-child(1)  { left: 8%;  top: 12%; animation-delay: 0s; opacity: 0.4; }
    .quark:nth-child(2)  { left: 22%; top: 28%; width: 1.5px; height: 1.5px; animation-delay: 0.5s; }
    .quark:nth-child(3)  { left: 41%; top: 9%;  animation-delay: 1.1s; opacity: 0.65; }
    .quark:nth-child(4)  { left: 63%; top: 18%; width: 1.5px; height: 1.5px; animation-delay: 0.3s; opacity: 0.35; }
    .quark:nth-child(5)  { left: 78%; top: 11%; animation-delay: 1.6s; }
    .quark:nth-child(6)  { left: 91%; top: 24%; width: 1.5px; height: 1.5px; animation-delay: 2.2s; opacity: 0.45; }
    .quark:nth-child(7)  { left: 14%; top: 48%; width: 1px; height: 1px; animation-delay: 0.9s; opacity: 0.3; }
    .quark:nth-child(8)  { left: 33%; top: 56%; animation-delay: 1.4s; opacity: 0.55; }
    .quark:nth-child(9)  { left: 52%; top: 42%; width: 1.5px; height: 1.5px; animation-delay: 2.0s; }
    .quark:nth-child(10) { left: 71%; top: 51%; animation-delay: 0.7s; opacity: 0.4; }
    .quark:nth-child(11) { left: 88%; top: 58%; width: 1px; height: 1px; animation-delay: 2.5s; opacity: 0.35; }
    .quark:nth-child(12) { left: 6%;  top: 72%; animation-delay: 1.8s; opacity: 0.5; }
    .quark:nth-child(13) { left: 27%; top: 81%; width: 1.5px; height: 1.5px; animation-delay: 0.4s; }
    .quark:nth-child(14) { left: 48%; top: 68%; width: 1px; height: 1px; animation-delay: 2.8s; opacity: 0.3; }
    .quark:nth-child(15) { left: 66%; top: 84%; animation-delay: 1.2s; opacity: 0.6; }
    .quark:nth-child(16) { left: 84%; top: 76%; width: 1.5px; height: 1.5px; animation-delay: 2.1s; opacity: 0.4; }
    .quark:nth-child(17) { left: 18%; top: 38%; width: 1px; height: 1px; animation-delay: 3.0s; opacity: 0.25; }
    .quark:nth-child(18) { left: 57%; top: 22%; animation-delay: 1.5s; opacity: 0.45; }
    .quark:nth-child(19) { left: 39%; top: 91%; width: 1.5px; height: 1.5px; animation-delay: 0.8s; }
    .quark:nth-child(20) { left: 95%; top: 88%; width: 1px; height: 1px; animation-delay: 2.4s; opacity: 0.35; }
    @keyframes quarkPulse {
      0%, 100% { opacity: 0.2; transform: scale(0.85); }
      50% { opacity: 0.9; transform: scale(1.2); }
    }

    .shell {
      position: relative; z-index: 1;
      height: 100dvh; height: 100svh;
      max-width: 44rem; margin: 0 auto;
      padding: max(0.75rem, env(safe-area-inset-top)) 1.25rem max(0.85rem, env(safe-area-inset-bottom));
      display: flex; flex-direction: column;
    }

    .arrive {
      opacity: 0;
      filter: blur(10px);
      transform: translateY(14px) scale(0.96);
      animation: arriveIn 1.15s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes arriveIn {
      to { opacity: 1; filter: blur(0); transform: translateY(0) scale(1); }
    }

    header { flex: 0 0 auto; }
    header nav {
      display: flex; justify-content: space-between; align-items: center;
      width: 100%; gap: 0.35rem;
    }
    header nav a {
      font-size: 0.88rem; font-weight: 600;
      color: var(--nav); letter-spacing: 0.01em;
      white-space: nowrap;
      opacity: 0;
      animation: arriveIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    header nav a:nth-child(1) { animation-delay: 3.55s; }
    header nav a:nth-child(2) { animation-delay: 3.7s; }
    header nav a:nth-child(3) { animation-delay: 3.85s; }

    main {
      flex: 1 1 auto;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; min-height: 0;
      padding: 0.35rem 0;
    }

    .logo-particles {
      width: min(94vw, 26rem);
      height: clamp(5.25rem, 22vw, 7.75rem);
      margin: 0 0 0.75rem;
      flex-shrink: 0;
      display: block;
      opacity: 0;
      animation: logoFrameIn 0.6s ease-out 0.05s forwards;
    }
    @keyframes logoFrameIn { to { opacity: 1; } }

    .geo-wrap {
      width: min(52vw, 180px);
      height: min(52vw, 180px);
      margin: 0 0 1.15rem;
      flex-shrink: 0;
      overflow: visible;
      background: transparent;
      animation-delay: 2.65s;
    }
    #geo-earth {
      width: 100%; height: 100%;
      display: block;
      background: transparent;
    }

    h1 {
      font-size: clamp(2.6rem, 11vw, 4.5rem); font-weight: 900;
      line-height: 0.9; letter-spacing: -0.05em; text-transform: uppercase;
      margin: 0 0 0.65rem;
      color: var(--fg);
      animation-delay: 3.05s;
    }

    .lines {
      display: flex; flex-direction: column; align-items: center;
      max-width: 18rem;
      margin: 0 auto;
    }
    .line {
      font-size: clamp(0.98rem, 3.4vw, 1.15rem); font-weight: 600;
      color: var(--fg-soft); line-height: 1.35; margin: 0 0 0.12rem;
      opacity: 0;
      filter: blur(8px);
      transform: translateY(10px);
      animation: arriveIn 0.95s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .line:nth-child(1) { animation-delay: 3.25s; }
    .line:nth-child(2) { animation-delay: 3.4s; }
    .line:nth-child(3) { animation-delay: 3.55s; }
    .line:nth-child(4) { animation-delay: 3.7s; }

    @media (max-height: 640px) {
      .logo-particles { height: clamp(4.25rem, 17vw, 5.75rem); margin-bottom: 0.5rem; }
      .geo-wrap { width: min(40vw, 140px); height: min(40vw, 140px); margin-bottom: 0.7rem; }
      h1 { font-size: clamp(2.2rem, 9vw, 3.2rem); margin-bottom: 0.45rem; }
      .line { font-size: 0.95rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .arrive, header nav a, .line, .quark-field, .logo-particles {
        animation: none !important;
        opacity: 1 !important;
        filter: none !important;
        transform: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="quark-field" aria-hidden="true">
    <span class="quark"></span><span class="quark"></span><span class="quark"></span><span class="quark"></span>
    <span class="quark"></span><span class="quark"></span><span class="quark"></span><span class="quark"></span>
    <span class="quark"></span><span class="quark"></span><span class="quark"></span><span class="quark"></span>
    <span class="quark"></span><span class="quark"></span><span class="quark"></span><span class="quark"></span>
    <span class="quark"></span><span class="quark"></span><span class="quark"></span><span class="quark"></span>
  </div>
  <div class="shell">
    <header>
      <nav aria-label="Primary">
        <a href="corporate.html">Financial</a>
        <a href="ai/">Tech</a>
        <a href="research/">Research + AI</a>
      </nav>
    </header>
    <main>
      <canvas class="logo-particles" id="logo-particles" width="780" height="200" aria-label="Dualis Capax" role="img"></canvas>
      <div class="geo-wrap arrive">
        <canvas id="geo-earth" width="360" height="360" aria-hidden="true"></canvas>
      </div>
      <h1 class="arrive">Truth<br>Prevails</h1>
      <div class="lines">
        <p class="line">Residual Law Finance.</p>
        <p class="line">Cutting Edge Technology.</p>
        <p class="line">Adaptive AI.</p>
        <p class="line">Research.</p>
      </div>
    </main>
  </div>

  <script>
  (function logoParticles() {
    const canvas = document.getElementById('logo-particles');
    const ctx = canvas.getContext('2d');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    let particles = [];
    let orbiters = [];
    let start = null;
    const ASSEMBLE_MS = 3800;

    /* Draw exact framing of brand/logo-dna-x.svg: Dualis | DNA | Capax */
    function drawBrandMark(o, w, h) {
      o.clearRect(0, 0, w, h);
      const scale = Math.min(w / 900, h / 200);
      const ox = (w - 900 * scale) / 2;
      const oy = (h - 200 * scale) / 2;
      o.save();
      o.translate(ox, oy);
      o.scale(scale, scale);

      o.fillStyle = '#f5f5f5';
      o.font = '800 96px Inter, Arial, Helvetica, sans-serif';
      o.textBaseline = 'alphabetic';
      o.letterSpacing = '-2.5px';
      try { o.letterSpacing = '-2.5px'; } catch (e) {}
      o.fillText('Dualis', 20, 128);
      o.fillText('Capax', 390, 128);

      /* Cyan DNA between the words — same paths as logo-dna-x.svg */
      o.strokeStyle = '#00d4e8';
      o.lineWidth = 5.5;
      o.lineCap = 'round';
      o.lineJoin = 'round';
      o.translate(318, 18);

      o.beginPath();
      o.moveTo(12, 160);
      o.bezierCurveTo(12, 120, 48, 110, 48, 80);
      o.bezierCurveTo(48, 50, 12, 40, 12, 0);
      o.stroke();

      o.beginPath();
      o.moveTo(48, 160);
      o.bezierCurveTo(48, 120, 12, 110, 12, 80);
      o.bezierCurveTo(12, 50, 48, 40, 48, 0);
      o.stroke();

      o.lineWidth = 4.5;
      [[18, 140, 42, 128], [18, 112, 42, 100], [18, 84, 42, 72], [18, 56, 42, 44], [18, 28, 42, 16]].forEach(function (L) {
        o.beginPath();
        o.moveTo(L[0], L[1]);
        o.lineTo(L[2], L[3]);
        o.stroke();
      });

      o.restore();
    }

    function sampleTargets() {
      const w = canvas.clientWidth || 360;
      const h = canvas.clientHeight || 90;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const off = document.createElement('canvas');
      off.width = Math.floor(w * dpr);
      off.height = Math.floor(h * dpr);
      const o = off.getContext('2d');
      o.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawBrandMark(o, w, h);

      const data = o.getImageData(0, 0, off.width, off.height).data;
      const targets = [];
      const step = Math.max(1, Math.floor(1.35 * dpr));
      for (let y = 0; y < off.height; y += step) {
        for (let x = 0; x < off.width; x += step) {
          const i = (y * off.width + x) * 4;
          const a = data[i + 3];
          if (a < 40) continue;
          const r = data[i], g = data[i + 1], b = data[i + 2];
          /* cyan DNA vs white letters */
          const isDna = b > 180 && g > 160 && r < 120;
          targets.push({
            x: x / dpr,
            y: y / dpr,
            dna: isDna
          });
        }
      }
      targets.sort(function (a, b) {
        return a.x - b.x || a.y - b.y;
      });
      return { targets, w, h };
    }

    function rebuild() {
      const sample = sampleTargets();
      const targets = sample.targets;
      const w = sample.w;
      const h = sample.h;
      const n = targets.length;

      particles = targets.map(function (t, i) {
        const rank = n <= 1 ? 0 : i / (n - 1);
        const angle = Math.random() * Math.PI * 2;
        const dist = (0.4 + Math.random() * 1.1) * Math.max(w, h);
        return {
          tx: t.x, ty: t.y,
          x: w / 2 + Math.cos(angle) * dist,
          y: h / 2 + Math.sin(angle) * dist,
          r: t.dna ? (1.05 + Math.random() * 1.15) : (0.95 + Math.random() * 1.15),
          phase: Math.random() * Math.PI * 2,
          bright: 0.75 + Math.random() * 0.25,
          rank: rank,
          dna: t.dna
        };
      });

      const cx = w / 2, cy = h / 2;
      orbiters = [];
      for (let i = 0; i < 36; i++) {
        const a0 = (i / 36) * Math.PI * 2 + Math.random() * 0.35;
        const radius = (0.32 + Math.random() * 0.4) * Math.min(w, h * 2.1);
        orbiters.push({
          a: a0,
          speed: 0.0003 + Math.random() * 0.0005,
          rx: radius * (0.9 + Math.random() * 0.3),
          ry: radius * (0.32 + Math.random() * 0.22),
          cx: cx + (Math.random() - 0.5) * w * 0.06,
          cy: cy + (Math.random() - 0.5) * h * 0.1,
          r: 0.9 + Math.random() * 1.3,
          phase: Math.random() * Math.PI * 2,
          flash: Math.random() * Math.PI * 2,
          flashSpeed: 0.002 + Math.random() * 0.0035
        });
      }
      start = performance.now();
    }

    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
    function smoothstep(edge0, edge1, x) {
      const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
      return t * t * (3 - 2 * t);
    }

    function frame(now) {
      if (start == null) start = now;
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      ctx.clearRect(0, 0, w, h);

      const t = Math.min(1, (now - start) / ASSEMBLE_MS);
      const density = easeOutCubic(t);
      const front = density * 1.15;
      const shine = smoothstep(0.72, 1, t);
      const glisten = smoothstep(0.88, 1, t);

      /* tighter, more defined — low bloom */
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        const local = smoothstep(p.rank - 0.08, p.rank + 0.02, front);
        if (local <= 0.001) continue;

        const pull = 0.05 + local * 0.2;
        p.x += (p.tx - p.x) * pull;
        p.y += (p.ty - p.y) * pull;

        const pulse = 0.82 + 0.18 * Math.sin(now * 0.0035 + p.phase);
        const alpha = Math.min(1, local * p.bright * pulse * (0.55 + 0.45 * density) * (1 + shine * 0.2));
        const radius = p.r * (0.7 + 0.35 * local) * (0.9 + 0.15 * pulse);

        ctx.beginPath();
        ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
        if (p.dna) {
          ctx.fillStyle = 'rgba(0, 212, 232, ' + alpha + ')';
          ctx.shadowColor = 'rgba(0, 212, 232, ' + (0.55 * alpha) + ')';
        } else {
          ctx.fillStyle = 'rgba(245, 245, 245, ' + alpha + ')';
          ctx.shadowColor = 'rgba(200, 220, 255, ' + (0.35 * alpha) + ')';
        }
        ctx.shadowBlur = 2.5 + 3 * shine;
        ctx.fill();
      }

      if (glisten > 0.01) {
        for (let i = 0; i < orbiters.length; i++) {
          const o = orbiters[i];
          o.a += o.speed * 16;
          const x = o.cx + Math.cos(o.a) * o.rx;
          const y = o.cy + Math.sin(o.a) * o.ry;
          const flash = Math.pow(0.5 + 0.5 * Math.sin(now * o.flashSpeed + o.flash), 10);
          const pulse = 0.5 + 0.5 * Math.sin(now * 0.003 + o.phase);
          const alpha = glisten * (0.2 + 0.8 * flash) * (0.5 + 0.5 * pulse) * 0.85;
          const radius = o.r * (0.55 + 1.0 * flash);
          ctx.beginPath();
          ctx.arc(x, y, radius, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(220, 240, 255, ' + alpha + ')';
          ctx.shadowColor = 'rgba(160, 210, 255, ' + (0.7 * alpha) + ')';
          ctx.shadowBlur = 3 + 10 * flash;
          ctx.fill();
        }
      }

      ctx.shadowBlur = 0;
      requestAnimationFrame(frame);
    }

    rebuild();
    requestAnimationFrame(frame);
    window.addEventListener('resize', function () {
      clearTimeout(window.__logoResize);
      window.__logoResize = setTimeout(rebuild, 120);
    });
  })();
  </script>

  <script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.170.0/build/three.module.js" } }
  </script>
  <script type="module">
  import * as THREE from 'three';
  const canvas = document.getElementById('geo-earth');
  const renderer = new THREE.WebGLRenderer({
    canvas, antialias: true, alpha: true,
    powerPreference: 'high-performance', premultipliedAlpha: false
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);
  renderer.setClearColor(0x000000, 0);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 20);
  camera.position.z = 3.55;
  scene.add(new THREE.AmbientLight(0xffffff, 0.65));
  const key = new THREE.DirectionalLight(0xffffff, 1.2);
  key.position.set(2.4, 1.6, 3.0); scene.add(key);
  const fill = new THREE.DirectionalLight(0x8899aa, 0.5);
  fill.position.set(-2, -0.5, 1.5); scene.add(fill);
  const geo = new THREE.IcosahedronGeometry(0.92, 2);
  const body = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    color: 0x6a7a88, flatShading: true, metalness: 0.35, roughness: 0.35,
    transparent: true, opacity: 0.55, depthWrite: false,
    emissive: 0x1a2838, emissiveIntensity: 0.35
  }));
  const wire = new THREE.LineSegments(
    new THREE.EdgesGeometry(geo, 1),
    new THREE.LineBasicMaterial({ color: 0xd0d8e0, transparent: true, opacity: 0.7 })
  );
  wire.scale.setScalar(1.002);
  const wireOuter = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(0.97, 1), 1),
    new THREE.LineBasicMaterial({ color: 0x8a98a8, transparent: true, opacity: 0.4 })
  );
  const points = new THREE.Points(
    geo.clone(),
    new THREE.PointsMaterial({
      color: 0xe8ecf0, size: 0.032, sizeAttenuation: true,
      transparent: true, opacity: 0.65
    })
  );
  const group = new THREE.Group();
  group.add(body); group.add(wire); group.add(wireOuter); group.add(points);
  scene.add(group);
  const Y_SPEED = (Math.PI * 2) / 22;
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    group.rotation.y += Y_SPEED * dt;
    group.rotation.x = 0.25;
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  function onResize() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (w < 1 || h < 1) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', onResize);
  onResize();
  </script>
</body>
