<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DualisCapax — Financial · Emerging AI · Networked Access</title>
<meta name="description" content="DualisCapax: financial and emerging AI networking plane.">
<meta name="theme-color" content="#020203">
<link rel="icon" type="image/svg+xml" href="brand/emblem-helix.svg">
<style>
:root{--font:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace;--gold:#C9A227}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#020203;color:rgba(243,242,239,.92);font-family:var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:56rem;margin:0 auto;padding:1.25rem 1.25rem 3rem}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.25rem;flex-wrap:wrap}
.brand-row img.wordmark{height:36px;width:auto;max-width:min(100%,280px);display:block}
.brand-row img.emblem{height:40px;width:40px;display:block;border-radius:50%}
.pill{font-family:var(--mono);font-size:.55rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(201,162,39,.95);border:1px solid rgba(201,162,39,.45);padding:.2rem .5rem;border-radius:3px}
h1{font-size:clamp(1.5rem,.9rem + 2.2vw,2.2rem);font-weight:600;letter-spacing:-.03em;line-height:1.15;margin-bottom:.65rem;color:#fff}
.lead{font-size:.95rem;line-height:1.55;color:rgba(255,255,255,.55);max-width:40ch;margin-bottom:1.25rem}
.stage-wrap{border:1px solid rgba(255,255,255,.1);border-radius:14px;overflow:hidden;background:#050508;margin-bottom:1rem}
.tour-stage{position:relative;width:100%}
.tour-stage video,.tour-stage canvas{display:block;width:100%;aspect-ratio:16/9;background:#050508}
.meta{padding:.9rem 1rem 1rem}
.tour-step{font-family:var(--mono);font-size:.65rem;letter-spacing:.12em;color:var(--gold)}
.tour-title{display:block;font-size:1.2rem;font-weight:600;margin:.25rem 0 .35rem;color:#fff}
.tour-line{font-size:.9rem;line-height:1.45;color:rgba(255,255,255,.55)}
.controls{display:flex;flex-wrap:wrap;gap:.5rem;padding:0 1rem 1rem}
.controls button{background:transparent;border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.85);padding:.55rem 1rem;border-radius:6px;font-size:.78rem;cursor:pointer}
.beats{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.5rem,1fr));gap:.4rem;padding:0 1rem 1rem}
.beats button{text-align:left;font-size:.68rem;padding:.45rem .55rem;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.7);border-radius:6px;cursor:pointer}
.note{font-size:.75rem;color:rgba(255,255,255,.35);margin:0 0 1.5rem}
nav.links{display:flex;flex-wrap:wrap;gap:.65rem 1.1rem;font-size:.72rem}
nav.links a{color:rgba(255,255,255,.45)}
nav.links a:hover{color:#fff}
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand-row">
      <img class="wordmark" src="brand/wordmark.svg" alt="DualisCapax">
      <img class="emblem" src="brand/emblem-helix.svg" alt="">
      <span class="pill">Living stage</span>
    </div>
    <h1>Same standard. Open research. Adaptive depth.</h1>
    <p class="lead">Financial and emerging-AI networking plane. Your brand. Motion stage below.</p>

    <div id="tour-root" class="stage-wrap">
      <div class="tour-stage"><video playsinline muted loop preload="metadata"></video></div>
      <div class="meta">
        <span class="tour-step"></span>
        <span class="tour-title"></span>
        <p class="tour-line"></p>
      </div>
      <div class="controls">
        <button type="button" data-tour="prev">Back</button>
        <button type="button" data-tour="next">Next</button>
        <button type="button" data-tour="play">Replay beat</button>
      </div>
      <div class="beats" id="beat-list"></div>
    </div>
    <p class="note">Brand mark = DualisCapax wordmark + DNA helix (your lockup). Not an unrelated icon.</p>

    <nav class="links">
      <a href="tour.html">Tour</a>
      <a href="narrative.html">Narrative</a>
      <a href="corporate.html">Corporate</a>
      <a href="ai/">AI</a>
      <a href="research/">Research</a>
      <a href="model.html">Model</a>
    </nav>
  </div>
  <script src="js/video-engine.js"></script>
  <script>
  (function () {
    var eng = new DualisVideoEngine({ root: '#tour-root', mediaBase: 'assets/tour/', autoplay: true }).start();
    document.querySelector('[data-tour=next]').onclick = function () { eng.next(); };
    document.querySelector('[data-tour=prev]').onclick = function () { eng.prev(); };
    document.querySelector('[data-tour=play]').onclick = function () { eng.go(eng.i); };
    var list = document.getElementById('beat-list');
    (window.DUALIS_STORYBOARD_STEPS || []).forEach(function (s, idx) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = (idx + 1) + '. ' + s.title;
      b.onclick = function () { eng.go(idx); };
      list.appendChild(b);
    });
  })();
  </script>
</body>
</html>
