<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>DualisCapax</title>
<meta name="theme-color" content="#000000"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;color:#f3efe6;height:100%;overflow:hidden}
body{font-family:Palatino,"Iowan Old Style","Times New Roman",serif}
a{color:inherit;text-decoration:none}
.leave{position:fixed;top:max(.85rem,env(safe-area-inset-top));right:max(1rem,env(safe-area-inset-right));z-index:8;font:.62rem/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.26em;text-transform:uppercase;color:rgba(243,239,230,.32)}
.leave:hover{color:#fff}
.word{position:fixed;top:max(.85rem,env(safe-area-inset-top));left:max(1rem,env(safe-area-inset-left));z-index:8;font:.62rem/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.26em;text-transform:uppercase;color:rgba(232,195,106,.7)}
.stage{position:relative;height:100dvh;background:#000}
.plate{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.6s ease;filter:saturate(1.05) contrast(1.06)}
.plate.on{opacity:1}
.sigil{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:18vh 12vw;opacity:0;transition:opacity 1.6s ease;filter:drop-shadow(0 0 40px rgba(212,168,72,.35))}
.sigil.on{opacity:1}
.stage::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.2),transparent 30%,rgba(0,0,0,.72));pointer-events:none}
.caption{position:absolute;left:0;right:0;bottom:9vh;z-index:3;text-align:center;font-size:clamp(1.4rem,4vw,2.6rem);letter-spacing:.03em;text-shadow:0 10px 40px #000}
</style>
</head>
<body>
<p class="word">DualisCapax</p>
<a class="leave" href="/leave.html">Leave</a>
<main class="stage" id="stage">
  <img class="sigil on" src="/brand/holo-helix.svg" alt="" data-cap="DNA">
  <img class="plate" src="https://images.unsplash.com/photo-1521791136064-7986c2928956?auto=format&fit=crop&w=1800&q=80" alt="" data-cap="A handshake">
  <img class="plate" src="https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&w=1800&q=80" alt="" data-cap="A life">
  <img class="plate" src="https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1800&q=80" alt="" data-cap="A chip">
  <p class="caption" id="cap">DNA</p>
</main>
<script>
(function(){
  var slides=document.querySelectorAll('.sigil, .plate');
  var cap=document.getElementById('cap');
  var i=0;
  setInterval(function(){
    slides[i].classList.remove('on');
    i=(i+1)%slides.length;
    slides[i].classList.add('on');
    cap.textContent=slides[i].getAttribute('data-cap');
  },5200);
})();
</script>
</body>
</html>
