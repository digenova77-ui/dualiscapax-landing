<style>
@layer reset, base, intro, site, motion;
@layer reset {
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;-webkit-text-size-adjust:100%}
}
@layer base {
  :root{
    color-scheme:dark;
    --fg:#f5f5f5;
    --z-site:1;--z-smoke:35;--z-intro:40;--z-nav:50;
  }
  body{font-family:Inter,system-ui,sans-serif;background:#000;color:var(--fg);overflow:hidden;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
}
@layer intro {
  .intro{position:fixed;inset:0;z-index:var(--z-intro);background:#000;display:flex;align-items:center;justify-content:center}
  .matrix{position:absolute;inset:0;z-index:3;width:100%;height:100%;display:block;pointer-events:none;opacity:0;transition:opacity 0.9s ease}
  .matrix.is-on{opacity:1}
  .matrix.is-fade{opacity:0;transition:opacity 0.7s ease}
  .intro.is-out{opacity:0;pointer-events:none}
  .seed{position:absolute;z-index:2;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#fff;box-shadow:0 0 12px 4px rgba(255,255,255,.95),0 0 40px 12px rgba(200,220,255,.55),0 0 80px 28px rgba(140,180,255,.25);opacity:0;transform:scale(.2);pointer-events:none}
  .seed.is-on{opacity:1;transform:scale(1)}
  .seed.is-bloom{transform:scale(18);opacity:.85}
  .seed.is-gone{opacity:0}
  .intro .skip{position:absolute;right:.75rem;bottom:max(.6rem,env(safe-area-inset-bottom));font-size:.78rem;font-weight:600;color:rgba(255,255,255,.7);background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:.4rem .85rem;cursor:pointer;z-index:4}
  .smoke{position:fixed;inset:0;z-index:var(--z-smoke);pointer-events:none;opacity:0;background:radial-gradient(ellipse 80% 60% at 50% 45%,rgba(180,200,220,.12),transparent 62%),transparent}
  .smoke.is-on{opacity:1}
  .smoke.is-clear{opacity:0}
}
@layer site {
  .site{position:fixed;inset:0;z-index:var(--z-site);opacity:0;visibility:hidden;background:#000;overflow:hidden}
  body.is-live .site{opacity:1;visibility:visible}
  html.land-direct .intro,
  html.land-direct .smoke{display:none!important}
  html.land-direct .site{opacity:1!important;visibility:visible!important}
  .quarks{position:absolute;inset:0;z-index:0;pointer-events:none;width:100%;height:100%;display:block}
  .shell{position:relative;z-index:1;height:100dvh;width:100%;max-width:48rem;margin:0 auto;padding:max(0.55rem,env(safe-area-inset-top)) max(1rem,env(safe-area-inset-right)) max(0.85rem,env(safe-area-inset-bottom)) max(1rem,env(safe-area-inset-left));display:flex;flex-direction:column}
  .topbar{flex-shrink:0;display:flex;justify-content:flex-end;align-items:center;min-height:2.5rem;position:relative;z-index:var(--z-nav)}
  .burger{width:2.5rem;height:2.5rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border-radius:8px;border:1px solid rgba(245,245,245,0.18);background:rgba(0,0,0,0.35)}
  .burger span{display:block;width:1.1rem;height:2px;background:#f5f5f5;border-radius:1px;transition:transform .2s ease,opacity .2s ease}
  .burger[aria-expanded="true"] span:nth-child(1){transform:translateY(7px) rotate(45deg)}
  .burger[aria-expanded="true"] span:nth-child(2){opacity:0}
  .burger[aria-expanded="true"] span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
  .nav-panel{position:absolute;top:calc(100% + 0.35rem);right:0;width:min(18rem,calc(100vw - 2rem));background:#0a0a0a;border:1px solid rgba(245,245,245,0.16);border-radius:12px;padding:0.5rem;box-shadow:0 12px 40px rgba(0,0,0,0.55);opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .18s ease,transform .18s ease,visibility 0s linear .18s;max-height:min(70dvh,28rem);overflow-y:auto}
  .nav-panel.is-open{opacity:1;visibility:visible;transform:translateY(0);transition:opacity .18s ease,transform .18s ease,visibility 0s}
  .nav-panel a{display:block;padding:0.75rem 0.85rem;font-size:1rem;font-weight:700;border-radius:8px}
  .nav-panel a:hover,.nav-panel a:focus-visible{background:rgba(255,255,255,0.06)}
  main{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:stretch;text-align:center}
  .stack{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding-block:clamp(0.6rem,2.5vh,1.4rem);gap:clamp(0.35rem,1.5vh,0.9rem)}
  .logo-stage{width:min(96vw,44rem);height:auto;aspect-ratio:630/160;margin:0;flex-shrink:0}
  .logo-stage img{width:100%;height:100%;object-fit:contain;object-position:center;display:block}
  .geo-wrap{width:min(58vw,200px);height:min(58vw,200px);margin:0;flex-shrink:0}
  #geo-earth{width:100%;height:100%;display:block}
  h1{font-size:clamp(2rem,9vw,3.5rem);font-weight:900;line-height:.9;letter-spacing:-.05em;text-transform:uppercase;margin:0}
  .lines{margin:0}
  .line{display:block;font-size:clamp(1rem,4vw,1.3rem);font-weight:900;color:var(--fg);margin:0 0 0.15rem;text-transform:uppercase;letter-spacing:0.08em;line-height:1.15}
  a.line:active{opacity:0.75}
  .hud{
    width:min(94vw,28rem);flex-shrink:0;
    border:1px solid rgba(126,182,255,0.28);
    border-radius:12px;
    background:linear-gradient(180deg,rgba(126,182,255,0.07),rgba(0,0,0,0.25));
    padding:0.55rem 0.65rem 0.55rem;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,0.35);
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;cursor:default;
  }
  .hud *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .hud-row{display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:0.35rem;align-items:center}
  .hud-cell{text-align:center;padding:0.15rem 0.2rem;min-width:0}
  .hud-cell + .hud-cell{border-left:1px solid rgba(126,182,255,0.18)}
  .hud-k{display:block;font-size:0.7rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:rgba(126,182,255,0.75);margin-bottom:0.15rem}
  .hud-v{display:block;font-size:clamp(0.88rem,3.4vw,1.05rem);font-weight:800;font-variant-numeric:tabular-nums;color:#e8f1ff;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hud-rail{margin-top:0.4rem;height:3px;border-radius:99px;background:rgba(126,182,255,0.12);overflow:hidden}
  .hud-fill{height:100%;width:8%;border-radius:99px;background:linear-gradient(90deg,#4a8fd8,#9ec5ff);box-shadow:0 0 8px rgba(126,182,255,0.55)}
  .hud-foot{margin-top:0.4rem;font-size:0.78rem;letter-spacing:0.03em;color:rgba(245,245,245,0.55);text-align:center;line-height:1.3}
  .jump{flex-shrink:0;margin:0;padding:0.2rem 0.5rem;font-size:clamp(0.95rem,3.5vw,1.1rem);font-weight:800;letter-spacing:0.06em;text-transform:uppercase;color:#e8f1ff;text-decoration:none;border:0;background:none}
  .jump:active{opacity:0.75}
  .jump span{display:block;margin-top:0.25rem;font-size:0.8rem;font-weight:600;letter-spacing:0.04em;text-transform:none;color:rgba(245,245,245,0.55)}
  .iris-mark{position:absolute;right:max(0.75rem,env(safe-area-inset-right));bottom:max(0.6rem,env(safe-area-inset-bottom));z-index:var(--z-nav);font-size:.78rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:rgba(245,245,245,.62)}
  .iris-mark:active{opacity:.75}
}
@layer motion {
  .intro{transition:opacity 2.4s ease}
  .seed{transition:opacity .5s ease,transform 1.1s cubic-bezier(.22,1,.36,1)}
  .seed.is-bloom{transition:opacity .9s ease,transform 1.35s cubic-bezier(.22,1,.36,1)}
  .seed.is-gone{transition:opacity .6s ease}
  .smoke{transition:opacity 2s ease}
  .smoke.is-clear{transition:opacity 2s ease}
  .site{transition:opacity 2.4s ease,visibility 0s linear 2.4s}
  body.is-live .site{transition:opacity 2.4s ease,visibility 0s}
}
</style>

<script>
(function(){
  var burger=document.getElementById('burger');
  var panel=document.getElementById('nav-panel');
  if(!burger||!panel)return;
  function setOpen(open){
    burger.setAttribute('aria-expanded',open?'true':'false');
    burger.setAttribute('aria-label',open?'Close menu':'Open menu');
    panel.classList.toggle('is-open',open);
    if(open)panel.removeAttribute('hidden');else panel.setAttribute('hidden','');
  }
  burger.addEventListener('click',function(e){e.stopPropagation();setOpen(burger.getAttribute('aria-expanded')!=='true')});
  document.addEventListener('click',function(e){if(!panel.classList.contains('is-open'))return;if(panel.contains(e.target)||burger.contains(e.target))return;setOpen(false)});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')setOpen(false)});
})();
</script>

<script type="module">
import * as THREE from 'three';
const canvas=document.getElementById('geo-earth');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.setSize(canvas.clientWidth,canvas.clientHeight,false);
renderer.setClearColor(0x000000,0);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(36,1,0.1,20);
camera.position.z=3.55;
scene.add(new THREE.AmbientLight(0xffffff,0.65));
const key=new THREE.DirectionalLight(0xffffff,1.2);key.position.set(2.4,1.6,3);scene.add(key);
const geo=new THREE.IcosahedronGeometry(0.92,2);
const body=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0x6a7a88,flatShading:true,metalness:0.35,roughness:0.35,transparent:true,opacity:0.55,depthWrite:false}));
const wire=new THREE.LineSegments(new THREE.EdgesGeometry(geo,1),new THREE.LineBasicMaterial({color:0xd0d8e0,transparent:true,opacity:0.7}));
const group=new THREE.Group();group.add(body);group.add(wire);scene.add(group);
let last=performance.now();
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;group.rotation.y+=(Math.PI*2/22)*dt;group.rotation.x=0.25;renderer.render(scene,camera);requestAnimationFrame(frame)}
requestAnimationFrame(frame);
function onResize(){const w=canvas.clientWidth,h=canvas.clientHeight;if(w<1||h<1)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
window.addEventListener('resize',onResize);onResize();
</script>
<script>
(function(){
  var LAUNCH_MS = Date.UTC(2026, 7, 24, 0, 0, 0);
  var BASE_SINGULARITY_MS = Date.UTC(2036, 7, 24, 0, 0, 0);
  var CAD_PER_DAY = 1000;
  var MAX_ADVANCE_DAYS = 3650;
  var PLEDGED_CAD = 0;
  var EARNED_CAD = 0;
  var upEl = document.getElementById('uptime');
  var earnedEl = document.getElementById('earned');
  var singEl = document.getElementById('singularity-cd');
  var pegEl = document.getElementById('peg-clock');
  var hudFoot = document.getElementById('hud-foot');
  var hudFill = document.getElementById('hud-fill');
  function pad(n){ return String(n).padStart(2,'0'); }
  function fmtMoney(n){
    try { return 'CAD $' + Number(n).toLocaleString('en-CA', { maximumFractionDigits: 0 }); }
    catch(e){ return 'CAD $' + n; }
  }
  function fmtUptime(ms){
    if (ms < 0) ms = 0;
    var s = Math.floor(ms / 1000);
    var d = Math.floor(s / 86400); s %= 86400;
    var h = Math.floor(s / 3600); s %= 3600;
    var m = Math.floor(s / 60); s %= 60;
    if (d > 0) return d + 'd ' + pad(h) + 'h ' + pad(m) + 'm';
    return pad(h) + ':' + pad(m) + ':' + pad(s);
  }
  function fmtCountdown(ms){
    if (ms <= 0) return 'NOW';
    var s = Math.floor(ms / 1000);
    var d = Math.floor(s / 86400); s %= 86400;
    var h = Math.floor(s / 3600); s %= 3600;
    var m = Math.floor(s / 60); s %= 60;
    if (d > 365) {
      var y = Math.floor(d / 365);
      var rd = d % 365;
      return y + 'y ' + rd + 'd ' + pad(h) + 'h';
    }
    if (d > 0) return d + 'd ' + pad(h) + 'h ' + pad(m) + 'm';
    return pad(h) + ':' + pad(m) + ':' + pad(s);
  }
  function ageLabel(ms){
    var d = Math.floor(ms / 86400000);
    if (d < 1) return 'Day one · zero earned is normal';
    if (d < 7) return d + ' days old · still early residual';
    if (d < 30) return d + ' days · zero still means no close yet';
    if (d < 180) return d + ' days · earned should start matching age';
    return d + ' days · scale should be visible on the ledger';
  }
  function singularityMs(pledged){
    var advanceDays = Math.min(MAX_ADVANCE_DAYS, Math.floor(Math.max(0, pledged) / CAD_PER_DAY));
    var target = BASE_SINGULARITY_MS - advanceDays * 86400000;
    var floor = Date.now() + 30 * 86400000;
    if (target < floor) target = floor;
    return target;
  }
  function tick(){
    var now = Date.now();
    var age = now - LAUNCH_MS;
    if (upEl) upEl.textContent = fmtUptime(age);
    if (earnedEl) earnedEl.textContent = EARNED_CAD === 0 ? 'CAD $0' : fmtMoney(EARNED_CAD);
    var target = singularityMs(PLEDGED_CAD);
    var left = target - now;
    var cd = fmtCountdown(left);
    if (singEl) singEl.textContent = cd;
    if (pegEl) pegEl.textContent = cd;
    if (hudFoot) hudFoot.textContent = ageLabel(age);
    if (hudFill) {
      var d = Math.floor(age / 86400000);
      var pct = Math.min(92, 6 + d * 1.2 + Math.min(40, PLEDGED_CAD / 500));
      hudFill.style.width = pct + '%';
    }
  }
  tick();
  setInterval(tick, 1000);
})();
</script>
<script>
(function(){
  var canvas = document.getElementById('quarks');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  if (!ctx) return;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0;
  var N = 48;
  var pts = [];
  function resize(){
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function seed(){
    pts = [];
    for (var i = 0; i < N; i++) {
      pts.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: 0.6 + Math.random() * 1.8,
        vx: (Math.random() - 0.5) * 0.15,
        vy: (Math.random() - 0.5) * 0.12,
        phase: Math.random() * Math.PI * 2,
        speed: 0.008 + Math.random() * 0.02
      });
    }
  }
  function frame(){
    if (!document.body.classList.contains('is-live')) {
      requestAnimationFrame(frame);
      return;
    }
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < pts.length; i++) {
      var p = pts[i];
      p.phase += p.speed;
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < -10) p.x = W + 10;
      if (p.x > W + 10) p.x = -10;
      if (p.y < -10) p.y = H + 10;
      if (p.y > H + 10) p.y = -10;
      var pulse = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(p.phase));
      var r = p.r * (0.7 + 0.5 * pulse);
      var g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 4);
      g.addColorStop(0, 'rgba(158,197,255,' + (0.85 * pulse) + ')');
      g.addColorStop(0.35, 'rgba(74,143,216,' + (0.35 * pulse) + ')');
      g.addColorStop(1, 'rgba(74,143,216,0)');
      ctx.beginPath();
      ctx.fillStyle = g;
      ctx.arc(p.x, p.y, r * 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.fillStyle = 'rgba(232,241,255,' + (0.9 * pulse) + ')';
      ctx.arc(p.x, p.y, r * 0.45, 0, Math.PI * 2);
      ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  resize();
  seed();
  window.addEventListener('resize', function(){ resize(); seed(); });
  requestAnimationFrame(frame);
})();
</script>
