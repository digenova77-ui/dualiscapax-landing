<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DualisCapax</title>
  <meta name="description" content="Residual Law Finance. Cutting Edge Technology. Adaptive AI. Research." />
  <meta name="theme-color" content="#050505" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #050505;
      --fg: #f5f5f5;
      --fg-muted: rgba(245, 245, 245, 0.75);
      --fg-soft: rgba(245, 245, 245, 0.72);
      --quark: #7eb6ff;
      --quark-glow: rgba(126, 182, 255, 0.9);
      --quark-glow-soft: rgba(90, 150, 255, 0.4);
      --nav: var(--fg-muted);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; -webkit-text-size-adjust: 100%; }
    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: #000;
      color: var(--fg);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    a { color: inherit; text-decoration: none; }

    /* —— NASA intro layer —— */
    .intro {
      position: fixed; inset: 0; z-index: 40;
      background: #000;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 1.1s ease;
    }
    .intro.is-out { opacity: 0; pointer-events: none; }
    .intro video {
      width: 100%; height: 100%;
      object-fit: cover;
      background: #000;
    }
    .intro .credit {
      position: absolute; left: 0.75rem; bottom: max(0.6rem, env(safe-area-inset-bottom));
      font-size: 0.65rem; letter-spacing: 0.04em;
      color: rgba(255,255,255,0.45);
      pointer-events: none;
    }
    .intro .skip {
      position: absolute; right: 0.75rem; bottom: max(0.6rem, env(safe-area-inset-bottom));
      font-size: 0.78rem; font-weight: 600;
      color: rgba(255,255,255,0.7);
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 999px;
      padding: 0.4rem 0.85rem;
      cursor: pointer;
    }

    /* smoke veil between NASA and site */
    .smoke {
      position: fixed; inset: 0; z-index: 35;
      pointer-events: none;
      opacity: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 45%, rgba(180,200,220,0.18), transparent 60%),
        radial-gradient(ellipse 50% 40% at 30% 60%, rgba(255,255,255,0.08), transparent 55%),
        radial-gradient(ellipse 50% 40% at 70% 40%, rgba(120,160,220,0.1), transparent 55%),
        #000;
      transition: opacity 0.9s ease;
    }
    .smoke.is-on { opacity: 1; }
    .smoke.is-clear { opacity: 0; transition: opacity 1.4s ease; }

    /* site stays hidden until intro hands off */
    .site {
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    body.is-live .site { opacity: 1; }

    .quark-field {
      position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
      opacity: 0;
    }
    body.is-live .quark-field {
      animation: fieldIn 1.6s ease-out 0.15s forwards;
    }
    @keyframes fieldIn { to { opacity: 1; } }

    .quark {
      position: absolute; width: 2px; height: 2px; border-radius: 50%;
      background: var(--quark);
      box-shadow: 0 0 5px 1px var(--quark-glow), 0 0 12px 3px var(--quark-glow-soft);
      animation: quarkSpark 2.8s ease-in-out infinite;
    }
    .quark:nth-child(1)  { left: 8%;  top: 12%; animation-delay: 0s; }
    .quark:nth-child(2)  { left: 22%; top: 28%; width: 1.5px; height: 1.5px; animation-delay: 0.4s; }
    .quark:nth-child(3)  { left: 41%; top: 9%;  animation-delay: 0.9s; }
    .quark:nth-child(4)  { left: 63%; top: 18%; width: 1.5px; height: 1.5px; animation-delay: 0.2s; }
    .quark:nth-child(5)  { left: 78%; top: 11%; animation-delay: 1.3s; }
    .quark:nth-child(6)  { left: 91%; top: 24%; width: 1.5px; height: 1.5px; animation-delay: 1.8s; }
    .quark:nth-child(7)  { left: 14%; top: 48%; width: 1px; height: 1px; animation-delay: 0.7s; }
    .quark:nth-child(8)  { left: 33%; top: 56%; animation-delay: 1.1s; }
    .quark:nth-child(9)  { left: 52%; top: 42%; width: 1.5px; height: 1.5px; animation-delay: 1.6s; }
    .quark:nth-child(10) { left: 71%; top: 51%; animation-delay: 0.5s; }
    .quark:nth-child(11) { left: 88%; top: 58%; width: 1px; height: 1px; animation-delay: 2.0s; }
    .quark:nth-child(12) { left: 6%;  top: 72%; animation-delay: 1.4s; }
    .quark:nth-child(13) { left: 27%; top: 81%; width: 1.5px; height: 1.5px; animation-delay: 0.3s; }
    .quark:nth-child(14) { left: 48%; top: 68%; width: 1px; height: 1px; animation-delay: 2.2s; }
    .quark:nth-child(15) { left: 66%; top: 84%; animation-delay: 1.0s; }
    .quark:nth-child(16) { left: 84%; top: 76%; width: 1.5px; height: 1.5px; animation-delay: 1.7s; }
    .quark:nth-child(17) { left: 18%; top: 38%; width: 1px; height: 1px; animation-delay: 2.4s; }
    .quark:nth-child(18) { left: 57%; top: 22%; animation-delay: 1.2s; }
    .quark:nth-child(19) { left: 39%; top: 91%; width: 1.5px; height: 1.5px; animation-delay: 0.6s; }
    .quark:nth-child(20) { left: 95%; top: 88%; width: 1px; height: 1px; animation-delay: 1.9s; }
    .quark:nth-child(21) { left: 45%; top: 5%; width: 1.5px; height: 1.5px; animation-delay: 0.8s; }
    .quark:nth-child(22) { left: 12%; top: 90%; animation-delay: 2.1s; }
    .quark:nth-child(23) { left: 75%; top: 35%; width: 1px; height: 1px; animation-delay: 1.5s; }
    .quark:nth-child(24) { left: 28%; top: 15%; animation-delay: 0.1s; }
    @keyframes quarkSpark {
      0%, 100% { opacity: 0.15; transform: scale(0.7); }
      40% { opacity: 1; transform: scale(1.35); }
      55% { opacity: 0.35; transform: scale(0.9); }
      70% { opacity: 0.9; transform: scale(1.2); }
    }

    .shell {
      position: relative; z-index: 1;
      height: 100dvh; height: 100svh;
      max-width: 48rem; margin: 0 auto;
      padding: max(0.75rem, env(safe-area-inset-top)) 1rem max(0.85rem, env(safe-area-inset-bottom));
      display: flex; flex-direction: column;
    }

    .arrive {
      opacity: 0;
      filter: blur(10px);
      transform: translateY(14px) scale(0.96);
    }
    body.is-live .arrive {
      animation: arriveIn 1.15s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes arriveIn {
      to { opacity: 1; filter: blur(0); transform: translateY(0) scale(1); }
    }

    header { flex: 0 0 auto; }
    header nav {
      display: flex; justify-content: space-between; align-items: center;
      width: 100%; gap: 0.35rem;
    }
    header nav a {
      font-size: 0.88rem; font-weight: 600;
      color: var(--nav); letter-spacing: 0.01em;
      white-space: nowrap;
      opacity: 0;
    }
    body.is-live header nav a {
      animation: arriveIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    body.is-live header nav a:nth-child(1) { animation-delay: 3.4s; }
    body.is-live header nav a:nth-child(2) { animation-delay: 3.55s; }
    body.is-live header nav a:nth-child(3) { animation-delay: 3.7s; }

    main {
      flex: 1 1 auto;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; min-height: 0;
      padding: 0.2rem 0;
    }

    /* logo + geo stacked, centered as one unit */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .logo-stage {
      position: relative;
      /* ~1.7× previous logo footprint */
      width: min(96vw, 44rem);
      height: clamp(8.5rem, 34vw, 13.2rem);
      margin: 0 0 0.15rem;
      flex-shrink: 0;
      opacity: 0;
    }
    body.is-live .logo-stage {
      animation: logoFrameIn 0.5s ease-out 0.05s forwards;
    }
    @keyframes logoFrameIn { to { opacity: 1; } }

    .logo-stage canvas,
    .logo-stage img.logo-exact {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }
    .logo-stage img.logo-exact {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.9s ease;
      z-index: 2;
    }
    .logo-stage img.logo-exact.is-on { opacity: 1; }
    .logo-stage canvas { z-index: 1; }

    .geo-wrap {
      width: min(48vw, 168px);
      height: min(48vw, 168px);
      margin: 0.1rem 0 0.9rem;
      flex-shrink: 0;
      overflow: visible;
      background: transparent;
    }
    #geo-earth {
      width: 100%; height: 100%;
      display: block;
      background: transparent;
    }

    h1 {
      font-size: clamp(2.4rem, 10vw, 4.2rem); font-weight: 900;
      line-height: 0.9; letter-spacing: -0.05em; text-transform: uppercase;
      margin: 0 0 0.55rem;
      color: var(--fg);
    }
    body.is-live h1.arrive { animation-delay: 2.85s; }

    .lines {
      display: flex; flex-direction: column; align-items: center;
      max-width: 18rem;
      margin: 0 auto;
    }
    .line {
      font-size: clamp(0.95rem, 3.2vw, 1.12rem); font-weight: 600;
      color: var(--fg-soft); line-height: 1.35; margin: 0 0 0.1rem;
      opacity: 0;
      filter: blur(8px);
      transform: translateY(10px);
    }
    body.is-live .line {
      animation: arriveIn 0.95s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    body.is-live .line:nth-child(1) { animation-delay: 3.05s; }
    body.is-live .line:nth-child(2) { animation-delay: 3.2s; }
    body.is-live .line:nth-child(3) { animation-delay: 3.35s; }
    body.is-live .line:nth-child(4) { animation-delay: 3.5s; }

    @media (max-height: 700px) {
      .logo-stage { height: clamp(6.5rem, 26vw, 10rem); }
      .geo-wrap { width: min(38vw, 130px); height: min(38vw, 130px); margin-bottom: 0.55rem; }
      h1 { font-size: clamp(2rem, 8vw, 3rem); margin-bottom: 0.4rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .intro, .smoke { display: none !important; }
      .site, .quark-field, .logo-stage, .arrive, header nav a, .line {
        opacity: 1 !important; animation: none !important; filter: none !important; transform: none !important;
      }
      .logo-stage img.logo-exact { opacity: 1 !important; }
    }
  </style>

  <script>
  (function introGate() {
    const intro = document.getElementById('intro');
    const video = document.getElementById('nasa-bb');
    const smoke = document.getElementById('smoke');
    const skip = document.getElementById('skip-intro');
    let done = false;

    function startSite() {
      if (done) return;
      done = true;
      smoke.classList.add('is-on');
      intro.classList.add('is-out');
      setTimeout(function () {
        document.body.classList.add('is-live');
        window.dispatchEvent(new Event('site-live'));
        smoke.classList.add('is-clear');
        setTimeout(function () {
          intro.remove();
          smoke.remove();
        }, 1600);
      }, 700);
    }

    skip.addEventListener('click', function () {
      try { video.pause(); } catch (e) {}
      startSite();
    });

    video.addEventListener('ended', startSite);
    video.addEventListener('error', startSite);

    /* safety: if video stalls, still open the site */
    setTimeout(function () {
      if (!done && video.readyState < 2) startSite();
    }, 8000);
    setTimeout(function () {
      if (!done) startSite();
    }, 22000);

    var p = video.play();
    if (p && p.catch) p.catch(function () { /* autoplay blocked — user can skip */ });
  })();
  </script>

  <script>
  (function logoParticles() {
    const canvas = document.getElementById('logo-particles');
    const exact = document.getElementById('logo-exact');
    const ctx = canvas.getContext('2d');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const LOGO_SRC = 'brand/logo-dna-x.svg';

    let particles = [], orbiters = [], start = null, logoImg = null, settled = false, running = false;
    const ASSEMBLE_MS = 3600;

    function loadLogo() {
      return new Promise(function (resolve) {
        const img = new Image();
        img.onload = function () { logoImg = img; resolve(img); };
        img.onerror = function () { resolve(null); };
        img.src = LOGO_SRC;
      });
    }

    function sampleFromExact() {
      const w = canvas.clientWidth || 360;
      const h = canvas.clientHeight || 90;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const off = document.createElement('canvas');
      off.width = Math.floor(w * dpr);
      off.height = Math.floor(h * dpr);
      const o = off.getContext('2d');
      o.setTransform(dpr, 0, 0, dpr, 0, 0);
      o.clearRect(0, 0, w, h);
      if (logoImg) {
        const ar = 900 / 200;
        let dw = w, dh = w / ar;
        if (dh > h) { dh = h; dw = h * ar; }
        o.drawImage(logoImg, (w - dw) / 2, (h - dh) / 2, dw, dh);
      }
      const data = o.getImageData(0, 0, off.width, off.height).data;
      const targets = [];
      const step = Math.max(1, Math.floor(1.25 * dpr));
      for (let y = 0; y < off.height; y += step) {
        for (let x = 0; x < off.width; x += step) {
          const i = (y * off.width + x) * 4;
          if (data[i + 3] < 40) continue;
          const r = data[i], g = data[i + 1], b = data[i + 2];
          targets.push({ x: x / dpr, y: y / dpr, dna: b > 160 && g > 140 && r < 140 });
        }
      }
      targets.sort(function (a, b) { return a.x - b.x || a.y - b.y; });
      return { targets: targets, w: w, h: h };
    }

    function rebuild() {
      settled = false;
      exact.classList.remove('is-on');
      const sample = sampleFromExact();
      const targets = sample.targets, w = sample.w, h = sample.h, n = targets.length;
      particles = targets.map(function (t, i) {
        const rank = n <= 1 ? 0 : i / (n - 1);
        const angle = Math.random() * Math.PI * 2;
        const dist = (0.4 + Math.random() * 1.1) * Math.max(w, h);
        return {
          tx: t.x, ty: t.y,
          x: w / 2 + Math.cos(angle) * dist,
          y: h / 2 + Math.sin(angle) * dist,
          r: t.dna ? 1.05 + Math.random() * 1.1 : 0.9 + Math.random() * 1.1,
          phase: Math.random() * Math.PI * 2,
          bright: 0.8 + Math.random() * 0.2,
          rank: rank, dna: t.dna
        };
      });
      const cx = w / 2, cy = h / 2;
      orbiters = [];
      for (let i = 0; i < 36; i++) {
        const radius = (0.32 + Math.random() * 0.4) * Math.min(w, h * 2.1);
        orbiters.push({
          a: (i / 36) * Math.PI * 2 + Math.random() * 0.35,
          speed: 0.0003 + Math.random() * 0.0005,
          rx: radius * (0.9 + Math.random() * 0.3),
          ry: radius * (0.32 + Math.random() * 0.22),
          cx: cx + (Math.random() - 0.5) * w * 0.06,
          cy: cy + (Math.random() - 0.5) * h * 0.1,
          r: 0.9 + Math.random() * 1.3,
          phase: Math.random() * Math.PI * 2,
          flash: Math.random() * Math.PI * 2,
          flashSpeed: 0.002 + Math.random() * 0.0035
        });
      }
      start = performance.now();
    }

    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
    function smoothstep(a, b, x) {
      const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
      return t * t * (3 - 2 * t);
    }

    function frame(now) {
      if (!running) return;
      if (start == null) start = now;
      const w = canvas.clientWidth, h = canvas.clientHeight;
      ctx.clearRect(0, 0, w, h);
      const t = Math.min(1, (now - start) / ASSEMBLE_MS);
      const density = easeOutCubic(t);
      const front = density * 1.15;
      const shine = smoothstep(0.7, 1, t);
      const glisten = smoothstep(0.85, 1, t);
      if (!settled && t >= 0.92) { settled = true; exact.classList.add('is-on'); }
      const coreFade = settled ? 0.22 : 1;

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        const local = smoothstep(p.rank - 0.08, p.rank + 0.02, front);
        if (local <= 0.001) continue;
        const pull = 0.05 + local * 0.2;
        p.x += (p.tx - p.x) * pull;
        p.y += (p.ty - p.y) * pull;
        const pulse = 0.85 + 0.15 * Math.sin(now * 0.0035 + p.phase);
        const alpha = Math.min(1, local * p.bright * pulse * (0.55 + 0.45 * density) * coreFade);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * (0.7 + 0.3 * local), 0, Math.PI * 2);
        if (p.dna) {
          ctx.fillStyle = 'rgba(0, 212, 232, ' + alpha + ')';
          ctx.shadowColor = 'rgba(0, 212, 232, ' + (0.4 * alpha) + ')';
        } else {
          ctx.fillStyle = 'rgba(245, 245, 245, ' + alpha + ')';
          ctx.shadowColor = 'rgba(200, 220, 255, ' + (0.25 * alpha) + ')';
        }
        ctx.shadowBlur = 2 + 2 * shine;
        ctx.fill();
      }
      if (glisten > 0.01) {
        for (let i = 0; i < orbiters.length; i++) {
          const o = orbiters[i];
          o.a += o.speed * 16;
          const flash = Math.pow(0.5 + 0.5 * Math.sin(now * o.flashSpeed + o.flash), 10);
          const pulse = 0.5 + 0.5 * Math.sin(now * 0.003 + o.phase);
          const alpha = glisten * (0.2 + 0.8 * flash) * (0.5 + 0.5 * pulse) * 0.9;
          ctx.beginPath();
          ctx.arc(o.cx + Math.cos(o.a) * o.rx, o.cy + Math.sin(o.a) * o.ry, o.r * (0.55 + flash), 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(220, 240, 255, ' + alpha + ')';
          ctx.shadowColor = 'rgba(160, 210, 255, ' + (0.7 * alpha) + ')';
          ctx.shadowBlur = 3 + 10 * flash;
          ctx.fill();
        }
      }
      ctx.shadowBlur = 0;
      requestAnimationFrame(frame);
    }

    function begin() {
      if (running) return;
      running = true;
      rebuild();
      requestAnimationFrame(frame);
    }

    loadLogo().then(function () {
      if (document.body.classList.contains('is-live')) begin();
    });
    window.addEventListener('site-live', begin);
    window.addEventListener('resize', function () {
      clearTimeout(window.__logoResize);
      window.__logoResize = setTimeout(function () { if (running) rebuild(); }, 120);
    });
  })();
  </script>

  <script type="module">
  import * as THREE from 'three';

  const canvas = document.getElementById('geo-earth');
  const renderer = new THREE.WebGLRenderer({
    canvas, antialias: true, alpha: true,
    powerPreference: 'high-performance', premultipliedAlpha: false
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);
  renderer.setClearColor(0x000000, 0);
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 20);
  camera.position.z = 3.55;
  scene.add(new THREE.AmbientLight(0xffffff, 0.65));
  const key = new THREE.DirectionalLight(0xffffff, 1.2);
  key.position.set(2.4, 1.6, 3.0); scene.add(key);
  const fill = new THREE.DirectionalLight(0x8899aa, 0.5);
  fill.position.set(-2, -0.5, 1.5); scene.add(fill);

  const geo = new THREE.IcosahedronGeometry(0.92, 2);
  const bodyMat = new THREE.MeshStandardMaterial({
    color: 0x6a7a88, flatShading: true, metalness: 0.35, roughness: 0.35,
    transparent: true, opacity: 0.55, depthWrite: false,
    emissive: 0xffffff, emissiveIntensity: 0
  });
  const body = new THREE.Mesh(geo, bodyMat);
  const wireMat = new THREE.LineBasicMaterial({ color: 0xd0d8e0, transparent: true, opacity: 0 });
  const wire = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 1), wireMat);
  wire.scale.setScalar(1.002);
  const wireOuterMat = new THREE.LineBasicMaterial({ color: 0x8a98a8, transparent: true, opacity: 0 });
  const wireOuter = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(0.97, 1), 1), wireOuterMat
  );
  const pointsMat = new THREE.PointsMaterial({
    color: 0xe8ecf0, size: 0.032, sizeAttenuation: true, transparent: true, opacity: 0
  });
  const points = new THREE.Points(geo.clone(), pointsMat);

  const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 1, depthWrite: false });
  const core = new THREE.Mesh(new THREE.SphereGeometry(0.12, 24, 24), coreMat);
  const haloMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.55, depthWrite: false });
  const halo = new THREE.Mesh(new THREE.SphereGeometry(0.22, 24, 24), haloMat);

  const group = new THREE.Group();
  group.add(core); group.add(halo); group.add(body); group.add(wire); group.add(wireOuter); group.add(points);
  scene.add(group);

  const FLASH_MS = 420, ZOOM_MS = 1100;
  let birthStart = null;
  let last = performance.now();
  const Y_SPEED = (Math.PI * 2) / 22;

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
  function smoothstep(a, b, x) {
    const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
    return t * t * (3 - 2 * t);
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    let scale = 0.001, coreOpacity = 0, haloOpacity = 0, meshOpacity = 0, wireOpacity = 0, emissive = 0;

    if (birthStart != null) {
      const since = now - birthStart;
      const flashT = Math.min(1, since / FLASH_MS);
      const zoomT = Math.min(1, Math.max(0, (since - FLASH_MS) / ZOOM_MS));
      const flashPulse = Math.sin(flashT * Math.PI * 3.2) * (1 - flashT * 0.35);
      const flashBoost = Math.max(0, flashPulse) * (1 - zoomT);
      const seedScale = 0.045 + flashBoost * 0.04;
      scale = seedScale + (1 - seedScale) * easeOutCubic(zoomT);
      coreOpacity = (0.95 + 0.05 * flashBoost) * (1 - smoothstep(0.35, 0.95, zoomT));
      haloOpacity = (0.5 + 0.45 * flashBoost) * (1 - smoothstep(0.2, 0.85, zoomT));
      meshOpacity = 0.55 * smoothstep(0.15, 0.75, zoomT);
      wireOpacity = 0.7 * smoothstep(0.25, 0.9, zoomT);
      emissive = (2.8 + 4.5 * flashBoost) * (1 - smoothstep(0.4, 1, zoomT)) + 0.35 * smoothstep(0.6, 1, zoomT);
    }

    group.scale.setScalar(scale);
    group.rotation.y += Y_SPEED * dt;
    group.rotation.x = 0.25;
    coreMat.opacity = coreOpacity;
    haloMat.opacity = haloOpacity;
    bodyMat.opacity = meshOpacity;
    bodyMat.emissiveIntensity = emissive;
    wireMat.opacity = wireOpacity;
    wireOuterMat.opacity = wireOpacity * 0.55;
    pointsMat.opacity = wireOpacity * 0.9;
    core.visible = coreOpacity > 0.01;
    halo.visible = haloOpacity > 0.01;
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function onLive() {
    /* geo birth slightly after logo starts assembling */
    setTimeout(function () { birthStart = performance.now(); }, 2200);
  }
  if (document.body.classList.contains('is-live')) onLive();
  window.addEventListener('site-live', onLive);

  function onResize() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (w < 1 || h < 1) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', onResize);
  onResize();
  </script>
</body>
</html>
