<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DualisCapax</title>
  <meta name="description" content="No tribes preferred. Truth prevails." />
  <meta name="theme-color" content="#020206" />
  <link rel="icon" href="brand/emblem-helix.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #020206;
      color: #f4f4f5;
      font-family: Inter, system-ui, sans-serif;
    }
    #stage {
      position: fixed; inset: 0;
      width: 100vw; height: 100dvh;
      display: block; z-index: 0;
    }

    .hud {
      position: fixed; inset: 0; z-index: 2;
      pointer-events: none;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding:
        calc(0.8rem + env(safe-area-inset-top))
        0.85rem
        calc(0.9rem + env(safe-area-inset-bottom));
      gap: 0.75rem;
    }
    .hud a, .hud button { pointer-events: auto; }

    .glass {
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(10, 12, 20, 0.42);
      backdrop-filter: blur(18px) saturate(1.2);
      -webkit-backdrop-filter: blur(18px) saturate(1.2);
      box-shadow: 0 10px 40px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.06);
    }

    /* Tier 1 — nav plane */
    .tier-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      padding: 0.65rem 0.75rem;
      border-radius: 18px;
      transform: translateY(-12px);
      opacity: 0;
      animation: slideIn 0.7s ease forwards 0.1s;
    }
    .brand {
      font-weight: 800;
      font-size: clamp(1.05rem, 3.6vw, 1.35rem);
      letter-spacing: -0.03em;
      text-decoration: none;
      color: #fff;
      white-space: nowrap;
    }
    .menu {
      display: flex; flex-direction: row; flex-wrap: nowrap; gap: 0.35rem;
    }
    .menu a {
      text-decoration: none;
      color: rgba(255,255,255,0.88);
      font-size: clamp(0.72rem, 2.4vw, 0.88rem);
      font-weight: 600;
      padding: 0.45rem 0.62rem;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
      white-space: nowrap;
    }

    /* Tier 2 — center breath */
    .tier-core {
      display: grid;
      place-items: center;
      text-align: center;
      pointer-events: none;
    }
    .core-copy {
      transform: translateY(18px);
      opacity: 0;
      animation: slideIn 0.8s ease forwards 0.25s;
    }
    .kicker {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      margin-bottom: 0.45rem;
    }
    .headline {
      font-size: clamp(2rem, 8vw, 3.4rem);
      line-height: 0.98;
      font-weight: 800;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      text-shadow: 0 10px 40px rgba(0,0,0,0.55);
    }

    /* Tier 3 — action plane */
    .tier-actions {
      display: grid;
      gap: 0.55rem;
      padding: 0.8rem;
      border-radius: 20px;
      transform: translateY(16px);
      opacity: 0;
      animation: slideIn 0.7s ease forwards 0.4s;
    }
    .tier-actions p {
      font-size: 0.86rem;
      color: rgba(255,255,255,0.62);
      text-align: center;
    }
    .row {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .row a, .row button {
      font: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      text-decoration: none;
      border-radius: 999px;
      padding: 0.7rem 1rem;
      border: 1px solid rgba(255,255,255,0.14);
      cursor: pointer;
    }
    .primary {
      background: #fff;
      color: #0a0a0c;
      border-color: #fff;
    }
    .ghost {
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.9);
    }

    @keyframes slideIn {
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>
  <canvas id="stage" aria-hidden="true"></canvas>

  <div class="hud">
    <div class="tier-nav glass">
      <a class="brand" href="index.html">DualisCapax</a>
      <nav class="menu">
        <a href="corporate.html">Financial</a>
        <a href="research/">Research</a>
        <a href="ai/chat.html">AI</a>
      </nav>
    </div>

    <div class="tier-core">
      <div class="core-copy">
        <div class="kicker">No Tribes Preferred</div>
        <h1 class="headline">Truth Prevails.</h1>
      </div>
    </div>

    <div class="tier-actions glass">
      <p>Open research free · Depth prepaid · Same rules</p>
      <div class="row">
        <a class="primary" href="ai/chat.html">Enter AI</a>
        <a class="ghost" href="pay.html">Fuel</a>
        <a class="ghost" href="faq.html">FAQ</a>
      </div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
  <script type="module">
    import { startPlaneStage } from './js/plane-stage.js?v=1';
    startPlaneStage(document.getElementById('stage'));
  </script>
</body>
</html>
