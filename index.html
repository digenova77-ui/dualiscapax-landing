<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DualisCapax</title>
<meta name="theme-color" content="#04060c">
<link rel="icon" href="brand/seal.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark;--bg:#04060c;--iris:#8eb4c8;--text:#e8eef2;--mute:#8b99a4;--line:rgba(200,220,230,.16);--glass:rgba(18,24,32,.6);--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",sans-serif;--serif:Georgia,serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans)}
header{position:fixed;inset-block-start:0;inset-inline:0;z-index:20;display:flex;align-items:center;gap:.5rem;padding:calc(.45rem + env(safe-area-inset-top,0px)) .75rem .45rem;background:var(--glass);backdrop-filter:blur(16px);border-block-end:1px solid var(--line)}
.brand{letter-spacing:.16em;font-size:.68rem;margin-inline-end:auto;color:inherit;text-decoration:none}
.chip{border:1px solid var(--iris);color:var(--iris);border-radius:999px;padding:.2rem .55rem;font-size:.72rem}
.wrap{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:5rem .9rem 5.2rem;text-align:center}
h1{font-family:var(--serif);font-size:clamp(1.7rem,6vw,2.8rem);margin:.2rem 0;font-weight:600}
.lead{color:var(--mute);max-width:34rem}
.stack{width:min(94vw,36rem);display:flex;flex-direction:column;gap:.5rem;margin-top:1rem;text-align:start}
.card{background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:14px;padding:.75rem .9rem}
.card h2{margin:0 0 .25rem;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--iris)}
.row{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.45rem}
a.btn,button.btn{display:inline-block;padding:.48rem .85rem;border-radius:999px;background:var(--iris);color:#061018;text-decoration:none;border:0;font-weight:700;font-size:.84rem}
.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.dock{position:fixed;inset-inline:0;inset-block-end:0;z-index:20;display:flex;justify-content:center;gap:.3rem;flex-wrap:wrap;padding:.4rem .5rem calc(.5rem + env(safe-area-inset-bottom,0px));background:var(--glass)}
</style>
</head>
<body>
<header>
  <a class="brand" href="dash.html">DUALISCAPAX</a>
  <span class="chip">U1</span>
</header>
<div class="wrap">
  <h1>U1 is bound</h1>
  <p class="lead">David John Di Genova. Operator desk is the dashboard. Get ID is no longer the front door.</p>
  <div class="stack">
    <div class="card">
      <h2>Unity</h2>
      <p>Member U1 · look packet on this device · health card is not stored here</p>
      <div class="row"><a class="btn" href="dash.html">Open dashboard</a></div>
    </div>
    <div class="card">
      <h2>Engine time</h2>
      <p>Prepaid passes. Separate from the ID.</p>
      <div class="row"><a class="btn ghost" href="pay.html">Pay</a><a class="btn ghost" href="ai/app.html">Iris</a></div>
    </div>
  </div>
</div>
<nav class="dock">
  <a class="btn ghost" href="dash.html">Desk</a>
  <a class="btn ghost" href="pay.html">Pay</a>
  <a class="btn ghost" href="ai/app.html">Iris</a>
</nav>
</body>
</html>
