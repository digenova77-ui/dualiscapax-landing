<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DualisCapax</title>
  <meta name="description" content="Residual-law financial firm. Cutting-edge math, science, adaptive AI and research." />
  <meta name="theme-color" content="#050505" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; -webkit-text-size-adjust: 100%; }
    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: #050505;
      color: #f5f5f5;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    .shell {
      height: 100dvh;
      height: 100svh;
      max-width: 44rem;
      margin: 0 auto;
      padding: 0 1.25rem;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 0 0;
      gap: 1rem;
      flex: 0 0 auto;
    }
    .mark { font-size: 1.15rem; font-weight: 800; letter-spacing: -0.04em; }
    nav { display: flex; gap: 1.35rem; flex-wrap: wrap; }
    nav a { font-size: 0.95rem; font-weight: 600; color: rgba(245,245,245,0.7); }
    main {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 0;
      gap: 1rem;
    }
    h1 {
      font-size: clamp(3.25rem, 14vw, 5.5rem);
      font-weight: 900;
      line-height: 0.88;
      letter-spacing: -0.05em;
      text-transform: uppercase;
    }
    .line {
      font-size: clamp(1.05rem, 3.8vw, 1.25rem);
      font-weight: 600;
      color: rgba(245,245,245,0.75);
      max-width: 24rem;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <a href="index.html" class="mark">DualisCapax</a>
      <nav>
        <a href="research/">Research</a>
        <a href="corporate.html">Financial</a>
        <a href="ai/">AI</a>
      </nav>
    </header>
    <main>
      <h1>Truth<br>Prevails.</h1>
      <p class="line">Residual-law financial firm. Cutting-edge math and science. Adaptive AI and research.</p>
    </main>
  </div>
</body>
</html>
