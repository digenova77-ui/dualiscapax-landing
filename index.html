<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DualisCapax</title>
<meta name="theme-color" content="#050505">
<meta name="description" content="The path is free. Upgrade is optional.">
<style>
:root{--ink:#e8e8e4;--dim:#8a8a84;--teal:#14b8a6;--bg:#050505}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#020308;color:var(--ink);font-family:Georgia,"Times New Roman",serif}
body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem 1.2rem calc(1.5rem + env(safe-area-inset-bottom,0px))}
.door{width:min(28rem,100%);text-align:center}
.orb{width:7.5rem;height:7.5rem;margin:0 auto 1.6rem;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#7ff5e6 0%,#14b8a6 28%,#0a3d38 68%,#020308 100%);
  box-shadow:0 0 40px rgba(20,184,166,.35),inset 0 0 18px rgba(127,245,230,.25);
  position:relative}
.orb::after{content:"";position:absolute;inset:22%;border-radius:50%;border:1px solid rgba(127,245,230,.28)}
.orb::before{content:"";position:absolute;inset:38%;border-radius:50%;border:1px solid rgba(127,245,230,.18)}
h1{font-weight:400;letter-spacing:.04em;font-size:clamp(1.8rem,6vw,2.4rem);margin:0 0 .55rem}
.lede{font-family:system-ui,sans-serif;color:var(--dim);font-size:.95rem;margin:0 0 1.8rem}
nav{display:flex;flex-wrap:wrap;justify-content:center;gap:.55rem .7rem;font-family:system-ui,sans-serif}
nav a{color:var(--ink);text-decoration:none;border:1px solid rgba(20,184,166,.28);padding:.55rem .8rem;min-height:44px;display:inline-flex;align-items:center;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase}
nav a:hover,nav a:focus{border-color:var(--teal);outline:none}
.note{margin-top:1.6rem;font-family:ui-monospace,monospace;font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:#5a5a56}
@media (prefers-reduced-motion:reduce){.orb{box-shadow:0 0 16px rgba(20,184,166,.2)}}
</style>
</head>
<body>
<main class="door">
  <div class="orb" aria-hidden="true"></div>
  <h1>DualisCapax</h1>
  <p class="lede">The path is free. Upgrade is optional.</p>
  <nav>
    <a href="/look">Look</a>
    <a href="/iris">Iris</a>
    <a href="/rte/">Boards</a>
    <a href="/rte/">Rooms</a>
  </nav>
  <p class="note">Look is free &middot; no bind wall</p>
</main>
</body>
</html>
