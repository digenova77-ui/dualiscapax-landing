<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DualisCapax</title>
<meta name="description" content="DualisCapax — financial and emerging AI. Living cinematic narrative.">
<meta name="theme-color" content="#020203">
<link rel="icon" type="image/svg+xml" href="brand/emblem-helix.svg">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#020203;color:#f3f2ef;font-family:system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.shell{min-height:100%;min-height:100dvh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:.75rem;padding:.85rem 1.1rem;border-bottom:1px solid rgba(255,255,255,.06);flex-wrap:wrap}
.top .wm{height:28px;width:auto;max-width:200px}
.top .em{width:28px;height:28px;border-radius:50%}
.top .sp{flex:1}
.top a,.top button{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.45);background:none;border:none;cursor:pointer;padding:.35rem .5rem}
.top a:hover,.top button:hover{color:#C9A227}
.film{flex:1;display:flex;flex-direction:column;min-height:0}
.tour-stage{flex:1;min-height:min(62vh,520px);position:relative;background:#020203}
.overlay{padding:1rem 1.15rem 1.25rem;border-top:1px solid rgba(255,255,255,.06);background:linear-gradient(180deg,rgba(2,2,3,.2),#020203)}
.tour-step{font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:#C9A227;font-family:ui-monospace,Menlo,Consolas,monospace}
.tour-title{font-size:clamp(1.35rem,3vw,1.85rem);font-weight:600;margin:.3rem 0 .4rem;color:#fff}
.tour-line{font-size:.92rem;line-height:1.5;color:rgba(255,255,255,.55);max-width:36rem}
.bar{height:3px;background:rgba(255,255,255,.08);margin-top:1rem;border-radius:2px;overflow:hidden}
.tour-progress-bar{height:100%;width:0;background:#C9A227;transition:width .1s linear}
.controls{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.9rem}
.controls button{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.85);padding:.55rem 1rem;border-radius:8px;font-size:.78rem;cursor:pointer}
.controls button:hover{border-color:#C9A227;color:#C9A227}
.beats{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin-top:.9rem}
@media(max-width:520px){.beats{grid-template-columns:repeat(2,1fr)}}
.beats button{text-align:left;font-size:.68rem;padding:.5rem .55rem;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.65);border-radius:8px;cursor:pointer}
.beats button:hover,.beats button.on{border-color:rgba(201,162,39,.55);color:#fff}
.foot{padding:.75rem 1.1rem 1.25rem;font-size:.68rem;color:rgba(255,255,255,.3);display:flex;flex-wrap:wrap;gap:.75rem 1.25rem}
.foot a{color:rgba(255,255,255,.4)}
.foot a:hover{color:#fff}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <img class="wm" src="brand/wordmark.svg" alt="DualisCapax">
    <img class="em" src="brand/emblem-helix.svg" alt="">
    <span class="sp"></span>
    <a href="corporate.html">Corporate</a>
    <a href="ai/">AI</a>
    <a href="research/">Research</a>
    <button type="button" id="btn-pause">Pause</button>
  </header>

  <section class="film" id="tour-root">
    <div class="tour-stage"></div>
    <div class="overlay">
      <div class="tour-step"></div>
      <div class="tour-title"></div>
      <p class="tour-line"></p>
      <div class="bar"><div class="tour-progress-bar"></div></div>
      <div class="controls">
        <button type="button" data-tour="prev">Back</button>
        <button type="button" data-tour="next">Next</button>
        <button type="button" data-tour="play">Replay</button>
      </div>
      <div class="beats" id="beat-list"></div>
    </div>
  </section>

  <footer class="foot">
    <span>DualisCapax · cinematic storyboard</span>
    <a href="tour.html">Tour</a>
    <a href="narrative.html">Narrative</a>
    <a href="model.html">Model</a>
    <a href="food-for-thought.html">Food for thought</a>
  </footer>
</div>
<script src="js/video-engine.js"></script>
<script>
(function () {
  var eng = new DualisVideoEngine({ root: '#tour-root' }).start();
  document.querySelector('[data-tour=next]').onclick = function () { eng.next(); };
  document.querySelector('[data-tour=prev]').onclick = function () { eng.prev(); };
  document.querySelector('[data-tour=play]').onclick = function () { eng.go(eng.i, true); };
  document.getElementById('btn-pause').onclick = function () {
    eng.pause();
    this.textContent = eng.running ? 'Pause' : 'Play';
  };
  var list = document.getElementById('beat-list');
  (window.DUALIS_STORYBOARD_STEPS || []).forEach(function (s, idx) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = (idx + 1) + '. ' + s.title;
    b.onclick = function () { eng.go(idx, true); };
    list.appendChild(b);
  });
})();
</script>
</body>
</html>
