<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DualisCapax</title>
<meta name="description" content="DualisCapax — residual research plane.">
<meta name="theme-color" content="#020203">
<link rel="icon" type="image/svg+xml" href="emblem-ring.svg">
<style>
:root{--font:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--lab:none}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:#020203;color:rgba(243,242,239,.92);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.void{min-height:100vh;min-height:100dvh;position:relative;display:flex;flex-direction:column;isolation:isolate}
.photo{position:fixed;inset:0;z-index:0;background:#020203 center/cover no-repeat;background-image:var(--lab);transform:scale(1.05);filter:saturate(.88) contrast(1.06)}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(2,2,3,.9) 0%,rgba(2,2,3,.58) 40%,rgba(2,2,3,.32) 68%,rgba(2,2,3,.5) 100%),linear-gradient(180deg,rgba(2,2,3,.45) 0%,transparent 28%,transparent 52%,rgba(2,2,3,.93) 100%)}
.L2{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 80% 50% at 72% 38%,rgba(74,159,224,.14),transparent 55%);mix-blend-mode:screen}
.L3{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.04;background-image:linear-gradient(rgba(255,255,255,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px);background-size:72px 72px;transform:perspective(600px) rotateX(55deg) scale(1.7);transform-origin:center 125%;mask-image:linear-gradient(180deg,transparent,#000 35%,#000 55%,transparent)}
.ui{position:relative;z-index:10;flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(1.5rem,4vw,2.75rem);max-width:40rem}
.top{display:flex;align-items:center;gap:.75rem;opacity:.7;font-family:var(--mono);font-size:.62rem;letter-spacing:.2em;text-transform:uppercase}
.top img{width:22px;height:22px;filter:drop-shadow(0 0 8px rgba(74,159,224,.5))}
.center{padding:2rem 0}
.k{font-family:var(--mono);font-size:.65rem;letter-spacing:.28em;text-transform:uppercase;color:rgba(201,162,39,.9);margin-bottom:1.75rem;text-shadow:0 2px 14px rgba(0,0,0,.85)}
h1{font-size:clamp(2.3rem,1.2rem + 3.8vw,3.6rem);font-weight:600;letter-spacing:-.035em;line-height:1.08;max-width:12ch;margin-bottom:1.5rem;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.95),0 16px 48px rgba(0,0,0,.9)}
.p{font-size:clamp(.95rem,.9rem + .3vw,1.08rem);line-height:1.65;color:rgba(255,255,255,.58);max-width:30ch;margin-bottom:2.5rem;text-shadow:0 2px 16px rgba(0,0,0,.95)}
.cta{display:inline-flex;align-items:center;gap:.6rem;font-size:.78rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:#fff;padding-bottom:.35rem;border-bottom:1px solid rgba(255,255,255,.4);text-shadow:0 2px 12px rgba(0,0,0,.85);transition:border-color .2s,letter-spacing .2s}
.cta:hover{border-color:rgba(201,162,39,.9);letter-spacing:.14em}
.bottom{display:flex;flex-wrap:wrap;gap:1rem 1.75rem;align-items:center;font-size:.65rem;letter-spacing:.08em;text-shadow:0 2px 10px rgba(0,0,0,.95)}
.bottom a{color:rgba(255,255,255,.55);transition:color .15s}
.bottom a:hover{color:#fff}
.bottom .s{color:rgba(201,162,39,.55)}
</style>
</head>
<body>
  <div class="void">
    <div class="photo" role="img" aria-label="Research laboratory"></div>
    <div class="L2" aria-hidden="true"></div>
    <div class="L3" aria-hidden="true"></div>
    <div class="ui">
      <div class="top">
        <img src="emblem-ring.svg" width="22" height="22" alt="">
        <span>DualisCapax</span>
      </div>
      <div class="center">
        <p class="k">Residual plane</p>
        <h1>Research that prices the cost of being wrong.</h1>
        <p class="p">Healthcare. Engineering. Adaptive systems. Open where it should be. Deep when the rails are live.</p>
        <a class="cta" href="research/">Enter research</a>
      </div>
      <div class="bottom">
        <a href="manifesto.html">Manifesto</a>
        <a href="residual-law.html">Residual Law</a>
        <a href="model.html">Model</a>
        <a href="gateway.html">Gateway</a>
        <span class="s">No Tribes Preferred</span>
      </div>
    </div>
  </div>
  <script src="lab-bg.js" defer></script>
</body>
</html>
