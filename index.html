<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DualisCapax</title>
<meta name="description" content="DualisCapax — residual research plane.">
<meta name="theme-color" content="#020203">
<link rel="icon" type="image/svg+xml" href="emblem-ring.svg">
<style>
:root{
  --font:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);
  background:#020203;
  color:rgba(243,242,239,.92);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none}

/* ========== DEPTH STACK (screen → floor) ========== */
.void{
  min-height:100vh;min-height:100dvh;
  position:relative;
  display:flex;flex-direction:column;
  isolation:isolate;
}

/* Layer 0 — absolute floor (deepest) */
.L0{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:#010102;
}

/* Layer 1–4 — atmospheric depth wells */
.L1,.L2,.L3,.L4,.L5{
  position:fixed;inset:0;z-index:1;pointer-events:none;
}
.L1{
  background:radial-gradient(ellipse 120% 80% at 50% 120%, #0a1520 0%, transparent 55%);
  opacity:.9;
}
.L2{
  background:radial-gradient(ellipse 90% 70% at 80% -10%, rgba(40,90,140,.22), transparent 50%);
  filter:blur(40px);
}
.L3{
  background:radial-gradient(ellipse 70% 60% at 10% 60%, rgba(120,90,30,.12), transparent 45%);
  filter:blur(50px);
}
.L4{
  background:
    radial-gradient(circle at 70% 40%, rgba(74,159,224,.06) 0%, transparent 25%),
    radial-gradient(circle at 30% 70%, rgba(201,162,39,.05) 0%, transparent 20%);
  filter:blur(20px);
}
.L5{
  /* horizon fog — mid distance */
  background:linear-gradient(180deg, transparent 40%, rgba(2,2,3,.4) 70%, rgba(2,2,3,.85) 100%);
}

/* Layer 6 — geometric residual lattice (far) */
.L6{
  position:fixed;inset:0;z-index:2;pointer-events:none;
  opacity:.07;
  background-image:
    linear-gradient(rgba(255,255,255,.5) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.5) 1px, transparent 1px);
  background-size:80px 80px;
  background-position:center;
  transform:perspective(600px) rotateX(58deg) scale(1.8);
  transform-origin:center 120%;
  mask-image:linear-gradient(180deg, transparent 0%, #000 30%, #000 60%, transparent 90%);
}

/* Layer 7 — dual residual filaments (mid-space) */
.L7{
  position:fixed;right:8%;top:10%;bottom:15%;
  width:min(28vw, 200px);
  z-index:3;pointer-events:none;
  opacity:.35;
}
.L7 svg{width:100%;height:100%}
@media(max-width:640px){
  .L7{opacity:.18;right:-5%;width:45vw}
}

/* Layer 8 — soft grain */
.L8{
  position:fixed;inset:0;z-index:4;pointer-events:none;opacity:.04;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* ========== UI FLOAT (nearest layers) ========== */
.ui{
  position:relative;z-index:10;
  flex:1;
  display:flex;flex-direction:column;
  justify-content:space-between;
  padding:clamp(1.5rem, 4vw, 2.75rem);
  max-width:42rem;
}

.top{
  display:flex;align-items:center;gap:.75rem;
  opacity:.55;
  font-family:var(--mono);
  font-size:.62rem;
  letter-spacing:.2em;
  text-transform:uppercase;
}
.top img{
  width:22px;height:22px;opacity:.9;
  filter:drop-shadow(0 0 8px rgba(74,159,224,.4));
}

.center{
  padding:2rem 0;
}

/* Type at different perceived depths */
.k{
  font-family:var(--mono);
  font-size:.65rem;
  letter-spacing:.28em;
  text-transform:uppercase;
  color:rgba(201,162,39,.7);
  margin-bottom:1.75rem;
  opacity:.8;
  transform:translateZ(0);
}

h1{
  font-size:clamp(2.4rem, 1.2rem + 4vw, 3.75rem);
  font-weight:600;
  letter-spacing:-.035em;
  line-height:1.08;
  max-width:12ch;
  margin-bottom:1.5rem;
  color:rgba(255,255,255,.95);
  text-shadow:
    0 1px 0 rgba(255,255,255,.06),
    0 24px 60px rgba(0,0,0,.9),
    0 0 80px rgba(74,159,224,.12);
}

.p{
  font-size:clamp(.95rem, .9rem + .3vw, 1.1rem);
  line-height:1.65;
  color:rgba(255,255,255,.42);
  max-width:28ch;
  margin-bottom:2.5rem;
  font-weight:400;
}

.cta{
  display:inline-flex;align-items:center;gap:.6rem;
  font-size:.78rem;
  font-weight:500;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:rgba(255,255,255,.9);
  padding-bottom:.35rem;
  border-bottom:1px solid rgba(255,255,255,.25);
  transition:border-color .2s, color .2s, letter-spacing .2s;
}
.cta:hover{
  border-color:rgba(201,162,39,.7);
  color:#fff;
  letter-spacing:.14em;
}

.bottom{
  display:flex;flex-wrap:wrap;gap:1rem 1.75rem;
  align-items:center;
  opacity:.4;
  font-size:.65rem;
  letter-spacing:.08em;
}
.bottom a{
  color:rgba(255,255,255,.5);
  transition:color .15s;
}
.bottom a:hover{color:rgba(255,255,255,.9)}
.bottom .s{
  color:rgba(201,162,39,.45);
  letter-spacing:.06em;
}

/* Micro depth ticks — suggest distance */
.ticks{
  position:fixed;
  left:clamp(.75rem, 2vw, 1.5rem);
  top:50%;
  transform:translateY(-50%);
  z-index:5;
  display:flex;flex-direction:column;gap:12px;
  pointer-events:none;
  opacity:.25;
}
.ticks i{
  display:block;
  width:4px;height:1px;
  background:rgba(255,255,255,.6);
}
.ticks i:nth-child(3){width:10px;background:rgba(201,162,39,.7)}
.ticks i:nth-child(5){width:7px}
@media(max-width:500px){.ticks{display:none}}
</style>
</head>
<body>
  <div class="void">
    <div class="L0" aria-hidden="true"></div>
    <div class="L1" aria-hidden="true"></div>
    <div class="L2" aria-hidden="true"></div>
    <div class="L3" aria-hidden="true"></div>
    <div class="L4" aria-hidden="true"></div>
    <div class="L5" aria-hidden="true"></div>
    <div class="L6" aria-hidden="true"></div>

    <div class="L7" aria-hidden="true">
      <svg viewBox="0 0 120 400" fill="none">
        <path d="M40 10 C70 50 70 90 40 130 C10 170 10 210 40 250 C70 290 70 330 40 370" stroke="#4a9fe0" stroke-width="1.2" opacity=".9"/>
        <path d="M80 10 C50 50 50 90 80 130 C110 170 110 210 80 250 C50 290 50 330 80 370" stroke="#c9a227" stroke-width="1.2" opacity=".9"/>
        <g stroke="rgba(255,255,255,.3)" stroke-width=".8">
          <path d="M42 50 H78"/><path d="M35 90 H85"/><path d="M42 130 H78"/>
          <path d="M35 170 H85"/><path d="M42 210 H78"/><path d="M35 250 H85"/>
          <path d="M42 290 H78"/><path d="M35 330 H85"/>
        </g>
      </svg>
    </div>

    <div class="L8" aria-hidden="true"></div>

    <div class="ticks" aria-hidden="true">
      <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
    </div>

    <div class="ui">
      <div class="top">
        <img src="emblem-ring.svg" width="22" height="22" alt="">
        <span>DualisCapax</span>
      </div>

      <div class="center">
        <p class="k">Residual plane</p>
        <h1>Research that prices the cost of being wrong.</h1>
        <p class="p">Healthcare. Engineering. Adaptive systems. Open where it should be. Deep when the rails are live.</p>
        <a class="cta" href="research/">Enter research</a>
      </div>

      <div class="bottom">
        <a href="manifesto.html">Manifesto</a>
        <a href="residual-law.html">Residual Law</a>
        <a href="model.html">Model</a>
        <a href="gateway.html">Gateway</a>
        <span class="s">No Tribes Preferred</span>
      </div>
    </div>
  </div>
</body>
</html>
