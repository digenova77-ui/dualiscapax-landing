<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DualisCapax</title>
  <meta name="description" content="No tribes preferred. Truth prevails. DualisCapax — Financial, Research, AI." />
  <meta name="theme-color" content="#050508" />
  <link rel="icon" href="brand/emblem-helix.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #050508;
      color: #f5f5f5;
      font-family: Inter, system-ui, sans-serif;
      overflow: hidden;
    }
    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 0;
    }
    .overlay {
      position: relative;
      z-index: 2;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding:
        calc(1rem + env(safe-area-inset-top))
        1.25rem
        calc(1.25rem + env(safe-area-inset-bottom));
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .brand {
      font-size: clamp(1.25rem, 3.5vw, 1.65rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: rgba(255,255,255,0.95);
      text-decoration: none;
    }
    .menu {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      justify-content: flex-end;
    }
    .menu a {
      color: rgba(255,255,255,0.72);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 0.45rem 0.75rem;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 999px;
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(8px);
    }
    .menu a:hover {
      color: #fff;
      border-color: rgba(255,255,255,0.35);
      background: rgba(255,255,255,0.08);
    }
    .center {
      display: grid;
      place-items: center;
      text-align: center;
      pointer-events: none;
    }
    .center-copy {
      display: grid;
      gap: 0.55rem;
      justify-items: center;
      max-width: min(72vw, 18rem);
    }
    .subtitle {
      font-size: clamp(0.78rem, 2.2vw, 0.95rem);
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
    }
    .title {
      font-size: clamp(1.55rem, 5.5vw, 2.75rem);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      text-shadow: 0 0 40px rgba(255,255,255,0.18);
      max-width: 12ch;
    }
    .bottom {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .bottom a {
      color: rgba(255,255,255,0.8);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.7rem 1.1rem;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(10px);
    }
    .bottom a.primary {
      background: #fff;
      color: #0a0a0c;
      border-color: #fff;
    }
  </style>
</head>
<body>
  <canvas id="stage" aria-hidden="true"></canvas>

  <div class="overlay">
    <header class="top">
      <a class="brand" href="index.html">DualisCapax</a>
      <nav class="menu" aria-label="Primary">
        <a href="corporate.html">Financial</a>
        <a href="research/">Research</a>
        <a href="ai/chat.html">AI</a>
      </nav>
    </header>

    <main class="center">
      <div class="center-copy">
        <p class="subtitle">No Tribes Preferred.</p>
        <h1 class="title">Truth Prevails.</h1>
      </div>
    </main>

    <footer class="bottom">
      <a class="primary" href="ai/chat.html">AI</a>
      <a href="research/">Research</a>
      <a href="corporate.html">Financial</a>
    </footer>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
  <script type="module">
    import { startBuckyball } from './js/buckyball.js';
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!reduce) startBuckyball(document.getElementById('stage'));
  </script>
</body>
</html>
