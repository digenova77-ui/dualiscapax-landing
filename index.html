<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DualisCapax</title>
  <meta name="description" content="No tribes preferred. Truth prevails. DualisCapax — Financial, Research, AI." />
  <meta name="theme-color" content="#050508" />
  <link rel="icon" href="brand/emblem-helix.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
    }
    body {
      min-height: 100%;
      background: #050508;
      color: #f5f5f5;
      font-family: Inter, system-ui, sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
    }
    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 0;
      pointer-events: none;
    }
    .overlay {
      position: relative;
      z-index: 2;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding:
        calc(1.1rem + env(safe-area-inset-top))
        1.25rem
        calc(2rem + env(safe-area-inset-bottom));
      gap: 2rem;
    }
    .top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
    }
    .brand {
      font-size: clamp(1.45rem, 5vw, 2rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: rgba(255,255,255,0.95);
      text-decoration: none;
      line-height: 1.1;
    }
    .menu {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.55rem;
    }
    @media (min-width: 720px) {
      .menu {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
    }
    .menu a {
      color: rgba(255,255,255,0.8);
      text-decoration: none;
      font-size: clamp(0.95rem, 3.2vw, 1.05rem);
      font-weight: 600;
      padding: 0.55rem 0.9rem;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(8px);
    }
    .menu a:hover {
      color: #fff;
      border-color: rgba(255,255,255,0.35);
      background: rgba(255,255,255,0.08);
    }
    .hero {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 58dvh;
      padding: 2rem 0;
    }
    .center-copy {
      display: grid;
      gap: 0.85rem;
      justify-items: center;
      max-width: min(88vw, 22rem);
    }
    .subtitle {
      font-size: clamp(1rem, 3.8vw, 1.2rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.75);
    }
    .title {
      font-size: clamp(2.1rem, 8vw, 3.4rem);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      text-shadow: 0 0 40px rgba(255,255,255,0.18);
      max-width: 12ch;
    }
    .bottom {
      display: grid;
      gap: 0.75rem;
      width: min(100%, 22rem);
      margin: 0 auto;
      padding-bottom: 0.5rem;
    }
    @media (min-width: 720px) {
      .bottom {
        display: flex;
        justify-content: center;
        width: auto;
        max-width: none;
      }
    }
    .bottom a {
      color: rgba(255,255,255,0.9);
      text-decoration: none;
      font-size: clamp(1rem, 3.5vw, 1.1rem);
      font-weight: 700;
      padding: 0.95rem 1.2rem;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(0,0,0,0.28);
      backdrop-filter: blur(10px);
      text-align: center;
    }
    .bottom a.primary {
      background: #fff;
      color: #0a0a0c;
      border-color: #fff;
    }
  </style>
</head>
<body>
  <canvas id="stage" aria-hidden="true"></canvas>

  <div class="overlay">
    <header class="top">
      <a class="brand" href="index.html">DualisCapax</a>
      <nav class="menu" aria-label="Primary">
        <a href="corporate.html">Financial</a>
        <a href="research/">Research</a>
        <a href="ai/chat.html">AI</a>
      </nav>
    </header>

    <section class="hero">
      <div class="center-copy">
        <p class="subtitle">No Tribes Preferred.</p>
        <h1 class="title">Truth Prevails.</h1>
      </div>
    </section>

    <nav class="bottom" aria-label="Sections">
      <a class="primary" href="ai/chat.html">AI</a>
      <a href="research/">Research</a>
      <a href="corporate.html">Financial</a>
    </nav>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
  <script type="module">
    import { startBuckyball } from './js/buckyball.js';
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!reduce) startBuckyball(document.getElementById('stage'));
  </script>
</body>
</html>
