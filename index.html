<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DualisCapax</title>
  <meta name="description" content="No tribes preferred. Truth prevails. DualisCapax — Financial, Research, AI." />
  <meta name="theme-color" content="#030308" />
  <link rel="icon" href="brand/emblem-helix.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      min-height: 100%;
      background: #030308;
      color: #f5f5f5;
      font-family: Inter, system-ui, sans-serif;
      overflow-x: hidden;
    }
    .page {
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(55dvh, 75dvh) auto;
    }

    /* One pure row: logo + nav */
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.65rem;
      min-height: 3.25rem;
      padding:
        calc(0.85rem + env(safe-area-inset-top))
        0.9rem
        0.65rem;
      position: relative;
      z-index: 3;
    }
    .brand {
      flex: 0 1 auto;
      min-width: 0;
      font-size: clamp(1.05rem, 3.8vw, 1.55rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: rgba(255,255,255,0.96);
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1;
    }
    .menu {
      flex: 0 0 auto;
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: flex-end;
      gap: 0.35rem;
    }
    .menu a {
      color: rgba(255,255,255,0.86);
      text-decoration: none;
      font-size: clamp(0.72rem, 2.5vw, 0.9rem);
      font-weight: 600;
      line-height: 1;
      padding: 0.48rem 0.62rem;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 999px;
      background: rgba(0,0,0,0.28);
      backdrop-filter: blur(10px);
      white-space: nowrap;
    }
    @media (min-width: 480px) {
      .menu { gap: 0.45rem; }
      .menu a { padding: 0.5rem 0.78rem; }
    }
    @media (min-width: 720px) {
      .top { padding-left: 1.25rem; padding-right: 1.25rem; }
      .menu { gap: 0.55rem; }
      .menu a {
        font-size: 0.92rem;
        padding: 0.55rem 0.9rem;
      }
    }

    .stage-wrap {
      position: relative;
      min-height: 55dvh;
      height: 75dvh;
      max-height: 75dvh;
    }
    #stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .under {
      padding: 1.25rem 1.25rem calc(1.5rem + env(safe-area-inset-bottom));
      text-align: center;
      border-top: 1px solid rgba(255,255,255,0.08);
      background: linear-gradient(180deg, rgba(8,8,14,0.96), #030308);
    }
    .copy {
      display: grid;
      gap: 0.55rem;
      justify-items: center;
      margin: 0 auto 1.1rem;
      max-width: min(90vw, 24rem);
    }
    .subtitle {
      font-size: clamp(1rem, 3.8vw, 1.15rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.72);
    }
    .title {
      font-size: clamp(2rem, 7.5vw, 3.1rem);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -0.03em;
      text-transform: uppercase;
    }
    .audio-bar {
      display: flex;
      justify-content: center;
      gap: 0.65rem;
      flex-wrap: wrap;
    }
    .audio-bar button {
      font: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      color: #0a0a0c;
      background: #fff;
      border: 0;
      border-radius: 999px;
      padding: 0.7rem 1rem;
      cursor: pointer;
    }
    .audio-bar button.ghost {
      color: rgba(255,255,255,0.85);
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.18);
    }
    .status {
      margin-top: 0.65rem;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.42);
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="top">
      <a class="brand" href="index.html">DualisCapax</a>
      <nav class="menu" aria-label="Primary">
        <a href="corporate.html">Financial</a>
        <a href="research/">Research</a>
        <a href="ai/chat.html">AI</a>
      </nav>
    </header>

    <section class="stage-wrap" aria-label="Residual dome">
      <canvas id="stage"></canvas>
    </section>

    <section class="under">
      <div class="copy">
        <p class="subtitle">No Tribes Preferred.</p>
        <h1 class="title">Truth Prevails.</h1>
      </div>
      <div class="audio-bar">
        <button type="button" id="btn-narrate">Play narration</button>
        <button type="button" class="ghost" id="btn-stop">Stop</button>
      </div>
      <p class="status" id="status">Dome above · words below</p>
    </section>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
  <script type="module">
    import { startMaxEngine } from './js/max-engine.js';

    const status = document.getElementById('status');
    const engine = startMaxEngine(document.getElementById('stage'), {
      narratorUrl: './assets/audio/narrator.mp3'
    });

    document.getElementById('btn-narrate').addEventListener('click', async () => {
      const result = await engine.playNarration();
      if (result.ok) status.textContent = 'Narration playing';
      else if (result.reason === 'missing-narrator-file') status.textContent = 'Add narrator.mp3 under assets/audio';
      else status.textContent = 'Audio unavailable';
    });

    document.getElementById('btn-stop').addEventListener('click', () => {
      engine.stopNarration();
      status.textContent = 'Dome above · words below';
    });
  </script>
</body>
</html>
