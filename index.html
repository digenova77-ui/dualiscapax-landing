<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>DualisCapax</title>
  <meta name="description" content="Open is free. Depth is prepaid. Adaptive AI on a shared plane." />
  <meta name="theme-color" content="#030308" />
  <link rel="icon" href="brand/emblem-helix.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --text: #f5f7ff;
      --muted: rgba(220, 228, 255, 0.72);
      --line: rgba(255, 255, 255, 0.18);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #030308;
      color: var(--text);
      font-family: Syne, system-ui, sans-serif;
      overflow-x: hidden;
    }
    #field {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 0;
    }
    .veil {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse 80% 60% at 50% 40%, rgba(3, 3, 12, 0.15), rgba(3, 3, 8, 0.72) 70%),
        linear-gradient(to top, rgba(3, 3, 8, 0.9), transparent 42%);
    }
    .ui {
      position: relative;
      z-index: 2;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: 1fr auto;
      padding: calc(1.25rem + env(safe-area-inset-top)) 1.25rem calc(1.5rem + env(safe-area-inset-bottom));
    }
    .hero {
      max-width: 920px;
      margin: auto 0;
      padding-top: 8vh;
    }
    .kicker {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.25rem;
      opacity: 0;
      animation: rise 1s ease forwards 0.15s;
    }
    h1 {
      font-size: clamp(2.8rem, 10vw, 6rem);
      line-height: 0.95;
      letter-spacing: -0.04em;
      font-weight: 800;
      margin-bottom: 1rem;
      text-shadow: 0 0 40px rgba(140, 160, 255, 0.25);
      opacity: 0;
      animation: rise 1s ease forwards 0.3s;
    }
    .pitch {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: clamp(0.95rem, 2.2vw, 1.1rem);
      color: var(--muted);
      max-width: 28ch;
      margin-bottom: 2rem;
      opacity: 0;
      animation: rise 1s ease forwards 0.45s;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      opacity: 0;
      animation: rise 1s ease forwards 0.6s;
    }
    .btn {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.85rem;
      text-decoration: none;
      border-radius: 999px;
      padding: 0.95rem 1.25rem;
      border: 1px solid var(--line);
      color: var(--text);
      backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, 0.03);
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.35);
    }
    .btn-primary {
      background: rgba(255, 255, 255, 0.92);
      color: #0a0a12;
      border-color: transparent;
      font-weight: 600;
    }
    .btn-primary:hover {
      background: #fff;
      color: #0a0a12;
    }
    .bar {
      display: grid;
      gap: 0.65rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.78rem;
      color: var(--muted);
      opacity: 0;
      animation: rise 1s ease forwards 0.8s;
    }
    @media (min-width: 800px) {
      .bar {
        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
      }
    }
    .bar strong {
      display: block;
      color: var(--text);
      font-weight: 600;
      margin-bottom: 0.2rem;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); filter: blur(6px); }
      to { opacity: 1; transform: translateY(0); filter: blur(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
      .kicker, h1, .pitch, .actions, .bar { opacity: 1; }
    }
  </style>
</head>
<body>
  <canvas id="field" aria-hidden="true"></canvas>
  <div class="veil" aria-hidden="true"></div>

  <div class="ui">
    <section class="hero">
      <div class="kicker">DualisCapax · residual plane</div>
      <h1>Open is free.<br />Depth is prepaid.</h1>
      <p class="pitch">Adaptive AI on a shared plane. Same rules for everyone.</p>
      <div class="actions">
        <a class="btn btn-primary" href="ai/chat.html">Open AI chat</a>
        <a class="btn" href="story.html">Play story</a>
        <a class="btn" href="pay.html">Buy Fuel</a>
      </div>
    </section>

    <section class="bar" aria-label="Core rules">
      <div>
        <strong>01 · Open</strong>
        Research surface stays free.
      </div>
      <div>
        <strong>02 · Depth</strong>
        Adaptive work burns Fuel.
      </div>
      <div>
        <strong>03 · Residual</strong>
        On the plane — not your wallet.
      </div>
    </section>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
  <script type="module">
    import { startResidualField } from './js/residual-field.js';

    const canvas = document.getElementById('field');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!reduce) {
      startResidualField(canvas);
    } else {
      canvas.style.display = 'none';
    }
  </script>
</body>
</html>
