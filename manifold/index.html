<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DCLM manifold</title>
  <style>
    :root{color-scheme:dark;--bg:#02030a;--ink:#e1fffb;--cyan:#63f7dd;--violet:#a68cff;--amber:#ffd37d}
    html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.3 ui-monospace,Menlo,monospace}
    canvas{position:fixed;inset:0;width:100%;height:100%}
    #hud{position:fixed;left:12px;right:12px;bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:8px}
    #status{color:var(--cyan);letter-spacing:.12em;font-size:11px}
    button{width:64px;height:64px;border-radius:50%;border:1px solid var(--cyan);background:#02030acc;color:var(--ink);font:700 12px ui-monospace,Menlo,monospace}
    #receipt{position:fixed;top:12px;left:12px;right:12px;color:var(--amber);white-space:pre-wrap;word-break:break-all}
  </style>
  <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.169.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.169.0/examples/jsm/"}}</script>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="receipt">Unity ID is a local plate. It does not grant a write.</div>
  <div id="hud">
    <div id="status">KERNEL · CHECKING</div>
    <div>
      <button id="run" type="button">RUN</button>
      <button id="iris" type="button">IRIS</button>
    </div>
  </div>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    const status = document.getElementById("status");
    const receipt = document.getElementById("receipt");
    const canvas = document.getElementById("view");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
    renderer.setSize(innerWidth, innerHeight);
    renderer.setClearColor(0x02030a);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 80);
    camera.position.set(6, 4.5, 9);
    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.target.set(0, 1.2, 0);
    scene.add(new THREE.HemisphereLight(0xd8fff8, 0x101018, 0.8));
    scene.add(new THREE.GridHelper(22, 22, 0x1f6f66, 0x10201c));
    const root = new THREE.Group();
    scene.add(root);
    const rings = [];
    for (let i = 1; i <= 4; i++) {
      const ring = new THREE.Mesh(new THREE.TorusGeometry(1.1 + i * 0.45, 0.015, 8, 80), new THREE.MeshBasicMaterial({ color: 0x63f7dd }));
      ring.rotation.x = Math.PI / 2;
      ring.position.y = 0.7;
      root.add(ring);
      rings.push(ring);
    }
    const core = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.6, 1.8, 32), new THREE.MeshStandardMaterial({ color: 0x102028, roughness: 0.6 }));
    core.position.y = 0.9;
    root.add(core);
    function tower(name, x, color) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(1.1, 3.6, 1.1), new THREE.MeshStandardMaterial({ color, roughness: 0.4 }));
      mesh.position.set(x, 1.8, 0);
      root.add(mesh);
      label(name, x, 3.8, 0, color);
    }
    function label(text, x, y, z, color) {
      const c = document.createElement("canvas");
      c.width = 512; c.height = 128;
      const g = c.getContext("2d");
      g.fillStyle = color; g.font = "700 48px sans-serif"; g.fillText(text, 16, 78);
      const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true }));
      s.position.set(x, y, z); s.scale.set(2.2, 0.55, 1); root.add(s);
    }
    tower("DCLM", -3.2, 0x3dceb8);
    tower("IRIS", 3.2, 0x6d5bd0);
    label("DCLM CORE", 0, 1.1, 1.5, "#63f7dd");
    label("V2 COMPUTE", 0, 4.4, 0, "#ffd37d");
    const unity = sessionStorage.getItem("unity-id") || crypto.randomUUID();
    sessionStorage.setItem("unity-id", unity);
    receipt.textContent = "UNITY " + unity.slice(0, 8) + " · LOOK class · not a write grant";
    const base = location.host.endsWith("dualiscapax.ai") ? "" : "https://dualiscapax.ai";
    async function probe() {
      try {
        const caps = await fetch(base + "/api/v2/capabilities").then(r => r.json());
        status.textContent = caps.backend ? "KERNEL · UP" : "KERNEL · HOLE";
      } catch (err) {
        status.textContent = "KERNEL · UNREACHABLE";
      }
    }
    document.getElementById("run").onclick = async () => {
      status.textContent = "KERNEL · RUNNING";
      try {
        const data = await fetch(base + "/api/v2/compute", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ payload: "unity:" + unity.slice(0, 8) }) }).then(r => r.json());
        status.textContent = data.accepted ? "KERNEL · ACCEPTED" : "KERNEL · HOLE";
        receipt.textContent = "seq " + data.sequence + "\n" + data.inputDigest;
      } catch (err) {
        status.textContent = "KERNEL · HOLE";
        receipt.textContent = err.message;
      }
    };
    document.getElementById("iris").onclick = async () => {
      try {
        const data = await fetch(base + "/api/iris").then(r => r.json());
        receipt.textContent = "IRIS " + data.status + " · authority " + data.authority_effect + " · dclm " + data.dclm;
      } catch (err) {
        receipt.textContent = "IRIS HOLE\n" + err.message;
      }
    };
    addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
    (function frame(){ rings.forEach((r,i) => r.rotation.z += 0.002 + i * 0.0004); controls.update(); renderer.render(scene, camera); requestAnimationFrame(frame); })();
    probe();
  </script>
</body>
</html>
