<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hall depth — DualisCapax</title>
<style>
  :root{
    --bg:#07090e;
    --ink:#e8eef4;
    --mute:#8b9caa;
    --amber:rgba(255,183,3,.55);
    --cyan:rgba(62,232,255,.55);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 Fraunces,Georgia,serif;overflow:hidden}
  .stage{perspective:1200px;height:100%;display:grid;place-items:center}
  .room{position:relative;width:min(92vw,40rem);height:min(70vh,28rem);transform-style:preserve-3d}
  .room::before{content:"";position:absolute;inset:0;background:radial-gradient(80% 60% at 50% 0%,rgba(62,232,255,.08),transparent 60%);pointer-events:none}
  .door{position:absolute;left:8%;right:8%;height:3.2rem;border:1px solid rgba(255,255,255,.12);background:rgba(8,14,22,.55);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;padding:0 1rem;cursor:pointer;color:var(--ink);font:12px/1 IBM Plex Mono,monospace;letter-spacing:.12em;text-transform:uppercase}
  .door.med{top:28%;border-color:var(--amber)}
  .door.eng{top:48%;border-color:var(--cyan)}
  .pane{position:absolute;inset:8% 6%;transform:translateZ(-180px) rotateX(6deg);opacity:0;pointer-events:none;border:1px solid transparent;background:rgba(10,16,24,.72);backdrop-filter:blur(16px);padding:1.25rem 1.3rem;transition:transform .45s ease,opacity .45s ease}
  .pane.open{transform:translateZ(80px) rotateX(0);opacity:1;pointer-events:auto}
  .pane.med{border-color:var(--amber);box-shadow:0 0 80px rgba(255,183,3,.08)}
  .pane.eng{border-color:var(--cyan);box-shadow:0 0 80px rgba(62,232,255,.08)}
  h1{font-size:1.4rem;margin:0 0 .4rem}
  p{margin:0;color:var(--mute)}
  .close{margin-top:1rem;font:11px IBM Plex Mono,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);background:none;border:0;cursor:pointer}
  .hint{position:fixed;bottom:1rem;left:0;right:0;text-align:center;font:11px IBM Plex Mono,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
</style>
</head>
<body>
  <div class="stage">
    <div class="room" id="room">
      <button class="door med" data-open="med">Medical</button>
      <button class="door eng" data-open="eng">Engineering</button>
      <article class="pane med" id="med">
        <h1>Medical</h1>
        <p>Leaf name. Public look. Class, study, SEAL stay behind this sheet until you pull them. No chart IDs.</p>
        <button class="close" data-close>Close pane</button>
      </article>
      <article class="pane eng" id="eng">
        <h1>Engineering</h1>
        <p>Surface. Invert. Next instrument. Same sheet machine. Cyan glass only.</p>
        <button class="close" data-close>Close pane</button>
      </article>
    </div>
  </div>
  <p class="hint">One pane. Depth on the Z. Empty is the room.</p>
  <script>
    const room=document.getElementById('room');
    room.addEventListener('click',e=>{
      const open=e.target.closest('[data-open]');
      const close=e.target.closest('[data-close]');
      if(open){
        document.querySelectorAll('.pane').forEach(p=>p.classList.remove('open'));
        document.getElementById(open.dataset.open).classList.add('open');
      }
      if(close){
        close.closest('.pane').classList.remove('open');
      }
    });
  </script>
</body>
</html>
