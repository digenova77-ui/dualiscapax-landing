<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DualisCapax // International Pipe Curtain Gate (Bulkhead DC-01)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #030712; color: #f8fafc; font-family: ui-monospace, SFMono-Regular, monospace; overflow: hidden; height: 100vh; display: flex; align-items: center; justify-content: center; }
    #curtain-container { position: relative; width: 440px; height: 440px; display: flex; align-items: center; justify-content: center; }
    svg.bulkhead { width: 100%; height: 100%; filter: drop-shadow(0 0 20px rgba(56, 189, 248, 0.2)); }
    .quad-wedge { cursor: pointer; transition: all 0.3s ease; opacity: 0.8; }
    .quad-wedge:hover { opacity: 1; filter: brightness(1.3); }
    .center-orb { fill: #0f172a; stroke: #38bdf8; stroke-width: 2; transition: all 0.4s ease; cursor: pointer; }
    .center-orb:hover { fill: #1e293b; stroke: #60a5fa; r: 52px; }
    #hud-readout { position: absolute; bottom: 24px; font-size: 11px; color: #94a3b8; text-align: center; width: 100%; letter-spacing: 0.05em; }
  </style>
</head>
<body>
  <div id="curtain-container">
    <svg class="bulkhead" viewBox="0 0 400 400">
      <!-- Concentric Rims -->
      <circle cx="200" cy="200" r="185" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4" />
      <circle cx="200" cy="200" r="130" fill="none" stroke="#334155" stroke-width="1" />
      <circle cx="200" cy="200" r="65" fill="none" stroke="#475569" stroke-width="1" />

      <!-- Quadrant Wedges -->
      <!-- Q1: Amber - Fiduciary -->
      <path class="quad-wedge" d="M 200 70 A 130 130 0 0 0 70 200 L 135 200 A 65 65 0 0 1 200 135 Z" fill="#d97706" onclick="window.location.href='/fiduciary-report'"/>
      <!-- Q2: Green - SCADA/Municipal -->
      <path class="quad-wedge" d="M 200 70 A 130 130 0 0 1 330 200 L 265 200 A 65 65 0 0 0 200 135 Z" fill="#059669" onclick="window.location.href='/sectors/municipal'"/>
      <!-- Q3: Cyan - Agent Iris -->
      <path class="quad-wedge" d="M 70 200 A 130 130 0 0 0 200 330 L 200 265 A 65 65 0 0 1 135 200 Z" fill="#0284c7" onclick="window.location.href='/iris-gateway'"/>
      <!-- Q4: Purple - Biophysical -->
      <path class="quad-wedge" d="M 330 200 A 130 130 0 0 1 200 330 L 200 265 A 65 65 0 0 0 265 200 Z" fill="#7c3aed" onclick="window.location.href='/research'"/>

      <!-- Crosshairs -->
      <line x1="200" y1="10" x2="200" y2="390" stroke="#1e293b" stroke-width="1" />
      <line x1="10" y1="200" x2="390" y2="200" stroke="#1e293b" stroke-width="1" />

      <!-- Center Geodesic Orb -->
      <circle class="center-orb" cx="200" cy="200" r="46" onclick="triggerApertureOpen()"/>
      <text x="200" y="204" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="bold" pointer-events="none">ENTER</text>
    </svg>
    <div id="hud-readout">DCLM LAYER [0] BULKHEAD DC-01 · SELECT SECTOR QUADRANT</div>
  </div>
  <script src="/src/ui/curtain_gate.js"></script>
</body>
</html>
