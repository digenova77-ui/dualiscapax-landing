<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ask — Unity</title>
<link rel="icon" href="brand/seal.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <a class="brand" href="hub.html" style="text-decoration:none;color:inherit">ASK</a>
  <a class="chip" href="security.html">Security</a>
</header>
<main>
  <h1 id="askline">What are you trying to find out?</h1>
  <p class="lead">Looking is free. Deeper Iris grind is engine time. Cards never go on this plate.</p>
  <p>
    <input id="q" style="width:100%;max-width:36rem;padding:.6rem .8rem;border-radius:999px;border:1px solid rgba(200,220,230,.2);background:#0a0e14;color:#e8eef2;font:inherit" placeholder="Ask in plain words">
  </p>
  <p><button class="btn" type="button" id="go">Ask (look is free)</button> <a class="btn ghost" href="pay.html">Buy deeper time</a></p>
  <p class="lead" id="next">Next: How deep does this question need to go?</p>
  <div class="row" style="margin-top:1.2rem">
    <a class="btn ghost" href="pricing.html">Pricing</a>
    <a class="btn ghost" href="security.html">Security</a>
    <a class="btn ghost" href="works.html">What works</a>
    <a class="btn ghost" href="life.html">Life</a>
    <a class="btn ghost" href="dash.html">Bonds</a>
    <a class="btn ghost" href="compute.html">Engine</a>
    <a class="btn ghost" href="study.html">Study</a>
  </div>
</main>
<script>
(function(){
  var NEXT=[
    "What are you trying to find out?",
    "How deep does this question need to go?",
    "Is this a look, or do you need Iris to grind?",
    "Who is allowed to ask you for more than your name?"
  ];
  var i=Math.floor(Date.now()/60000)%NEXT.length;
  document.getElementById("askline").textContent=NEXT[i];
  document.getElementById("next").textContent="Next: "+NEXT[(i+1)%NEXT.length];
  function send(){
    var t=(document.getElementById("q").value||"").trim();
    try{ sessionStorage.setItem("dc.ask", t||NEXT[i]); }catch(e){}
    location.href="ai/app.html";
  }
  document.getElementById("go").onclick=send;
  document.getElementById("q").addEventListener("keydown", function(e){ if(e.key==="Enter") send(); });
})();
</script>
</body>
</html>
