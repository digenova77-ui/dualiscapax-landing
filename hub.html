<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ask</title>
<meta name="theme-color" content="#04060c">
<link rel="icon" href="brand/seal.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark;--bg:#04060c;--iris:#8eb4c8;--text:#e8eef2;--mute:#8b99a4;--line:rgba(200,220,230,.14);--glass:rgba(10,16,24,.55)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,sans-serif}
.stage{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 28%,rgba(142,180,200,.16),transparent 42%)}
header{position:relative;z-index:2;display:flex;gap:.5rem;padding:calc(.7rem + env(safe-area-inset-top)) .9rem}
.brand{margin-inline-end:auto;letter-spacing:.2em;font-size:.72rem;color:inherit;text-decoration:none}
.chip{border:1px solid var(--iris);color:var(--iris);border-radius:999px;padding:.2rem .6rem;font-size:.72rem;text-decoration:none}
main{position:relative;z-index:2;padding:2rem .9rem;max-width:40rem;margin:0 auto}
h1{font-family:Georgia,serif;font-size:clamp(1.5rem,6vw,2.2rem)}
.lead{color:var(--mute)}
#q{width:100%;padding:.75rem 1rem;border-radius:999px;border:1px solid var(--line);background:var(--glass);color:inherit;font:inherit}
.row{display:flex;flex-wrap:wrap;gap:.4rem;margin:1rem 0}
.btn{appearance:none;border:0;background:var(--iris);color:#061018;font:700 .86rem inherit;padding:.55rem .95rem;border-radius:999px;text-decoration:none;display:inline-block;cursor:pointer}
.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
</style>
</head>
<body>
<div class="stage"></div>
<header>
  <a class="brand" href="hub.html">ASK</a>
  <a class="chip" href="ai/iris.html">Iris</a>
  <a class="chip" href="pay.html">Pay</a>
</header>
<main>
  <h1>What are you trying to find out?</h1>
  <p class="lead">Look is free. Packs and rooms are on Pay. Iris is the usable chat.</p>
  <p><input id="q" placeholder="Ask in plain words"></p>
  <p><button class="btn" type="button" id="go">Ask Iris</button> <a class="btn ghost" href="pay.html">Everything you can pay</a></p>
  <div class="row">
    <a class="btn ghost" href="story.html">Story</a>
    <a class="btn ghost" href="compute.html">Engine</a>
    <a class="btn ghost" href="law.html">Law</a>
  </div>
</main>
<script>
(function(){
  function go(){
    var t=document.getElementById("q").value.trim();
    try{ sessionStorage.setItem("dc.ask", t); }catch(e){}
    location.href="ai/iris.html";
  }
  document.getElementById("go").onclick=go;
  document.getElementById("q").addEventListener("keydown",function(e){ if(e.key==="Enter") go(); });
})();
</script>
</body>
</html>
