<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>DualisCapax — Residual Engine · Video · XR Haptic</title>
<meta name="theme-color" content="#020203"/>
<link rel="icon" type="image/svg+xml" href="emblem-ring.svg"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#020203;color:#e8e6e3;font-family:system-ui,sans-serif;overflow:hidden}
#hud{position:absolute;z-index:20;top:12px;left:12px;right:12px;max-width:420px;background:rgba(0,0,0,.72);border:1px solid rgba(201,162,39,.35);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.45}
#hud h1{font-size:14px;color:#c9a227;margin-bottom:6px;letter-spacing:.06em}
#hud a{color:#c9a227}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button{padding:8px 14px;border-radius:6px;border:1px solid rgba(255,255,255,.2);background:#1a1a1c;color:#eee;font-weight:600;cursor:pointer;font-size:12px}
button.primary{background:#c9a227;color:#020203;border-color:#c9a227}
button:disabled{opacity:.4;cursor:not-allowed}
#stage{position:absolute;inset:0}
canvas{display:block;width:100%;height:100%}
#status{margin-top:6px;color:rgba(255,255,255,.55);font-size:12px}
</style>
</head>
<body>
<div id="hud">
  <h1>DUALISCAPAX · Residual Engine</h1>
  <div>WebGL residual field + WebXR controllers/haptics when a headset is available.</div>
  <div id="status">Booting…</div>
  <div class="row">
    <button type="button" class="primary" id="pulseBtn">Test pulse (gamepad)</button>
    <button type="button" id="xrBtn" disabled>Enter VR</button>
    <a href="model.html" style="align-self:center;font-size:12px">Model tour →</a>
    <a href="index.html" style="align-self:center;font-size:12px">Home</a>
  </div>
</div>
<div id="stage"></div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "@webxr-input-profiles/motion-controllers": "https://cdn.jsdelivr.net/npm/@webxr-input-profiles/motion-controllers@1.0.0/dist/motion-controllers.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { fetchProfile, MotionController } from '@webxr-input-profiles/motion-controllers';
const PROFILES = 'https://cdn.jsdelivr.net/npm/@webxr-input-profiles/assets@1.0/dist/profiles';
const statusEl = document.getElementById('status');
const xrBtn = document.getElementById('xrBtn');
const pulseBtn = document.getElementById('pulseBtn');
const stage = document.getElementById('stage');
let renderer, scene, camera, clock;
let session = null, refSpace = null;
const loader = new GLTFLoader();
const motionControllers = new Map();
const controllerMeshes = new Map();
let quarks;
async function pulse(source, intensity = 0.55, duration = 35) {
  const actuators = source?.hapticActuators ?? source?.gamepad?.hapticActuators;
  if (!actuators?.length) return false;
  try {
    return await actuators[0].pulse(Math.min(1, Math.max(0, intensity)), Math.min(400, Math.max(1, duration)));
  } catch { return false; }
}
async function pulseAny(intensity = 0.5, duration = 40) {
  const pads = navigator.getGamepads?.() || [];
  let ok = false;
  for (const g of pads) {
    if (!g) continue;
    const acts = g.hapticActuators || g.vibrationActuator;
    if (acts && !acts.length && acts.playEffect) {
      try {
        await acts.playEffect('dual-rumble', { duration, strongMagnitude: intensity, weakMagnitude: intensity * 0.6 });
        ok = true;
      } catch {}
    }
    if (acts?.length) {
      try { await acts[0].pulse(intensity, duration); ok = true; } catch {}
    }
  }
  if (session) {
    for (const src of session.inputSources || []) {
      if (await pulse(src, intensity, duration)) ok = true;
    }
  }
  statusEl.textContent = ok ? 'Haptic pulse sent' : 'No haptic actuator found (need VR controller or supported gamepad)';
  return ok;
}
function buildQuarks() {
  const n = 1200;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(n * 3);
  const col = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const r = 0.4 + Math.random() * 2.2;
    const t = Math.random() * Math.PI * 2;
    const y = (Math.random() - 0.5) * 2.4;
    pos[i * 3] = Math.cos(t) * r;
    pos[i * 3 + 1] = y;
    pos[i * 3 + 2] = Math.sin(t) * r;
    const g = 0.55 + Math.random() * 0.45;
    col[i * 3] = 0.75 * g; col[i * 3 + 1] = 0.55 * g; col[i * 3 + 2] = 0.12 * g;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const mat = new THREE.PointsMaterial({ size: 0.025, vertexColors: true, transparent: true, opacity: 0.85 });
  return new THREE.Points(geo, mat);
}
async function createController(source) {
  if (source.targetRayMode !== 'tracked-pointer') return;
  try {
    const { profile, assetPath } = await fetchProfile(source, PROFILES);
    const mc = new MotionController(source, profile, assetPath);
    motionControllers.set(source, mc);
    const gltf = await loader.loadAsync(assetPath);
    controllerMeshes.set(source, gltf.scene);
    scene.add(gltf.scene);
    statusEl.textContent = 'Controller: ' + (source.profiles?.[0] || 'loaded');
  } catch (e) {
    console.warn(e);
    statusEl.textContent = 'Controller mesh failed (haptics still available)';
  }
}
function onFrame(time, frame) {
  const t = clock.getElapsedTime();
  if (quarks) {
    quarks.rotation.y = t * 0.08;
    const p = quarks.geometry.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const y = p.getY(i);
      p.setY(i, y + Math.sin(t + i * 0.01) * 0.0008);
    }
    p.needsUpdate = true;
  }
  if (frame && refSpace) {
    for (const [source, mc] of motionControllers) {
      mc.updateFromGamepad();
      const mesh = controllerMeshes.get(source);
      if (!mesh || !source.gripSpace) continue;
      const pose = frame.getPose(source.gripSpace, refSpace);
      if (pose) {
        mesh.position.copy(pose.transform.position);
        mesh.quaternion.copy(pose.transform.orientation);
      }
    }
  }
  renderer.render(scene, camera);
}
async function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x020203);
  camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 50);
  camera.position.set(0, 1.4, 3.2);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(devicePixelRatio);
  renderer.setSize(innerWidth, innerHeight);
  renderer.xr.enabled = true;
  stage.appendChild(renderer.domElement);
  scene.add(new THREE.AmbientLight(0x404050, 0.7));
  const dl = new THREE.DirectionalLight(0xffe6a0, 1.1);
  dl.position.set(2, 4, 3);
  scene.add(dl);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshStandardMaterial({ color: 0x0c0c10, roughness: 0.92 }));
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(1.15, 0.03, 16, 100), new THREE.MeshStandardMaterial({ color: 0xc9a227, metalness: 0.6, roughness: 0.35 }));
  ring.rotation.x = Math.PI / 2;
  ring.position.y = 1.1;
  scene.add(ring);
  quarks = buildQuarks();
  quarks.position.y = 1.1;
  scene.add(quarks);
  clock = new THREE.Clock();
  renderer.setAnimationLoop(onFrame);
  pulseBtn.addEventListener('click', () => pulseAny(0.65, 45));
  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  if (!navigator.xr) {
    statusEl.textContent = 'WebGL residual field running. WebXR not available — haptics via gamepad if present.';
    return;
  }
  const ok = await navigator.xr.isSessionSupported('immersive-vr');
  if (!ok) {
    statusEl.textContent = 'WebGL residual field running. Immersive VR not supported on this device.';
    return;
  }
  statusEl.textContent = 'WebGL + WebXR ready. Enter VR for controllers/haptics.';
  xrBtn.disabled = false;
  xrBtn.addEventListener('click', async () => {
    try {
      session = await navigator.xr.requestSession('immersive-vr', {
        requiredFeatures: ['local-floor'],
        optionalFeatures: ['hand-tracking', 'local']
      });
      await renderer.xr.setSession(session);
      refSpace = await session.requestReferenceSpace('local-floor');
      statusEl.textContent = 'VR session active — select/squeeze pulses haptics.';
      session.addEventListener('inputsourceschange', (ev) => {
        for (const s of ev.added) createController(s);
        for (const s of ev.removed) {
          const m = controllerMeshes.get(s);
          if (m) { scene.remove(m); controllerMeshes.delete(s); }
          motionControllers.delete(s);
        }
      });
      session.addEventListener('selectstart', (e) => pulse(e.inputSource, 0.7, 40));
      session.addEventListener('squeezestart', (e) => pulse(e.inputSource, 0.45, 28));
      session.addEventListener('end', () => {
        statusEl.textContent = 'VR session ended. WebGL field still running.';
        xrBtn.disabled = false;
      });
      xrBtn.disabled = true;
    } catch (err) {
      statusEl.textContent = 'VR start failed: ' + err.message;
    }
  });
}
init();
</script>
</body>
</html>
