<body>
<header>

  <nav><a href="index.html">Gateway</a><a href="pay.html">Pay</a><a href="id.html">ID</a></nav>
</header>
<main>
  <h1>Energy</h1>
  <p class="lead" id="energy">The energy cost is the joule. The joule has not been read, so the cost is empty.</p>
  <a class="btn" href="pay.html">Merit exchange</a>
<script type="module">
import { energyCost, pricingGateway } from "./js/merit-align.js";
const line = document.getElementById("energy");
const cost = energyCost();
const gate = pricingGateway("fuel");
if (cost.cost === null || gate.priced !== true) {
  line.textContent = "The energy cost is the joule. The joule has not been read, so the cost is empty. Merit is not priced.";
}
</script>
