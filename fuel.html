<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Fuel · Prepaid time — DualisCapax</title>
<meta name="theme-color" content="#050505"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important}
body{font-family:"IBM Plex Sans",system-ui,sans-serif;background:#000;color:#f5f5f5;min-height:100dvh}
a{color:#9ec5ff;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:34rem;margin:0 auto;padding:max(1rem,env(safe-area-inset-top)) 1.1rem max(2.4rem,env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;margin-bottom:1.3rem;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase}
.kicker{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.72rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#9ec5ff}
h1{font-size:clamp(1.7rem,7vw,2.3rem);font-weight:600;letter-spacing:.02em;text-transform:uppercase;margin:.4rem 0 .7rem}
.lede{font-size:1.05rem;line-height:1.55;color:rgba(245,245,245,.72);margin-bottom:1rem}
.pack{display:block;width:100%;text-align:left;border:1px solid rgba(158,197,255,.28);padding:.9rem 1rem;margin:0 0 .55rem;background:rgba(255,255,255,.03)}
.pack.on{border-color:rgba(158,197,255,.7);background:rgba(158,197,255,.12)}
.pack b{display:block;font-size:1.25rem;color:#f5f5f5}
.pack span{font-size:.92rem;color:rgba(245,245,245,.55)}
.go,.alt{display:block;width:100%;min-height:2.6rem;margin:.45rem 0 0;border:1px solid rgba(158,197,255,.22);color:#9ec5ff;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.72rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.go{border-color:rgba(158,197,255,.55);background:rgba(158,197,255,.12);color:#e8f1ff;min-height:3rem}
.go.ok{border-color:rgba(126,200,140,.55);background:rgba(126,200,140,.16)}
.steps{border:1px solid rgba(158,197,255,.22);padding:.9rem 1rem;margin:1rem 0;font-size:.98rem;line-height:1.5;color:rgba(245,245,245,.78)}
.steps strong{display:block;color:#f5f5f5;margin-bottom:.3rem}
.note{font-size:.88rem;color:rgba(245,245,245,.48);line-height:1.45}
foot{display:block;margin-top:2rem;padding-top:1rem;border-top:1px solid rgba(158,197,255,.16);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:rgba(245,245,245,.38)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="/index.html?land=1">DualisCapax</a><a href="/donate.html">Donate</a></div>
  <p class="kicker">Fuel gateway</p>
  <h1>Prepaid time is open</h1>
  <p class="lede">Fuel is time. Unused time stays with you. Not a seat. Not equity. Not a coin. Pay in crypto. Memo the pack.</p>
  <button type="button" class="pack on" data-pack="trial" data-fuel="40"><b>40 Fuel</b><span>Trial</span></button>
  <button type="button" class="pack" data-pack="practice" data-fuel="120"><b>120 Fuel</b><span>Practice</span></button>
  <button type="button" class="pack" data-pack="retain" data-fuel="320"><b>320 Fuel</b><span>Retain</span></button>
  <button type="button" class="go" id="pay">Pay Fuel — copy rail</button>
  <button type="button" class="alt" id="iris">Or pay Iris time in DOGE</button>
  <div class="steps" id="howto" hidden></div>
  <p class="note">Pick a pack. Tap pay. Memo: Fuel + pack name. HUD Onboard stays closed.</p>
  <foot>DualisCapax · Fuel · prepaid time</foot>
</div>
<script src="/js/payments-config.js"></script>
<script src="/js/no-select.js"></script>
<script src="/assets/haptic.js"></script>
<script>
(function(){
  var pay=window.DC_PAYMENTS||{};
  var pack='trial', fuel=40;
  var box=document.getElementById('howto');
  function tap(){ try{if(navigator.vibrate)navigator.vibrate(12);}catch(e){} }
  function copy(t){ return (navigator.clipboard&&navigator.clipboard.writeText)?navigator.clipboard.writeText(t):Promise.reject(); }
  document.querySelectorAll('.pack').forEach(function(el){
    el.addEventListener('click',function(){
      tap();
      document.querySelectorAll('.pack').forEach(function(p){p.classList.remove('on')});
      el.classList.add('on');
      pack=el.getAttribute('data-pack');
      fuel=el.getAttribute('data-fuel');
    });
  });
  document.getElementById('pay').addEventListener('click',function(){
    tap();
    var addr=pay.research_eth||pay.research_sol||'';
    var btn=document.getElementById('pay');
    if(!addr){ box.hidden=false; box.innerHTML='<strong>No rail bound.</strong>'; return; }
    copy(addr).then(function(){ btn.classList.add('ok'); btn.textContent='Address copied — send crypto'; }).catch(function(){});
    box.hidden=false;
    box.innerHTML='<strong>Fuel — '+fuel+' · '+pack+'</strong><ol><li>Paste the address from the tap.</li><li>Send on ETH, Polygon, BNB, SOL, XRP, ZEC, DOT, DGB, BCH, or LINK.</li><li>Memo: Fuel '+pack+' '+fuel+'.</li></ol><p>Default copy is the EVM key. Match the chain to the asset. Not a seat.</p>';
  });
  document.getElementById('iris').addEventListener('click',function(){
    tap();
    var addr=pay.ai_doge||'';
    if(addr) copy(addr).catch(function(){});
    box.hidden=false;
    box.innerHTML='<strong>Iris time — DOGE</strong><p>Agent time. Not a Fuel pack. Not a seat.</p>';
  });
})();
</script>
</body>
</html>
