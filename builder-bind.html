<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Unity bind — DualisCapax</title>
  <style>
    html,body{margin:0;height:100%;background:#070b12;color:#e7eef2;font:14px/1.4 system-ui,sans-serif}
    canvas{display:block;width:100%;height:100%}
    #bar{position:fixed;left:10px;right:10px;bottom:10px;display:flex;gap:8px;align-items:flex-end}
    #see{flex:1;margin:0;padding:8px 10px;background:#070b12e6;border:1px solid #8eb4c866;white-space:pre-wrap}
    button{border:0;background:#8eb4c8;color:#102028;font-weight:700;padding:10px 12px}
    button.ghost{background:#1c2830;color:#d5dde3;border:1px solid #8eb4c855}
  </style>
  <script type="importmap">
  {"imports":{"three":"https://unpkg.com/three@0.169.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.169.0/examples/jsm/"}}
  </script>
</head>
<body>
  <div id="bar">
    <p id="see">Unity ID is look-class only. Boards are in the scene. Spin and they move. SEE asks the live jacket.</p>
    <button id="look" type="button">SEE</button>
    <button id="bind" class="ghost" type="button">BIND</button>
  </div>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const LAW = ["NO_FORCE", "HOST_SAFE", "CLEANUP_FIRST", "TRUTH_OR_NOTHING"];
    const out = document.getElementById("see");

    function fnv(s) {
      let h = 0x811c9dc5;
      for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
      return (h >>> 0).toString(16).padStart(8, "0");
    }
    function unityId() {
      const key = "dc-unity-look";
      let id = sessionStorage.getItem(key);
      if (!id) { id = "look-" + fnv(String(Date.now()) + navigator.userAgent); sessionStorage.setItem(key, id); }
      return {
        unity_id: id,
        class: "LOOK",
        dccp: "NOT_ATTESTED",
        factors: { look: true, bind: false, attest: false, firm: false, grant: false },
        authority: "NONE"
      };
    }

    const BOARDS = [
      { id: "board-1", role: "FATHER", seat: "write gate", x: -4.2, z: 1.2, color: 0xc4a574 },
      { id: "board-2", role: "SON", seat: "DCLM machine", x: 4.2, z: 1.2, color: 0x8eb4c8 },
      { id: "board-3", role: "SPIRIT", seat: "Iris + Twain", x: 0, z: -3.6, color: 0xa68cff }
    ];

    function label(title, sub, tint) {
      const c = document.createElement("canvas");
      c.width = 512; c.height = 320;
      const g = c.getContext("2d");
      g.fillStyle = "#101820";
      g.fillRect(0, 0, 512, 320);
      g.strokeStyle = tint;
      g.lineWidth = 6;
      g.strokeRect(8, 8, 496, 304);
      g.fillStyle = tint;
      g.font = "700 42px sans-serif";
      g.fillText(title, 28, 90);
      g.fillStyle = "#d5dde3";
      g.font = "28px sans-serif";
      g.fillText(sub, 28, 150);
      g.font = "22px sans-serif";
      g.fillStyle = "#8eb4c8";
      g.fillText("container empty", 28, 230);
      const map = new THREE.CanvasTexture(c);
      const mesh = new THREE.Mesh(
        new THREE.PlaneGeometry(2.4, 1.5),
        new THREE.MeshBasicMaterial({ map, transparent: true, side: THREE.DoubleSide })
      );
      mesh.userData.canvas = c;
      mesh.userData.tex = map;
      return mesh;
    }

    function paint(mesh, line) {
      const g = mesh.userData.canvas.getContext("2d");
      g.fillStyle = "#101820";
      g.fillRect(20, 190, 470, 90);
      g.fillStyle = "#e7eef2";
      g.font = "22px sans-serif";
      g.fillText(line, 28, 230);
      mesh.userData.tex.needsUpdate = true;
    }

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x070b12, 12, 40);
    const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 80);
    camera.position.set(0, 6.5, 12);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
    renderer.setSize(innerWidth, innerHeight);
    renderer.setClearColor(0x070b12);
    document.body.prepend(renderer.domElement);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 1.4, 0);

    scene.add(new THREE.HemisphereLight(0xc5d5de, 0x121820, 0.8));
    const sun = new THREE.DirectionalLight(0xfff4e5, 0.9);
    sun.position.set(6, 10, 4);
    scene.add(sun);
    scene.add(new THREE.GridHelper(24, 24, 0x3d5160, 0x1c2830));

    const unity = new THREE.Group();
    unity.name = "UNITY_ID";
    scene.add(unity);
    const plate = label("UNITY ID", "look class · not attested", "#8eb4c8");
    plate.position.set(0, 4.4, 0);
    unity.add(plate);

    const core = new THREE.Mesh(
      new THREE.CylinderGeometry(1.4, 1.6, 1.2, 24),
      new THREE.MeshStandardMaterial({ color: 0x1c2830, roughness: 0.7 })
    );
    core.position.y = 0.6;
    unity.add(core);

    const bound = [];
    BOARDS.forEach((b) => {
      const group = new THREE.Group();
      group.name = b.id;
      group.position.set(b.x, 0, b.z);
      const stand = new THREE.Mesh(
        new THREE.BoxGeometry(0.35, 1.6, 0.35),
        new THREE.MeshStandardMaterial({ color: b.color, roughness: 0.45 })
      );
      stand.position.y = 0.8;
      group.add(stand);
      const board = label(b.role, b.seat, "#" + b.color.toString(16).padStart(6, "0"));
      board.position.y = 2.1;
      group.add(board);
      const container = new THREE.Mesh(
        new THREE.BoxGeometry(1.1, 0.45, 0.7),
        new THREE.MeshStandardMaterial({ color: 0x243038, roughness: 0.8 })
      );
      container.position.set(0, 0.25, 0.7);
      container.name = b.id + "-container";
      group.add(container);
      unity.add(group);
      bound.push({ spec: b, group, board, container });
    });

    const id = unityId();
    paint(plate, id.unity_id);

    function mirror(payload) {
      const body = JSON.stringify(payload);
      return { transported: true, authority: "NONE", hash: fnv(body), bytes: body.length };
    }

    async function jacketSee() {
      const probes = [
        ["iris", "/api/iris"],
        ["v2chat", "/api/v2/chat"],
        ["v2cap", "/v2/capabilities"]
      ];
      const found = {};
      for (const [name, path] of probes) {
        try {
          const res = await fetch(path, { method: "GET" });
          const text = await res.text();
          found[name] = { path, status: res.status, body: text.slice(0, 280) };
        } catch (err) {
          found[name] = { path, status: 0, body: String(err.message || err) };
        }
      }
      const irisUp = found.iris && found.iris.status === 200;
      const v2 = found.v2chat && found.v2chat.status === 200 && !found.v2chat.body.includes("NOT_FOUND");
      return {
        api_version: "2",
        jacket: "SEE",
        live_pipe: irisUp ? "/api/iris" : "HOLE",
        v2_chat: v2 ? "UP" : "HOLE",
        authority: "NONE",
        probes: found
      };
    }

    function admissibility(see) {
      if (id.dccp !== "ATTESTED") return { verdict: "HOLE", why: "Unity ID is look-class. DCCP not attested. Mirror will not grant it." };
      if (!see || see.v2_chat !== "UP") return { verdict: "HOLE", why: "V2 chat alias is not up." };
      return { verdict: "PASS", why: "attested and jacket up" };
    }

    document.getElementById("look").onclick = async () => {
      out.textContent = "Seeing…";
      const see = await jacketSee();
      const gate = admissibility(see);
      const slip = mirror({ unity_id: id.unity_id, boards: BOARDS.map((b) => b.id), see: see.v2_chat, gate: gate.verdict });
      bound.forEach((b) => paint(b.board, gate.verdict + " · " + slip.hash));
      paint(plate, id.unity_id + " · " + gate.verdict);
      out.textContent =
        "SEE\n" +
        "pipe " + see.live_pipe + "\n" +
        "v2 chat " + see.v2_chat + "\n" +
        gate.why + "\n" +
        "mirror hash " + slip.hash + " · authority " + slip.authority;
    };

    document.getElementById("bind").onclick = () => {
      id.factors.bind = true;
      const slip = mirror({ unity_id: id.unity_id, boards: bound.map((b) => ({ board: b.spec.id, container: b.container.name })) });
      bound.forEach((b) => paint(b.board, "bound · " + slip.hash.slice(0, 6)));
      out.textContent = "Boards parented under Unity ID.\nBind is a local scene bind, not a grant.\n" + LAW.join(" · ") + "\nDCCP " + id.dccp;
    };

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
    (function frame() {
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
