name = "dualiscapax-landing"
pages_build_output_dir = "."
compatibility_date = "2026-09-04"

# Canonical apex: dualiscapax.com, served by this Cloudflare Pages project.
# dualiscapax.ai chains to the canonical apex with a permanent redirect
# (zone Redirect Rule; see docs/ops/CLOUDFLARE-REDIRECT-AI-TO-COM.md).
# Production rail: wrangler pages deploy of the lander package.
# Single rail: GitHub Pages is retired (.github/workflows/deploy.yml) and
# this repository carries no CNAME file and no second serving claim.
# [previews] is Workers Builds only. Pages rejects it. Do not add it here.

# Secrets (set via wrangler secret put or dashboard):
#   SIGNING_SECRET  — HMAC-SHA256 shared secret for /v1/authorize

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[durable_objects.bindings]]
name = "AUDIT_LOG"
class_name = "AuditLog"

[[migrations]]
tag = "v1-trinity-auth"
new_classes = ["RateLimiter", "AuditLog"]
