<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exchange — DualisCapax</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="brand">DUALISCAPAX</div>
  <nav><a href="/">Poster</a><a href="/pay.html">Pay</a></nav>
</header>
<main>
  <h1>HTTP 402</h1>
  <p class="lead">0.01 USDC. Exact. The receipt is withheld until the facilitator settles.</p>
  <form id="exchange">
    <label class="check"><input type="radio" name="network" value="eip155:8453" checked> Base</label>
    <label class="check"><input type="radio" name="network" value="eip155:84532"> Base Sepolia</label>
    <button type="submit">Exchange</button>
  </form>
  <p id="status" role="status">Asking the exchange.</p>
  <pre id="receipt" style="white-space:pre-wrap;word-break:break-all;text-align:left"></pre>
  <p><a href="/">Back to the poster</a></p>
</main>
<script type="module">
import { decodeHeader } from "/js/x402-exchange.js";

const status = document.querySelector("#status");
const receipt = document.querySelector("#receipt");
const form = document.querySelector("#exchange");
const endpoint = "/api/x402/exchange";

function say(text) { status.textContent = text; }

async function readRequired(response) {
  const header = response.headers.get("PAYMENT-REQUIRED");
  if (header) {
    try { return decodeHeader(header); } catch (err) { /* body still carries it */ }
  }
  return response.json();
}

async function ask() {
  const response = await fetch(endpoint, { headers: { accept: "application/json" } });
  const body = await readRequired(response);
  if (response.status !== 402) {
    say("The exchange did not ask for payment.");
    receipt.textContent = JSON.stringify(body, null, 2);
    return null;
  }
  say("Payment required. 0.01 USDC. Nothing has moved.");
  receipt.textContent = JSON.stringify(body.accepts, null, 2);
  return body;
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  await ask();
  say("Payment required. The sovereign coin is Trinity's own. Nothing has moved.");
});

ask();
</script>
</body>
</html>
