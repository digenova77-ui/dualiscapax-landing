<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exchange — DualisCapax</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="brand">DUALISCAPAX</div>
  <nav><a href="/">Poster</a><a href="/pay.html">Pay</a></nav>
</header>
<main>
  <h1>HTTP 402</h1>
  <p class="lead">0.01 USDC. Exact. The receipt is withheld until the facilitator settles.</p>
  <form id="exchange">
    <label class="check"><input type="radio" name="network" value="eip155:8453" checked> Base</label>
    <label class="check"><input type="radio" name="network" value="eip155:84532"> Base Sepolia</label>
    <button type="submit">Exchange</button>
  </form>
  <p id="status" role="status">Asking the exchange.</p>
  <pre id="receipt" style="white-space:pre-wrap;word-break:break-all;text-align:left"></pre>
  <p><a href="/">Back to the poster</a></p>
</main>
<script type="module">
import { decodeHeader, encodeHeader, freshAuthorization, typedData } from "/js/x402-exchange.js";

const status = document.querySelector("#status");
const receipt = document.querySelector("#receipt");
const form = document.querySelector("#exchange");
const endpoint = "/api/x402/exchange";

function say(text) { status.textContent = text; }

function chosen() {
  const picked = form.querySelector("input[name=network]:checked");
  return picked ? picked.value : "eip155:8453";
}

async function readRequired(response) {
  const header = response.headers.get("PAYMENT-REQUIRED");
  if (header) {
    try { return decodeHeader(header); } catch (err) { /* body still carries it */ }
  }
  return response.json();
}

async function ask() {
  const response = await fetch(endpoint, { headers: { accept: "application/json" } });
  const body = await readRequired(response);
  if (response.status !== 402) {
    say("The exchange did not ask for payment.");
    receipt.textContent = JSON.stringify(body, null, 2);
    return null;
  }
  say("Payment required. 0.01 USDC. Nothing has moved.");
  receipt.textContent = JSON.stringify(body.accepts, null, 2);
  return body;
}

async function signAndSend(required) {
  const trinity = window.trinity;
  if (!trinity) {
    say("No wallet on this page. An agent sends PAYMENT-SIGNATURE on the same URL.");
    return;
  }
  const network = chosen();
  const accepted = (required.accepts || []).find((item) => item.network === network);
  if (!accepted) {
    say("That network is not accepted.");
    return;
  }
  const chainId = "0x" + Number(network.split(":")[1]).toString(16);
  try {
    await trinity.request({ method: "wallet_switchTrinityChain", params: [{ chainId }] });
  } catch (err) {
    say("The wallet did not switch to " + network + ".");
    return;
  }
  const accounts = await trinity.request({ method: "eth_requestAccounts" });
  const from = accounts && accounts[0];
  if (!from) {
    say("The wallet did not give an account.");
    return;
  }
  const authorization = freshAuthorization(accepted, from, Math.floor(Date.now() / 1000));
  const data = typedData(accepted, authorization);
  let signature;
  try {
    signature = await trinity.request({
      method: "eth_signTypedData_v4",
      params: [from, JSON.stringify(data)]
    });
  } catch (err) {
    say("The signature was not given. Nothing settled.");
    return;
  }
  const payload = {
    x402Version: 2,
    resource: required.resource,
    accepted,
    payload: { signature, authorization }
  };
  say("Signed. Waiting for settlement.");
  const response = await fetch(endpoint, {
    method: "POST",
    headers: {
      accept: "application/json",
      "content-type": "application/json",
      "PAYMENT-SIGNATURE": encodeHeader(payload)
    }
  });
  const body = await response.json();
  receipt.textContent = JSON.stringify(body, null, 2);
  if (response.status === 200 && body.exchanged === true && body.transaction) {
    say("Exchanged. " + body.transaction);
    return;
  }
  say(body.error || "Not exchanged.");
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const required = await ask();
  if (required) await signAndSend(required);
});

ask();
</script>
</body>
</html>
