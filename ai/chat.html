<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050508" />
  <title>Adaptive Intelligence · DualisCapax</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050508;
      --panel: rgba(12, 12, 18, 0.82);
      --line: rgba(255,255,255,0.12);
      --text: #f4f4f5;
      --muted: #a1a1aa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
    }
    body {
      min-height: 100dvh;
      overflow: hidden;
      background:
        radial-gradient(ellipse 100% 70% at 50% -10%, rgba(90,110,160,0.22), transparent 55%),
        radial-gradient(ellipse 80% 50% at 100% 30%, rgba(255,255,255,0.04), transparent 45%),
        #050508;
    }

    .shell {
      height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding:
        calc(0.75rem + env(safe-area-inset-top))
        0
        env(safe-area-inset-bottom);
    }

    /* Hero banner */
    .banner {
      position: relative;
      margin: 0 0.85rem;
      border: 1px solid var(--line);
      border-radius: 22px;
      overflow: hidden;
      min-height: 148px;
      isolation: isolate;
      box-shadow: 0 18px 50px rgba(0,0,0,0.35);
    }
    .banner-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      background:
        linear-gradient(120deg, rgba(5,5,8,0.2), rgba(5,5,8,0.78) 55%, rgba(5,5,8,0.92)),
        radial-gradient(circle at 78% 40%, rgba(180,195,230,0.28), transparent 42%),
        repeating-linear-gradient(90deg, transparent 0 28px, rgba(255,255,255,0.045) 29px),
        repeating-linear-gradient(0deg, transparent 0 28px, rgba(255,255,255,0.03) 29px),
        linear-gradient(160deg, #10131c, #07080d 60%, #050508);
    }
    .banner-bg::after {
      content: "";
      position: absolute;
      left: -10%;
      right: -10%;
      bottom: -55%;
      height: 100%;
      background:
        linear-gradient(180deg, transparent, rgba(5,5,8,0.65)),
        radial-gradient(ellipse at center, rgba(140,160,210,0.16), transparent 65%);
      transform: perspective(500px) rotateX(55deg);
      transform-origin: center bottom;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .banner-ui {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 0.85rem;
      padding: 0.95rem 1rem 1.1rem;
      min-height: 148px;
    }
    .banner-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .back {
      color: rgba(255,255,255,0.72);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.4rem 0.65rem;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(8px);
    }
    .fuel {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.4rem 0.7rem;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(8px);
    }
    .fuel.empty { border-color: rgba(248,113,113,0.55); color: #f87171; }
    .banner-title-wrap {
      display: grid;
      gap: 0.25rem;
      align-content: end;
      padding-bottom: 0.15rem;
    }
    .banner-kicker {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
    }
    .banner-title {
      font-size: clamp(1.55rem, 7vw, 2.35rem);
      line-height: 0.98;
      font-weight: 800;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      text-shadow: 0 2px 18px rgba(0,0,0,0.45);
      max-width: 12ch;
    }

    /* Chat stage */
    .stage {
      min-height: 0;
      display: grid;
      grid-template-rows: 1fr auto;
      margin: 0.85rem;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--panel);
      backdrop-filter: blur(14px);
      overflow: hidden;
    }
    .log {
      min-height: 0;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .msg {
      max-width: min(92%, 34rem);
      padding: 0.9rem 1rem;
      border-radius: 18px;
      font-size: 1.02rem;
      line-height: 1.5;
    }
    .msg.bot {
      align-self: flex-start;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .msg.user {
      align-self: flex-end;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.16);
    }
    .msg .who {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      margin-bottom: 0.35rem;
    }

    .dock {
      border-top: 1px solid rgba(255,255,255,0.08);
      padding: 0.75rem;
      display: grid;
      gap: 0.65rem;
      background: rgba(0,0,0,0.22);
    }
    .chips {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.1rem;
    }
    .chips button {
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
      color: rgba(255,255,255,0.8);
      font: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.5rem 0.85rem;
      border-radius: 999px;
    }
    .composer {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.55rem;
      align-items: end;
    }
    .composer textarea {
      width: 100%;
      resize: none;
      min-height: 48px;
      max-height: 120px;
      padding: 0.8rem 1rem;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(10,10,14,0.9);
      color: #fff;
      font: inherit;
      font-size: 1.02rem;
    }
    .composer button {
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 14px;
      background: #fff;
      color: #0a0a0c;
      font-size: 1.15rem;
      font-weight: 800;
    }
    .composer button:disabled { opacity: 0.4; }
    .buy {
      display: none;
      padding: 0.75rem 0.85rem;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
      font-size: 0.92rem;
      color: var(--muted);
    }
    .buy.show { display: block; }
    .buy a {
      display: inline-block;
      margin-top: 0.45rem;
      color: #0a0a0c;
      background: #fff;
      text-decoration: none;
      font-weight: 700;
      padding: 0.5rem 0.8rem;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="banner">
      <div class="banner-bg" aria-hidden="true"></div>
      <div class="banner-ui">
        <div class="banner-row">
          <a class="back" href="../index.html">← Home</a>
          <div class="fuel" id="fuel">Fuel —</div>
        </div>
        <div class="banner-title-wrap">
          <div class="banner-kicker">DualisCapax</div>
          <h1 class="banner-title">Adaptive Intelligence</h1>
        </div>
      </div>
    </header>

    <section class="stage" aria-label="Chat">
      <div class="log" id="log"></div>
      <div class="dock">
        <div class="buy" id="buy">
          Fuel empty. Depth pauses.
          <div><a href="../pay.html">Add Fuel</a></div>
        </div>
        <div class="chips">
          <button type="button" data-q="What is DualisCapax?">What is DualisCapax?</button>
          <button type="button" data-q="What is Fuel?">Fuel</button>
          <button type="button" data-q="How does access work?">Access</button>
        </div>
        <form class="composer" id="form">
          <textarea id="input" rows="1" placeholder="Message (uses Fuel)…"></textarea>
          <button type="submit" id="send" aria-label="Send">↑</button>
        </form>
      </div>
    </section>
  </div>

  <script src="../js/fuel-ledger.js"></script>
  <script src="../js/api-config.js"></script>
  <script>
  (function () {
    var log = document.getElementById('log');
    var input = document.getElementById('input');
    var form = document.getElementById('form');
    var fuelEl = document.getElementById('fuel');
    var buy = document.getElementById('buy');
    var sendBtn = document.getElementById('send');
    var history = [];

    function uiFuel() {
      var b = DCFuel.balance();
      fuelEl.textContent = 'Fuel ' + b;
      fuelEl.className = 'fuel' + (b <= 0 ? ' empty' : '');
      buy.className = 'buy' + (b <= 0 ? ' show' : '');
      sendBtn.disabled = b <= 0;
    }

    function add(who, text) {
      var d = document.createElement('div');
      d.className = 'msg ' + who;
      d.innerHTML = '<div class="who">' + (who === 'user' ? 'You' : 'DualisCapax') + '</div>' + text;
      log.appendChild(d);
      log.scrollTop = log.scrollHeight;
    }

    function localAnswer(q) {
      var s = (q || '').toLowerCase();
      if (s.indexOf('fuel') >= 0) return 'Fuel pays for depth AI so the server is not free-drained. Open research stays free.';
      if (s.indexOf('dualis') >= 0) return 'DualisCapax: networked plane — open research, metered adaptive intelligence, equal rules.';
      if (s.indexOf('access') >= 0) return 'Open layer free. Depth burns Fuel. Live Grok runs only via server API key.';
      return 'Demo engine (no server key configured). Deploy server/worker.js and set DC_API_BASE for live Grok.';
    }

    async function serverAnswer(messages) {
      var base = (window.DC_API_BASE || '').replace(/\/$/, '');
      if (!base) return null;
      var res = await fetch(base + '/api/chat', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-DC-Fuel': String(DCFuel.balance())
        },
        body: JSON.stringify({ messages: messages })
      });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
      return data.content || '';
    }

    async function send(text) {
      text = (text || '').trim();
      if (!text) return;
      var burn = DCFuel.burn(1);
      uiFuel();
      if (!burn.ok) {
        add('bot', 'No Fuel. Add Fuel to continue depth.');
        return;
      }
      add('user', text);
      input.value = '';
      history.push({ role: 'user', content: text });
      sendBtn.disabled = true;
      try {
        var live = await serverAnswer(history.slice(-12));
        var reply = live !== null ? live : localAnswer(text);
        history.push({ role: 'assistant', content: reply });
        add('bot', reply + ' · Fuel ' + burn.balance);
      } catch (e) {
        add('bot', 'Server error: ' + (e.message || e) + ' — falling back.');
        var fb = localAnswer(text);
        history.push({ role: 'assistant', content: fb });
        add('bot', fb);
      }
      uiFuel();
    }

    form.onsubmit = function (e) { e.preventDefault(); send(input.value); };
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(input.value); }
    });
    document.querySelectorAll('.chips button').forEach(function (b) {
      b.onclick = function () { send(b.getAttribute('data-q')); };
    });

    uiFuel();
    var mode = window.DC_API_BASE ? 'Live server path ready' : 'Demo mode';
    add('bot', 'Adaptive Intelligence online. Depth uses Fuel. ' + mode + '.');
  })();
  </script>
</body>
</html>
