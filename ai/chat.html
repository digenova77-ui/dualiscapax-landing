<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#020203">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AI · DualisCapax</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;overflow:hidden;background:#020203;color:#f3f2ef;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
.app{height:100%;height:100dvh;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.top{display:flex;align-items:center;gap:.6rem;padding:.75rem 1rem;
  border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0}
.top a.back{font-size:1.35rem;color:rgba(255,255,255,.5);text-decoration:none;padding:.2rem .35rem}
.top .title{flex:1;font-size:.95rem;font-weight:600}
.fuel{
  font-size:.75rem;letter-spacing:.06em;
  padding:.35rem .65rem;border-radius:999px;
  border:1px solid rgba(201,162,39,.45);color:#C9A227;
  background:rgba(201,162,39,.1);white-space:nowrap;
}
.fuel.empty{border-color:rgba(239,68,68,.5);color:#f87171;background:rgba(239,68,68,.1)}
.log{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:1rem;display:flex;flex-direction:column;gap:.85rem}
.msg{max-width:92%;padding:.85rem 1rem;border-radius:16px;font-size:1.05rem;line-height:1.45}
.msg.bot{align-self:flex-start;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.msg.user{align-self:flex-end;background:rgba(201,162,39,.2);border:1px solid rgba(201,162,39,.35)}
.msg .who{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:#C9A227;margin-bottom:.35rem}
.chips{display:flex;gap:.5rem;overflow-x:auto;padding:0 1rem .55rem;flex-shrink:0}
.chips button{flex-shrink:0;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);
  color:rgba(255,255,255,.75);font-size:.85rem;padding:.45rem .85rem;border-radius:999px;white-space:nowrap}
.composer{flex-shrink:0;display:flex;gap:.5rem;align-items:flex-end;
  padding:.75rem 1rem calc(.75rem + env(safe-area-inset-bottom));
  border-top:1px solid rgba(255,255,255,.08);background:#0a0a0c}
.composer textarea{flex:1;resize:none;min-height:44px;max-height:120px;padding:.75rem 1rem;
  border-radius:22px;border:1px solid rgba(255,255,255,.12);background:#12141a;color:#fff;
  font-size:1.05rem;font-family:inherit;line-height:1.35}
.composer button{width:48px;height:48px;border-radius:50%;border:none;background:#C9A227;color:#0a0a0a;
  font-size:1.2rem;font-weight:700;cursor:pointer;flex-shrink:0}
.composer button:disabled{opacity:.4}
.buy{display:none;padding:.75rem 1rem;background:#1a1008;border-top:1px solid rgba(201,162,39,.3);flex-shrink:0}
.buy.show{display:block}
.buy p{font-size:.95rem;margin-bottom:.65rem;color:rgba(255,255,255,.75)}
.buy a{display:inline-block;padding:.65rem 1rem;border-radius:12px;background:#C9A227;color:#0a0a0a;font-weight:600;text-decoration:none}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="back" href="../index.html" aria-label="Back">←</a>
    <div class="title">Adaptive Intelligence</div>
    <div class="fuel" id="fuel">Fuel —</div>
  </header>
  <div class="log" id="log"></div>
  <div class="chips">
    <button type="button" data-q="What is DualisCapax?">What is DualisCapax?</button>
    <button type="button" data-q="What is Fuel credit?">What is Fuel?</button>
    <button type="button" data-q="How does access work?">Access</button>
  </div>
  <div class="buy" id="buy">
    <p>Fuel empty. Depth chat pauses so the backend is not run free.</p>
    <a href="../participate.html">Buy Fuel credit</a>
  </div>
  <form class="composer" id="form">
    <textarea id="input" rows="1" placeholder="Message (uses Fuel)…" enterkeyhint="send"></textarea>
    <button type="submit" id="send" aria-label="Send">↑</button>
  </form>
</div>
<script src="../js/fuel-ledger.js"></script>
<script src="../js/payments-config.js"></script>
<script>
(function () {
  var log = document.getElementById('log');
  var input = document.getElementById('input');
  var form = document.getElementById('form');
  var fuelEl = document.getElementById('fuel');
  var buy = document.getElementById('buy');
  var sendBtn = document.getElementById('send');

  function uiFuel() {
    var b = DCFuel.balance();
    fuelEl.textContent = 'Fuel ' + b;
    fuelEl.className = 'fuel' + (b <= 0 ? ' empty' : '');
    buy.className = 'buy' + (b <= 0 ? ' show' : '');
    sendBtn.disabled = b <= 0;
    // live payment link if configured
    var link = (window.DC_PAYMENTS && DC_PAYMENTS.fuel) || '';
    if (link) buy.querySelector('a').href = link;
  }

  function add(who, text) {
    var d = document.createElement('div');
    d.className = 'msg ' + who;
    d.innerHTML = '<div class="who">' + (who === 'user' ? 'You' : 'DualisCapax') + '</div>' + text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  }

  function answer(q) {
    var s = (q || '').toLowerCase();
    if (s.indexOf('fuel') >= 0) {
      return 'Fuel credit pays for depth AI so the backend is not free-drained. Open research stays free. Each message here burns Fuel. Buy more when empty — see participate / Fuel packs when payments are live.';
    }
    if (s.indexOf('dualis') >= 0) {
      return 'DualisCapax builds a networked plane: open research, metered adaptive intelligence, equal rules. Depth runs on Fuel so capacity stays solvent.';
    }
    if (s.indexOf('access') >= 0) {
      return 'Open layer is free to learn. Adaptive chat burns Fuel. When xAI/Grok API is wired server-side, the same Fuel debit authorizes real model calls under DualisCapax’s API account.';
    }
    return 'Hybrid dialogue (demo engine). Fuel was debited. When the live Grok/xAI backend is connected on the server, answers run on paid API calls backed by your Fuel — not a shared personal login.';
  }

  function send(text) {
    text = (text || '').trim();
    if (!text) return;
    var burn = DCFuel.burn(1);
    uiFuel();
    if (!burn.ok) {
      add('bot', 'No Fuel left. Buy Fuel credit to continue depth chat. Open pages stay free.');
      return;
    }
    add('user', text);
    input.value = '';
    setTimeout(function () {
      add('bot', answer(text) + ' · Fuel left: ' + burn.balance);
    }, 320);
  }

  form.onsubmit = function (e) { e.preventDefault(); send(input.value); };
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(input.value); }
  });
  document.querySelectorAll('.chips button').forEach(function (b) {
    b.onclick = function () { send(b.getAttribute('data-q')); };
  });

  uiFuel();
  add('bot', 'Full-screen AI chat. Depth uses Fuel credit so the backend stays funded. Balance shown top-right. Demo credits included for beta.');
})();
</script>
</body>
</html>
