<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Watch Iris — DualisCapax</title>
  <meta name="theme-color" content="#050505" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/cta.css" />
  <script src="../assets/spine-nav.js" defer></script>
  <style>
    :root { --bg:#050505; --fg:#f5f5f5; --muted:rgba(245,245,245,0.55); --faint:rgba(245,245,245,0.28); --line:rgba(255,255,255,0.09); }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:Inter,system-ui,sans-serif; background:var(--bg); color:var(--fg); line-height:1.55; min-height:100dvh; font-size:1.12rem; }
    a { color:inherit; text-decoration:none; }
    .site { max-width:42rem; margin:0 auto; padding:0 max(1.15rem, env(safe-area-inset-right)) 0 max(1.15rem, env(safe-area-inset-left)); }
    .eyebrow { font-size:0.86rem; font-weight:600; letter-spacing:0.16em; text-transform:uppercase; color:var(--muted); margin-bottom:1.1rem; }
    h1 { font-size:clamp(2.2rem,9vw,3.2rem); font-weight:800; line-height:0.92; letter-spacing:-0.045em; text-transform:uppercase; margin-bottom:1.1rem; }
    .statement { font-size:1.2rem; line-height:1.55; color:var(--muted); max-width:34rem; margin-bottom:1.2rem; }
    .frame {
      width:100%;
      height:min(78dvh, 44rem);
      border:1px solid var(--line);
      border-radius:12px;
      background:#050508;
      display:block;
    }
    .under { margin-top:0.85rem; font-size:1.05rem; color:var(--muted); }
    .under a { text-decoration:underline; text-underline-offset:0.18em; }
    footer { padding:2.25rem 0 2.75rem; border-top:1px solid var(--line); font-size:0.95rem; color:var(--faint); text-align:center; margin-top:2rem; }
    main { padding:1.5rem 0 0.5rem; }
  </style>
</head>
<body>
  <div class="site">
    <div class="top">
      <a href="/?land=1" class="mark">DualisCapax</a>
      <div class="top-links">
        <a href="/for-people">For you</a>
        <a href="/research/">Look</a>
        <a href="/ai/">Adaptive AI</a>
        <a href="/ai/app">Ask</a>
      </div>
    </div>
    <main>
      <div class="eyebrow">Research · Adaptive AI</div>
      <h1>Watch her</h1>
      <p class="statement">You take an empty place. She takes another empty one. Nothing here is named as a game.</p>
      <iframe class="frame" src="/ai/nursery" title="Iris walking" allow="autoplay"></iframe>
      <p class="under"><a href="/ai/app">Ask her</a> · <a href="/research/">Back to research</a></p>
    </main>
    <footer>DualisCapax · Iris · framed walk</footer>
  </div>
</body>
</html>
