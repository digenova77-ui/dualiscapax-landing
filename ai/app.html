<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050508" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Iris" />
  <title>Iris · DualisCapax</title>
  <link rel="manifest" href="manifest-dclm.json" />
  <link rel="icon" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050508;
      --text: #f4f4f5;
      --muted: rgba(244,244,245,0.52);
      --line: rgba(255,255,255,0.10);
      --cyan: #4a9fe0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
      overflow: hidden;
    }
    body {
      height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      min-height: 3rem;
      padding: env(safe-area-inset-top) max(0.85rem, env(safe-area-inset-right)) 0 max(0.85rem, env(safe-area-inset-left));
      border-bottom: 1px solid var(--line);
      background: #050508;
    }
    .brand {
      display: flex;
      align-items: center;
      min-width: 0;
      text-decoration: none;
      color: inherit;
    }
    .brand img {
      height: 1.28rem;
      width: auto;
      display: block;
    }
    .who {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0.4rem 0;
    }

    .log {
      position: relative;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 1rem max(1rem, env(safe-area-inset-right)) 1rem max(1rem, env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }
    .bubble {
      max-width: min(36rem, 92%);
      padding: 0.8rem 0.95rem;
      border-radius: 16px;
      font-size: 1.02rem;
      line-height: 1.5;
    }
    .bubble.them {
      align-self: flex-start;
      background: rgba(255,255,255,0.045);
      border: 1px solid var(--line);
    }
    .bubble.you {
      align-self: flex-end;
      background: rgba(74,159,224,0.12);
      border: 1px solid rgba(74,159,224,0.28);
    }

    .stage {
      display: none;
      position: absolute;
      top: 0.7rem;
      right: max(0.7rem, env(safe-area-inset-right));
      width: 4.4rem;
      height: 5.4rem;
      z-index: 2;
    }
    .stage.on { display: block; }
    .stage video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #000;
    }

    .dock {
      border-top: 1px solid var(--line);
      padding: 0.55rem max(0.75rem, env(safe-area-inset-right)) calc(0.55rem + env(safe-area-inset-bottom)) max(0.75rem, env(safe-area-inset-left));
      background: #050508;
    }
    .err {
      font-size: 0.78rem;
      color: #f87171;
      margin-bottom: 0.35rem;
    }
    form {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 0.4rem;
      align-items: end;
    }
    form button.icon,
    form button.send {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      font-size: 1.05rem;
      line-height: 1;
    }
    form button.icon {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text);
    }
    form button.icon.on {
      background: var(--cyan);
      color: #050508;
      border-color: var(--cyan);
    }
    textarea {
      width: 100%;
      min-height: 44px;
      max-height: 88px;
      resize: none;
      padding: 0.7rem 0.85rem;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #0a0b10;
      color: #fff;
      font: inherit;
      font-size: 1.02rem;
      line-height: 1.35;
    }
    form button.send {
      border: 0;
      background: #fff;
      color: #050508;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/index.html?land=1">
      <img src="/brand/logo-mark-dark.svg" alt="DualisCapax" />
    </a>
    <div class="who" id="who">Iris</div>
  </header>

  <div class="log" id="log">
    <div class="stage" id="stage">
      <video id="you" autoplay muted playsinline aria-label="You"></video>
    </div>
  </div>

  <div class="dock">
    <p class="err" id="err" hidden></p>
    <form id="form">
      <button class="icon" type="button" id="talk" aria-label="Talk">●</button>
      <textarea id="input" rows="1" placeholder="Message Iris"></textarea>
      <button class="send" type="submit" aria-label="Send">↑</button>
    </form>
    <input id="file" type="file" hidden accept="image/jpeg,image/png,image/webp,text/plain,text/markdown,text/csv,application/json,application/pdf,.txt,.md,.csv,.json,.pdf" />
  </div>

  <script src="dclm-look.js"></script>
  <script>
  (function () {
    if (navigator.serviceWorker) {
      navigator.serviceWorker.register("./sw.js", { scope: "./" }).then(function (r) {
        if (r.waiting) r.waiting.postMessage("SKIP_WAITING");
      }).catch(function () {});
    }
    var log = document.getElementById("log");
    var errEl = document.getElementById("err");
    var you = document.getElementById("you");
    var stage = document.getElementById("stage");
    var input = document.getElementById("input");
    var stream = null;
    var rec = null;
    var listening = false;
    var videoOn = false;
    var taps = 0;
    var tapTimer = 0;

    function showErr(t) {
      errEl.hidden = !t;
      errEl.textContent = t || "";
    }
    function add(who, html) {
      var d = document.createElement("div");
      d.className = "bubble " + who;
      d.textContent = html;
      log.appendChild(d);
      log.scrollTop = log.scrollHeight;
    }
    function speakOut(text) {
      if (!window.speechSynthesis) return;
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(String(text || "").slice(0, 420));
      u.rate = 0.94;
      window.speechSynthesis.speak(u);
    }
    function fitBox() {
      input.style.height = "44px";
      input.style.height = Math.min(88, input.scrollHeight) + "px";
    }
    async function send(text) {
      text = (text || "").trim();
      if (!text) return;
      add("you", text);
      input.value = "";
      fitBox();
      if (!window.DCLMLook) {
        add("them", "I do not know that leftover. I will not invent it.");
        return;
      }
      var recu = await DCLMLook.run(text, { voice: "you", case_id: "look-app" });
      var spoken = recu && recu.spoken ? recu.spoken : "I do not know that leftover. I will not invent it.";
      add("them", spoken);
      speakOut(spoken);
    }
    async function hexOf(s) {
      var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
      return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, "0"); }).join("");
    }

    document.getElementById("form").addEventListener("submit", function (e) {
      e.preventDefault();
      send(input.value);
    });
    input.addEventListener("input", fitBox);
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send(input.value);
      }
    });

    document.getElementById("talk").addEventListener("click", function () {
      var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { showErr("Talk needs a mic on this phone. Type instead."); return; }
      if (listening && rec) { rec.stop(); listening = false; document.getElementById("talk").classList.remove("on"); return; }
      rec = new SR();
      rec.lang = "en-CA";
      rec.interimResults = false;
      rec.onresult = function (ev) { send(ev.results[0][0].transcript); };
      rec.onend = function () { listening = false; document.getElementById("talk").classList.remove("on"); };
      rec.onerror = rec.onend;
      listening = true;
      document.getElementById("talk").classList.add("on");
      rec.start();
    });

    document.getElementById("who").addEventListener("click", function () {
      taps += 1;
      clearTimeout(tapTimer);
      tapTimer = setTimeout(function () { taps = 0; }, 600);
      if (taps < 3) return;
      taps = 0;
      if (videoOn) {
        if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
        stream = null;
        you.srcObject = null;
        videoOn = false;
        stage.classList.remove("on");
        return;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showErr("Camera did not open.");
        return;
      }
      navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false }).then(function (s) {
        stream = s;
        you.srcObject = s;
        videoOn = true;
        stage.classList.add("on");
        showErr("");
      }).catch(function () { showErr("Camera did not open."); });
    });

    var hold;
    document.querySelector(".send").addEventListener("pointerdown", function () {
      hold = setTimeout(function () { document.getElementById("file").click(); }, 650);
    });
    document.querySelector(".send").addEventListener("pointerup", function () { clearTimeout(hold); });
    document.querySelector(".send").addEventListener("pointerleave", function () { clearTimeout(hold); });

    document.getElementById("file").addEventListener("change", async function (e) {
      var f = e.target.files && e.target.files[0];
      e.target.value = "";
      if (!f) return;
      add("you", f.name || "A file leftover.");
      var receipt = await hexOf([f.name, f.size, f.lastModified, f.type].join("|"));
      var spoken = "Leftover of a file leftover named " + (f.name || "unnamed").slice(0, 80) + ". " + f.size + " bytes. Receipt " + receipt.slice(0, 16) + "…. She keeps a receipt. Not the body.";
      add("them", spoken);
      speakOut(spoken);
    });

    add("them", "Iris. Ask. If I do not know, I will say so.");
  })();
  </script>
</body>
</html>
