<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#050508"/>
<meta http-equiv="Cache-Control" content="no-cache"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Iris"/>
<title>Iris · DualisCapax</title>
<link rel="manifest" href="manifest-dclm.json"/>
<link rel="icon" href="icon.svg"/>
<style>
:root{--bg:#050508;--fg:#f4f4f5;--muted:rgba(244,244,245,.88);--line:rgba(158,197,255,.18);--blue:#9ec5ff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg);color:var(--fg);font-family:ui-sans-serif,system-ui,sans-serif}
body{min-height:100dvh;display:grid;grid-template-rows:auto minmax(18rem,1fr) auto;overflow-x:hidden;overflow-y:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
header{display:flex;align-items:center;gap:.55rem;min-height:2.8rem;padding:env(safe-area-inset-top) max(.8rem,env(safe-area-inset-right)) 0 max(.8rem,env(safe-area-inset-left))}
.brand{display:flex;align-items:center;text-decoration:none;color:inherit}
.brand img{height:1.15rem;width:auto}
.who{margin-left:.35rem;font:600 .68rem/1 ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;color:rgba(244,244,245,.62)}
.tools{margin-left:auto;display:flex;gap:.35rem}
.tools button{min-width:2.4rem;height:2.4rem;padding:0 .4rem;border:1px solid var(--line);background:transparent;color:var(--fg);font:600 .72rem ui-monospace,monospace}
.tools button.on{border-color:var(--blue);color:var(--blue)}
.plate{position:relative;min-height:18rem;display:grid;place-items:center;padding:1rem 0}
.presence{width:min(78vw,26rem);height:min(78vw,26rem);max-height:52rem}
.presence canvas{display:block;width:100%;height:100%}
/* Iris is a roaming presence, not a viewport-locked panel. Position is transient and never persisted. */
#presence.iris-floater{position:fixed;z-index:20;width:min(42vw,12rem);height:min(42vw,12rem);max-height:none;pointer-events:auto;touch-action:pan-y;will-change:transform;filter:drop-shadow(0 0 1.2rem rgba(56,189,248,.12))}
@media(min-width:700px){#presence.iris-floater{width:min(24vw,16rem);height:min(24vw,16rem)}}
@media(prefers-reduced-motion:reduce){#presence.iris-floater{will-change:auto}}
.pip{position:absolute;right:max(.7rem,env(safe-area-inset-right));bottom:.7rem;width:min(34vw,9.5rem);border:1px solid var(--line);background:#000;display:none}
.pip.on{display:block}
.pip video{display:block;width:100%;height:auto}
.dock{padding:.4rem max(.8rem,env(safe-area-inset-right)) calc(.7rem + env(safe-area-inset-bottom)) max(.8rem,env(safe-area-inset-left));text-align:center}
.caption{
  min-height:2.8rem;
  max-height:none;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  font:500 clamp(1.08rem,4.4vw,1.32rem)/1.4 system-ui,sans-serif;
  color:var(--muted);
  padding:0 .55rem;
}
.caption.long{
  font:500 clamp(.95rem,3.6vw,1.12rem)/1.4 system-ui,sans-serif;
  text-align:left;
}
.talk{width:5.4rem;height:5.4rem;margin:.45rem auto 0;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--fg);font:700 .72rem/1 ui-monospace,monospace;letter-spacing:.14em}
.talk.on{border-color:var(--blue);color:#050508;background:var(--blue)}
.err{color:#f87171;font-size:.78rem;min-height:1rem;margin-top:.25rem}
#quat-hud{display:none !important}
</style>
</head>
<body>
<header>
  <a class="brand" href="/index.html"><img src="/brand/logo-mark-dark.svg" alt="DualisCapax home"/><span class="who">Iris</span></a>
  <div class="tools">
    <button type="button" id="cam" aria-pressed="false" aria-label="Camera">cam</button>
    <button type="button" id="filebtn" aria-label="Show her a file">file</button>
    <button type="button" id="screen" aria-pressed="false" aria-label="This page">here</button>
    <button type="button" id="hang" aria-label="Hang up">×</button>
  </div>
</header>
<main class="plate">
  <div class="presence" id="presence" aria-label="Iris"></div>
  <div class="pip" id="pip"><video id="you" autoplay muted playsinline></video></div>
</main>
<div class="dock">
  <p class="caption" id="caption"></p>
  <button type="button" class="talk" id="talk" aria-pressed="false">TALK</button>
  <p class="err" id="err" hidden role="alert"></p>
</div>
<input id="irisLocalFile" type="file" hidden accept="image/jpeg,image/png,image/webp,text/plain,text/markdown,text/csv,application/json,application/pdf,.txt,.md,.csv,.json,.pdf"/>
<p class="sr" id="announce" aria-live="assertive"></p>
<script src="/js/dsap-engine.js?v=54"></script>
<script src="/js/iris-sphere.js?v=54"></script>
<script src="/js/iris-voice.js?v=54"></script>
<script src="/js/iris-av.js?v=54"></script>
<script src="/js/iris-policy.js?v=54"></script>
<script src="/js/iris-page.js?v=54"></script>
<script src="/js/iris-guest.js?v=54"></script>
<script src="iris-book.js?v=54"></script>
<script src="/js/iris-fuel-gate.js?v=54"></script>
<script src="/js/iris-session.js?v=54"></script>
<script src="dclm-look.js?v=54"></script>
<script>
(function(){
  var cap=document.getElementById("caption");
  var errEl=document.getElementById("err");
  var talk=document.getElementById("talk");
  var pip=document.getElementById("pip");
  var rec=null, busy=false, primed=false, synthWatch=0, greeted=false;

  function showErr(m){ if(!m){errEl.hidden=true;errEl.textContent="";return;} errEl.hidden=false;errEl.textContent=m; }
  function line(t){
    var s=String(t||"");
    cap.textContent=s;
    cap.classList.toggle("long", s.length>88);
    cap.scrollTop=0;
    document.getElementById("announce").textContent=s;
  }
  function greetText(){
    return (window.IrisGuest && IrisGuest.greetLine) ? IrisGuest.greetLine() : "Hey. I'm Iris. What should I call you? Tap Talk if you want to say it.";
  }
  function primeVoice(){
    primed=true;
    if(window.IrisAV&&IrisAV.unlock) IrisAV.unlock();
    if(window.DSAP&&DSAP.unlock) DSAP.unlock().catch(function(){});
    if(!window.speechSynthesis) return;
    try{
      speechSynthesis.cancel();
      var warm=new SpeechSynthesisUtterance(" ");
      warm.volume=0.01;
      warm.rate=1;
      speechSynthesis.speak(warm);
    }catch(e){}
  }
  function keepSynth(){
    if(!window.speechSynthesis) return;
    try{ if(speechSynthesis.paused) speechSynthesis.resume(); }catch(e){}
  }
  function speakNow(spoken){
    var text=String(spoken||"").trim();
    if(!text) return;
    if(window.IrisAV&&IrisAV.unlock) IrisAV.unlock();
    if(synthWatch) clearInterval(synthWatch);
    synthWatch=setInterval(keepSynth, 220);
    setTimeout(function(){ if(synthWatch){ clearInterval(synthWatch); synthWatch=0; } }, 20000);
    if(window.IrisAV&&IrisAV.speak){
      IrisAV.speak(text, function(){ if(synthWatch){ clearInterval(synthWatch); synthWatch=0; } });
      return;
    }
    if(window.speechSynthesis){
      var u=new SpeechSynthesisUtterance(text.slice(0,900));
      u.rate=0.98; u.pitch=1;
      if(window.IrisVoice&&IrisVoice.applyUtterance) IrisVoice.applyUtterance(u);
      u.onend=function(){ if(synthWatch){ clearInterval(synthWatch); synthWatch=0; } };
      speechSynthesis.cancel();
      keepSynth();
      speechSynthesis.speak(u);
    }
  }
  function meet(){
    if(greeted) return;
    greeted=true;
    primeVoice();
    var spoken=greetText();
    if(window.IrisGuest&&IrisGuest.markAsked) IrisGuest.markAsked();
    line(spoken);
    speakNow(spoken);
  }
  if(window.IrisSphere&&IrisSphere.mount) IrisSphere.mount("#presence");
  if(window.IrisSphere&&IrisSphere.setWoken) IrisSphere.setWoken(true);

  // Ambient, non-authoritative motion only: no storage, network calls, or self-editing.
  // Iris drifts slowly through the open middle of the viewport and yields to people.
  (function letIrisRoam(){
    var orb=document.getElementById("presence");
    if(!orb) return;
    orb.classList.add("iris-floater");
    var reduced=!!(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    var x=.5,y=.46,tx=.5,ty=.46,lastMove=0,holdUntil=0,rafId=0,seed=17;
    var active=false;
    function rand(){seed=(seed*48271)%2147483647;return seed/2147483647;}
    function bounds(){
      var w=window.innerWidth||360,h=window.innerHeight||640;
      var rect=orb.getBoundingClientRect(), hw=Math.max(36,rect.width/2), hh=Math.max(36,rect.height/2);
      return {w:w,h:h,minX:hw+12,maxX:w-hw-12,minY:Math.max(90,hh+52),maxY:Math.min(h-hh-125,h*.78)};
    }
    function choose(){
      var b=bounds();
      if(b.maxX<=b.minX||b.maxY<=b.minY) return;
      tx=(b.minX+rand()*(b.maxX-b.minX))/b.w;
      ty=(b.minY+rand()*(b.maxY-b.minY))/b.h;
      lastMove=performance.now();
    }
    function nearControls(px,py){
      var els=[document.querySelector("header"),document.querySelector(".dock"),document.querySelector(".pip")];
      return els.some(function(el){
        if(!el||el.hidden||getComputedStyle(el).display==="none") return false;
        var r=el.getBoundingClientRect();
        return px>r.left-24&&px<r.right+24&&py>r.top-24&&py<r.bottom+24;
      });
    }
    function tick(now){
      rafId=requestAnimationFrame(tick);
      var b=bounds();
      if(reduced||document.hidden||document.activeElement===talk||talk.classList.contains("on")||
         (document.getElementById("cam")&&document.getElementById("cam").classList.contains("on"))||
         (window.speechSynthesis&&speechSynthesis.speaking)||now<holdUntil) return;
      if(now-lastMove>8500) choose();
      var nx=x+(tx-x)*.0035, ny=y+(ty-y)*.0035;
      var px=nx*b.w,py=ny*b.h;
      if(nearControls(px,py)){holdUntil=now+2200;choose();return;}
      x=nx;y=ny;
      orb.style.transform="translate3d("+Math.round(x*b.w)+"px,"+Math.round(y*b.h)+"px,0) translate(-50%,-50%)";
    }
    function yieldToHuman(ev){
      holdUntil=performance.now()+6500;
      if(ev&&typeof ev.clientX==="number"&&typeof ev.clientY==="number"){
        var b=bounds();x=ev.clientX/b.w;y=ev.clientY/b.h;
        orb.style.transform="translate3d("+ev.clientX+"px,"+ev.clientY+"px,0) translate(-50%,-50%)";
      }
    }
    orb.addEventListener("pointerdown",yieldToHuman,{passive:true});
    document.addEventListener("pointermove",function(ev){
      var r=orb.getBoundingClientRect();
      if(ev.clientX>r.left-45&&ev.clientX<r.right+45&&ev.clientY>r.top-45&&ev.clientY<r.bottom+45) yieldToHuman(ev);
    },{passive:true});
    window.addEventListener("resize",function(){holdUntil=performance.now()+1200;},{passive:true});
    choose();
    orb.style.transform="translate3d(50vw,46vh,0) translate(-50%,-50%)";
    if(!reduced) rafId=requestAnimationFrame(tick);
    else orb.style.transform="translate3d(50vw,46vh,0) translate(-50%,-50%)";
  })();
  line(greetText());
  window.addEventListener("pointerdown", meet, { capture: true, once: true });
  window.addEventListener("keydown", meet, { capture: true, once: true });

  async function hear(text){
    text=String(text||"").trim();
    if(!text||busy) return;
    busy=true;
    line("…");
    try{
      var guest = window.IrisGuest ? IrisGuest.rememberFrom(text) : null;
      if(guest && guest.name && window.IrisGuest.parseName && IrisGuest.parseName(text)){
        var hello = "Good to meet you, " + guest.name + ". I'm the person at this table for DualisCapax. What do you want to know?";
        line(hello);
        speakNow(hello);
        busy=false;
        return;
      }
      var recu = window.IrisSession&&IrisSession.think
        ? await IrisSession.think(text)
        : window.DCLMLook&&DCLMLook.run
          ? await DCLMLook.run(text)
          : {spoken:"I'm Iris."};
      var spoken=(recu&&recu.spoken)||"I'm Iris.";
      line(spoken);
      speakNow(spoken);
    }catch(e){ showErr("She could not answer."); line("Say that again."); }
    busy=false;
  }

  function startRec(){
    if(window.IrisAV&&IrisAV.releaseMicTracks) IrisAV.releaseMicTracks();
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){ showErr("This browser cannot hear. That's okay — tap TALK still unlocks her mouth."); return false; }
    rec=new SR();
    rec.lang=(window.IrisVoice&&IrisVoice.locale&&IrisVoice.locale())||(navigator.language||"en");
    rec.continuous=false; rec.interimResults=true;
    rec.onresult=function(ev){
      var t="";
      for(var i=ev.resultIndex;i<ev.results.length;i++) t+=ev.results[i][0].transcript;
      line(t||"…");
      if(ev.results[ev.results.length-1].isFinal) hear(t);
    };
    rec.onerror=function(){ talk.classList.remove("on"); talk.setAttribute("aria-pressed","false"); };
    rec.onend=function(){ talk.classList.remove("on"); talk.setAttribute("aria-pressed","false"); if(window.IrisSphere&&IrisSphere.setListening) IrisSphere.setListening(false); };
    rec.start();
    return true;
  }

  talk.addEventListener("click",function(){
    var on=!talk.classList.contains("on");
    showErr("");
    meet();
    primeVoice();
    if(window.IrisAV&&IrisAV.releaseMicTracks) IrisAV.releaseMicTracks();
    if(on){
      if(!startRec()) return;
      talk.classList.add("on"); talk.setAttribute("aria-pressed","true");
      if(window.IrisSphere&&IrisSphere.setListening) IrisSphere.setListening(true);
      line("I'm listening.");
    }else{
      if(rec) try{rec.stop();}catch(e){}
      talk.classList.remove("on"); talk.setAttribute("aria-pressed","false");
      if(window.IrisSphere&&IrisSphere.setListening) IrisSphere.setListening(false);
    }
  });

  document.getElementById("cam").addEventListener("click",function(){
    var btn=document.getElementById("cam");
    var on=!btn.classList.contains("on");
    meet();
    primeVoice();
    if(window.IrisAV&&IrisAV.camera){
      IrisAV.camera(on).then(function(res){
        var live=!!(res&&res.live);
        btn.classList.toggle("on",live);
        btn.setAttribute("aria-pressed",live?"true":"false");
        pip.classList.toggle("on",live);
      }).catch(function(){ showErr("Camera blocked."); });
      return;
    }
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ showErr("Camera did not open."); return; }
    if(!on){
      var vid=document.getElementById("you");
      if(vid && vid.srcObject){ vid.srcObject.getTracks().forEach(function(t){t.stop();}); vid.srcObject=null; }
      pip.classList.remove("on"); btn.classList.remove("on"); return;
    }
    navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false}).then(function(s){
      document.getElementById("you").srcObject=s;
      pip.classList.add("on"); btn.classList.add("on"); btn.setAttribute("aria-pressed","true");
    }).catch(function(){ showErr("Camera blocked."); });
  });

  document.getElementById("screen").addEventListener("click",function(){
    showErr("");
    meet();
    primeVoice();
    var spoken = (window.IrisPage && IrisPage.here && IrisPage.here().spoken)
      || "You're with me in the lab. I already know this page.";
    line(spoken);
    speakNow(spoken);
  });

  document.getElementById("filebtn").addEventListener("click",function(){
    meet();
    document.getElementById("irisLocalFile").click();
  });
  document.getElementById("irisLocalFile").addEventListener("change",function(ev){
    var f = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if(!f) return;
    var note = "Got " + f.name + ". I'll look at it here on this device. What do you want to know about it?";
    line(note);
    speakNow(note);
  });

  document.getElementById("hang").addEventListener("click",function(){
    if(rec) try{rec.stop();}catch(e){}
    if(window.IrisAV&&IrisAV.stopAll) IrisAV.stopAll();
    if(window.speechSynthesis) speechSynthesis.cancel();
    talk.classList.remove("on");
    document.getElementById("cam").classList.remove("on");
    document.getElementById("screen").classList.remove("on");
    pip.classList.remove("on");
    line("Whenever you're ready.");
  });
})();
</script>
</body>
</html>
