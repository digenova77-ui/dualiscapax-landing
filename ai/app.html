<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#050508"/>
<title>Iris · DualisCapax</title>
<meta name="description" content="Talk to Iris. DualisCapax agent. Short answers. First person."/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{color-scheme:dark;--fg:#f5f5f5;--muted:rgba(245,245,245,.68);--line:rgba(158,197,255,.22);--blue:#9ec5ff;--you:rgba(158,197,255,.12)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#050508;color:var(--fg);font-family:"IBM Plex Sans",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;min-height:100dvh;overflow:hidden}
.sr{position:absolute;left:-9999px}
header{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.55rem max(.75rem,env(safe-area-inset-right)) .45rem max(.75rem,env(safe-area-inset-left));border-bottom:1px solid var(--line);background:#050508}
header .brand{font:600 .72rem/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);text-decoration:none}
header .tools{display:flex;gap:.35rem}
header button{min-width:40px;min-height:40px;border:1px solid var(--line);background:transparent;color:var(--fg);font-size:.85rem;padding:.35rem .5rem}
#log{flex:1;overflow-y:auto;padding:1rem max(.75rem,env(safe-area-inset-right)) 1rem max(.75rem,env(safe-area-inset-left));display:flex;flex-direction:column;gap:.65rem}
.bubble{max-width:min(34rem,92%);padding:.85rem 1rem;font-size:1.12rem;line-height:1.55}
.bubble.them{align-self:flex-start;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.bubble.you{align-self:flex-end;background:var(--you);border:1px solid rgba(158,197,255,.28)}
.bubble a{display:inline-block;margin-top:.45rem;color:var(--blue);font:600 .8rem/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;text-decoration:none}
.dock{border-top:1px solid var(--line);padding:.45rem max(.75rem,env(safe-area-inset-right)) calc(.5rem + env(safe-area-inset-bottom)) max(.75rem,env(safe-area-inset-left));background:#050508}
.err{font-size:.78rem;color:#f87171;margin-bottom:.3rem}
form{display:flex;gap:.4rem;align-items:flex-end}
form button{width:44px;height:44px;border:1px solid var(--line);background:transparent;color:var(--fg);font-size:1rem}
textarea{width:100%;min-height:48px;max-height:120px;resize:none;padding:.75rem .85rem;border:1px solid var(--line);background:#0a0b10;color:#fff;font:inherit;font-size:1.1rem;line-height:1.4}
@media (max-width:40rem){
  .bubble{font-size:1.18rem;line-height:1.58;padding:.95rem 1.05rem}
  .bubble a{font-size:.85rem}
  textarea{font-size:1.14rem;min-height:52px}
  form button{width:48px;height:48px}
  .err{font-size:.85rem}
}
</style>
<script src="/js/api-unified.js"></script>
<script src="/ai/dclm-look.js"></script>
<script src="/ai/iris-live.js"></script>
</head>
<body>
<a class="sr" href="#input">Skip to message</a>
<header>
  <a class="brand" href="/">DualisCapax · Iris</a>
  <div class="tools">
    <button type="button" id="hear" aria-label="Speak last">Hear</button>
    <button type="button" id="cam" aria-label="Camera">Cam</button>
    <button type="button" id="clear" aria-label="Clear chat">Clear</button>
  </div>
</header>
<div id="log" role="log" aria-live="polite"></div>
<div class="dock">
  <div class="err" id="err" hidden></div>
  <form id="form">
    <button type="button" id="attach" aria-label="Attach">+</button>
    <button type="button" id="talk" aria-label="Talk">Mic</button>
    <textarea id="input" rows="1" placeholder="Ask Iris" aria-label="Message"></textarea>
    <button type="submit" aria-label="Send">→</button>
  </form>
  <input id="file" type="file" hidden accept="image/jpeg,image/png,image/webp,text/plain,text/markdown,text/csv,application/json,application/pdf,.txt,.md,.csv,.json,.pdf"/>
</div>
<script>
(function(){
  var log=document.getElementById("log");
  var input=document.getElementById("input");
  var err=document.getElementById("err");
  var lastSpoken="";
  var vision={live:false};
  function showErr(m){ if(!m){err.hidden=true;err.textContent="";return;} err.hidden=false;err.textContent=m; }
  function tap(){ try{ if(navigator.vibrate) navigator.vibrate(8); }catch(e){} }
  function historyFrom(){
    var rows=[];
    log.querySelectorAll(".bubble").forEach(function(b){
      rows.push({ role:b.classList.contains("you")?"user":"assistant", content:b.getAttribute("data-text")||b.textContent||"" });
    });
    return rows;
  }
  function addBubble(who, text, href, label){
    var d=document.createElement("div");
    d.className="bubble "+who;
    d.setAttribute("data-text", text||"");
    d.textContent=text||"";
    if(href){ var a=document.createElement("a"); a.href=href; a.textContent=label||"Open"; d.appendChild(document.createElement("br")); d.appendChild(a); }
    log.appendChild(d);
    log.scrollTop=log.scrollHeight;
    if(who==="them") lastSpoken=text||"";
    return d;
  }
  function fitBox(){ input.style.height="48px"; input.style.height=Math.min(120, input.scrollHeight)+"px"; }
  async function send(text){
    text=String(text||"").trim();
    if(!text) return;
    addBubble("you", text);
    input.value=""; fitBox();
    showErr("");
    try{
      var recu = window.IrisLive && window.IrisLive.run
        ? await window.IrisLive.run(text, { log:log, voice:"you", vision:vision, last:lastSpoken })
        : { spoken: "Four doors: Help, Bill, Fuel, Donate." };
      var spoken = (recu && recu.spoken) ? recu.spoken : "Four doors: Help, Bill, Fuel, Donate.";
      addBubble("them", spoken, recu && recu.href, recu && recu.label);
    }catch(e){
      showErr("Send failed.");
      addBubble("them", "Four doors: Help, Bill, Fuel, Donate.");
    }
  }
  document.getElementById("form").addEventListener("submit", function(e){ e.preventDefault(); tap(); send(input.value); });
  input.addEventListener("input", fitBox);
  input.addEventListener("keydown", function(e){ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); tap(); send(input.value); } });
  document.getElementById("clear").addEventListener("click", function(){
    log.querySelectorAll(".bubble").forEach(function(b){ b.remove(); });
    lastSpoken=""; showErr("");
  });
  document.getElementById("hear").addEventListener("click", function(){
    if(!lastSpoken||!window.speechSynthesis) return;
    var u=new SpeechSynthesisUtterance(lastSpoken);
    u.rate=1.02; window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
  });
  document.getElementById("cam").addEventListener("click", function(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ showErr("Camera did not open."); return; }
    navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false}).then(function(s){
      vision.live=true; showErr("Camera on.");
      setTimeout(function(){ s.getTracks().forEach(function(t){t.stop();}); vision.live=false; }, 8000);
    }).catch(function(){ showErr("Camera blocked."); });
  });
  document.getElementById("attach").addEventListener("click", function(){ document.getElementById("file").click(); });
  addBubble("them", "Hi. I'm Iris. Ask about your bill, Fuel, or Donate.");
})();
</script>
</body>
</html>
