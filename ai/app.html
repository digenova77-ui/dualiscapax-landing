<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#050508"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Iris"/>
<title>Iris · DualisCapax</title>
<link rel="manifest" href="manifest-dclm.json"/>
<link rel="icon" href="icon.svg"/>
<link rel="apple-touch-icon" href="icon.svg"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#050508;--fg:#f4f4f5;--muted:rgba(244,244,245,.55);--line:rgba(158,197,255,.18);--blue:#9ec5ff;--you:rgba(158,197,255,.14)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:"IBM Plex Sans",system-ui,sans-serif;overflow:hidden}
body{height:100dvh;display:grid;grid-template-rows:auto 1fr auto}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
header{display:flex;align-items:center;gap:.6rem;min-height:3rem;padding:env(safe-area-inset-top) max(.85rem,env(safe-area-inset-right)) 0 max(.85rem,env(safe-area-inset-left));border-bottom:1px solid var(--line);background:#050508}
.brand{display:flex;align-items:center;min-width:0;text-decoration:none;color:inherit}
.brand img{height:1.2rem;width:auto;display:block}
.who{margin-left:.2rem;font:600 .68rem/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.tools{margin-left:auto;display:flex;gap:.35rem}
.tools button{width:2.2rem;height:2.2rem;border:1px solid var(--line);background:transparent;color:var(--fg);font:600 .72rem "IBM Plex Mono",ui-monospace,monospace}
.tools button.on{border-color:var(--blue);color:var(--blue)}
.log{min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:1rem max(1rem,env(safe-area-inset-right)) 1rem max(1rem,env(safe-area-inset-left));display:flex;flex-direction:column;gap:.65rem}
.bubble{max-width:min(34rem,92%);padding:.85rem 1rem;font-size:1.12rem;line-height:1.55}
.bubble.them{align-self:flex-start;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.bubble.you{align-self:flex-end;background:var(--you);border:1px solid rgba(158,197,255,.28)}
.bubble a{display:inline-block;margin-top:.45rem;color:var(--blue);font:600 .8rem/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;text-decoration:none}
.stage{display:none;margin-bottom:.5rem}
.stage.on{display:block}
.stage video{width:min(100%,16rem);max-height:12rem;border:1px solid var(--line);background:#000}
.chips{display:flex;gap:.4rem;overflow-x:auto;padding:0 0 .45rem;scrollbar-width:none}
.chips button{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--blue);font:600 .68rem/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;padding:.5rem .75rem}
.dock{border-top:1px solid var(--line);padding:.45rem max(.75rem,env(safe-area-inset-right)) calc(.5rem + env(safe-area-inset-bottom)) max(.75rem,env(safe-area-inset-left));background:#050508}
.err{font-size:.78rem;color:#f87171;margin-bottom:.3rem}
form{display:grid;grid-template-columns:auto auto 1fr auto;gap:.35rem;align-items:end}
form button{width:44px;height:44px;border:1px solid var(--line);background:transparent;color:var(--fg);font-size:1rem}
form button.on{background:var(--blue);color:#050508;border-color:var(--blue)}
form button.send{border:0;background:#fff;color:#050508;font-weight:800}
textarea{width:100%;min-height:48px;max-height:120px;resize:none;padding:.75rem .85rem;border:1px solid var(--line);background:#0a0b10;color:#fff;font:inherit;font-size:1.1rem;line-height:1.4}
@media (max-width:40rem){
  .bubble{font-size:1.18rem;line-height:1.58;padding:.95rem 1.05rem}
  .bubble a{font-size:.85rem}
  textarea{font-size:1.14rem;min-height:52px}
  form button{width:48px;height:48px}
  .tools button{width:2.4rem;height:2.4rem}
  .who{font-size:.78rem}
  .chips button{font-size:.85rem;padding:.55rem .8rem}
}
</style>
</head>
<body>
<a class="sr" href="#input">Skip to message</a>
<header>
  <a class="brand" href="/index.html?land=1"><img src="/brand/logo-mark-dark.svg" alt="DualisCapax home"/><span class="who" id="who">Iris</span></a>
  <div class="tools">
    <button type="button" id="hear" class="on" aria-pressed="true" aria-label="Screen reader voice on">♪</button>
    <button type="button" id="cam" aria-pressed="false" aria-label="Open camera">□</button>
    <button type="button" id="wipe" aria-label="Clear chat">×</button>
  </div>
</header>
<div class="log" id="log" role="log" aria-live="polite" aria-relevant="additions" aria-label="Iris conversation">
  <div class="stage" id="stage"><video id="you" autoplay muted playsinline aria-label="Live camera"></video></div>
</div>
<p class="sr" id="announce" aria-live="assertive"></p>
<div class="dock">
  <div class="chips" id="chips" aria-label="Suggested questions">
    <button type="button" data-q="What can you do?">Help</button>
    <button type="button" data-q="Can you see me?">See</button>
    <button type="button" data-q="Read the screen">Read</button>
    <button type="button" data-q="Ontario measure sheet">Bill</button>
  </div>
  <p class="err" id="err" hidden role="alert"></p>
  <form id="form" aria-label="Message Iris">
    <button type="button" id="filebtn" aria-label="Attach a file">+</button>
    <button type="button" id="talk" aria-pressed="false" aria-label="Talk">●</button>
    <textarea id="input" rows="1" placeholder="Ask Iris" aria-label="Message"></textarea>
    <button class="send" type="submit" aria-label="Send">↑</button>
  </form>
  <input id="file" type="file" hidden accept="image/jpeg,image/png,image/webp,text/plain,text/markdown,text/csv,application/json,application/pdf,.txt,.md,.csv,.json,.pdf"/>
</div>
<script src="/js/no-select.js"></script>
<script src="/assets/haptic.js"></script>
<script src="dclm-look.js?v=31b"></script>
<script src="iris-live.js?v=31b"></script>
<script>
(function(){
  if(navigator.serviceWorker){
    navigator.serviceWorker.register("./sw.js",{scope:"./"}).then(function(r){if(r.waiting)r.waiting.postMessage("SKIP_WAITING");}).catch(function(){});
  }
  var log=document.getElementById("log");
  var errEl=document.getElementById("err");
  var input=document.getElementById("input");
  var chips=document.getElementById("chips");
  var lastSpoken="";
  var vision={live:false};
  var stream=null;
  function showErr(m){ if(!m){errEl.hidden=true;errEl.textContent="";return;} errEl.hidden=false;errEl.textContent=m; }
  function addBubble(who,text,href,label){
    var d=document.createElement("div");
    d.className="bubble "+who;
    d.setAttribute("data-text",text||"");
    d.textContent=text||"";
    if(href){ var a=document.createElement("a"); a.href=href; a.textContent=label||"Open"; d.appendChild(document.createElement("br")); d.appendChild(a); }
    log.appendChild(d);
    log.scrollTop=log.scrollHeight;
    if(who==="them") lastSpoken=text||"";
    return d;
  }
  function fitBox(){ input.style.height="48px"; input.style.height=Math.min(120,input.scrollHeight)+"px"; }
  async function send(text){
    text=String(text||"").trim();
    if(!text) return;
    addBubble("you",text);
    input.value=""; fitBox();
    showErr("");
    if(chips) chips.style.display="none";
    try{
      var recu = (window.IrisLive && window.IrisLive.run)
        ? await window.IrisLive.run(text,{log:log,voice:"you",vision:vision,last:lastSpoken})
        : (window.DCLMLook && window.DCLMLook.run)
          ? await window.DCLMLook.run(text,{voice:"you",vision:vision,last:lastSpoken})
          : {spoken:"Four doors: Help, Bill, Fuel, Donate."};
      var spoken=(recu&&recu.spoken)?recu.spoken:"Four doors: Help, Bill, Fuel, Donate.";
      addBubble("them",spoken,recu&&recu.href,recu&&recu.label);
    }catch(e){
      showErr("Send failed.");
      addBubble("them","Four doors: Help, Bill, Fuel, Donate.");
    }
  }
  document.getElementById("form").addEventListener("submit",function(e){e.preventDefault();send(input.value);});
  input.addEventListener("input",fitBox);
  input.addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send(input.value);}});
  if(chips) chips.querySelectorAll("button").forEach(function(b){b.addEventListener("click",function(){send(b.getAttribute("data-q"));});});
  document.getElementById("wipe").addEventListener("click",function(){
    log.querySelectorAll(".bubble").forEach(function(b){b.remove();});
    lastSpoken=""; showErr(""); if(chips) chips.style.display="";
  });
  document.getElementById("hear").addEventListener("click",function(){
    var b=document.getElementById("hear");
    var on=b.classList.toggle("on");
    b.setAttribute("aria-pressed",on?"true":"false");
    if(on&&lastSpoken&&window.speechSynthesis){
      var u=new SpeechSynthesisUtterance(lastSpoken); u.rate=1.02;
      window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
    }
  });
  document.getElementById("cam").addEventListener("click",function(){
    var stage=document.getElementById("stage");
    var vid=document.getElementById("you");
    var btn=document.getElementById("cam");
    if(stream){
      stream.getTracks().forEach(function(t){t.stop();}); stream=null; vision.live=false;
      stage.classList.remove("on"); btn.classList.remove("on"); btn.setAttribute("aria-pressed","false"); return;
    }
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){showErr("Camera did not open.");return;}
    navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false}).then(function(s){
      stream=s; vision.live=true; vid.srcObject=s; stage.classList.add("on");
      btn.classList.add("on"); btn.setAttribute("aria-pressed","true"); showErr("");
    }).catch(function(){showErr("Camera blocked.");});
  });
  document.getElementById("filebtn").addEventListener("click",function(){document.getElementById("file").click();});
  addBubble("them","Hi. I'm Iris. Ask about your bill, Fuel, or Donate.");
})();
</script>
</body>
</html>
