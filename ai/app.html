<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Iris" />
  <title>Ask Iris · DualisCapax Logic AI</title>
  <link rel="manifest" href="manifest-dclm.json" />
  <link rel="icon" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #050505; color: #f5f5f5; font-family: "IBM Plex Sans", system-ui, sans-serif; }
    body { min-height: 100dvh; display: grid; grid-template-rows: auto auto 1fr auto; padding: calc(0.75rem + env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) 5.5rem max(1rem, env(safe-area-inset-left)); }
    header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 0.55rem; gap: 0.75rem; }
    .who-head { display: grid; gap: 0.1rem; text-align: center; flex: 1; }
    header strong { font-size: 0.82rem; letter-spacing: 0.18em; text-transform: uppercase; font-family: "IBM Plex Mono", ui-monospace, monospace; }
    header span { font-size: 0.72rem; color: rgba(158,197,255,0.75); letter-spacing: 0.08em; text-transform: uppercase; font-family: "IBM Plex Mono", ui-monospace, monospace; }
    .mark, .home { font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: #9ec5ff; text-decoration: none; font-family: "IBM Plex Mono", ui-monospace, monospace; min-height: 2.75rem; display: inline-flex; align-items: center; }
    .mark { color: #e8f1ff; }
    .stage { position: relative; display: none; margin-bottom: 0.65rem; border: 1px solid rgba(158,197,255,0.22); min-height: 11rem; background: #07090d; overflow: hidden; }
    .stage.on { display: block; }
    .stage video.you { position: absolute; right: 0.5rem; bottom: 0.5rem; width: 5.2rem; height: 6.4rem; object-fit: cover; border: 1px solid rgba(158,197,255,0.4); background: #000; }
    .iris-face { height: 11rem; display: flex; align-items: center; justify-content: center; font-family: "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.2em; text-transform: uppercase; color: #9ec5ff; font-size: 0.72rem; background: radial-gradient(ellipse at 50% 40%, rgba(158,197,255,0.16), transparent 62%); }
    .log { min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 0.85rem; padding: 0.25rem 0 1rem; }
    .bubble { max-width: 92%; padding: 0.9rem 1rem; border: 1px solid rgba(158,197,255,0.18); font-size: 1.02rem; line-height: 1.5; }
    .bubble.them { align-self: flex-start; background: rgba(12,18,28,0.92); }
    .bubble.you { align-self: flex-end; background: rgba(158,197,255,0.08); }
    .dock { padding-top: 0.7rem; border-top: 1px solid rgba(158,197,255,0.16); display: grid; gap: 0.55rem; }
    .tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.4rem; }
    .tools button { min-height: 2.75rem; border: 1px solid rgba(158,197,255,0.28); background: rgba(0,0,0,0.35); color: #e8f1ff; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; }
    .tools button.on { background: #9ec5ff; color: #050505; }
    .chips { display: flex; gap: 0.45rem; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .chips button { flex-shrink: 0; border: 1px solid rgba(158,197,255,0.28); background: rgba(0,0,0,0.35); color: #e8f1ff; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 0.72rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.5rem 0.75rem; }
    .chips.doors { display: none; }
    .chips.doors.on { display: flex; }
    form { display: grid; grid-template-columns: 1fr auto; gap: 0.5rem; }
    textarea { width: 100%; min-height: 52px; resize: none; padding: 0.85rem 1rem; border: 1px solid rgba(158,197,255,0.28); background: #05070a; color: #fff; font: inherit; font-size: 1.05rem; }
    form button { width: 52px; height: 52px; border: 0; background: #9ec5ff; color: #050505; font-weight: 700; font-size: 1.15rem; }
    .err { font-size: 0.82rem; color: #c45c4a; }
  </style>
</head>
<body>
  <header>
    <a class="mark" href="/index.html?land=1">DualisCapax</a>
    <div class="who-head">
      <strong>Iris</strong>
      <span>Logic AI</span>
    </div>
    <a class="home" href="/index.html?land=1">Home</a>
  </header>
  <div class="stage" id="stage">
    <div class="iris-face" id="iris-face">Iris</div>
    <video class="you" id="you" autoplay muted playsinline aria-label="You"></video>
  </div>
  <div class="log" id="log"></div>
  <div class="dock">
    <div class="tools">
      <button type="button" id="talk">Talk</button>
      <button type="button" id="video">Video</button>
      <button type="button" id="files">Files</button>
      <button type="button" id="doors">Doors</button>
    </div>
    <div class="chips doors" id="door-chips">
      <button type="button" data-q="Connectors">Connectors</button>
      <button type="button" data-q="Mail">Mail</button>
      <button type="button" data-q="Drive">Drive</button>
      <button type="button" data-q="GitHub">GitHub</button>
      <button type="button" data-q="Calendar">Calendar</button>
    </div>
    <div class="chips">
      <button type="button" data-q="Who is Iris?">Who is Iris?</button>
      <button type="button" data-q="What is DualisCapax Logic AI?">Logic AI</button>
      <button type="button" data-q="Leftover of relativity">Relativity</button>
      <button type="button" data-q="Leftover of a file leftover">File leftover</button>
    </div>
    <p class="err" id="err" hidden></p>
    <form id="form">
      <textarea id="input" rows="2" placeholder="Talk, type, or hand a leftover"></textarea>
      <button type="submit" aria-label="Send">↑</button>
    </form>
    <input id="file" type="file" hidden accept="image/jpeg,image/png,image/webp,text/plain,text/markdown,text/csv,application/json,application/pdf,.txt,.md,.csv,.json,.pdf" />
  </div>
  <script src="dclm-look.js"></script>
  <script>
  (function () {
    if (navigator.serviceWorker) {
      navigator.serviceWorker.register("./sw.js", { scope: "./" }).then(function (r) {
        if (r.waiting) r.waiting.postMessage("SKIP_WAITING");
      }).catch(function () {});
    }
    var log = document.getElementById("log");
    var errEl = document.getElementById("err");
    var you = document.getElementById("you");
    var stage = document.getElementById("stage");
    var stream = null;
    var rec = null;
    var listening = false;
    var videoOn = false;
    function showErr(t) {
      errEl.hidden = !t;
      errEl.textContent = t || "";
    }
    function add(who, html) {
      var d = document.createElement("div");
      d.className = "bubble " + who;
      d.textContent = html;
      log.appendChild(d);
      log.scrollTop = log.scrollHeight;
    }
    function speakOut(text) {
      if (!window.speechSynthesis) return;
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(String(text || "").slice(0, 420));
      u.rate = 0.94;
      window.speechSynthesis.speak(u);
    }
    async function send(text) {
      text = (text || "").trim();
      if (!text) return;
      add("you", text);
      document.getElementById("input").value = "";
      if (!window.DCLMLook) {
        add("them", "I do not know that leftover. I will not invent it.");
        return;
      }
      var recu = await DCLMLook.run(text, { voice: "you", case_id: "look-app" });
      var spoken = recu && recu.spoken ? recu.spoken : "I do not know that leftover. I will not invent it.";
      add("them", spoken);
      speakOut(spoken);
    }
    async function hexOf(s) {
      var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
      return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, "0"); }).join("");
    }
    document.getElementById("form").addEventListener("submit", function (e) {
      e.preventDefault();
      send(document.getElementById("input").value);
    });
    document.querySelectorAll(".chips button").forEach(function (b) {
      b.addEventListener("click", function () { send(b.getAttribute("data-q")); });
    });
    document.getElementById("talk").addEventListener("click", function () {
      var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { showErr("Talk leftover needs a mouth on this phone. Type instead."); return; }
      if (listening && rec) { rec.stop(); listening = false; document.getElementById("talk").classList.remove("on"); return; }
      rec = new SR();
      rec.lang = "en-CA";
      rec.interimResults = false;
      rec.onresult = function (ev) { send(ev.results[0][0].transcript); };
      rec.onend = function () { listening = false; document.getElementById("talk").classList.remove("on"); };
      rec.onerror = rec.onend;
      listening = true;
      document.getElementById("talk").classList.add("on");
      rec.start();
    });
    document.getElementById("video").addEventListener("click", function () {
      if (videoOn) {
        if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
        stream = null;
        you.srcObject = null;
        videoOn = false;
        stage.classList.remove("on");
        document.getElementById("video").classList.remove("on");
        return;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showErr("Video leftover did not open. Talk still sits.");
        return;
      }
      navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false }).then(function (s) {
        stream = s;
        you.srcObject = s;
        videoOn = true;
        stage.classList.add("on");
        document.getElementById("video").classList.add("on");
        showErr("");
      }).catch(function () {
        showErr("Camera leftover did not open. Talk still sits.");
      });
    });
    document.getElementById("files").addEventListener("click", function () {
      document.getElementById("file").click();
    });
    document.getElementById("file").addEventListener("change", async function (e) {
      var f = e.target.files && e.target.files[0];
      e.target.value = "";
      if (!f) return;
      add("you", f.name || "A file leftover.");
      var receipt = await hexOf([f.name, f.size, f.lastModified, f.type].join("|"));
      var spoken = "Leftover of a file leftover named " + (f.name || "unnamed").slice(0, 80) + ". " + f.size + " bytes. Receipt " + receipt.slice(0, 16) + "…. She keeps a receipt. Not the body. We do not copy a paper. Walk-back is I can take the file back.";
      add("them", spoken);
      speakOut(spoken);
    });
    document.getElementById("doors").addEventListener("click", function () {
      var row = document.getElementById("door-chips");
      var on = !row.classList.contains("on");
      row.classList.toggle("on", on);
      document.getElementById("doors").classList.toggle("on", on);
    });
    add("them", "She is Iris. DualisCapax Logic AI. Talk, sit on video, hand a file, or open a door. If I do not know, I will not invent it.");
  })();
  </script>
</body>
</html>
