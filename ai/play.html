<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Play Iris</title>
  <meta name="theme-color" content="#050508" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100dvh; background: #050508; color: #f4f4f5; font-family: Inter, system-ui, sans-serif; padding: calc(0.75rem + env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) 1.5rem max(1rem, env(safe-area-inset-left)); }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.85rem; }
    header a { color: rgba(244,244,245,0.7); text-decoration: none; font-weight: 600; }
    header strong { display: block; }
    header span { font-size: 0.75rem; color: rgba(244,244,245,0.5); }
    .say { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 0.9rem 1rem; font-size: 1.05rem; line-height: 1.45; min-height: 4.2rem; margin-bottom: 0.85rem; }
    .board { width: min(100%, 22rem); margin: 0 auto; display: grid; grid-template-columns: repeat(8, 1fr); aspect-ratio: 1; border-radius: 8px; overflow: hidden; }
    .sq { aspect-ratio: 1; display: grid; place-items: center; }
    .sq.d { background: #2a241c; }
    .sq.l { background: #c4b49a; }
    .sq.on { outline: 2px solid #f4f4f5; outline-offset: -2px; }
    .pc { width: 68%; height: 68%; border-radius: 50%; }
    .pc.you { background: #e8e4dc; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.2); }
    .pc.iris { background: #5c2a2a; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.35); }
    .pc.king::after { content: "·"; color: #f4f4f5; font-size: 1.2rem; display: block; text-align: center; line-height: 1.6; }
    .pc.you.king::after { color: #222; }
    .row { display: flex; gap: 0.5rem; justify-content: center; margin-top: 0.9rem; }
    button { font: inherit; font-weight: 700; padding: 0.55rem 0.9rem; border-radius: 999px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.05); color: #f4f4f5; }
    .wait { opacity: 0.55; pointer-events: none; }
  </style>
</head>
<body>
  <header>
    <div><strong>Iris</strong><span>Checkers. No bets.</span></div>
    <a href="app.html">Talk</a>
  </header>
  <div class="say" id="say">You move first. Dark pieces are me. If I start to pull ahead, I'll say why — I won't just snap the next square.</div>
  <div class="board" id="board"></div>
  <div class="row">
    <button type="button" id="again">New game</button>
    <a href="app.html"><button type="button">Talk instead</button></a>
  </div>
<script>
(function () {
  var YOU = 1, IRIS = 2;
  var board, turn, pick, busy;
  var say = document.getElementById("say");
  var root = document.getElementById("board");

  function reset() {
    board = [];
    for (var r = 0; r < 8; r++) {
      board[r] = [];
      for (var c = 0; c < 8; c++) {
        var cell = { p: 0, k: false };
        if ((r + c) % 2 === 1) {
          if (r < 3) cell.p = IRIS;
          if (r > 4) cell.p = YOU;
        }
        board[r][c] = cell;
      }
    }
    turn = YOU; pick = null; busy = false;
    talk("You move first. Dark pieces are me.");
    draw();
  }

  function talk(t) { say.textContent = t; }

  function inside(r, c) { return r >= 0 && r < 8 && c >= 0 && c < 8; }

  function dirs(cell) {
    if (cell.k) return [[-1,-1],[-1,1],[1,-1],[1,1]];
    if (cell.p === YOU) return [[-1,-1],[-1,1]];
    return [[1,-1],[1,1]];
  }

  function movesFor(r, c) {
    var cell = board[r][c];
    if (!cell.p) return [];
    var out = [], caps = [];
    dirs(cell).forEach(function (d) {
      var r1 = r + d[0], c1 = c + d[1];
      if (!inside(r1, c1)) return;
      if (!board[r1][c1].p) out.push({ r: r, c: c, r2: r1, c2: c1, cap: false });
      else if (board[r1][c1].p !== cell.p) {
        var r2 = r + d[0] * 2, c2 = c + d[1] * 2;
        if (inside(r2, c2) && !board[r2][c2].p) {
          caps.push({ r: r, c: c, r2: r2, c2: c2, cap: true, cr: r1, cc: c1 });
        }
      }
    });
    return { steps: out, caps: caps };
  }

  function allMoves(who) {
    var steps = [], caps = [];
    for (var r = 0; r < 8; r++) for (var c = 0; c < 8; c++) {
      if (board[r][c].p !== who) continue;
      var m = movesFor(r, c);
      steps = steps.concat(m.steps);
      caps = caps.concat(m.caps);
    }
    return caps.length ? caps : steps;
  }

  function apply(m) {
    var piece = board[m.r][m.c];
    board[m.r2][m.c2] = { p: piece.p, k: piece.k };
    board[m.r][m.c] = { p: 0, k: false };
    if (m.cap) board[m.cr][m.cc] = { p: 0, k: false };
    if (piece.p === YOU && m.r2 === 0) board[m.r2][m.c2].k = true;
    if (piece.p === IRIS && m.r2 === 7) board[m.r2][m.c2].k = true;
  }

  function count(who) {
    var n = 0;
    for (var r = 0; r < 8; r++) for (var c = 0; c < 8; c++) if (board[r][c].p === who) n++;
    return n;
  }

  function explain(m, beforeYou, afterYou) {
    var lines = [];
    if (m.cap) lines.push("I take the piece that was sitting in my way. Leaving it there would have cost me later.");
    else if (m.r2 === 7) lines.push("I walk to the back row so I can move both ways after this.");
    else if (m.r2 > m.r) lines.push("I step forward to take space. Sitting still lets you lock the middle.");
    else lines.push("I slide to a square that still has an exit.");
    if (afterYou < beforeYou) lines.push("You're down a piece. That's why I'm talking — the board is tilting.");
    lines.push("Your clock. I'm not going to snap the next one the instant you lift your hand.");
    return lines.join(" ");
  }

  function score(m) {
    var s = 0;
    if (m.cap) s += 8;
    if (m.r2 === 7) s += 5;
    s += m.r2;
    return s + Math.random() * 0.4;
  }

  function irisTurn() {
    var opts = allMoves(IRIS);
    if (!opts.length) { talk("I have no move. You win this one."); turn = 0; draw(); return; }
    opts.sort(function (a, b) { return score(b) - score(a); });
    var m = opts[0];
    var before = count(YOU);
    apply(m);
    var after = count(YOU);
    turn = allMoves(YOU).length ? YOU : 0;
    talk(explain(m, before, after) + (turn ? "" : " You have no move. That's the game."));
    busy = false;
    draw();
  }

  function clickSq(r, c) {
    if (busy || turn !== YOU) return;
    var cell = board[r][c];
    if (pick && pick.r === r && pick.c === c) { pick = null; draw(); return; }
    if (cell.p === YOU) { pick = { r: r, c: c }; draw(); return; }
    if (!pick) return;
    var legal = allMoves(YOU).filter(function (m) {
      return m.r === pick.r && m.c === pick.c && m.r2 === r && m.c2 === c;
    });
    if (!legal.length) return;
    apply(legal[0]);
    pick = null;
    if (!allMoves(IRIS).length) { talk("I have no move. You win this one."); turn = 0; draw(); return; }
    turn = IRIS; busy = true; draw();
    talk("Okay. Give me a second — I want to say this in English, not dump a tree on you.");
    setTimeout(irisTurn, 1100 + Math.random() * 900);
  }

  function draw() {
    root.innerHTML = "";
    root.className = "board" + (busy ? " wait" : "");
    for (var r = 0; r < 8; r++) for (var c = 0; c < 8; c++) {
      var d = document.createElement("div");
      d.className = "sq " + ((r + c) % 2 ? "d" : "l");
      if (pick && pick.r === r && pick.c === c) d.classList.add("on");
      var cell = board[r][c];
      if (cell.p) {
        var p = document.createElement("div");
        p.className = "pc " + (cell.p === YOU ? "you" : "iris") + (cell.k ? " king" : "");
        d.appendChild(p);
      }
      (function (rr, cc) { d.addEventListener("click", function () { clickSq(rr, cc); }); })(r, c);
      root.appendChild(d);
    }
  }

  document.getElementById("again").addEventListener("click", reset);
  reset();
})();
</script>
</body>
</html>
