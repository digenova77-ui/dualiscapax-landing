<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dualis floor — it runs</title>
  <style>
    html,body{margin:0;height:100%;background:#0c1216;color:#e7eef2;font:15px/1.4 system-ui,sans-serif}
    canvas{display:block;width:100%;height:100%}
    #hud{position:fixed;left:12px;right:12px;bottom:12px;display:flex;gap:8px;align-items:center;justify-content:space-between;pointer-events:none}
    #hud p{margin:0;padding:8px 10px;background:#0c1216cc;border:1px solid #8eb4c866;max-width:36rem}
    button{pointer-events:auto;border:0;background:#8eb4c8;color:#102028;font-weight:700;padding:10px 12px}
    #err{display:none;padding:24px;max-width:36rem}
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/",
      "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
    }
  }
  </script>
</head>
<body>
  <div id="err"><h1>Could not start the 3D floor</h1><p id="errtext"></p></div>
  <div id="hud"><p id="line">Drag to look. Scroll or pinch to zoom. Tap a pale node to shove it. Physics is cannon-es, stepped at 1/60. Iris bridge has no endpoint — nothing is fetched.</p><button id="shove" type="button">SHOVE NODES</button></div>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import * as CANNON from "cannon-es";

    const line = document.getElementById("line");
    const canvas = document.createElement("canvas");
    document.body.prepend(canvas);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
    renderer.setSize(innerWidth, innerHeight);
    renderer.setClearColor(0x0c1216);

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x0c1216, 18, 70);
    const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 200);
    camera.position.set(16, 10, 18);

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.target.set(0, 1.2, 0);
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.minDistance = 6;
    controls.maxDistance = 48;

    scene.add(new THREE.HemisphereLight(0xc5d5de, 0x1a242c, 0.7));
    const sun = new THREE.DirectionalLight(0xfff4e5, 1.1);
    sun.position.set(12, 20, 8);
    scene.add(sun);

    const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.81, 0) });
    world.broadphase = new CANNON.SAPBroadphase(world);
    world.allowSleep = true;
    const groundMat = new CANNON.Material("ground");
    const bodyMat = new CANNON.Material("body");
    world.addContactMaterial(new CANNON.ContactMaterial(groundMat, bodyMat, { friction: 0.35, restitution: 0.45 }));

    const pairs = [];
    function addStatic(mesh, shape, x, y, z) {
      mesh.position.set(x, y, z);
      scene.add(mesh);
      const body = new CANNON.Body({ mass: 0, material: groundMat });
      body.addShape(shape);
      body.position.set(x, y, z);
      world.addBody(body);
      return body;
    }
    function addDynamic(mesh, shape, x, y, z, mass) {
      mesh.position.set(x, y, z);
      scene.add(mesh);
      const body = new CANNON.Body({ mass, material: bodyMat, linearDamping: 0.2, angularDamping: 0.2 });
      body.addShape(shape);
      body.position.set(x, y, z);
      world.addBody(body);
      pairs.push({ mesh, body });
      return body;
    }

    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(40, 48),
      new THREE.MeshStandardMaterial({ color: 0x1a242c, roughness: 0.95 })
    );
    floor.rotation.x = -Math.PI / 2;
    addStatic(floor, new CANNON.Plane(), 0, 0, 0);
    world.bodies[world.bodies.length - 1].quaternion.setFromEuler(-Math.PI / 2, 0, 0);

    const grid = new THREE.GridHelper(80, 40, 0x3d5160, 0x24303a);
    grid.position.y = 0.01;
    scene.add(grid);

    const core = new THREE.Mesh(
      new THREE.CylinderGeometry(2.2, 2.4, 5, 24),
      new THREE.MeshStandardMaterial({ color: 0x8eb4c8, roughness: 0.45, metalness: 0.1 })
    );
    addStatic(core, new CANNON.Cylinder(2.2, 2.4, 5, 16), 0, 2.5, 0);

    const label = makeLabel("DCLM core\nlaw floor");
    label.position.set(0, 5.6, 0);
    scene.add(label);

    const layers = ["L1 public face", "L2 playground", "L3 access", "L4 ownership", "L5 identity", "L6 root"];
    layers.forEach((name, i) => {
      const r = 6.5 + i * 3.2;
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(r, 0.08, 8, 48),
        new THREE.MeshStandardMaterial({ color: 0x6d8794, roughness: 0.6 })
      );
      ring.rotation.x = Math.PI / 2;
      ring.position.y = 0.08;
      scene.add(ring);
      const post = new THREE.Mesh(
        new THREE.BoxGeometry(0.5, 0.7 + i * 0.15, 1.4),
        new THREE.MeshStandardMaterial({ color: 0x314049 })
      );
      addStatic(post, new CANNON.Box(new CANNON.Vec3(0.25, 0.35 + i * 0.07, 0.7)), r, 0.4, 0);
      const tag = makeLabel(name);
      tag.position.set(r, 1.5 + i * 0.1, 0);
      scene.add(tag);
    });

    const gate = new THREE.Mesh(
      new THREE.BoxGeometry(0.4, 2.4, 3.2),
      new THREE.MeshStandardMaterial({ color: 0x8a6238, roughness: 0.7 })
    );
    addStatic(gate, new CANNON.Box(new CANNON.Vec3(0.2, 1.2, 1.6)), 9.2, 1.2, 0);
    const iris = makeLabel("Iris bridge\nno endpoint set");
    iris.position.set(9.2, 2.8, 0);
    scene.add(iris);

    const sectors = ["health", "education", "water", "food", "climate", "pandemic"];
    sectors.forEach((name, i) => {
      const a = -0.8 + i * 0.45;
      const x = Math.cos(a) * 16;
      const z = Math.sin(a) * 16 - 6;
      const pad = new THREE.Mesh(
        new THREE.BoxGeometry(2.2, 0.3, 2.2),
        new THREE.MeshStandardMaterial({ color: 0x3d4c46 })
      );
      addStatic(pad, new CANNON.Box(new CANNON.Vec3(1.1, 0.15, 1.1)), x, 0.15, z);
      const tag = makeLabel(name);
      tag.position.set(x, 1.2, z);
      scene.add(tag);
    });

    const nodes = [];
    for (let i = 0; i < 6; i++) {
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.42, 20, 16),
        new THREE.MeshStandardMaterial({ color: 0xd7c7a1, roughness: 0.4 })
      );
      const body = addDynamic(mesh, new CANNON.Sphere(0.42), -3 + i * 1.15, 3 + i * 0.3, 4.2, 1);
      nodes.push(body);
    }

    function makeLabel(text) {
      const c = document.createElement("canvas");
      c.width = 512; c.height = 256;
      const g = c.getContext("2d");
      g.fillStyle = "rgba(12,18,22,0.8)";
      g.fillRect(0, 0, 512, 256);
      g.strokeStyle = "#8eb4c8";
      g.strokeRect(8, 8, 496, 240);
      g.fillStyle = "#e7eef2";
      g.font = "600 42px sans-serif";
      text.split("\n").forEach((row, i) => g.fillText(row, 28, 100 + i * 52));
      const tex = new THREE.CanvasTexture(c);
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
      sprite.scale.set(2.6, 1.3, 1);
      return sprite;
    }

    const ray = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    canvas.addEventListener("pointerdown", (e) => {
      const rect = canvas.getBoundingClientRect();
      pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      ray.setFromCamera(pointer, camera);
      const hits = ray.intersectObjects(pairs.map((p) => p.mesh));
      if (!hits.length) return;
      const pair = pairs.find((p) => p.mesh === hits[0].object);
      if (!pair) return;
      pair.body.wakeUp();
      pair.body.applyImpulse(new CANNON.Vec3((Math.random() - 0.5) * 4, 3.5, (Math.random() - 0.5) * 4));
      line.textContent = "Hit. That node has mass 1 and just took an impulse. The core and rings do not move.";
    });
    document.getElementById("shove").onclick = () => {
      nodes.forEach((b) => {
        b.wakeUp();
        b.applyImpulse(new CANNON.Vec3((Math.random() - 0.5) * 5, 4, (Math.random() - 0.5) * 5));
      });
      line.textContent = "All six nodes shoved. They fall, bounce, and sleep. No network call.";
    };

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    const step = 1 / 60;
    let acc = 0;
    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      acc += dt;
      while (acc >= step) {
        world.step(step);
        acc -= step;
      }
      pairs.forEach(({ mesh, body }) => {
        mesh.position.copy(body.position);
        mesh.quaternion.copy(body.quaternion);
      });
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
