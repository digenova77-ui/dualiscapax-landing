name: Diamond Claim Gates

on:
  push:
    branches: ["main", "test/**"]
    paths:
      - "tests/**"
      - ".github/workflows/diamond-claim-gates.yml"
      - "js/api-unified.js"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  symplectic-math:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test symplectic invariant and counterexamples
        run: python -m unittest discover -s tests -p "test_symplectic_invariant.py" -v

  api-client-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test API client timing and request contracts
        run: node --test tests/api-unified.test.cjs
