name: pages-direct-upload

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Optional note'
        required: false
        default: 'Direct Upload from Actions'

permissions:
  contents: read

concurrency:
  group: pages-direct-upload
  cancel-in-progress: true

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Deploy cf-pages → dualiscapax-landing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN missing in Actions secrets"
            exit 1
          fi
          set +e
          npx --yes wrangler@3.112.0 pages deploy cf-pages \
            --project-name=dualiscapax-landing \
            --commit-dirty=true
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::Direct Upload failed (exit $code)."
            echo "::error::If the log says Authentication error [code: 10000]: the token is seated but lacks Account → Cloudflare Pages → Edit on this Account ID."
            echo "::error::Backoff will not fix 10000. Replace CLOUDFLARE_API_TOKEN then re-run this workflow once."
            echo "::error::Do not open AWS / R2 / KV to skip this. dualiscapax.ai is this Pages project."
            exit "$code"
          fi
