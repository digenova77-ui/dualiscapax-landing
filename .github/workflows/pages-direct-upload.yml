name: pages-direct-upload

# Factory handoff: always pack cf-pages as an artifact.
# Cloudflare deploy is attempted second. 10000 does not eat the zip.

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Optional note'
        required: false
        default: 'Factory handoff pack'

permissions:
  contents: read
  actions: write

concurrency:
  group: pages-direct-upload
  cancel-in-progress: true

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Zip cf-pages (flat)
        run: |
          set -euo pipefail
          cd cf-pages
          zip -r ../dualis-pages-handoff.zip . -x '*.DS_Store' '_peel-backup/*' 'data/matchups/*'
          echo "packed $(unzip -Z1 ../dualis-pages-handoff.zip | grep -v '/$' | wc -l) files"
      - uses: actions/upload-artifact@v4
        with:
          name: dualis-pages-handoff
          path: dualis-pages-handoff.zip
          retention-days: 14

  upload:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Try Cloudflare Pages (may 10000)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN missing — zip artifact is the handoff."
            exit 0
          fi
          npx --yes wrangler@3.112.0 pages deploy cf-pages \
            --project-name=dualiscapax-landing \
            --commit-dirty=true
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::warning::Cloudflare 10000 or deploy fail. Artifact from pack job is the handoff."
            exit 0
          fi
