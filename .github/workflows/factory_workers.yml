name: dualis-factory-workers

# CONSTRAINT PATCH-WF-01 (factory-floor-v01):
# SKIP_STUB is evidence about the mesh guard.
# It is NOT authorization to mutate the repository.
# This workflow is contents:read. Receipts are artifacts (OBSERVED).
# Historical receipt commits on main remain historical.
# Parallel harvest workflows still have contents:write on main — residual OPEN.

on:
  schedule:
    - cron: '22,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: dualis-factory-workers
  cancel-in-progress: false

jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Factory observed receipt + mesh truth check
        run: |
          python3 << 'PY'
          import json, os, subprocess
          from pathlib import Path
          from datetime import datetime, timezone

          root = Path(".")
          forest_path = root / "units" / "FOREST.json"
          live = []
          if forest_path.exists():
              forest = json.loads(forest_path.read_text())
              live = forest.get("live") or []
          receipt = {
            "kind": "factory_tick",
            "surface": "OBSERVED",
            "authority_effect": "NONE",
            "captured_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
            "law": "truth-or-nothing — SKIP_STUB is not authorization to mutate",
            "live_units": [{"id": u.get("id"), "workflow": u.get("workflow"), "cron_slot": u.get("cron_slot") or u.get("cron")} for u in live],
            "actions": [],
          }
          env = os.environ.copy()
          env["PYTHONPATH"] = "src/engine"
          mesh = root / "src" / "engine" / "unity" / "unity_mesh_orchestrator.py"
          if mesh.exists():
              r = subprocess.run(
                  ["python3", str(mesh), "STUB"],
                  env=env, capture_output=True, text=True,
              )
              verdict = "unknown"
              for line in (r.stdout or "").splitlines():
                  if line.startswith("Verdict:"):
                      verdict = line.split(":", 1)[1].strip()
              receipt["actions"].append({
                  "step": "unity_mesh_stub_guard",
                  "verdict": verdict,
                  "ok": verdict == "SKIP_STUB",
                  "authority_effect": "NONE",
                  "stdout_tail": (r.stdout or "")[-400:],
              })
              if verdict != "SKIP_STUB":
                  raise SystemExit("mesh stub guard failed — theater leak")
          else:
              receipt["actions"].append({
                  "step": "unity_mesh_stub_guard",
                  "verdict": "UNKNOWN",
                  "ok": False,
                  "authority_effect": "NONE",
                  "reason": "orchestrator_missing",
              })
          out = root / "src" / "engine" / "ledgers" / "factory"
          out.mkdir(parents=True, exist_ok=True)
          day = datetime.now(timezone.utc).strftime("%Y%m%dT%H%M%SZ")
          path = out / f"observed_{day}.json"
          path.write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps(receipt, indent=2))
          PY
      - name: Upload OBSERVED receipt (no repo mutation)
        uses: actions/upload-artifact@v4
        with:
          name: factory-observed-tick
          path: src/engine/ledgers/factory/observed_*.json
          if-no-files-found: warn
          retention-days: 14
