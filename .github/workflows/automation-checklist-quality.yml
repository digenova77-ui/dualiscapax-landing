name: automation-checklist-quality

on:
  push:
    branches:
      - docs/automation-excellence-checklist
  pull_request:
    branches:
      - main
    paths:
      - "docs/ops/AUTOMATION_EXCELLENCE_CHECKLIST.md"
      - "scripts/validate-automation-checklist.cjs"
      - "js/iris-session.js"
      - "js/iris-fuel-gate.js"
      - "ai/app.html"
      - "scripts/test-diamond-derivative-fail-closed.cjs"
      - ".github/workflows/automation-checklist-quality.yml"

permissions:
  contents: read

jobs:
  validate-checklist:
    name: Validate checklist structure and granularity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate checklist
        run: node scripts/validate-automation-checklist.cjs
      - name: Run Diamond Derivative fail-closed regressions
        run: node scripts/test-diamond-derivative-fail-closed.cjs
