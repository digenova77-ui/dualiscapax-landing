name: stripe-fulfill-tests

on:
  pull_request:
    paths:
      - "workers/stripe-fulfill/**"
      - ".github/workflows/stripe-fulfill-test.yml"
  push:
    branches:
      - "feat/fiat-fuel-ledger-bridge"
    paths:
      - "workers/stripe-fulfill/**"
      - ".github/workflows/stripe-fulfill-test.yml"

permissions:
  contents: read

jobs:
  test:
    name: Validate Stripe fulfillment rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check worker modules
        working-directory: workers/stripe-fulfill
        run: |
          node --check worker.js
          node --check idempotency.js
          node --check merch-refine.js
      - name: Run SKU and amount validation tests
        working-directory: workers/stripe-fulfill
        run: npm test
