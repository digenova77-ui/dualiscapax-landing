name: unity-playground-idle

# Draw book → landscape drawers. NEVER cf-pages/.
on:
  schedule:
    - cron: '4,34 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unity-playground-idle
  cancel-in-progress: false

jobs:
  idle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Draw book into landscape
        run: |
          python3 << 'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          root = Path('.')
          def load(p):
              try:
                  return json.loads(Path(p).read_text())
              except Exception:
                  return None
          ohf = load('research/hockey/ohf-five/INDEX.json')
          house = load('research/hockey/house-rec/INDEX.json')
          landscape = {
            'kind': 'global_landscape',
            'captured_at': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
            'law': 'cite-or-hole — bots fill drawers, never invent, never paint plate',
            'drawn_from': {'ohf_five': bool(ohf), 'house_rec': bool(house)},
            'drawers': {
              '0_plate_ice': 'awaiting_200',
              '3_ohf_five': 'book' if ohf else 'hole',
              '4_house_rec': 'book' if house else 'awaiting_association_cites',
              '5_hockey_canada': 'hole',
              '6_iihf': 'hole',
              '7_sport_world': 'hole',
              '8_golf': 'book' if Path('research/golf').exists() else 'hole',
              '9_stream_rights': 'hole',
              '10_playground': 'sandbox',
            },
            'ohf_leagues': (ohf or {}).get('leagues') or (ohf or {}).get('ohf_members_youth') or [],
          }
          out = root / 'factory' / 'sandbox'
          out.mkdir(parents=True, exist_ok=True)
          (out / 'landscape.json').write_text(json.dumps(landscape, indent=2) + '\n')
          rec_dir = out / 'receipts'
          rec_dir.mkdir(parents=True, exist_ok=True)
          day = datetime.now(timezone.utc).strftime('%Y%m%dT%H%M%SZ')
          (rec_dir / f'landscape_{day}.json').write_text(json.dumps(landscape, indent=2) + '\n')
          ice_dir = (root / 'cf-pages' / 'ice' / 'index.html').exists()
          if ice_dir:
              raise SystemExit('hole: ice/ folder returned')
          print(json.dumps({'ok': True}, indent=2))
          PY
      - name: Commit landscape
        run: |
          git config user.email "playground-idle@dualiscapax.ai"
          git config user.name "Dualis Unity Playground Idle"
          git add factory/sandbox/
          if git diff --cached --quiet; then echo none; exit 0; fi
          git commit -m "chore(pipe): landscape drawers from book [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD && exit 0
            sleep $((i * 2))
          done
          exit 1
