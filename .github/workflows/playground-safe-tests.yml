name: playground-safe-tests

on:
  push:
    branches: [workbench/domain-handoff-audit]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node-tests:
    name: Iris and API safety tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run isolated safety tests
        run: node --test tests/*.test.cjs
