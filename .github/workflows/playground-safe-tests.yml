name: playground-safe-tests

on:
  pull_request:
    branches: [main]
    paths:
      - "ai/app.html"
      - "js/iris-file.js"
      - "js/iris-session.js"
      - "js/api-config.js"
      - "js/api-world.js"
      - "tests/**"
      - ".github/workflows/playground-safe-tests.yml"

permissions:
  contents: read

jobs:
  node-tests:
    name: Iris and API safety tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run isolated safety tests
        run: node --test tests/*.test.cjs
