name: Trinity autonomy tests

on:
  push:
    branches:
      - "feat/trinity-affinity-autonomy-20261020"
    paths:
      - "autonomy/**"
      - "tests/test_affinity.py"
      - "tests/test_integration_lifecycle.py"
      - "tests/test_ledger.py"
      - "tests/test_supervisor.py"
      - "tests/test_orchestrator.py"
      - "tests/test_sqlite_ledger.py"
      - "tests/test_durable_queue.py"
      - "tests/test_provisioning.py"
      - "tests/test_sandbox_policy.py"
      - "tests/test_evidence.py"
      - "tests/test_worker_runner.py"
      - "tests/test_workflow_audit.py"
      - ".github/workflows/trinity-affinity-tests.yml"
  pull_request:
    paths:
      - "autonomy/**"
      - "tests/test_affinity.py"
      - "tests/test_integration_lifecycle.py"
      - "tests/test_ledger.py"
      - "tests/test_supervisor.py"
      - "tests/test_orchestrator.py"
      - "tests/test_sqlite_ledger.py"
      - "tests/test_durable_queue.py"
      - "tests/test_provisioning.py"
      - "tests/test_sandbox_policy.py"
      - "tests/test_evidence.py"
      - "tests/test_worker_runner.py"
      - ".github/workflows/trinity-affinity-tests.yml"
permissions:
  contents: read

jobs:
  autonomy-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run affinity and authorization tests
        run: PYTHONPATH=. python tests/test_affinity.py -v
      - name: Run integration lifecycle tests
        run: PYTHONPATH=. python tests/test_integration_lifecycle.py -v
      - name: Run service identity provisioning tests
        run: PYTHONPATH=. python tests/test_provisioning.py -v
      - name: Run hash-chain ledger tests
        run: PYTHONPATH=. python tests/test_ledger.py -v
      - name: Run durable SQLite ledger tests
        run: PYTHONPATH=. python tests/test_sqlite_ledger.py -v
      - name: Run durable job queue tests
        run: PYTHONPATH=. python tests/test_durable_queue.py -v
      - name: Run supervisor idempotency and retry tests
        run: PYTHONPATH=. python tests/test_supervisor.py -v
      - name: Run fail-closed orchestration tests
        run: PYTHONPATH=. python tests/test_orchestrator.py -v
      - name: Run sandbox policy tests
        run: PYTHONPATH=. python tests/test_sandbox_policy.py -v
      - name: Run evidence redaction tests
        run: PYTHONPATH=. python tests/test_evidence.py -v
      - name: Run fail-closed worker runner tests
        run: PYTHONPATH=. python tests/test_worker_runner.py -v
      - name: Run workflow security inventory (report-only)
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from autonomy.workflow_audit import scan_workflows

          findings = scan_workflows(".")
          counts = {level: sum(f.severity == level for f in findings) for level in ("high", "medium", "low")}
          lines = [
              "## GitHub Actions static risk inventory",
              "",
              "Heuristic review leads only; findings are not proof of exploitability. This lane reports risks and does not hide or auto-fix them.",
              "",
              f"- High: {counts['high']}",
              f"- Medium: {counts['medium']}",
              f"- Low: {counts['low']}",
              "",
          ]
          lines.extend(f"- **{f.severity.upper()}** `{f.rule_id}` — `{f.path}`: {f.message}" for f in findings)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("\\n".join(lines) + "\\n")
          print("\\n".join(lines))
          PY
      - name: Run workflow audit tests
        run: PYTHONPATH=. python tests/test_workflow_audit.py -v
      - name: Run complete Python regression suite
        run: PYTHONPATH=. python -m unittest discover -s tests -p "test_*.py" -v
