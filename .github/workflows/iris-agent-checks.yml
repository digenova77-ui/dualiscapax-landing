name: Iris agent bridge checks

on:
  pull_request:
    paths:
      - "workers/iris-agent/**"
      - ".github/workflows/iris-agent-checks.yml"
  push:
    branches:
      - "feat/cloudflare-iris-agent-bridge"
    paths:
      - "workers/iris-agent/**"
      - ".github/workflows/iris-agent-checks.yml"

permissions:
  contents: read

concurrency:
  group: iris-agent-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/iris-agent
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: Type-check
        run: npm run check
