name: Cloudflare Durable Object Worker deploy

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Type DEPLOY-DO-WORKER to deploy the dedicated Durable Object Worker"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-durable-object-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm_deploy == 'DEPLOY-DO-WORKER'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-bootstrap
    steps:
      - name: Checkout approved main revision
        uses: actions/checkout@v4

      - name: Validate required secrets without printing them
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          echo "Required Cloudflare secrets are present (values hidden)."

      - name: Deploy dedicated Durable Object Worker
        working-directory: workers/landing-durable-objects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml

      - name: Verify deployment metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deployments status --name dualiscapax-landing-do
