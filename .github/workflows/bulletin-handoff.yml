name: bulletin-handoff

# RETIRED 2026-10-17 (fix/retire-cf-pages-rail-20261017, see PR #113).
# Production is self-hosted on the NJ server (Caddy) for dualiscapax.com and dualiscapax.ai.
# DNS resolves both to 108.61.17.141 directly (not proxied through Cloudflare).
# Cloudflare Pages project dualiscapax-landing is an orphaned copy and does not serve either domain.
# This workflow stays in tree so old badges and links do not 404. It does not deploy, upload or purge anything.
# Previous content: git show 2e74c779:.github/workflows/bulletin-handoff.yml

on:
  workflow_dispatch:
    inputs:
      confirm_retirement:
        description: "Type RETIRED — this workflow does not publish"
        required: true
        default: "RETIRED"

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse Cloudflare Pages rail
        run: |
          echo "Bulletin handoff to Cloudflare is retired."
          echo "Production = NJ Caddy (.com and .ai). See docs/ops/ENVIRONMENT.md."
          exit 0
