name: hockey-ohf-five

# Five OHF youth members: OMHA ALLIANCE GTHL NOHA OWHA.
# Org indexes + official cites only. No named minors. No helix.
# Time-splice: :09/:39 — golf keeps slot A :07/:37.

on:
  schedule:
    - cron: '9,39 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hockey-ohf-five
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Harvest five OHF youth league indexes
        run: python3 scripts/harvest_hockey_ohf_five.py
      - name: Commit indexes
        run: |
          git config user.email "hockey-harvest@dualiscapax.ai"
          git config user.name "Dualis OHF Five Harvest"
          git add research/hockey/ohf-five/ units/sports/hockey-ohf-five/ cf-pages/data/ohf-five/
          if git diff --cached --quiet; then
            echo "No pack changes."
            exit 0
          fi
          git commit -m "chore(hockey): OHF five league index harvest [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD && exit 0
            echo "push race attempt $i — retry"
            sleep $((i * 2))
          done
          echo "push failed after retries" >&2
          exit 1
