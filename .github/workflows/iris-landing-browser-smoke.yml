name: iris-landing-browser-smoke

on:
  push:
    branches: [workbench/domain-handoff-audit]
  pull_request:
    branches: [main]
    paths:
      - "ai/app.html"
      - "ai/dclm-look.js"
      - "js/iris-file.js"
      - "js/iris-session.js"
      - "tests/browser/**"
      - ".github/workflows/iris-landing-browser-smoke.yml"

permissions:
  contents: read

jobs:
  browser-smoke:
    name: Landing Iris browser smoke tests (external network blocked)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pinned Playwright
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run isolated browser tests
        run: node tests/browser/iris-landing-smoke.cjs
