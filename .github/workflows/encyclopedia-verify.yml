name: encyclopedia-verify

on:
  push:
    paths:
      - "encyclopedia/**"
      - "playground.html"
      - "helix.html"
      - "ai/app.html"
      - "js/**"
      - ".github/workflows/encyclopedia-verify.yml"
  pull_request:
    paths:
      - "encyclopedia/**"
      - "playground.html"
      - "helix.html"
      - "ai/app.html"
      - "js/**"
      - ".github/workflows/encyclopedia-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: DCLM preflight then encyclopedia spine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check above — DCLM Layer [0] preflight
        run: |
          set -euo pipefail
          python3 encyclopedia/crypto_tools/dclm_preflight.py
          echo "SEALED is an integrity state only and is not scientific validation."
