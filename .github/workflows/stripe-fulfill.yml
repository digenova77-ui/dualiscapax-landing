name: stripe-fulfill-v2

# DualisCapax — last mile before Cloudflare privilege.
# This workflow is the deploy button. It cannot mint Cloudflare access.
# Operator one-time: repo Settings → Secrets → Actions
#   CLOUDFLARE_API_TOKEN   (narrow: Workers Scripts Edit/Read + Account Settings Read;
#                           MUST NOT include D1 Edit — see docs/ops/RESIDUAL_R1_TOKEN_SCOPE.md)
#   CLOUDFLARE_ACCOUNT_ID
# Then Run workflow, or push under workers/stripe-fulfill/.
# Webhook secret stays on the Worker (wrangler secret put / dashboard). Never git.
#
# CONSTRAINT (residual R3): admit via factory/tools/admit_stripe_fulfill_deploy.sh before deploy.
# CONSTRAINT (residual R1): this workflow MUST NEVER run wrangler D1 SQL execute.
# CONSTRAINT: CHECKOUT_OPEN must remain "false"; do not open checkout here.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workers/stripe-fulfill/**"
      - ".github/workflows/stripe-fulfill.yml"
      - "factory/tools/admit_artifact_authority.mjs"
      - "factory/tools/admit_stripe_fulfill_deploy.sh"
      - "factory/tools/stamp_artifact_tip.mjs"
      - "factory/tools/verify_artifact_receipt.mjs"

permissions:
  contents: read

concurrency:
  group: stripe-fulfill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Admit + deploy stripe-fulfill-v2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Require Cloudflare silo secrets
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not in this repo's Actions secrets."
            echo "That is the only remaining privileged step. Add them, then re-run this workflow."
            echo "Do not paste those values into chat."
            exit 1
          fi

      - name: Forbid d1 execute in this workflow (residual R1)
        run: |
          set -euo pipefail
          # Comments documenting the ban must not trip the gate (Egg #11 TipSeal false positive).
          if grep -nE 'd1[[:space:]]+execute|wrangler[[:space:]]+d1[[:space:]]+execute' \
              .github/workflows/stripe-fulfill.yml | grep -vE '^[[:space:]]*[0-9]+:[[:space:]]*#'; then
            echo "::error::d1 execute must not appear in stripe-fulfill workflow (non-comment)"
            exit 1
          fi
          if [ "${CHECKOUT_OPEN:-}" = "true" ]; then
            echo "::error::CHECKOUT_OPEN=true in runner env — refuse"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Admit artifact authority (SOLE deploy gate)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash factory/tools/admit_stripe_fulfill_deploy.sh

      - name: TipSeal + dual-control gate (egg #7 tip bind)
        run: |
          set -euo pipefail
          node scripts/dual-control/generate-tipseal.mjs --worker stripe-fulfill --out /tmp/tipseal.json --sealer "github-actions:${GITHUB_WORKFLOW}"
          SEAL_TIP=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/tipseal.json','utf8')).tip_sha")
          if [ "$SEAL_TIP" != "$GITHUB_SHA" ]; then
            echo "::error::TipSeal tip_sha ($SEAL_TIP) != GITHUB_SHA ($GITHUB_SHA)"
            exit 1
          fi
          DAVID_YES_TIP_SHA="$GITHUB_SHA" node scripts/dual-control/gate-deploy.mjs --tipseal /tmp/tipseal.json --expect-worker stripe-fulfill
          echo "TIPSEAL_GATE_OK tip=$SEAL_TIP"

      - name: wrangler deploy (post-admit only; park closed)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/stripe-fulfill
          command: deploy

      - name: Annotate CF deployment with tip_sha (egg #7)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DAVID_YES_TIP_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/dual-control/annotate-deployment.mjs --tipseal /tmp/tipseal.json --script dualiscapax-stripe-fulfill-v2
