name: workflow-safety-audit

on:
  push:
    branches: [docs/source-of-truth-inventory]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/audit-workflow-safety.cjs"
      - ".github/workflows/workflow-safety-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    name: Inventory workflow triggers and side-effect signals
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate read-only workflow audit
        run: node scripts/audit-workflow-safety.cjs
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: workflow-safety-audit
          path: workflow-safety-audit.json
          retention-days: 14
          if-no-files-found: error
