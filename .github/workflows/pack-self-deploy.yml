name: pack-self-deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Zip cf-pages at archive root
        run: |
          cd cf-pages
          zip -r "$GITHUB_WORKSPACE/dualis-pages.zip" . -x '*.DS_Store'
      - uses: actions/upload-artifact@v4
        with:
          name: dualis-pages
          path: dualis-pages.zip
          retention-days: 14
