name: pack-self-deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["dualis-factory-workers"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pack-self-deploy
  cancel-in-progress: true

jobs:
  pack:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Zip cf-pages at archive root
        run: |
          cd cf-pages
          zip -r "$GITHUB_WORKSPACE/dualis-pages.zip" . -x '*.DS_Store'
      - uses: actions/upload-artifact@v4
        with:
          name: dualis-pages
          path: dualis-pages.zip
          retention-days: 14
