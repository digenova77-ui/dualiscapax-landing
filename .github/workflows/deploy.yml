name: Deploy DualisCapax Landing to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Rebuild plates on this side
        run: |
          set -e
          cat brand/9672.part0.b64 brand/9672.part1.b64 brand/9672.part2.b64 brand/9672.part3.b64 | tr -d '\n' | base64 -d > brand/9672.jpg
          file brand/9672.jpg
          ls -l brand/9672.jpg
          if [ -f brand/11180.part00.b64 ]; then
            cat brand/11180.part00.b64 brand/11180.part01.b64 brand/11180.part02.b64 brand/11180.part03.b64 brand/11180.part04.b64 brand/11180.part05.b64 brand/11180.part06.b64 brand/11180.part07.b64 | tr -d '\n' | base64 -d > brand/11180.jpg
            file brand/11180.jpg
            ls -l brand/11180.jpg
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
