name: Deploy DualisCapax Landing to GitHub Pages

# RETIRED 2026-09-11.
# GitHub is the information repository. Production publish is manual Cloudflare zip.
# This workflow stays in tree so old badges do not 404. It does not upload Pages.

on:
  workflow_dispatch:
    inputs:
      confirm_retirement:
        description: "Type RETIRED — this workflow does not publish"
        required: true
        default: "RETIRED"

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse GitHub Pages publish
        run: |
          echo "GitHub Pages deploy rail is retired."
          echo "Use scripts/pack_hierarchical_flat_zip.py --lander"
          echo "then upload dist/cloudflare/lander-*.zip in Cloudflare Pages."
          echo "Docs: docs/ops/ENVIRONMENT.md"
          exit 0
