name: wav-watch

# Repository artifact gate only. Never infer production health from CI.
# Missing or malformed greeting assets are a hard failure, not a warning.
on:
  pull_request:
    paths:
      - audio/**
      - js/iris-wav.js
      - index.html
      - .github/workflows/wav-watch.yml
  push:
    branches: [main]
    paths:
      - audio/**
      - js/iris-wav.js
      - index.html
      - .github/workflows/wav-watch.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wav-watch
  cancel-in-progress: false

jobs:
  repository-artifact-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require valid local greeting assets and player wiring
        run: |
          set -euo pipefail
          python3 << 'PY'
          import sys
          import wave
          from pathlib import Path

          required = [
              Path("audio/iris-greet.wav"),
              Path("audio/iris-greet.mp3"),
              Path("js/iris-wav.js"),
              Path("index.html"),
          ]
          missing = [str(path) for path in required if not path.is_file() or path.stat().st_size == 0]
          if missing:
              print("FAIL: required greeting artifacts are missing or empty:")
              for item in missing:
                  print(f" - {item}")
              sys.exit(1)

          wav_path = Path("audio/iris-greet.wav")
          try:
              with wave.open(str(wav_path), "rb") as audio:
                  if audio.getnframes() <= 0 or audio.getframerate() <= 0:
                      raise ValueError("WAV contains no playable frames")
          except Exception as exc:
              print(f"FAIL: WAV validation failed: {type(exc).__name__}: {exc}")
              sys.exit(1)

          html = Path("index.html").read_text(encoding="utf-8")
          player = Path("js/iris-wav.js").read_text(encoding="utf-8")
          if "iris-wav.js" not in html:
              print("FAIL: index.html does not load js/iris-wav.js")
              sys.exit(1)
          if "iris-greet.wav" not in player and "iris-greet.mp3" not in player:
              print("FAIL: player does not reference either greeting asset")
              sys.exit(1)

          print("PASS: required greeting files exist, WAV parses, and player is wired.")
          print("NOTE: this is repository validation only; it makes no production claim.")
          PY
