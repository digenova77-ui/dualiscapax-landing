name: secret-scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: refuse committed live secrets
        run: |
          set -e
          # Live material only. Test fixtures that mention the token NAME are excluded via the workflow file itself.
          if git grep -I -nE 'whsec_[A-Za-z0-9]+|sk_live_[A-Za-z0-9]+|rk_live_[A-Za-z0-9]+|sk_test_[A-Za-z0-9]{16,}|rk_test_[A-Za-z0-9]{16,}|xai-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN OPENSSH PRIVATE KEY|BEGIN RSA PRIVATE KEY|BEGIN EC PRIVATE KEY' -- ':!.github/workflows/secret-scan.yml' ':!.github/workflows/security.yml'; then
            echo 'Refuse: live secret pattern in tree'
            exit 1
          fi
          echo 'No live secret patterns in tree'
