name: secret-scan

# Open repo guard. Crawlers stay. Secrets do not.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Grep the working tree for never-commit strings
        run: |
          python3 << 'PY'
          import json, os, re
          from datetime import datetime, timezone
          from pathlib import Path

          needles = [
              ("sk_live_", "stripe secret"),
              ("whsec_", "stripe webhook secret"),
              ("CLOUDFLARE_API_TOKEN=", "cf token assign"),
              ("CF_API_TOKEN=", "cf token assign"),
              ("XAI_API_KEY=", "xai assign"),
              ("BEGIN PRIVATE KEY", "pem"),
              ("BEGIN RSA PRIVATE KEY", "pem"),
              ("BEGIN OPENSSH PRIVATE KEY", "ssh"),
              ("github_pat_", "github pat"),
          ]
          # ghp_/gho_ also, but allow the word in docs that say "never ghp_"
          skip_dir = {".git", "node_modules", ".wrangler", "dist"}
          hits = []
          root = Path(".")
          for p in root.rglob("*"):
              if not p.is_file():
                  continue
              if any(part in skip_dir for part in p.parts):
                  continue
              if p.stat().st_size > 1_500_000:
                  continue
              try:
                  text = p.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue
              # Law files may name the needle. Only fail if it looks assigned.
              for needle, cls in needles:
                  if needle not in text:
                      continue
                  if p.as_posix() in ("AGENT/NEVER-COMMIT.md", "SECURITY.md", ".github/workflows/secret-scan.yml"):
                      continue
                  hits.append({"path": p.as_posix(), "class": cls, "needle": needle})
          card = {
              "kind": "secret-scan",
              "clerk": "unity:sec.watch",
              "at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "sha": os.environ.get("GITHUB_SHA"),
              "hits": hits,
              "verdict": "HOLE" if hits else "LIVE",
              "law": "Open GitHub. Never-commit strings stay off main.",
          }
          print(json.dumps(card, indent=2))
          if hits:
              raise SystemExit("secret-scan HOLE — rotate and drop the string")
          PY
