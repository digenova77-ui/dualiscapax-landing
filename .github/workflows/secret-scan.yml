name: secret-scan

# Open repo guard. Crawlers stay. Secrets do not.
# DCLM: fail on assigned-shaped keys, not on docs that name the prefix.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Assigned-shape scan (working tree)
        run: |
          python3 << 'PY'
          import json, os, re
          from datetime import datetime, timezone
          from pathlib import Path

          PATTERNS = [
              ("stripe_sk", re.compile(r"sk_(?:live|test)_[A-Za-z0-9]{16,}")),
              ("stripe_rk", re.compile(r"rk_live_[A-Za-z0-9]{16,}")),
              ("stripe_whsec", re.compile(r"whsec_[A-Za-z0-9]{16,}")),
              ("github_pat", re.compile(r"github_pat_[A-Za-z0-9_]{20,}")),
              ("github_classic", re.compile(r"ghp_[A-Za-z0-9]{20,}")),
              ("xai", re.compile(r"xai-[A-Za-z0-9]{20,}")),
              ("pem", re.compile(r"-----BEGIN (?:RSA |OPENSSH |EC )?PRIVATE KEY-----\s+[A-Za-z0-9+/=]{40,}")),
          ]
          PLACEHOLDER = re.compile(r"(?:\.{3}|xxx+|REDACTED|YOUR[_-]?KEY|changeme)", re.I)
          skip_dir = {".git", "node_modules", ".wrangler", "dist"}
          hits = []
          mentions = 0
          for p in Path(".").rglob("*"):
              if not p.is_file() or any(part in skip_dir for part in p.parts):
                  continue
              if p.stat().st_size > 1_500_000:
                  continue
              try:
                  text = p.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue
              if "sk_live_" in text or "whsec_" in text:
                  mentions += 1
              for cls, rx in PATTERNS:
                  for m in rx.finditer(text):
                      val = m.group(0)
                      if PLACEHOLDER.search(val):
                          continue
                      hits.append({"path": p.as_posix(), "class": cls, "head": val[:12] + "…"})
          card = {
              "kind": "secret-scan",
              "clerk": "unity:sec.watch",
              "at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "sha": os.environ.get("GITHUB_SHA"),
              "prefix_mentions_files": mentions,
              "assigned_hits": hits,
              "verdict": "HOLE" if hits else "LIVE",
              "law": "Prefix in a doc is not a leak. Assigned-shaped secret is.",
              "amplitude": "working tree only. fetch-depth 1. History is a Settings click (push protection).",
          }
          print(json.dumps(card, indent=2))
          if hits:
              raise SystemExit("secret-scan HOLE — rotate and drop the string")
          PY
