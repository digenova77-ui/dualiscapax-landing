name: secret-scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: refuse committed live secrets
        run: |
          set -e
          if git grep -I -nE 'whsec_[A-Za-z0-9]+|sk_live_[A-Za-z0-9]+|rk_live_[A-Za-z0-9]+|BEGIN OPENSSH PRIVATE KEY|BEGIN RSA PRIVATE KEY' -- ':!.github/workflows/secret-scan.yml'; then
            echo 'Refuse: live secret pattern in tree'
            exit 1
          fi
          echo 'No live secret patterns in tree'
