name: residual-ring

on:
  push:
    branches: [main]
  schedule:
    # Daily observe — ring does not sleep just because chat is idle
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  A_build:
    name: A · Build manifest
    runs-on: ubuntu-latest
    outputs:
      manifest_sha: ${{ steps.hash.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Build critical-path manifest
        id: hash
        run: |
          set -euo pipefail
          paths=(
            hall/index.html
            hall/cuts-v1.json
            hall/narrator-land.js
            hall/AGENT-TRIGGER.md
            hall/rails.html
            index.html
            residual-law.html
            gateway.html
            research/sim/METHOD.md
            research/sim/packs/als-dual-path.json
            research/sim/storage/RESIDUAL-VAULT.md
          )
          : > /tmp/manifest.txt
          for p in "${paths[@]}"; do
            if [ -f "$p" ]; then
              h=$(sha256sum "$p" | awk '{print $1}')
              echo "$p $h" >> /tmp/manifest.txt
            else
              echo "$p MISSING" >> /tmp/manifest.txt
            fi
          done
          cat /tmp/manifest.txt
          msha=$(sha256sum /tmp/manifest.txt | awk '{print $1}')
          echo "sha=$msha" >> "$GITHUB_OUTPUT"
          mkdir -p artifacts
          cp /tmp/manifest.txt artifacts/critical-manifest.txt
          echo "$msha" > artifacts/manifest.sha
      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: residual-manifest
          path: artifacts/

  B_verify:
    name: B · Verify vs previous
    needs: A_build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Diff critical paths against previous commit
        run: |
          set -euo pipefail
          paths=(
            hall/index.html
            hall/cuts-v1.json
            hall/narrator-land.js
            hall/AGENT-TRIGGER.md
            hall/rails.html
            index.html
            residual-law.html
            gateway.html
            research/sim/METHOD.md
            research/sim/packs/als-dual-path.json
            research/sim/storage/RESIDUAL-VAULT.md
          )
          echo "=== git diff HEAD~1 (critical paths) ==="
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            git diff --stat HEAD~1 -- "${paths[@]}" || true
            if git diff --name-only HEAD~1 -- hall/index.html hall/cuts-v1.json residual-law.html research/sim/METHOD.md research/sim/storage/RESIDUAL-VAULT.md | grep -q .; then
              echo "LAW_SURFACE_CHANGED=1"
              if ! git log -1 --pretty=%B | grep -qiE 'law|residual|vault|method|hall|loop'; then
                echo "::warning::Law- or hall-related paths changed without hall/law/residual/vault/method/loop in commit message"
              fi
            fi
          else
            echo "First commit — no previous baseline"
          fi
          echo "A_manifest=${{ needs.A_build.outputs.manifest_sha }}"

  C_observe:
    name: C · Observe live surface
    needs: [A_build, B_verify]
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public endpoints
        run: |
          set -euo pipefail
          LIVE="${LIVE_URL:-https://www.dualiscapax.ai/}"
          HALL="${HALL_URL:-https://www.dualiscapax.ai/hall/}"
          RAW="https://raw.githubusercontent.com/digenova77-ui/dualiscapax-landing/main/index.html"
          RAW_HALL="https://raw.githubusercontent.com/digenova77-ui/dualiscapax-landing/main/hall/index.html"
          echo "LIVE=$LIVE HALL=$HALL"
          code_live=$(curl -sL -o /tmp/live.html -w "%{http_code}" "$LIVE" || echo 000)
          code_hall=$(curl -sL -o /tmp/hall.html -w "%{http_code}" "$HALL" || echo 000)
          code_raw=$(curl -sL -o /tmp/raw.html -w "%{http_code}" "$RAW" || echo 000)
          code_raw_hall=$(curl -sL -o /tmp/raw-hall.html -w "%{http_code}" "$RAW_HALL" || echo 000)
          echo "live_http=$code_live hall_http=$code_hall raw_http=$code_raw raw_hall_http=$code_raw_hall"
          echo "=== live head ==="
          head -c 400 /tmp/live.html | tr '\n' ' ' || true
          echo
          echo "=== hall head ==="
          head -c 400 /tmp/hall.html | tr '\n' ' ' || true
          echo
          if grep -q "FIVE ROOMS\|START THE TOUR\|data-land" /tmp/raw-hall.html 2>/dev/null; then
            echo "RAW_HALL_OK=1"
          else
            echo "::warning::Raw hall/index.html missing five-room markers"
          fi
          if grep -q "FIVE ROOMS\|START THE TOUR\|data-land" /tmp/hall.html 2>/dev/null; then
            echo "LIVE_HALL_OK=1"
          else
            echo "::warning::LIVE /hall/ missing five-room hall — Pages may still be on an older publish or apex is not this repo"
          fi
          if grep -qi "Residual-Tax Software Control Plane\|Unity Framework" /tmp/live.html 2>/dev/null; then
            if ! grep -q "Sandbox surface\|FIVE ROOMS" /tmp/live.html 2>/dev/null; then
              echo "::warning::LIVE / still looks like merch or control-plane — cutover to /hall only if David says yes"
            fi
          fi
          echo "manifest_sha=${{ needs.A_build.outputs.manifest_sha }}"
          echo "Ring position: A built → B verified → C observed / and /hall. Checkout stays closed."
