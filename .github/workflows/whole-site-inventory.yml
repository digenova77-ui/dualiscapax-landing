name: Whole-Site and Iris Inventory

on:
  push:
    branches: [feat/iris-single-governed-runtime-20261023]
    paths:
      - "scripts/whole-site-audit.mjs"
      - ".github/workflows/whole-site-inventory.yml"
      - "**/*.html"
      - "js/**"
      - "ai/**"
      - "server/**"
      - "workers/**"
  pull_request:
    paths:
      - "scripts/whole-site-audit.mjs"
      - ".github/workflows/whole-site-inventory.yml"
      - "**/*.html"
      - "js/**"
      - "ai/**"
      - "server/**"
      - "workers/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whole-site-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Scan all tracked website source
        run: node scripts/whole-site-audit.mjs
      - name: Publish inventory as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: whole-site-iris-inventory
          path: audit-output/
          if-no-files-found: error
          retention-days: 30
      - name: Summarize scan
        run: |
          echo "## Whole-site / Iris static inventory" >> "$GITHUB_STEP_SUMMARY"
          echo 'Generated artifacts: whole-site-inventory.md and whole-site-inventory.json' >> "$GITHUB_STEP_SUMMARY"
          node -e 'const x=require("./audit-output/whole-site-inventory.json"); for (const [k,v] of Object.entries(x.counts)) console.log("- "+k+": "+v)' >> "$GITHUB_STEP_SUMMARY"
