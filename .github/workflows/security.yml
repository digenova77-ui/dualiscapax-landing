name: "Production Security and Invariant CI Gate"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Audit for Exposed Secret Keys (sk_live_ / sk_test / whsec_)
        run: |
          echo "[*] Scanning for unauthorized Stripe secret keys in client code..."
          if grep -rn "sk_live_" . --exclude-dir=.git || grep -rn "whsec_" . --exclude-dir=.git; then
            echo "[!] ERROR: Live Stripe secrets detected in client repository! Failing closed."
            exit 1
          fi
          echo "[ok] PASS: Zero exposed secret keys verified."

      - name: Verify Production Payment Configuration (open: false)
        run: |
          echo "[*] Verifying research/payment-links.production.json remains CLOSED..."
          python3 -c "
          import json
          with open('research/payment-links.production.json') as f:
              data = json.load(f)
          assert data['meta']['open'] is False, 'Gateway must be CLOSED (open: false)'
          assert data['meta'].get('access_status') == 'CLOSED'
          assert data['meta']['invariants']['zero_secret_keys_in_client'] is True
          ledger = data['meta'].get('ledger', {})
          assert ledger.get('LEDGER-EARNED', 0) == 0
          assert ledger.get('LEDGER-PLEDGED', 0) == 0
          print('[ok] PASS: Access sales CLOSED; ledgers CAD 0; zero secret keys invariant holds.')
          "
