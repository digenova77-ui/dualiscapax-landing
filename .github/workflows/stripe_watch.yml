name: stripe-watch
on:
  schedule:
    - cron: "16,46 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stripe-watch
  cancel-in-progress: false
jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 units/stripe-watch/stripe_watch.py
      - run: |
          git config user.email "factory@dualiscapax.ai"
          git config user.name "Dualis Factory"
          git add research/stripe || true
          if git diff --cached --quiet; then echo none; exit 0; fi
          git commit -m "chore(stripe-watch): pulse [skip ci]"
          git pull --rebase origin HEAD && git push origin HEAD
