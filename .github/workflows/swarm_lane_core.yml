name: Swarm lane Iris-Core

# Perpetual cue. Cron is the backstop. Actuators false. No lander publish.

on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:

concurrency:
  group: dualis-swarm-lane-core
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  lane:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: src/engine
      SWARM_LANE: iris-core
      LIVE_ACTUATORS: 'false'
      CRA_SEND: 'NO'
      DUALIS_TARGET: STUB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 src/engine/swarm_five_lane.py
      - name: Commit refilled cue
        run: |
          git config user.email "swarm@dualiscapax.ai"
          git config user.name "Dualis Swarm Iris-Core"
          git add src/engine/ledgers/five/iris-core src/engine/ledgers/cue/iris-core.json || true
          git diff --cached --quiet && exit 0
          git commit -m "chore(swarm): iris-core cue refilled [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD && exit 0
            sleep $((i * 2))
          done
          exit 1
      - name: Chain next refill
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          queued=$(gh run list --workflow swarm_lane_core.yml --status queued --limit 5 --json databaseId --jq 'length')
          if [ "$queued" != "0" ]; then
            echo "next refill already queued"
            exit 0
          fi
          gh workflow run swarm_lane_core.yml --ref main || echo "chain deferred — cue already full"
