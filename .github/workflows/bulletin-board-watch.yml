name: Bulletin Board Watcher (Native WIF)

on:
  schedule:
    # Autonomous heartbeat: runs every 30 minutes on GitHub compute
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write   # Allows committing the downloaded ./bulletin manifest/state
  id-token: write   # Required for GitHub OIDC to mint Google WIF tokens

jobs:
  poll-bulletin-board:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Exchange short-lived GitHub OIDC token with Google WIF
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Read FACTORY_BULLETIN_BOARD into ./bulletin/ (read-only)
      - name: Read FACTORY_BULLETIN_BOARD (read-only)
        run: |
          pip install --quiet google-api-python-client google-auth
          python scripts/read_bulletin_board.py \
            --folder-id 1T6qBAzbwdmJj820bO9qji3wIx7xj0_q4 \
            --out ./bulletin

      # 4. Commit updated bulletin state (or tick artifact) to repo
      - name: Commit & Push Bulletin Snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add ./bulletin _manifest.json 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No bulletin changes. Clean tick."
          else
            git commit -m "chore(bulletin): sync board snapshot via WIF [skip ci]"
            git push origin main
          fi

      # 5. Archive snapshot as run artifact
      - name: Upload Bulletin Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bulletin-snapshot
          path: ./bulletin/
          if-no-files-found: ignore
