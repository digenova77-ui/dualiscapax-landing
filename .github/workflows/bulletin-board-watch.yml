name: Bulletin Board Watcher (Native WIF)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

# Pacemaker only. ./bulletin is INPUT/EVIDENCE for the factory.
# This workflow must not deploy Pages, Cloudflare, or treat a board drop as execution authority.

concurrency:
  group: bulletin-board-watch
  cancel-in-progress: false

jobs:
  poll-bulletin-board:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fail closed if WIF provider/SA are empty
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          WIF_SA: ${{ vars.GCP_SERVICE_ACCOUNT || secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "${WIF_PROVIDER}" ] || [ -z "${WIF_SA}" ]; then
            echo "::error::HOLE: GCP_WORKLOAD_IDENTITY_PROVIDER and/or GCP_SERVICE_ACCOUNT empty in repo vars and secrets."
            echo "Set Actions Variables (preferred) or Secrets with those exact names."
            echo "Do not add credentials_json. Keep GitHub OIDC -> Google WIF."
            exit 1
          fi
          echo "WIF provider and SA names present (values not printed)."

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT || secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Read FACTORY_BULLETIN_BOARD (read-only)
        run: |
          pip install --quiet google-api-python-client google-auth
          python scripts/read_bulletin_board.py \
            --folder-id 1T6qBAzbwdmJj820bO9qji3wIx7xj0_q4 \
            --out ./bulletin

      - name: Commit & Push Bulletin Snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ./bulletin
          if git diff --staged --quiet; then
            echo "No bulletin changes. Clean tick."
          else
            git commit -m "chore(bulletin): sync board snapshot via WIF [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD && exit 0
              echo "push race attempt $i — retry"
              sleep $((i * 2))
            done
            echo "push failed after retries" >&2
            exit 1
          fi

      - name: Upload Bulletin Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bulletin-snapshot
          path: ./bulletin/
          if-no-files-found: ignore
