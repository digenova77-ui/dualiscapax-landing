name: DualisCapax Autonomous Swarm Runner (retired)

# Retired/demoted: this manual workflow is an inert notice only.
# It must not write repository state, create commits, or push to main.
on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Reference only; no task is executed"
        required: false
        default: ""

permissions: {}

concurrency:
  group: dualis-swarm-engine
  cancel-in-progress: false

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Refuse execution without an authorized implementation
        run: |
          set -eu
          echo "Swarm runner is retired and has no repository or external side effects."
          echo "No task was executed. Use the reviewed Trinity autonomy path."
