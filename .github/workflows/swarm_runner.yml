name: DualisCapax Autonomous Swarm Runner (demoted)

# DEMOTED 2026-09-14: hourly stub ledger flush removed from schedule.
# Factory workers + purposeful harvest units own the clock.

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Manual archaeology only'
        required: false
        default: ''

concurrency:
  group: dualis-swarm-engine
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  demoted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Refuse stub epoch
        run: |
          echo "swarm_runner schedule demoted — use factory_workers / unit harvests."
          mkdir -p src/engine/ledgers/factory
          printf '%s\n' '{"kind":"swarm_runner_demoted","law":"no stub epoch SUCCESS"}'             > src/engine/ledgers/factory/swarm_runner_demoted_notice.json
      - name: Commit notice
        run: |
          git config --local user.email "swarm@dualiscapax.ai"
          git config --local user.name "Dualis Swarm (demoted)"
          git add src/engine/ledgers/factory/swarm_runner_demoted_notice.json || true
          git diff --cached --quiet && exit 0
          git commit -m "chore(swarm): runner demoted [skip ci]"
          git pull --rebase origin main && git push origin HEAD || true
