name: Iris and Trinity test gauntlet

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Iris fail-closed regression suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run regression suite
        run: python -m unittest discover -s tests -v

  source-checks:
    name: JavaScript syntax checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Trinity verifier syntax
        run: node --check verify.js

  live-edge-smoke:
    name: Live Trinity edge verification
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify live .ai law, Trinity, seal and Unity status
        env:
          BASE_URL: https://dualiscapax.ai
        run: timeout 45s node verify.js "$BASE_URL"
