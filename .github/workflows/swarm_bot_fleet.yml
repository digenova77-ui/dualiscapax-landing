name: DualisCapax Swarm Bot Fleet (demoted)

# DEMOTED 2026-09-14: stub theater (tax/trading/mesh PASS) removed from schedule.
# Purposeful harvest lives in golf_usa_envelopes.yml + hockey_girls_owha.yml.
# Factory health: factory_workers.yml. Manual dispatch kept for ledger archaeology only.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'manual_only — schedule removed'
        required: false
        default: 'manual_only'

concurrency:
  group: dualis-bot-fleet
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  demoted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Refuse theater
        run: |
          echo "swarm_bot_fleet schedule removed."
          echo "Use golf_usa_envelopes / hockey_girls_owha / factory_workers."
          mkdir -p src/engine/ledgers/factory
          printf '%s\n' '{"kind":"fleet_demoted","at":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'","law":"no stub UNANIMOUS_PASS"}' \
            > src/engine/ledgers/factory/fleet_demoted_notice.json
      - name: Commit notice if new
        run: |
          git config --local user.email "agent-iris@dualiscapax.ai"
          git config --local user.name "Agent Iris (Bot Fleet)"
          git add src/engine/ledgers/factory/fleet_demoted_notice.json || true
          git diff --cached --quiet && exit 0
          git commit -m "chore(bots): fleet demoted — use factory workers [skip ci]"
          git pull --rebase origin main && git push origin HEAD || true
