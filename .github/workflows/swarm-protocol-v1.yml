name: Swarm Protocol v1 Tests

on:
  pull_request:
    paths:
      - "src/engine/swarm_protocol.py"
      - "src/engine/swarm_lifecycle.py"
      - "src/engine/swarm_wave.py"
      - "src/engine/domain_architecture.py"
      - "src/engine/decision_energy.py"
      - "config/dualis.seed.v1.json"
      - "tests/test_swarm_wave.py"
      - "tests/test_swarm_protocol.py"
      - "tests/test_swarm_lifecycle.py"
      - "tests/test_domain_architecture.py"
      - "tests/test_decision_energy.py"
      - "docs/architecture/SWARM_PROTOCOL_V1.md"
      - "docs/architecture/THREE_RING_ONE_SEED.md"
      - "docs/architecture/DIAMOND_UNIVERSAL_KEY_AND_DECISION_ENERGY.md"
      - ".github/workflows/swarm-protocol-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile swarm and domain architecture modules
        run: python3 -m py_compile src/engine/swarm_protocol.py src/engine/swarm_lifecycle.py src/engine/swarm_wave.py src/engine/domain_architecture.py src/engine/decision_energy.py
      - name: Run fail-closed protocol, lifecycle, planner, and domain architecture tests
        env:
          PYTHONPATH: src/engine
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
