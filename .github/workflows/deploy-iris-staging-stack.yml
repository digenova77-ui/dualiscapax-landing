name: Deploy Iris staging stack

# Manual, staging-only deployment. Never deploys Pages or production Workers.
# The staging runtime URL is discovered automatically after Wrangler deploys it.
on:
  workflow_dispatch:

concurrency:
  group: iris-staging-stack
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify deployment credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo "Missing repository secret CLOUDFLARE_API_TOKEN"; exit 1; }
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || { echo "Missing repository secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          npx --yes wrangler whoami

      - name: Deploy isolated staging stack and run mandatory live gauntlet
        shell: bash
        run: bash workers/deploy-iris-staging-stack.sh
