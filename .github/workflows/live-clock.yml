name: live-clock

on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * *'

permissions:
  contents: write

concurrency:
  group: live-clock
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Probe apex and plate
        run: |
          set +e
          probe() {
            local path="$1"
            curl -sS -o /tmp/body -w "%{http_code}" --max-time 20 "https://dualiscapax.ai${path}"
          }
          {
            echo "# LIVE-STATUS"
            echo ""
            echo "Probed: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "| path | status |"
            echo "|---|---|"
            fail=0
            gd=""
            for p in / /ice /gameday /gameday.html /rte/sima-dclm/ /alacarte; do
              code=$(probe "$p")
              echo "| \`$p\` | $code |"
              if [ "$p" = "/gameday" ]; then gd="$code"; fi
              if [ "$p" = "/gameday" ] || [ "$p" = "/gameday.html" ]; then
                if [ "$code" != "200" ]; then fail=1; fi
              fi
            done
            echo ""
            if [ "$fail" -ne 0 ]; then
              echo "Hole: gameday not 200. Kitchen A Git Connect or B Pages Edit. See research/CANON.md."
            else
              echo "Gameday 200. Deploy hole closed."
            fi
          } > research/LIVE-STATUS.md
          echo "gameday=$gd fail=$fail" >> "$GITHUB_STEP_SUMMARY"
          cat research/LIVE-STATUS.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit plate only if it changed
        run: |
          git config user.name "dualis-live-clock"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/LIVE-STATUS.md
          if git diff --staged --quiet; then
            echo "No status change."
            exit 0
          fi
          git commit -m "chore(clock): LIVE-STATUS [skip ci]"
          git push
