name: live-clock

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe apex only when dispatched
        run: |
          echo "live-clock is dispatch-only. No cron. No push."
          curl -sS -o /dev/null -w "/ %{http_code}\n" --max-time 20 "https://dualiscapax.ai/" || true
