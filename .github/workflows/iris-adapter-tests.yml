name: Iris adapter regression

on:
  pull_request:
    paths:
      - "js/iris-cognitive-engine.js"
      - "tests/test_iris_cognitive_engine.mjs"
      - ".github/workflows/iris-adapter-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iris-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test Iris interaction and truthfulness boundaries
        run: node --test tests/test_iris_cognitive_engine.mjs
