name: Iris adapter regression

on:
  pull_request:
    paths:
      - "js/iris-cognitive-engine.js"
      - "tests/test_iris_cognitive_engine.mjs"
      - ".github/workflows/iris-adapter-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iris-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Pin third-party actions to the exact commits already resolved by CI.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Test Iris interaction and truthfulness boundaries
        run: node --test tests/test_iris_cognitive_engine.mjs
