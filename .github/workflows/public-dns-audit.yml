name: Public DNS and HTTPS audit

on:
  push:
    branches:
      - "research/earth-photo-archive"
    paths:
      - ".github/workflows/public-dns-audit.yml"
      - "research/photo-archive/audit_public_dns.py"
  schedule:
    - cron: "41 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Serialize evidence refreshes because both workflows write snapshots to this branch.
  group: research-evidence-refresh
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query public DNS and HTTPS only
        run: python research/photo-archive/audit_public_dns.py
      - name: Ingest audit snapshot into content-addressed provenance archive
        run: |
          python research/diamond-floor/diamond_floor.py ingest research/photo-archive/public-dns-audit.json \
            --archive research/photo-archive \
            --source-url "https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/research/photo-archive/public-dns-audit.json" \
            --creator "DualisCapax automated public DNS audit" \
            --rights-status needs-review \
            --notes "First-party generated observation snapshot of public DNS-over-HTTPS and public HTTPS GET checks; not a Cloudflare zone export and not a deployment signal."
      - name: Commit audit snapshot and provenance when changed
        run: |
          if git diff --quiet -- research/photo-archive/public-dns-audit.json research/photo-archive/assets research/photo-archive/provenance; then
            echo "No audit or provenance changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/photo-archive/public-dns-audit.json research/photo-archive/assets research/photo-archive/provenance
          git commit -m "Record read-only DNS audit with content-addressed provenance"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
