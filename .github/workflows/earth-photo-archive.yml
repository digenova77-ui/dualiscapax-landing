name: Earth photo archive updater

on:
  push:
    branches:
      - "research/earth-photo-archive"
    paths:
      - ".github/workflows/earth-photo-archive.yml"
      - "research/photo-archive/update_discoveries.py"
  schedule:
    - cron: "23 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: earth-photo-archive-updater
  cancel-in-progress: false

jobs:
  update-discovery-index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh NASA discovery index
        run: python research/photo-archive/update_discoveries.py
      - name: Commit index only when changed
        run: |
          if git diff --quiet -- research/photo-archive/discoveries.json; then
            echo "No archive changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/photo-archive/discoveries.json
          git commit -m "Refresh Earth science photo discovery index"
          git push origin "HEAD:${{ github.ref_name }}"
