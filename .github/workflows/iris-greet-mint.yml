name: iris-greet-mint

# Artifact preparation only. This workflow has no repository-writing authority.
# Father remains the sole writing authority; Trinity remains the sole authorization gate.
on:
  workflow_dispatch:
  schedule:
    - cron: "8,38 * * * *"

permissions:
  contents: read

concurrency:
  group: iris-greet-mint
  cancel-in-progress: false

jobs:
  mint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mint Sonia take
        run: |
          set -euo pipefail
          pip install -q edge-tts
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p audio
          python3 << 'PY'
          import asyncio
          import edge_tts

          TEXT = "Hey. I'm Iris. You walked into Dualis. Ask anything small for free. If you want the heavy work, I'll say the price first."
          VOICE = "en-GB-SoniaNeural"

          async def main():
              await edge_tts.Communicate(TEXT, VOICE).save("audio/iris-greet.mp3")

          asyncio.run(main())
          PY
          ffmpeg -v error -y -i audio/iris-greet.mp3 -ar 22050 -ac 1 audio/iris-greet.wav
          test -s audio/iris-greet.mp3
          test -s audio/iris-greet.wav
      - name: Upload reviewable artifact only
        uses: actions/upload-artifact@v4
        with:
          name: iris-greeting-candidate
          path: |
            audio/iris-greet.mp3
            audio/iris-greet.wav
          if-no-files-found: error
          retention-days: 7
