name: workers-live

# RETIRED as an auto-deploy rail 2026-09-11.
# Workers source stays in this repo. Seated operator deploys with wrangler locally.
# See docs/ops/CLOUDFLARE_MANUAL_ZIP.md and docs/ops/ENVIRONMENT.md.
# Secrets never belong in chat.

on:
  workflow_dispatch:
    inputs:
      confirm_retirement:
        description: "Type RETIRED — Actions will not wrangler deploy"
        required: true
        default: "RETIRED"

permissions:
  contents: read

concurrency:
  group: workers-live-retired
  cancel-in-progress: true

jobs:
  retired:
    name: Refuse Actions worker deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Point operator at manual wrangler
        run: |
          echo "workers-live auto-deploy is retired."
          echo "From a seated machine:"
          echo "  npx wrangler whoami"
          echo "  (cd workers/iris-gateway && npx wrangler deploy)"
          echo "  (cd workers/stripe-fulfill && npx wrangler deploy)"
          echo "GitHub keeps the source. Cloudflare stays the edge."
