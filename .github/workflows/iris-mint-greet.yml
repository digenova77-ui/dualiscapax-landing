name: iris-mint-greet

# Legacy manual mint retained as artifact preparation only.
# It cannot commit, push, or write repository contents.
# Father remains the sole writing authority; Trinity remains the sole authorization gate.
on:
  workflow_dispatch:

concurrency:
  group: iris-mint-greet
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mint Sonia take
        run: |
          set -euo pipefail
          pip install -q edge-tts
          mkdir -p audio
          python3 << 'PY'
          import asyncio
          import pathlib
          import edge_tts

          text = "Hey. I'm Iris. Talk. That's the whole interface."
          voice = "en-GB-SoniaNeural"
          output = pathlib.Path("audio")
          async def main():
              await edge_tts.Communicate(text, voice).save(str(output / "iris-greet.mp3"))
          asyncio.run(main())
          assert (output / "iris-greet.mp3").is_file()
          assert (output / "iris-greet.mp3").stat().st_size > 0
          PY
      - name: Upload reviewable artifact only
        uses: actions/upload-artifact@v4
        with:
          name: iris-greeting-legacy-candidate
          path: audio/iris-greet.mp3
          if-no-files-found: error
          retention-days: 7
