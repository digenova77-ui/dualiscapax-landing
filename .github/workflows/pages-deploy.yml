name: Pages deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check edge routes
        run: python3 scripts/check_edge_routes.py

      - name: Live match unit tests
        run: python3 scripts/test_omni_match.py -q

      - name: Package
        run: |
          python3 scripts/pack_hierarchical_flat_zip.py --lander --check
          python3 scripts/pack_hierarchical_flat_zip.py --lander

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN secret is empty. Seat it in Actions secrets."
            exit 1
          fi
          # Pages rejects [previews] in wrangler.toml (Workers Builds only).
          # Deploy from a config without that block. Token is seated.
          grep -v '^\[previews\]' wrangler.toml > /tmp/pages.toml
          npx --yes wrangler pages deploy . \
            --project-name=dualiscapax-web \
            --commit-dirty=true \
            --config /tmp/pages.toml

      - name: Verify routes
        run: ./scripts/verify_live_routes.sh https://dualiscapax.ai

      - name: Live omni match
        run: ./scripts/verify_omni_match.sh https://dualiscapax.ai
