name: Pages deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check edge routes
        run: python3 scripts/check_edge_routes.py

      - name: Live match unit tests
        run: python3 scripts/test_omni_match.py -q

      - name: Package
        run: |
          python3 scripts/pack_hierarchical_flat_zip.py --lander --check
          python3 scripts/pack_hierarchical_flat_zip.py --lander

      - name: Token preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./scripts/cf_token_preflight.sh

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN secret is empty."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID secret is empty."
            exit 1
          fi
          rm -rf /tmp/pages-out
          mkdir -p /tmp/pages-out
          unzip -q dist/cloudflare/lander-*.zip -d /tmp/pages-out
          # Pages project. No [previews]. No custom --config path.
          npx --yes wrangler pages deploy /tmp/pages-out \
            --project-name=dualiscapax-web \
            --commit-dirty=true

      - name: Verify routes
        run: ./scripts/verify_live_routes.sh https://dualiscapax.ai

      - name: Live omni match
        run: ./scripts/verify_omni_match.sh https://dualiscapax.ai
