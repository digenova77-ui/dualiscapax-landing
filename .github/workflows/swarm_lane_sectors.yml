name: Swarm lane sectors

# Perpetual cue. Cron is the backstop. Actuators false. No lander publish.

on:
  schedule:
    - cron: '27 */6 * * *'
  workflow_dispatch:

concurrency:
  group: dualis-swarm-lane-sectors
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  lane:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: src/engine
      SWARM_LANE: sectors
      LIVE_ACTUATORS: 'false'
      CRA_SEND: 'NO'
      DUALIS_TARGET: STUB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 src/engine/swarm_five_lane.py
      - name: Commit refilled cue
        run: |
          git config user.email "swarm@dualiscapax.ai"
          git config user.name "Dualis Swarm Sectors"
          git add src/engine/ledgers/five/sectors src/engine/ledgers/cue/sectors.json || true
          git diff --cached --quiet && exit 0
          git commit -m "chore(swarm): sectors cue refilled [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD && exit 0
            sleep $((2 ** i))
          done
          exit 1
      - name: Hold the next refill
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 << 'PY'
          import json, subprocess, sys, time
          from datetime import datetime, timezone
          wf = "swarm_lane_sectors.yml"
          raw = subprocess.check_output(["gh","run","list","--workflow",wf,"--limit","30","--json","createdAt,status"], text=True)
          now = time.time()
          def stamp(s):
              return datetime.strptime(s, "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=timezone.utc).timestamp()
          runs = json.loads(raw)
          recent = [r for r in runs if now - stamp(r["createdAt"]) < 6 * 3600]
          step = min(len(recent), 5)
          gap = min(21600, 600 * (2 ** step))
          newest = max(stamp(r["createdAt"]) for r in runs) if runs else 0
          age = now - newest if runs else gap
          print(f"backoff gap={int(gap)} age={int(age)} recent={len(recent)}")
          if age < gap:
              print("hold")
              sys.exit(0)
          print("open")
          sys.exit(10)
          PY
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "backoff hold — no dispatch"
            exit 0
          fi
          if [ "$code" -ne 10 ]; then
            exit "$code"
          fi
          queued=$(gh run list --workflow swarm_lane_sectors.yml --status queued --limit 5 --json databaseId --jq 'length')
          if [ "$queued" != "0" ]; then
            echo "next refill already queued"
            exit 0
          fi
          gh workflow run swarm_lane_sectors.yml --ref main || echo "chain deferred — cue already full"
