name: DualisCapax Vultr Control Plane

# Safe bridge: local operator -> GitHub workflow_dispatch -> runner -> Vultr.
# This workflow is intentionally read-only. It does not provision, deploy, mutate DNS,
# change firewalls, modify SSH keys, bill, delete, or sign wallet/token transactions.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Read-only operation"
        required: true
        type: choice
        options:
          - inventory
          - ssh_verify
        default: inventory
      region_scope:
        description: "Inventory scope"
        required: true
        type: choice
        options:
          - both
          - toronto
          - new_jersey
          - ip
        default: both
      target_ip:
        description: "Explicit IPv4 when region_scope=ip or operation=ssh_verify"
        required: false
        type: string
        default: "108.61.17.141"

permissions:
  contents: read

concurrency:
  group: dualiscapax-vultr-readonly-${{ inputs.region_scope }}-${{ inputs.target_ip }}
  cancel-in-progress: false

env:
  VULTR_API_BASE: https://api.vultr.com/v2

jobs:
  inventory:
    name: Vultr read-only inventory
    runs-on: ubuntu-latest
    environment: vultr-readonly
    steps:
      - name: Validate target input
        env:
          TARGET_IP: ${{ inputs.target_ip }}
          REGION_SCOPE: ${{ inputs.region_scope }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ipaddress, os
          if os.environ["REGION_SCOPE"] == "ip" or os.environ.get("TARGET_IP"):
              ipaddress.ip_address(os.environ["TARGET_IP"])
          PY

      - name: Query Vultr metadata
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
          TARGET_IP: ${{ inputs.target_ip }}
          REGION_SCOPE: ${{ inputs.region_scope }}
        run: |
          set -euo pipefail
          test -n "$VULTR_API_KEY" || { echo "::error::VULTR_API_KEY is not configured"; exit 1; }
          mkdir -p out
          auth=(-H "Authorization: Bearer ${VULTR_API_KEY}" -H "Accept: application/json")
          for endpoint in account instances regions ssh-keys firewalls domains; do
            curl --fail-with-body --silent --show-error --retry 2 --max-time 30 \
              "${auth[@]}" "$VULTR_API_BASE/$endpoint" -o "out/vultr-$endpoint.json"
          done
          jq --arg ip "$TARGET_IP" --arg scope "$REGION_SCOPE" '{schema:"dualis.vultr-inventory/1",readOnly:true,regionScope:$scope,targetIp:$ip,instances:([.instances[]? | {id,label,main_ip,region,plan,status,power_status,server_status,firewall_group_id}] | map(select(($scope == "both") or ($scope == "toronto" and ((.region // "") | ascii_downcase | test("tor"))) or ($scope == "new_jersey" and ((.region // "") | ascii_downcase | test("nj|new"))) or ($scope == "ip" and (.main_ip == $ip or .ipv4 == $ip or .internal_ip == $ip)))),mutations:[]}' out/vultr-instances.json > out/target.json
          jq '{available: true}' out/vultr-account.json > out/account-sanitized.json
          jq -s '{schema:"dualis.vultr-inventory/1",readOnly:true,target:(.[0].instances),account:(.[1]),regions:(.[2].regions // [] | map({id,city,country,continent})),sshKeys:(.[3].ssh_keys // [] | map({id,name,date_created})),firewalls:(.[4].firewalls // [] | map({id,description,date_created})),domains:(.[5].domains // [] | map({domain,date_created})),mutations:[]}' out/target.json out/account-sanitized.json out/vultr-regions.json out/vultr-ssh-keys.json out/vultr-firewalls.json out/vultr-domains.json > out/inventory.json
          jq '{schema,readOnly,target,mutations}' out/inventory.json

      - name: Verify Vultr API connection and output instance health
        run: |
          set -euo pipefail
          jq -e '(.schema == "dualis.vultr-inventory/1") and (.readOnly == true) and (.target | type == "array")' out/inventory.json >/dev/null
          total=$(jq '.target | length' out/inventory.json)
          healthy=$(jq '[.target[] | select((.status == "active") and (.power_status == "running") and (.server_status == "running"))] | length' out/inventory.json)
          if [ "$total" -eq 0 ]; then
            overall=NO_INSTANCES_IN_SCOPE
          elif [ "$healthy" -eq "$total" ]; then
            overall=HEALTHY
          else
            overall=DEGRADED
          fi
          echo "vultr_api_connection=ok"
          echo "inventory_scope=${{ inputs.region_scope }}"
          echo "instances_in_scope=$total"
          echo "instances_healthy=$healthy"
          echo "overall_health=$overall"
          jq -r '.target[] | ["instance", (.id // ""), (.label // ""), (.region // ""), (.main_ip // ""), (.status // "unknown"), (.power_status // "unknown"), (.server_status // "unknown")] | @tsv' out/inventory.json

      - name: Upload sanitized inventory evidence
        uses: actions/upload-artifact@v4
        with:
          name: dualiscapax-vultr-inventory-${{ github.run_id }}
          path: out/inventory.json
          if-no-files-found: error
          retention-days: 14

      - name: Notify on degraded Vultr instances
        env:
          DCLM_ALERT_WEBHOOK_URL: ${{ secrets.DCLM_ALERT_WEBHOOK_URL }}
          REGION_SCOPE: ${{ inputs.region_scope }}
        run: python3 scripts/check_vultr_health.py out/inventory.json

  ssh_verify:
    name: Vultr SSH read-only verification
    if: ${{ inputs.operation == 'ssh_verify' }}
    needs: inventory
    runs-on: ubuntu-latest
    environment: vultr-readonly
    steps:
      - name: Require SSH secret and user
        env:
          SSH_KEY: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.VULTR_SSH_USER }}
        run: |
          set -euo pipefail
          test "${{ inputs.region_scope }}" = "ip" || { echo "::error::ssh_verify requires region_scope=ip and one explicit target_ip"; exit 1; }
          test -n "$SSH_KEY" || { echo "::error::VULTR_SSH_PRIVATE_KEY is not configured"; exit 1; }
          test -n "$SSH_USER" || { echo "::error::VULTR_SSH_USER is not configured"; exit 1; }

      - name: Install ephemeral SSH key
        env:
          SSH_KEY: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/dclm-ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/dclm-ssh/id_rsa"
          chmod 600 "$RUNNER_TEMP/dclm-ssh/id_rsa"

      - name: Execute read-only host probe
        env:
          SSH_USER: ${{ secrets.VULTR_SSH_USER }}
          TARGET_IP: ${{ inputs.target_ip }}
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/dclm-ssh/id_rsa" \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 "$SSH_USER@$TARGET_IP" \
            'printf "ssh_auth=ok\\n"; hostname; id -u; uname -srv; . /etc/os-release 2>/dev/null && printf "os=%s %s\\n" "$ID" "$VERSION_ID" || true; uptime -p 2>/dev/null || true; df -h / | tail -1'

      - name: Remove ephemeral SSH key
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/dclm-ssh"
