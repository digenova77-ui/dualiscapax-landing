name: Cloudflare Read-Only Inventory

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-readonly-inventory
  cancel-in-progress: false

jobs:
  inventory:
    name: Inventory Cloudflare resources (GET only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query account resources without exposing credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "BLOCKED: CLOUDFLARE_API_TOKEN secret is missing."
            exit 2
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "BLOCKED: CLOUDFLARE_ACCOUNT_ID secret is missing."
            exit 2
          fi

          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          # Every request below is HTTP GET. Never print response bodies wholesale.
          probe() {
            local label="$1"
            local path="$2"
            local file="$tmp/response.json"
            local code
            code="$(curl --silent --show-error --output "$file" --write-out '%{http_code}' \
              --max-time 20 --request GET \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header "Accept: application/json" \
              "${base}${path}")" || code="CURL_ERROR"
            printf '\n== %s ==\nHTTP: %s\n' "$label" "$code"
            if [[ "$code" == "200" ]]; then
              jq -r '
                if .success == true then
                  "API success: true",
                  ("items: " + ((.result // []) | if type == "array" then length else 1 end | tostring)),
                  ((.result // []) | if type == "array" then .[] else . end |
                    [.name // .id // .queue_name // .slug // empty] |
                    map(select(type == "string" and length > 0)) | .[]?)
                else
                  "API success: false (response details withheld)"
                end
              ' "$file" 2>/dev/null || echo "Response shape was not recognized; body withheld."
            else
              echo "Access not confirmed. Response body withheld."
            fi
          }

          probe "Workers scripts" "/workers/scripts"
          probe "Pages projects" "/pages/projects"
          probe "D1 databases" "/d1/database"
          probe "Queues" "/queues"
          probe "Workflows" "/workflows"
          probe "AI Gateway gateways" "/ai-gateway/gateways"

          echo
          echo "Safety: GET-only inventory. No resources were created, changed, deleted, deployed, or published."
