name: Cloudflare Read-Only Inventory

on:
  workflow_dispatch:
  push:
    branches:
      - ops/cloudflare-readonly-audit-20261023

permissions:
  contents: read

concurrency:
  group: cloudflare-readonly-inventory
  cancel-in-progress: false

jobs:
  inventory:
    name: Verify credential and inventory Cloudflare resources (GET only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify existing credential candidates and inventory
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_PAGES_DEPLOY: ${{ secrets.CF_PAGES_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "BLOCKED: CLOUDFLARE_ACCOUNT_ID secret is missing."
            exit 2
          fi

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          token=""
          verify_candidate() {
            local label="$1"
            local candidate="${2:-}"
            local code
            if [[ -z "$candidate" ]]; then
              printf '%s: NOT PRESENT\n' "$label"
              return 1
            fi
            code="$(curl --silent --output "$tmp/verify.json" --write-out '%{http_code}' \
              --max-time 15 --request GET \
              --header "Authorization: Bearer $candidate" \
              --header "Accept: application/json" \
              "https://api.cloudflare.com/client/v4/user/tokens/verify" || true)"
            printf '%s token verification HTTP: %s\n' "$label" "${code:-CURL_ERROR}"
            if [[ "$code" == "200" ]] && jq -e '.success == true and .result.status == "active"' "$tmp/verify.json" >/dev/null 2>&1; then
              token="$candidate"
              printf 'Selected credential candidate: %s (value withheld)\n' "$label"
              return 0
            fi
            return 1
          }

          if ! verify_candidate "CLOUDFLARE_API_TOKEN" "${CLOUDFLARE_API_TOKEN:-}"; then
            if ! verify_candidate "CF_PAGES_DEPLOY" "${CF_PAGES_DEPLOY:-}"; then
              echo "BLOCKED: No active token verified. No account inventory calls were made."
              exit 3
            fi
          fi

          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          probe() {
            local label="$1"
            local path="$2"
            local code
            code="$(curl --silent --output "$tmp/response.json" --write-out '%{http_code}' \
              --max-time 20 --request GET \
              --header "Authorization: Bearer $token" \
              --header "Accept: application/json" \
              "${base}${path}" || true)"
            printf '\n== %s ==\nHTTP: %s\n' "$label" "${code:-CURL_ERROR}"
            if [[ "$code" == "200" ]]; then
              jq -r '
                if .success == true then
                  "API success: true",
                  ("items: " + ((.result // []) | if type == "array" then length else 1 end | tostring)),
                  ((.result // []) | if type == "array" then .[] else . end |
                    [.name // .id // .queue_name // .slug // empty] |
                    map(select(type == "string" and length > 0)) | .[]?)
                else
                  "API success: false (response details withheld)"
                end
              ' "$tmp/response.json" 2>/dev/null || echo "Response shape not recognized; body withheld."
            else
              echo "Access not confirmed. Response body withheld."
            fi
          }

          probe "Workers scripts" "/workers/scripts"
          probe "Pages projects" "/pages/projects"
          probe "D1 databases" "/d1/database"
          probe "Queues" "/queues"
          probe "Workflows" "/workflows"
          probe "AI Gateway gateways" "/ai-gateway/gateways"

          # Resolve exact Pages project details, including custom domains and branch.
          for project in dualiscapax-landing dualiscapax; do
            code="$(curl --silent --output "$tmp/project.json" --write-out '%{http_code}' \
              --max-time 20 --request GET \
              --header "Authorization: Bearer $token" \
              --header "Accept: application/json" \
              "${base}/pages/projects/${project}" || true)"
            printf '\\n== Pages project detail: %s ==\\nHTTP: %s\\n' "$project" "${code:-CURL_ERROR}"
            if [[ "$code" == "200" ]] && jq -e '.success == true' "$tmp/project.json" >/dev/null 2>&1; then
              jq -r '.result | "name: " + (.name // "unknown"), "production_branch: " + (.production_branch // "unknown"), "domains: " + ((.domains // []) | join(", "))' "$tmp/project.json"
            else
              echo "Details unavailable; response body withheld."
            fi
          done

          # Check whether the same credential can enumerate the two domain zones.
          for domain in dualiscapax.ai dualiscapax.com; do
            code="$(curl --silent --output "$tmp/zones.json" --write-out '%{http_code}' \
              --max-time 20 --request GET \
              --header "Authorization: Bearer $token" \
              --header "Accept: application/json" \
              "https://api.cloudflare.com/client/v4/zones?name=${domain}" || true)"
            printf '\n== Zone lookup: %s ==\nHTTP: %s\n' "$domain" "${code:-CURL_ERROR}"
            if [[ "$code" == "200" ]] && jq -e '.success == true' "$tmp/zones.json" >/dev/null 2>&1; then
              zone_ids="$(jq -r '.result[]? | [.id, .name] | @tsv' "$tmp/zones.json")"
              if [[ -z "$zone_ids" ]]; then
                echo "No zones returned for this name."
              else
                while IFS="$(printf '\\t')" read -r zone_id zone_name; do
                  printf 'zone: %s\n' "$zone_name"
                  route_code="$(curl --silent --output "$tmp/routes.json" --write-out '%{http_code}' \
                    --max-time 20 --request GET \
                    --header "Authorization: Bearer $token" \
                    --header "Accept: application/json" \
                    "https://api.cloudflare.com/client/v4/zones/${zone_id}/workers/routes" || true)"
                  printf 'Workers routes HTTP: %s\n' "${route_code:-CURL_ERROR}"
                  if [[ "$route_code" == "200" ]] && jq -e '.success == true' "$tmp/routes.json" >/dev/null 2>&1; then
                    jq -r '.result[]? | "pattern: " + (.pattern // "unknown") + " | script: " + (.script // "(zone default)")' "$tmp/routes.json"
                  else
                    echo "Route access not confirmed; response body withheld."
                  fi
                done <<< "$zone_ids"
              fi
            else
              echo "Zone access not confirmed; response body withheld."
            fi
          done

          echo "Safety: GET-only inventory. No resources were created, changed, deleted, deployed, or published."
\\t' read -r zone_id zone_name; do
                  printf 'zone: %s\\n' "$zone_name"
                  route_code="$(curl --silent --output "$tmp/routes.json" --write-out '%{http_code}' \
                    --max-time 20 --request GET \
                    --header "Authorization: Bearer $token" \
                    --header "Accept: application/json" \
                    "https://api.cloudflare.com/client/v4/zones/${zone_id}/workers/routes" || true)"
                  printf 'Workers routes HTTP: %s\\n' "${route_code:-CURL_ERROR}"
                  if [[ "$route_code" == "200" ]] && jq -e '.success == true' "$tmp/routes.json" >/dev/null 2>&1; then
                    jq -r '.result[]? | "pattern: " + (.pattern // "unknown") + " | script: " + (.script // "(zone default)")' "$tmp/routes.json"
                  else
                    echo "Route access not confirmed; response body withheld."
                  fi
                done <<< "$zone_ids"
              fi
            else
              echo "Zone access not confirmed; response body withheld."
            fi
          done

          echo
          echo "Safety: GET-only inventory. No resources were created, changed, deleted, deployed, or published."
