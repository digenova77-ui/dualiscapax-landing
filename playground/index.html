<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DCLM manifold — local origin</title>
  <style>
    html,body{margin:0;height:100%;background:#070b12;color:#e7eef2;font:14px/1.4 system-ui,sans-serif}
    canvas{display:block;width:100%;height:100%}
    #bar{position:fixed;left:10px;right:10px;bottom:10px;display:flex;gap:8px;align-items:flex-end}
    #see{flex:1;margin:0;padding:8px 10px;background:#070b12ee;border:1px solid #8eb4c866;white-space:pre-wrap}
    button{border:0;background:#8eb4c8;color:#102028;font-weight:700;padding:10px 12px}
  </style>
  <script type="importmap">
  {"imports":{"three":"https://unpkg.com/three@0.169.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.169.0/examples/jsm/"}}
  </script>
</head>
<body>
  <div id="bar"><p id="see">Origin 127.0.0.1:8080. Tap a node. SEE asks the jacket. Authority stays none.</p><button id="run" type="button">SEE</button></div>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const LAW = ["NO_FORCE", "HOST_SAFE", "CLEANUP_FIRST", "TRUTH_OR_NOTHING"];
    const ORIGIN = location.origin.includes("8080") ? "" : "http://127.0.0.1:8080";
    const out = document.getElementById("see");
    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x070b12, 14, 48);
    const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 80);
    camera.position.set(10, 7, 12);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
    renderer.setSize(innerWidth, innerHeight);
    renderer.setClearColor(0x070b12);
    document.body.prepend(renderer.domElement);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 1.5, 0);
    scene.add(new THREE.HemisphereLight(0xc5d5de, 0x121820, 0.75));
    const sun = new THREE.DirectionalLight(0xfff4e5, 1);
    sun.position.set(8, 12, 6);
    scene.add(sun);
    scene.add(new THREE.GridHelper(28, 28, 0x3d5160, 0x1c2830));

    const unity = new THREE.Group();
    scene.add(unity);
    for (let i = 1; i <= 6; i++) {
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(1.6 + i * 1.15, 0.035, 8, 64),
        new THREE.MeshStandardMaterial({ color: 0x6d8794, roughness: 0.5 })
      );
      ring.rotation.x = Math.PI / 2;
      ring.position.y = 0.04;
      unity.add(ring);
    }
    const dclm = new THREE.Mesh(
      new THREE.BoxGeometry(1.3, 4.2, 1.3),
      new THREE.MeshStandardMaterial({ color: 0x3d8f86, roughness: 0.4 })
    );
    dclm.position.set(-3.2, 2.1, 0);
    dclm.name = "DCLM";
    unity.add(dclm);
    const iris = new THREE.Mesh(
      new THREE.BoxGeometry(1.3, 4.2, 1.3),
      new THREE.MeshStandardMaterial({ color: 0x6d5bd0, roughness: 0.4 })
    );
    iris.position.set(3.2, 2.1, 0);
    iris.name = "IRIS";
    unity.add(iris);
    const nodes = [];
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.28, 18, 14),
        new THREE.MeshStandardMaterial({ color: 0xd7c7a1, roughness: 0.35 })
      );
      mesh.position.set(Math.cos(a) * 5.2, 0.28, Math.sin(a) * 5.2);
      mesh.userData.home = mesh.position.clone();
      unity.add(mesh);
      nodes.push(mesh);
    }
    function tag(text, x, y, z) {
      const c = document.createElement("canvas");
      c.width = 512; c.height = 128;
      const g = c.getContext("2d");
      g.fillStyle = "rgba(7,11,18,0.8)";
      g.fillRect(0, 0, 512, 128);
      g.fillStyle = "#e7eef2";
      g.font = "600 36px sans-serif";
      g.fillText(text, 24, 74);
      const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true }));
      s.position.set(x, y, z);
      s.scale.set(2.2, 0.55, 1);
      unity.add(s);
    }
    tag("DCLM", -3.2, 4.5, 0);
    tag("IRIS", 3.2, 4.5, 0);
    tag("UNITY", 0, 3.2, 0);

    const ray = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    renderer.domElement.addEventListener("pointerdown", (e) => {
      const r = renderer.domElement.getBoundingClientRect();
      pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
      pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
      ray.setFromCamera(pointer, camera);
      const hit = ray.intersectObjects(nodes)[0];
      if (!hit) return;
      hit.object.position.y = 1.4;
      out.textContent = "Node lifted. It is a scene body, not a person.";
    });

    async function see() {
      const ask = { api_version: "2", law: LAW, authority: "NONE", pii_coefficient: 0, nodes: nodes.length };
      try {
        const res = await fetch(ORIGIN + "/v2/dclm/sandbox/execute", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(ask)
        });
        const body = await res.json();
        out.textContent = body.verdict + "\n" + (body.why || "jacket saw the manifold") + "\nreceipt " + body.receipt;
        return body;
      } catch (err) {
        out.textContent = "HOLE\norigin not reachable\n" + err.message;
      }
    }
    document.getElementById("run").onclick = see;
    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
    (function frame() {
      nodes.forEach((n, i) => {
        if (n.position.y > 0.28) n.position.y += (0.28 - n.position.y) * 0.04;
        n.position.x = n.userData.home.x + Math.sin(performance.now() / 900 + i) * 0.05;
      });
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    })();
    see();
  </script>
</body>
</html>
