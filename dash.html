<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard — DualisCapax</title>
<link rel="icon" href="brand/seal.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <a class="brand" href="dash.html" style="text-decoration:none;color:inherit">DUALISCAPAX</a>
  <nav><a href="dash.html">Dashboard</a><a href="pay.html">Pay</a><a href="ai/app.html">Iris</a></nav>
</header>
<main>
  <p class="chips"><span class="chip">U1</span><span class="chip" id="ledger">LEDGER: LOOK</span></p>
  <h1>Operator desk</h1>
  <p class="lead">Public look is name and U1 only. Licence and health card stay dark, gated on this ID. They do not go on the website.</p>

  <div class="card">
    <h2>Unity ID</h2>
    <p style="font-size:2rem;margin:.2rem 0">U1</p>
    <p>David John Di Genova · Belleville · look packet</p>
  </div>

  <div class="card" style="margin-top:1rem">
    <h2>Dark gates</h2>
    <p id="darkline">Off.</p>
  </div>

  <div class="card" style="margin-top:1rem">
    <h2>Access you allow</h2>
    <label class="check"><input type="checkbox" id="l_look" checked disabled> Look — public: name, town, U1.</label>
    <label class="check"><input type="checkbox" id="l_pay"> Pay</label>
    <label class="check"><input type="checkbox" id="l_engine"> Engine</label>
    <label class="check"><input type="checkbox" id="l_civil"> Civil licence — dark. Gated on U1. Not published. You hold the card.</label>
    <label class="check"><input type="checkbox" id="l_health"> Healthcare — dark. Hospital, physician, pharmacy only. You hold the card.</label>
    <label class="check"><input type="checkbox" id="l_school"> Schools — work email only. No cards.</label>
    <button class="btn" type="button" id="save">Save on this device</button>
    <p id="out" class="lead"></p>
  </div>
</main>
<script>
(function(){
  var keys=["l_pay","l_engine","l_civil","l_health","l_school"];
  function paint(){
    var civil=false, health=false;
    try{
      civil=localStorage.getItem("dc.layer.l_civil")==="1";
      health=localStorage.getItem("dc.layer.l_health")==="1";
    }catch(e){}
    var bits=[];
    if(civil) bits.push("CIVIL DARK");
    if(health) bits.push("HEALTH DARK");
    document.getElementById("ledger").textContent=bits.length?bits.join(" · "):"LEDGER: LOOK";
    document.getElementById("darkline").textContent=bits.length
      ?"Gated on U1. Cards stay with you. Dualis does not publish numbers."
      :"No dark gates on.";
  }
  keys.forEach(function(k){
    try{ if(localStorage.getItem("dc.layer."+k)==="1") document.getElementById(k).checked=true; }catch(e){}
  });
  paint();
  document.getElementById("save").onclick=function(){
    keys.forEach(function(k){
      try{ localStorage.setItem("dc.layer."+k, document.getElementById(k).checked?"1":"0"); }catch(e){}
    });
    paint();
    document.getElementById("out").textContent="Saved on this phone only.";
  };
})();
</script>
</body>
</html>
